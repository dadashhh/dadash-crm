              <div><div style={{fontSize:10,color:"var(--text-tertiary)",marginBottom:4,textTransform:"uppercase"}}>Timezone</div><select className="filter-select" style={{width:"100%"}} value={newSpForm.timezone} onChange={e=>setNewSpForm(p=>({...p,timezone:e.target.value}))}><option value="Europe/Zurich">Europe/Zurich</option><option value="Europe/Paris">Europe/Paris</option><option value="Europe/Berlin">Europe/Berlin</option><option value="Europe/Rome">Europe/Rome</option></select></div>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn" onClick={()=>setShowNewSpender(false)}>{fr?"Annuler":"Cancel"}</button>
              <button className="btn btn-primary" onClick={handleCreateSpender} disabled={spSavingProfile}>{spSavingProfile?React.createElement(Spinner,{size:14}):(fr?"Créer":"Create")}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
});

// =============================================
// MES SPENDERS TAB — Chatter + Gérant enriched cards
// =============================================
const MesSpendersTab = ({user, lang, txs, models, profiles, dbSpenders, products, productTags, onRefresh}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const dr = useDateRange("all");
  const [filterModel, setFilterModel] = useState("");
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const debouncedSearch = useDebounce(search, DEBOUNCE_DELAY);
  const [viewMode, setViewMode] = useState("cards");
  const [selectedSpender, setSelectedSpender] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  // ── WhatsApp Analyzer state ──
  const [waText, setWaText] = useState("");
  const [waExtracting, setWaExtracting] = useState(false);
  const [waResults, setWaResults] = useState(null); // {entries: [{spender, amount, product, date, currency, notes}], raw}
  const [waMatchedSpenders, setWaMatchedSpenders] = useState({}); // {idx: {matched: spender|null, action: "link"|"create"|null}}
  const [waTxCreating, setWaTxCreating] = useState({});
  const [waTxCreated, setWaTxCreated] = useState({});

  const classColors = {
    whale: { bg: "var(--accent-subtle)", border: "var(--accent-muted)", text: "var(--accent)", icon: "\u{1F40B}" },
    vip: { bg: "var(--warning-muted)", border: "var(--warning-muted)", text: "var(--warning)", icon: "\u2B50" },
    regular: { bg: "var(--success-muted)", border: "var(--success-muted)", text: "var(--success)", icon: "\u{1F464}" },
    lead: { bg: "var(--pink-muted)", border: "var(--pink-muted)", text: "var(--pink)", icon: "\u{1F3AF}" },
    timewaster: { bg: "var(--danger-muted)", border: "var(--danger-muted)", text: "var(--danger)", icon: "\u23F0" },
    new: { bg: "var(--border-subtle)", border: "var(--border-default)", text: "var(--text-secondary)", icon: "\u{1F195}" },
  };

  const metricBoxStyle = { padding: "6px 8px", borderRadius: 10, background: "var(--bg-overlay)", textAlign: "center" };
  const tagStyle = { padding: "2px 8px", borderRadius: 6, background: "var(--bg-overlay)", border: "1px solid var(--border-subtle)", fontSize: 10, fontWeight: 500, color: "var(--text-secondary)", display: "inline-block" };

  const timeAgo = (dateStr) => {
    if (!dateStr) return fr ? "jamais" : "never";
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return fr ? "maintenant" : "now";
    if (mins < 60) return `${mins}min`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h`;
    const days = Math.floor(hrs / 24);
    return `${days}j`;
  };

  // Date-filtered transactions
  const filteredTxs = useMemo(() => {
    let ft = dr.filterByDate(txs, "date");
    if (filterModel) ft = ft.filter(tx => tx.model_id === filterModel);
    return ft;
  }, [txs, dr.startDate, dr.endDate, dr.activePreset, filterModel]);

  // Build enriched spenders from DB + TX data
  const enrichedSpenders = useMemo(() => {
    const map = {};
    // Seed from DB spenders
    (dbSpenders || []).forEach(dbSp => {
      const h = dbSp.handle || dbSp.name;
      if (!h) return;
      map[h] = { ...dbSp, spender_handle: h, txs: [], classification: dbSp.classification || "new" };
    });
    // Enrich with transactions
    filteredTxs.forEach(tx => {
      const h = tx.spender_handle;
      if (!h) return;
      if (!map[h]) map[h] = { spender_handle: h, classification: "new", txs: [] };
      map[h].txs.push(tx);
    });
    // Compute stats and auto-classify
    return Object.values(map).map(sp => {
      const spTxs = sp.txs || [];
      const validTxs = spTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
      const total = validTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const txCount = spTxs.length;
      const avgTicket = validTxs.length > 0 ? Math.round(total / validTxs.length) : 0;
      const sortedByDate = [...spTxs].sort((a, b) => new Date(b.date) - new Date(a.date));
      const lastPurchase = sortedByDate.length > 0 ? sortedByDate[0].date : null;
      // Auto-classification if still "new" or not set
      let classification = sp.classification;
      if (!classification || classification === "new") {
        if (total >= 500) classification = "whale";
        else if (total >= 200) classification = "vip";
        else if (total > 0) classification = "regular";
        else if (txCount === 0) classification = "lead";
      }
      // Collect model_ids this spender appears in
      const modelIds = [...new Set(spTxs.map(tx => tx.model_id).filter(Boolean))];
      return {
        ...sp,
        total_spent: total,
        tx_count: txCount,
        avg_ticket: avgTicket,
        last_purchase_date: sp.last_purchase_date || lastPurchase,
        classification,
        model_ids: modelIds,
      };
    });
  }, [filteredTxs, dbSpenders, convertAmount]);

  // Filter by role: chatter sees only spenders of their assigned models
  const mySpenders = useMemo(() => {
    let list = enrichedSpenders;
    if (user.role === "chatter" && user.assigned_models && user.assigned_models.length > 0) {
      list = list.filter(sp => sp.model_ids.some(mid => user.assigned_models.includes(mid)));
    }
    // Apply classification filter
    if (filter !== "all") list = list.filter(sp => sp.classification === filter);
    // Apply search
    if (debouncedSearch.trim()) {
      const q = debouncedSearch.toLowerCase();
      list = list.filter(sp =>
        (sp.spender_handle || "").toLowerCase().includes(q) ||
        (sp.first_name || "").toLowerCase().includes(q) ||
        (sp.city || "").toLowerCase().includes(q) ||
        (sp.telegram_username || "").toLowerCase().includes(q) ||
        (sp.job || "").toLowerCase().includes(q)
      );
    }
    // Sort by total_spent desc
    return [...list].sort((a, b) => b.total_spent - a.total_spent);
  }, [enrichedSpenders, user, filter, debouncedSearch]);

  // KPIs
  const whaleCount = mySpenders.filter(s => s.classification === "whale").length;
  const totalCA = mySpenders.reduce((s, sp) => s + sp.total_spent, 0);
  const avgTicket = mySpenders.length > 0 ? Math.round(totalCA / Math.max(mySpenders.filter(s => s.tx_count > 0).length, 1)) : 0;

  const updateForm = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

  const handleSaveSpender = async (formData) => {
    setSaving(true);
    try {
      const updates = {
        first_name: formData.first_name || null,
        age: formData.age ? parseInt(formData.age) : null,
        city: formData.city || null,
        country: formData.country || null,
        job: formData.job || null,
        telegram_username: formData.telegram_username || null,
        whatsapp_phone: formData.whatsapp_phone || null,
        classification: formData.classification || "new",
        favorite_content: formData.favorite_content || null,
        preferences: formData.preferences || null,
        personality_notes: formData.personality_notes || null,
        best_time: formData.best_time || null,
        relationship_status: formData.relationship_status || null,
        risk_level: formData.risk_level || "safe",
        chatter_notes: formData.chatter_notes || null,
        last_contact_date: formData.last_contact_date || null,
      };
      if (formData.id) {
        const { error } = await sb.from("spenders").update(updates).eq("id", formData.id);
        if (error) { addToast("Erreur: " + error.message, "error"); setSaving(false); return; }
      } else {
        const { error } = await sb.from("spenders").upsert({ handle: formData.spender_handle, name: formData.spender_handle, ...updates }, { onConflict: "handle" });
        if (error) { addToast("Erreur: " + error.message, "error"); setSaving(false); return; }
      }
      setSaving(false);
      setEditMode(false);
      addToast(fr ? "Fiche sauvegardée" : "Profile saved", "success");
      await onRefresh();
      setSelectedSpender(null);
    } catch (e) { /* Spender profile save failed */ setSaving(false); addToast("Erreur: " + e.message, "error"); }
  };

  const openDetail = (sp) => {
    setSelectedSpender(sp);
    setForm({ ...sp });
    setEditMode(false);
  };

  const spenderTxs = useMemo(() => {
    if (!selectedSpender) return [];
    return txs.filter(tx => tx.spender_handle === selectedSpender.spender_handle).sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [selectedSpender, txs]);

  // ── WhatsApp Analyzer: IA extraction ──
  const waExtract = () => {
    if (!waText.trim()) return;
    setWaExtracting(true);
    try {
      const lines = waText.split("\n").map(l => l.trim()).filter(Boolean);
      const entries = [];
      // Amount patterns: $50, 50$, 50€, €50, 50 USD, 50 EUR, 50.00, 50,00
      const amountRe = /(?:[\$\u20AC\u00A3])\s*(\d[\d.,]*)|(\d[\d.,]*)\s*(?:[\$\u20AC\u00A3]|(?:USD|EUR|GBP|usd|eur))/;
      const amountRe2 = /\b(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:\$|\u20AC|\u00A3|USD|EUR|dollars?|euros?)/i;
      const amountRe3 = /(?:\$|\u20AC|\u00A3)\s*(\d{1,6}(?:[.,]\d{1,2})?)/;
      // Date patterns in messages
      const msgDateRe = /\[?(\d{1,2}\/\d{1,2}\/\d{2,4})[,\s]+(\d{1,2}:\d{2}(?::\d{2})?(?:\s*[APap][Mm])?)\]?\s*[-–]?\s*/;
      // Known product keywords from catalog
      const productNames = (products || []).map(p => p.name?.toLowerCase()).filter(Boolean);
      const tagNames = (productTags || []).map(t => t.name?.toLowerCase()).filter(Boolean);
      let currentSender = null;
      let currentDate = null;
      for (const line of lines) {
        // Try to parse message header
        const hdr = line.match(msgDateRe);
        if (hdr) {
          const rest = line.slice(hdr[0].length);
          const colonIdx = rest.indexOf(":");
          if (colonIdx > 0 && colonIdx < 60) {
            currentSender = rest.slice(0, colonIdx).replace(/^~\s*/, "").trim();
            const dateParts = hdr[1].split("/");
            if (dateParts.length === 3) {
              const p0 = parseInt(dateParts[0],10), p1 = parseInt(dateParts[1],10);
              let yr = parseInt(dateParts[2],10); if (yr < 100) yr += 2000;
              const day = p0 > 12 ? p0 : (p1 > 12 ? p1 : p0);
              const month = p0 > 12 ? p1 : (p1 > 12 ? p0 : p1);
              currentDate = `${yr}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            }
          }
        }
        // Look for amounts in this line
        let amt = null, cur = "EUR";
        const m1 = line.match(amountRe) || line.match(amountRe2) || line.match(amountRe3);
        if (m1) {
          const rawAmt = (m1[1] || m1[2] || "").replace(",", ".");
          amt = parseFloat(rawAmt);
          if (isNaN(amt) || amt <= 0 || amt > 100000) amt = null;
          if (line.match(/[\$]|USD|usd|dollars?/i)) cur = "USD";
          else if (line.match(/[\u00A3]|GBP|pounds?/i)) cur = "GBP";
        }
        if (amt) {
          // Detect product mention
          let product = null, tag = null;
          const lower = line.toLowerCase();
          for (const pn of productNames) { if (lower.includes(pn)) { product = pn; break; } }
          for (const tn of tagNames) { if (lower.includes(tn)) { tag = tn; break; } }
          entries.push({
            spender: currentSender || "?",
            amount: amt,
            currency: cur,
            product: product,
            tag: tag,
            date: currentDate || new Date().toISOString().slice(0,10),
            notes: line.slice(0, 120),
            line: line,
          });
        }
      }
      // Try matching spenders
      const matches = {};
      entries.forEach((e, idx) => {
        const name = (e.spender || "").toLowerCase().trim();
        const found = enrichedSpenders.find(sp =>
          sp.spender_handle?.toLowerCase() === name ||
          sp.first_name?.toLowerCase() === name ||
          sp.name?.toLowerCase() === name ||
          (sp.telegram_username && sp.telegram_username.toLowerCase() === name)
        );
        matches[idx] = { matched: found || null, action: found ? "link" : null };
      });
      setWaResults({ entries });
      setWaMatchedSpenders(matches);
      setWaTxCreated({});
      setWaTxCreating({});
      if (entries.length === 0) {
        addToast(fr ? "Aucune transaction d\u00E9tect\u00E9e dans le texte." : "No transactions detected in text.", "warning");
      } else {
        addToast(fr ? `${entries.length} transaction(s) d\u00E9tect\u00E9e(s) !` : `${entries.length} transaction(s) detected!`, "success");
      }
    } catch (err) { /* WhatsApp extraction failed */
      addToast(fr ? "Erreur d'extraction: " + err.message : "Extraction error: " + err.message, "error");
    }
    setWaExtracting(false);
  };

  // ── WhatsApp Analyzer: create TX from extracted entry ──
  const waCreateTx = async (idx, entry, matchedSp) => {
    setWaTxCreating(p => ({...p, [idx]: true}));
    try {
      const handle = matchedSp?.spender_handle || entry.spender?.replace(/^@/, "").replace(/\s+/g, "_").toLowerCase() || "unknown";
      // Upsert spender if new
      if (!matchedSp) {
        await safeUpsertSpender({ handle, name: entry.spender || handle, status: "active", last_seen: new Date().toISOString() });
      }
      // Build TX row
      const isUUID = (v) => typeof v === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
      const txRow = {
        date: new Date(entry.date || Date.now()).toISOString(),
        spender_handle: handle,
        amount: entry.amount,
        status: "pending",
        notes: entry.notes || null,
      };
      if (entry.currency && entry.currency !== "EUR") txRow.currency = entry.currency;
      if (entry.product) txRow.product = entry.product;
      if (entry.tag) txRow.tag = entry.tag;
      // Try to find model from user's assigned models
      if (user.assigned_models && user.assigned_models.length === 1) {
        txRow.model_id = user.assigned_models[0];
      }
      txRow.chatter_id = user.id;
      const res = await safeInsertTx(txRow);
      if (!res.error) {
        setWaTxCreated(p => ({...p, [idx]: true}));
        addToast(`${handle} \u2014 ${entry.amount}${entry.currency === "USD" ? "$" : "\u20AC"} \u2713`, "success");
        await onRefresh();
      } else {
        addToast("Erreur: " + res.error.message, "error");
      }
    } catch (e) {
      addToast("Erreur: " + e.message, "error");
    }
    setWaTxCreating(p => ({...p, [idx]: false}));
  };

  // ── WhatsApp Analyzer: create all TX at once ──
  const waCreateAll = async () => {
    if (!waResults?.entries) return;
    for (let i = 0; i < waResults.entries.length; i++) {
      if (waTxCreated[i]) continue;
      const e = waResults.entries[i];
      const m = waMatchedSpenders[i]?.matched;
      await waCreateTx(i, e, m);
    }
  };

  // ── RENDER ──
  return (
    <div>
      {/* GlobalFilterBar */}
      <GlobalFilterBar lang={lang} dr={dr} models={models} profiles={null}
        model={filterModel} setModel={setFilterModel} showModelFilter />

      {/* Header + View Toggle */}
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20 }}>
        <div>
          <h2 style={{ fontSize: 20, fontWeight: 800, margin: 0 }}>{"\u{1F4B0}"} {fr ? "Mes Spenders" : "My Spenders"}</h2>
          <p style={{ color: "var(--text-tertiary)", fontSize: 11, margin: "3px 0 0", fontStyle: "italic" }}>
            {fr ? "Connais ton client, close ta vente" : "Know your client, close the deal"}
          </p>
        </div>
        <div style={{display:"flex",gap:0,borderRadius:14,border:"1px solid var(--border-default)",overflow:"hidden"}}>
          <button onClick={()=>setViewMode("cards")} style={{padding:"7px 14px",border:"none",background:viewMode==="cards"?"var(--accent-muted)":"transparent",color:viewMode==="cards"?"var(--accent)":"var(--text-tertiary)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{"\u{1F4CB}"} Cards</button>
          <button onClick={()=>setViewMode("table")} style={{padding:"7px 14px",border:"none",background:viewMode==="table"?"var(--accent-muted)":"transparent",color:viewMode==="table"?"var(--accent)":"var(--text-tertiary)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{"\u{1F4CA}"} Table</button>
          <button onClick={()=>setViewMode("analyzer")} style={{padding:"7px 14px",border:"none",background:viewMode==="analyzer"?"var(--accent-muted)":"transparent",color:viewMode==="analyzer"?"var(--accent)":"var(--text-tertiary)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{"\u{1F4F1}"} WA Analyzer</button>
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 24 }}>
        <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 14, padding: "16px 20px" }}>
          <div style={{ fontSize: 10, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>{"\u{1F465}"} {fr ? "Mes Spenders" : "My Spenders"}</div>
          <div style={{ fontSize: 24, fontWeight: 800 }}>{mySpenders.length}</div>
        </div>
        <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 14, padding: "16px 20px" }}>
          <div style={{ fontSize: 10, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>{"\u{1F40B}"} Whales</div>
          <div style={{ fontSize: 24, fontWeight: 800, color: "var(--accent)" }}>{whaleCount}</div>
        </div>
        <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 14, padding: "16px 20px" }}>
          <div style={{ fontSize: 10, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>{"\u{1F4B0}"} CA Total</div>
          <div style={{ fontSize: 24, fontWeight: 800, color: "var(--success)" }}>{totalCA.toLocaleString("fr-FR", { maximumFractionDigits: 0 })}{currencySymbol}</div>
        </div>
        <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 14, padding: "16px 20px" }}>
          <div style={{ fontSize: 10, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>{"\u{1F451}"} Top Spender</div>
          <div style={{ fontSize: 14, fontWeight: 800, color: "var(--warning)", overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{mySpenders[0]?`@${mySpenders[0].spender_handle}`:"\u2014"}</div>
          {mySpenders[0] && <div style={{fontSize:10,color:"var(--text-tertiary)"}}>{(mySpenders[0].total_spent||0).toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}</div>}
        </div>
      </div>

      {/* Filters */}
      <div style={{ display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap" }}>
        {[
          { key: "all", label: fr ? "Tous" : "All", icon: "\u{1F465}" },
          { key: "whale", label: "Whale", icon: "\u{1F40B}", color: "var(--accent)" },
          { key: "vip", label: "VIP", icon: "\u2B50", color: "var(--warning)" },
          { key: "regular", label: "Regular", icon: "\u{1F464}", color: "var(--success)" },
          { key: "lead", label: "Lead", icon: "\u{1F3AF}", color: "var(--pink)" },
          { key: "timewaster", label: "Timewaster", icon: "\u23F0", color: "var(--danger)" },
        ].map(f => (
          <button key={f.key} onClick={() => setFilter(f.key)} style={{
            padding: "6px 14px", borderRadius: 12,
            border: filter === f.key ? `1px solid ${(f.color || "var(--text-quaternary)")}66` : "1px solid var(--border-default)",
            background: filter === f.key ? `${(f.color || "var(--text-quaternary)")}20` : "transparent",
            color: filter === f.key ? (f.color || "var(--text-primary)") : "var(--text-tertiary)",
            fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans', sans-serif",
          }}>
            {f.icon} {f.label}
          </button>
        ))}
      </div>

      {/* Search */}
      <input
        type="text"
        placeholder={fr ? "\u{1F50D} Chercher par nom, pseudo, ville..." : "\u{1F50D} Search by name, handle, city..."}
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        style={{
          width: "100%", padding: "10px 16px", borderRadius: 14,
          border: "1px solid var(--border-default)", background: "var(--card-bg)",
          color: "var(--text-primary)", fontSize: 13, fontFamily: "'DM Sans', sans-serif",
          outline: "none", marginBottom: 20, boxSizing: "border-box",
        }}
      />

      {/* Grid of cards */}
      {viewMode === "cards" && (
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 16 }}>
        {mySpenders.map(sp => {
          const c = classColors[sp.classification] || classColors.new;

// OBJECTIFS TAB
// =============================================
const ObjectifsTab = ({user, lang, txs, profiles, onRefresh}) => {
  const { convertAmount, currencySymbol } = useCurrency();
  const addToast = useToast();
  const fr = lang === "fr";
  const [confettiShown, setConfettiShown] = useState({});

  const renderChatterObjectifs = (ch, isOwn) => {
    const xp = calculateXP(ch.id, txs, convertAmount);
    const level = getLevel(xp);
    const streak = calculateStreak(ch.id, txs);
    const streakBadges = getStreakBadges(streak);
    const dailyCA = getDailyProgress(ch.id, txs, convertAmount);
    const weeklyCA = getWeeklyProgress(ch.id, txs, convertAmount);
    const dGoal = Number(ch.daily_goal) || 500;
    const wGoal = Number(ch.weekly_goal) || 3000;
    const dailyPct = Math.min(Math.round((dailyCA / dGoal) * 100), 200);
    const weeklyPct = Math.min(Math.round((weeklyCA / wGoal) * 100), 200);
    const isMultiplier = dailyCA >= dGoal * 1.5;

    // Confetti on goal reached
    if (dailyCA >= dGoal && !confettiShown[ch.id]) {
      setConfettiShown(prev => ({ ...prev, [ch.id]: true }));
      if (isOwn) setTimeout(launchConfetti, 300);
    }

    return (
      <div key={ch.id} style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 12, padding: 20, marginBottom: 14 }}>
        {/* Header: name + level + streak */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {!isOwn && <Tag type="chatter" label={ch.name} id={ch.id}/>}
            {isOwn && <span style={{ fontSize: 15, fontWeight: 800 }}>{ch.name}</span>}
            <LevelBadge xp={xp} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <StreakBadge streak={streak} />
            {isMultiplier && (
              <div style={{ padding: "4px 12px", borderRadius: 12, background: "var(--warning-muted)", border: "1px solid var(--warning-muted)", animation: "glowPulse 2s infinite" }}>
                <span style={{ fontSize: 12, fontWeight: 800, color: "var(--warning)" }}>{"\u26A1"} XP x2</span>
              </div>
            )}
          </div>
        </div>
        {/* XP Progress */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "var(--text-tertiary)", marginBottom: 4 }}>
            <span>{level.icon} {level.name}</span>
            <span>{level.nextLevel ? `${xp.toLocaleString()} / ${level.nextLevel.min.toLocaleString()} XP` : "MAX LEVEL"}</span>
          </div>
          <XPProgressBar xp={xp} />
        </div>
        {/* Daily Goal */}
        <div style={{ background: "var(--bg-overlay)", borderRadius: 14, padding: 14, marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: "var(--text-tertiary)", fontWeight: 600 }}>
              {fr ? "OBJECTIF DAILY" : "DAILY GOAL"} {isMultiplier && "\u26A1 BONUS x2 ACTIF"}
            </span>
            <span style={{ fontSize: 12, fontWeight: 800, color: dailyPct >= 100 ? "var(--success)" : "var(--text-primary)" }}>
              {Math.round(dailyCA).toLocaleString()} / {dGoal.toLocaleString()}{currencySymbol}
            </span>
          </div>
          <div style={{ width: "100%", height: 10, borderRadius: 10, background: "var(--bg-hover)", overflow: "hidden" }}>
            <div style={{
              width: Math.min(dailyPct, 100) + "%", height: "100%", borderRadius: 10,
              background: dailyPct >= 150 ? "linear-gradient(90deg, var(--success), var(--warning), var(--pink))" : dailyPct >= 100 ? "linear-gradient(90deg, var(--success), var(--accent))" : "var(--accent)",
              transition: "width 0.8s ease",
              boxShadow: dailyPct >= 100 ? "none" : "none",
            }} />
          </div>
          <div style={{ fontSize: 10, color: "var(--text-quaternary)", marginTop: 4 }}>
            {dailyPct}% \u2014 {dailyPct >= 150 ? "\u{1F525} BONUS MULTIPLICATEUR x2 !" : dailyPct >= 100 ? "\u2705 Objectif atteint !" : `${fr ? "Encore" : "Still"} ${Math.round(dGoal - dailyCA).toLocaleString()}${currencySymbol}`}
          </div>
        </div>
        {/* Weekly Goal */}
        <div style={{ background: "var(--bg-overlay)", borderRadius: 14, padding: 14, marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: "var(--text-tertiary)", fontWeight: 600 }}>{fr ? "OBJECTIF WEEKLY" : "WEEKLY GOAL"}</span>
            <span style={{ fontSize: 12, fontWeight: 800, color: weeklyPct >= 100 ? "var(--success)" : "var(--text-primary)" }}>
              {Math.round(weeklyCA).toLocaleString()} / {wGoal.toLocaleString()}{currencySymbol}
            </span>
          </div>
          <div style={{ width: "100%", height: 10, borderRadius: 10, background: "var(--bg-hover)", overflow: "hidden" }}>
            <div style={{ width: Math.min(weeklyPct, 100) + "%", height: "100%", borderRadius: 10, background: weeklyPct >= 100 ? "linear-gradient(90deg, var(--success), var(--accent))" : "var(--accent)", transition: "width 0.8s ease" }} />
          </div>
          <div style={{ fontSize: 10, color: "var(--text-quaternary)", marginTop: 4 }}>{weeklyPct}%</div>
        </div>
        {/* Streak badges */}
        {streakBadges.length > 0 && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            {streakBadges.map(b => (
              <span key={b.name} style={{ padding: "3px 10px", borderRadius: 10, background: b.color + "15", border: "1px solid " + b.color + "30", color: b.color, fontSize: 10, fontWeight: 700 }}>{b.icon} {b.name}</span>
            ))}
          </div>
        )}
      </div>
    );
  };

  if (user.role === "chatter") {
    return (
      <div>
        <div style={{ marginBottom: 20 }}>
          <h2 style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>{"\u{1F3AF}"} {fr ? "Mes Objectifs" : "My Goals"}</h2>
          <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "3px 0 0" }}>{fr ? "XP, niveaux, streaks et objectifs" : "XP, levels, streaks and goals"}</p>
        </div>
        {renderChatterObjectifs(user, true)}
      </div>
    );
  }

  // Gérant view: all chatters + goal config
  const chatters = profiles.filter(u => u.role === "chatter");
  const [editGoals, setEditGoals] = useState(null);
  const [goalForm, setGoalForm] = useState({ daily_goal: 0, weekly_goal: 0 });
  const saveGoals = async () => {
    if (!editGoals) return;
    await sb.from("profiles").update({ daily_goal: Number(goalForm.daily_goal), weekly_goal: Number(goalForm.weekly_goal) }).eq("id", editGoals);
    addToast(fr ? "Objectifs mis \u00E0 jour" : "Goals updated", "success");
    setEditGoals(null);
    if (onRefresh) await onRefresh();
  };

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <h2 style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>{"\u{1F3AF}"} {fr ? "Objectifs \u00E9quipe" : "Team Goals"}</h2>
        <p style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "3px 0 0" }}>{fr ? "Suivi des objectifs de chaque chatter" : "Track each chatter's goals"}</p>
      </div>
      {chatters.map(ch => (
        <div key={ch.id}>
          {renderChatterObjectifs(ch, false)}
          {/* Goal edit button */}
          <div style={{ display: "flex", gap: 8, marginTop: -8, marginBottom: 14, paddingLeft: 8 }}>
            {editGoals === ch.id ? (
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>Daily:</span>
                <input type="number" value={goalForm.daily_goal} onChange={e => setGoalForm({ ...goalForm, daily_goal: e.target.value })} className="input" style={{ width: 80, fontSize: 11, padding: "4px 8px" }} />
                <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>Weekly:</span>
                <input type="number" value={goalForm.weekly_goal} onChange={e => setGoalForm({ ...goalForm, weekly_goal: e.target.value })} className="input" style={{ width: 80, fontSize: 11, padding: "4px 8px" }} />
                <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{currencySymbol}</span>
                <button onClick={saveGoals} className="btn btn-primary" style={{ fontSize: 10, padding: "4px 10px" }}>{"\u2705"}</button>
                <button onClick={() => setEditGoals(null)} style={{ fontSize: 10, color: "var(--text-quaternary)", background: "none", border: "none", cursor: "pointer" }}>{"\u2715"}</button>
              </div>
            ) : (
              <button onClick={() => { setEditGoals(ch.id); setGoalForm({ daily_goal: ch.daily_goal || 0, weekly_goal: ch.weekly_goal || 0 }); }}
                style={{ fontSize: 10, color: "var(--text-quaternary)", background: "none", border: "1px solid var(--border-default)", borderRadius: 8, padding: "3px 10px", cursor: "pointer" }}>
                {"\u2699\uFE0F"} {fr ? "Configurer objectifs" : "Configure goals"}
              </button>
            )}
          </div>
        </div>
      ))}
    </div>
  );
};

  const { convertAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const dr = useDateRange("7d");
  const [leaderMetric, setLeaderMetric] = useState("ca");
  const chatters = profiles.filter(u=>u.role==="chatter");
  const compFiltered = dr.filterByDate(txs, "date");

  const ranking = useMemo(() => {
    return chatters.map(ch => {
      const chTx = compFiltered.filter(tx => tx.chatter_id === ch.id && (tx.status === "validated" || tx.status === "confirmee"));
      const ca = chTx.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const allChTx = compFiltered.filter(tx => tx.chatter_id === ch.id);
      const convRate = allChTx.length > 0 ? Math.round((chTx.length / allChTx.length) * 100) : 0;
      const avgTicket = chTx.length > 0 ? Math.round(ca / chTx.length) : 0;
      const xp = calculateXP(ch.id, txs, convertAmount);
      const streak = calculateStreak(ch.id, txs);
      return { user: ch, ca, cnt: allChTx.length, validCnt: chTx.length, convRate, avgTicket, xp, streak };
    }).sort((a, b) => {
      if (leaderMetric === "ca") return b.ca - a.ca;
      if (leaderMetric === "txCount") return b.validCnt - a.validCnt;
      if (leaderMetric === "convRate") return b.convRate - a.convRate;
      if (leaderMetric === "avgTicket") return b.avgTicket - a.avgTicket;
      return b.ca - a.ca;
    });
  }, [compFiltered, chatters, leaderMetric, txs, convertAmount]);

  const top3 = ranking.slice(0, 3);
  const maxCA = top3.length > 0 ? top3[0].ca : 1;
  const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];

  const getMetricValue = (r) => {
    if (leaderMetric === "ca") return Math.round(r.ca).toLocaleString() + currencySymbol;
    if (leaderMetric === "txCount") return r.validCnt + " TX";
    if (leaderMetric === "convRate") return r.convRate + "%";
    if (leaderMetric === "avgTicket") return Math.round(r.avgTicket).toLocaleString() + currencySymbol;
    return Math.round(r.ca).toLocaleString() + currencySymbol;
  };

  return (
    <div>
      <GlobalFilterBar lang={lang} dr={dr} />

      {/* Metric selector */}
      <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
        {[{k:"ca",l:"CA Brut"},{k:"txCount",l:"Nombre TX"},{k:"convRate",l:"Taux Conv."},{k:"avgTicket",l:"Panier Moyen"}].map(m => (
          <button key={m.k} onClick={() => setLeaderMetric(m.k)} className={`filter-chip ${leaderMetric===m.k?"active":""}`}>{m.l}</button>
        ))}
      </div>

      <div className="trophy">{"\u{1F3C6}"}</div>

      {/* Podium */}
      <div className="podium">
        {top3.map((r, idx) => (
          <div key={r.user.id} className="podium-step">
            <div className="podium-rank">{medals[idx]}</div>
            <LevelBadge xp={r.xp} />
            <div className="podium-bar" style={{ height: `${(r.ca / maxCA) * 200}px` }}></div>
            <div className="podium-name">{r.user.name}</div>
            <div className="podium-ca">{getMetricValue(r)}</div>
            <StreakBadge streak={r.streak} />
          </div>
        ))}
      </div>

      {/* Full table */}
      <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 16, overflow: "hidden", marginBottom: 20 }}>
        <div style={{ overflowX: "auto" }}>
          <table className="table">
            <thead><tr>
              <th>#</th><th>Chatter</th><th>{fr ? "Niveau" : "Level"}</th><th>CA</th><th>TX</th><th>{fr ? "Taux Conv." : "Conv. Rate"}</th><th>{fr ? "Panier Moyen" : "Avg Ticket"}</th><th>Streak</th><th>XP</th>
            </tr></thead>
            <tbody>
              {ranking.map((r, idx) => (
                <tr key={r.user.id} style={{ background: user.id === r.user.id ? "var(--accent-subtle)" : "" }}>
                  <td style={{ fontWeight: 700 }}>{idx < 3 ? medals[idx] : (idx + 1)}</td>
                  <td><Tag type="chatter" label={r.user.name} id={r.user.id}/> {user.id === r.user.id && <span style={{ fontSize: 9, color: "var(--accent)" }}>({t(lang, "you")})</span>}</td>
                  <td><LevelBadge xp={r.xp} /></td>
                  <td style={{ fontWeight: 700 }}>{Math.round(r.ca).toLocaleString()}{currencySymbol}</td>
                  <td>{r.validCnt}</td>
                  <td>
                    <span style={{ padding: "2px 8px", borderRadius: 10, background: r.convRate >= 80 ? "var(--success-muted)" : r.convRate >= 50 ? "var(--warning-muted)" : "var(--danger-muted)", color: r.convRate >= 80 ? "var(--success)" : r.convRate >= 50 ? "var(--warning)" : "var(--danger)", fontSize: 11, fontWeight: 700 }}>{r.convRate}%</span>
                  </td>
                  <td>{Math.round(r.avgTicket).toLocaleString()}{currencySymbol}</td>
                  <td><StreakBadge streak={r.streak} /></td>
                  <td style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{r.xp.toLocaleString()}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

const PayesTab = ({user, lang, txs, payouts, profiles, onRefresh, invoices}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const dr = useDateRange("all");
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [payesSubTab, setPayesSubTab] = useState("paies");
  const chatters = user.role==="chatter" ? profiles.filter(u=>u.id===user.id) : profiles.filter(u=>u.role==="chatter");
  const [form, setForm] = useState({user_id:chatters[0]?.id||"",amount:"",method:"Virement",date:""});
  const fr = lang === "fr";
  const payFilteredTxs = dr.filterByDate(txs, "date");
  const getChatterData = (chatterId) => {
    const chTx = payFilteredTxs.filter(tx=>tx.chatter_id===chatterId && tx.status==="validated");
    const totalComm = chTx.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
    const paidAmount = payouts.filter(p=>p.user_id===chatterId && p.status==="done").reduce((s,p)=>s+Number(p.amount),0);
    return {totalEarned:totalComm, paidAmount, balance:totalComm-paidAmount};
  };
  const handleAddPayout = async () => {
    if(!form.amount||isNaN(parseFloat(form.amount))||parseFloat(form.amount)<=0) { addToast(fr?"Montant invalide (> 0)":"Invalid amount (> 0)","error"); return; }
    if(!form.date) { addToast(fr?"Date requise":"Date required","error"); return; }
    setSaving(true);
    try {
      const {data:inserted, error} = await sb.from("payouts").insert({user_id:form.user_id, amount:parseFloat(form.amount), method:form.method, date:form.date, status:"pending"}).select().single();
      if(error) { addToast("Erreur payout: " + error.message, "error"); setSaving(false); return; }
      // Auto-generate invoice for chatter payout
      const chatterProfile = profiles.find(p=>p.id===form.user_id);
      if(inserted && user.role==="gerant") {
        try { await generateChatterInvoice({id:inserted.id, user_id:form.user_id, amount:parseFloat(form.amount), method:form.method, date:form.date}, txs, profiles, user.id); } catch(e) { /* Chatter invoice gen best-effort */ addToast(fr?"Erreur génération facture":"Invoice generation error","error"); }
      }
      setForm({user_id:chatters[0]?.id||"",amount:"",method:"Virement",date:""});
      setShowForm(false);
      await onRefresh();
      addToast(t(lang,"payout_added")||"Payout ajouté ✓","success");
    } catch(e) { /* Payout creation failed */ addToast("Erreur payout: " + e.message, "error"); }
    setSaving(false);
  };
  const myInvoices = (invoices||[]).filter(inv => {
    if (user.role === "chatter") return inv.profile_id === user.id && inv.type === "outgoing_chatter";
    if (user.role === "gerant") return inv.type === "outgoing_chatter";
    return false;
  });
  return (
    <div>
      {/* Sub-tab selector */}
      <div style={{display:"flex",gap:4,marginBottom:20}}>
        {[{id:"paies",label:fr?"Mes Paies":"My Payouts"},{id:"factures",label:fr?"Mes Factures":"My Invoices"}].map(tb=>(
          <button key={tb.id} className="btn" style={{padding:"6px 16px",fontSize:12,fontWeight:payesSubTab===tb.id?800:600,background:payesSubTab===tb.id?"var(--accent)":"var(--card-bg)",color:payesSubTab===tb.id?"#fff":"var(--text-secondary)",border:"1px solid "+(payesSubTab===tb.id?"var(--accent)":"var(--border-subtle)"),borderRadius:20}} onClick={()=>setPayesSubTab(tb.id)}>{tb.label}</button>
        ))}
      </div>
      {payesSubTab==="factures" ? (
        <MyInvoicesPanel invoices={myInvoices} lang={lang} />
      ) : (
      <>
      <GlobalFilterBar lang={lang} dr={dr} />
      {chatters.map(ch=>{
        const data = getChatterData(ch.id);
        const chPayouts = payouts.filter(p=>p.user_id===ch.id);
        return (
          <div key={ch.id} className="card" style={{marginBottom:20}}>
            <div className="profile-header"><div className="profile-name"><Tag type="chatter" label={ch.name} id={ch.id}/></div></div>
            <div className="profile-section">
              <div className="profile-row"><span>{t(lang,"total_earned")}</span><span>{data.totalEarned.toFixed(0)}</span></div>
              <div className="profile-row"><span>{t(lang,"already_paid")}</span><span>{data.paidAmount.toFixed(0)}</span></div>
              <div className="profile-row"><span>{t(lang,"balance_due")}</span><span style={{color:data.balance>0?"var(--warning)":"var(--success)",fontWeight:700}}>{data.balance.toFixed(0)}</span></div>
            </div>
            <div style={{marginTop:16}}>
              <div className="section-title"><div className="section-bar"></div>{t(lang,"payment_history")}</div>
              <div className="table-wrap">
                <table className="table" style={{fontSize:12}}>
                  <thead><tr><th>{t(lang,"date")}</th><th>{t(lang,"amount")}</th><th>{t(lang,"method")}</th><th>{t(lang,"status")}</th></tr></thead>
                  <tbody>
                    {chPayouts.map(p=>(
                      <tr key={p.id}><td>{fmtDate(p.date)}</td><td>{p.amount}</td><td>{p.method}</td><td><span className={`badge ${p.status==="done"?"badge-done":"badge-pending"}`}>{p.status}</span></td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })}
      {user.role==="gerant"&&(
        <>
          <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ {t(lang,"add_payout")}</button>
          {showForm&&(
            <div className="card" style={{marginBottom:20}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
                <div className="form-group-modal">
                  <label className="form-label">Chatter</label>
                  <select className="filter-select" value={form.user_id} onChange={e=>setForm({...form,user_id:e.target.value})}>
                    {chatters.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                  </select>
                </div>
                <div className="form-group-modal">
                  <label className="form-label">{t(lang,"amount")}</label>
                  <input className="form-input" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
                </div>
                <div className="form-group-modal">
                  <label className="form-label">{t(lang,"method")}</label>
                  <select className="filter-select" value={form.method} onChange={e=>setForm({...form,method:e.target.value})}>
                    <option>Virement</option><option>PayPal</option><option>Revolut</option><option>Twint</option><option>Cash</option>
                  </select>
                </div>
                <div className="form-group-modal">
                  <label className="form-label">{t(lang,"date")}</label>
                  <input className="filter-date" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} />
                </div>
              </div>
              <div style={{display:"flex",gap:12,marginTop:16}}>
                <button className="btn btn-success" onClick={handleAddPayout} disabled={saving}>{saving?"...":t(lang,"create")}</button>
                <button className="btn btn-danger" onClick={()=>setShowForm(false)}>{t(lang,"cancel")}</button>
              </div>
            </div>
          )}
        </>
      )}
      </>
      )}
    </div>
  );
};

const ChattersTab = ({user, lang, txs, profiles, models}) => {
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const [selectedId, setSelectedId] = useState(null);
  const chatters = profiles.filter(u=>u.role==="chatter");
  const getStats = (chatterId) => {
    const chTx = txs.filter(tx=>tx.chatter_id===chatterId);
    const validTx = chTx.filter(tx=>tx.status==="validated");
    const validCA = validTx.reduce((s,tx)=>s+Number(tx.amount),0);
    const pendingCA = chTx.filter(tx=>tx.status==="pending").reduce((s,tx)=>s+Number(tx.amount),0);
    const refusedCount = chTx.filter(tx=>tx.status==="refused").length;
    const commDue = validTx.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
    const avgTicket = validTx.length ? validCA/validTx.length : 0;
    const spenders = [...new Set(chTx.map(tx=>tx.spender_handle))];
    return {validCA, validCount:validTx.length, pendingCA, pendingCount:chTx.filter(tx=>tx.status==="pending").length, refusedCount, commDue, avgTicket, spenders};
  };
  const totalValidCA = chatters.reduce((s,ch)=>s+getStats(ch.id).validCA,0);
  const totalCommOwed = chatters.reduce((s,ch)=>s+getStats(ch.id).commDue,0);
  const totalPendingCA = chatters.reduce((s,ch)=>s+getStats(ch.id).pendingCA,0);
  const selected = selectedId ? chatters.find(c=>c.id===selectedId) : null;
  const selStats = selected ? getStats(selected.id) : null;
  const medals = ["🥇","🥈","🥉"];
  return (
    <div>
      <div className="kpi-grid">
        <KPICard label={t(lang,"active_chatters")} value={String(chatters.length)} icon="💬"/>
        <KPICard label={t(lang,"ca_validated")} value={String(totalValidCA)+currencySymbol} icon="✅"/>
        <KPICard label={t(lang,"total_comm_owed")} value={totalCommOwed.toFixed(0)+currencySymbol} icon="💸"/>
        <KPICard label={t(lang,"ca_pending")} value={String(totalPendingCA)+currencySymbol} icon="⏳" className="warning" />
      </div>
      <div style={{display:"grid",gridTemplateColumns:selected?"300px 1fr":"1fr",gap:16}}>
        <div>
          {chatters.map((ch,i)=>{
            const stats = getStats(ch.id);
            const chXP = calculateXP(ch.id, txs, convertAmount);
            const chStreak = calculateStreak(ch.id, txs);
            return (
              <div key={ch.id} className="spender-card" onClick={()=>setSelectedId(selectedId===ch.id?null:ch.id)}
                style={{border:selectedId===ch.id?"1px solid var(--accent)":""}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:20}}>{medals[i]||("#"+(i+1))}</span>
                    <div>
                      <div className="spender-name"><Tag type="chatter" label={ch.name} id={ch.id}/></div>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                        <LevelBadge xp={chXP} />
                        {chStreak > 0 && <StreakBadge streak={chStreak} />}
                      </div>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="spender-ltv">{stats.validCA}{currencySymbol}</div>
                    <div style={{fontSize:10,color:"var(--text2)"}}>{stats.validCount} ventes</div>
                  </div>
                </div>
                <XPProgressBar xp={chXP} />
              </div>
            );
          })}
        </div>
        {selected && selStats && (
          <div className="profile-panel">
            <div className="profile-header">
              <div className="profile-name">{selected.name}</div>
              <button className="profile-close" onClick={()=>setSelectedId(null)}>X</button>
            </div>
            <div style={{fontSize:12,color:"var(--text2)",marginBottom:8}}>Commission: {selected.commission_pct}%</div>
            <div style={{marginBottom:12}}>
              <LevelBadge xp={calculateXP(selected.id, txs, convertAmount)} />
              <XPProgressBar xp={calculateXP(selected.id, txs, convertAmount)} />
              <div style={{display:"flex",gap:8,marginTop:6}}>
                <StreakBadge streak={calculateStreak(selected.id, txs)} />
                {getStreakBadges(calculateStreak(selected.id, txs)).map(b => (
                  <span key={b.name} style={{padding:"2px 8px",borderRadius:8,background:b.color+"15",color:b.color,fontSize:10,fontWeight:600}}>{b.icon} {b.name}</span>
                ))}
              </div>
            </div>
            <BadgeBar badges={getBadges(txs, selected.id).badges}/>
            <div className="profile-section">
              <div className="profile-section-title">KPIs</div>
              <div className="profile-row"><span>{t(lang,"ca_validated")}</span><span style={{color:"var(--accent)",fontWeight:700}}>{selStats.validCA}{currencySymbol}</span></div>
              <div className="profile-row"><span>{t(lang,"ca_pending")}</span><span style={{color:"var(--warning)",fontWeight:700}}>{selStats.pendingCA}{currencySymbol}</span></div>
              <div className="profile-row"><span>{t(lang,"total_comm_owed")}</span><span style={{color:selStats.commDue>0?"var(--warning)":"var(--success)",fontWeight:700}}>{selStats.commDue.toFixed(0)}{currencySymbol}</span></div>
              <div className="profile-row"><span>Panier moyen</span><span>{selStats.avgTicket.toFixed(0)}{currencySymbol}</span></div>
            </div>
            <div className="profile-section">
              <div className="profile-section-title">{t(lang,"stats")}</div>
              <div className="profile-row"><span>{t(lang,"validated")}</span><span>{selStats.validCount}</span></div>
              <div className="profile-row"><span>{t(lang,"pending")}</span><span>{selStats.pendingCount}</span></div>
              <div className="profile-row"><span>{t(lang,"refused")}</span><span>{selStats.refusedCount}</span></div>
            </div>
            <div className="profile-section">
              <div className="profile-section-title">{t(lang,"managed_spenders")} ({selStats.spenders.length})</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {selStats.spenders.map(sp=>(
                  <Tag key={sp} type="spender" label={sp} id={sp}/>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

  const totalDadaFees = validTxs.reduce((s,tx)=>s+Number(tx.dada_fee||0),0);
  const totalNet = validTxs.reduce((s,tx)=>s+Number(tx.net_amount||0),0);

    <div>

              <tr><td>{t(lang,"dada_fee")}</td><td>-{totalDadaFees.toFixed(0)}</td></tr>
              <tr><td style={{fontWeight:600}}>{t(lang,"net")}</td><td style={{fontWeight:600}}>{totalNet.toFixed(0)}</td></tr>
              <tr><td>{t(lang,"chatter_comms")}</td><td>-{totalComms.toFixed(0)}</td></tr>
              <tr><td style={{fontWeight:600}}>{t(lang,"gross_margin")}</td><td style={{fontWeight:600}}>{(totalNet-totalComms).toFixed(0)}</td></tr>
              <tr><td>{t(lang,"expenses")}</td><td>-{totalExpenses.toFixed(0)}</td></tr>
              <tr><td style={{fontWeight:600,color:"var(--success)"}}>{t(lang,"net_profit")}</td><td style={{fontWeight:600,color:"var(--success)"}}>{netProfit.toFixed(0)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>{t(lang,"revenue_by_model")}</div>
          <div className="table-wrap">
            <table className="table"><thead><tr><th>Model</th><th>CA</th></tr></thead>

              {models.map(m=>{
                const ca = validTxs.filter(tx=>tx.model_id===m.id).reduce((s,tx)=>s+Number(tx.amount),0);
                return <tr key={m.id}><td>{m.name}</td><td>{ca}</td></tr>;
              })}
            </tbody></table>
          </div>
        </div>
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>Commission Distribution</div>
          <table className="table"><thead><tr><th>Chatter</th><th>Comm</th></tr></thead>
          <tbody>
            {profiles.filter(u=>u.role==="chatter").map(u=>{
              const comm = validTxs.filter(tx=>tx.chatter_id===u.id).reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);

          </tbody></table>
        </div>
      </div>
      <div className="card" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>{t(lang,"expenses")}</div>
        <button className="btn btn-primary" style={{marginBottom:12,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ Add Expense</button>
        {showForm&&(

// =============================================
// SPENDER PROFILE ENGINE (computed from transactions)
// =============================================
const computeSpenderProfile = (handle, txs, models, profiles, spenders) => {
  const sTxs = txs.filter(tx=>tx.spender_handle===handle).sort((a,b)=>new Date(b.date)-new Date(a.date));
  // Also find spender record for OFM metadata (resume, info, contenu, tw)
  const spenderRecord = (spenders||[]).find(s=>(s.handle||s.name||"").toLowerCase()===handle.toLowerCase());
  if(sTxs.length===0 && !spenderRecord) return null;
  const now = new Date();
  const ltv = sTxs.reduce((s,tx)=>s+Number(tx.amount),0);
  const validatedCA = sTxs.filter(tx=>tx.status==="validated").reduce((s,tx)=>s+Number(tx.amount),0);
  const pendingCA = sTxs.filter(tx=>tx.status==="pending").reduce((s,tx)=>s+Number(tx.amount),0);
  const cnt = sTxs.length;
  const aov = ltv/cnt;
  const maxTicket = Math.max(...sTxs.map(tx=>Number(tx.amount)));
  const lastPurchase = sTxs[0]?.date;
  const firstPurchase = sTxs[sTxs.length-1]?.date;
  const recencyDays = lastPurchase ? Math.floor((now-new Date(lastPurchase))/(86400000)) : 999;

  // 7d/30d/90d splits
  const d7 = new Date(now.getTime()-7*86400000);
  const d30 = new Date(now.getTime()-30*86400000);
  const d90 = new Date(now.getTime()-90*86400000);
  const ca7d = sTxs.filter(tx=>new Date(tx.date)>=d7).reduce((s,tx)=>s+Number(tx.amount),0);
  const ca30d = sTxs.filter(tx=>new Date(tx.date)>=d30).reduce((s,tx)=>s+Number(tx.amount),0);
  const ca90d = sTxs.filter(tx=>new Date(tx.date)>=d90).reduce((s,tx)=>s+Number(tx.amount),0);

  // Trend 30d vs previous 30d
  const d60 = new Date(now.getTime()-60*86400000);
  const caPrev30d = sTxs.filter(tx=>{const d=new Date(tx.date);return d>=d60&&d<d30;}).reduce((s,tx)=>s+Number(tx.amount),0);
  const trend = caPrev30d>0 ? ((ca30d-caPrev30d)/caPrev30d*100).toFixed(0) : ca30d>0?"new":0;

  // Top models (rank + montant)
  const modelMap = {};
  sTxs.forEach(tx=>{
    if(!tx.model_id) return;
    if(!modelMap[tx.model_id]) modelMap[tx.model_id]={id:tx.model_id, ca:0, cnt:0};
    modelMap[tx.model_id].ca += Number(tx.amount);
    modelMap[tx.model_id].cnt++;
  });
  const topModels = Object.values(modelMap).map(m=>({...m, name:models.find(x=>x.id===m.id)?.name||"?", pct:ltv>0?((m.ca/ltv)*100):0})).sort((a,b)=>b.ca-a.ca);

  // Top content types
  const typeMap = {};
  sTxs.forEach(tx=>{
    const tp = tx.type||tx.product||tx.tag||"autre";
    if(!typeMap[tp]) typeMap[tp]={type:tp, ca:0, cnt:0};
    typeMap[tp].ca += Number(tx.amount);
    typeMap[tp].cnt++;
  });
  const topTypes = Object.values(typeMap).sort((a,b)=>b.ca-a.ca);

  // Time-of-day pattern (hour buckets)
  const hourMap = {};
  sTxs.forEach(tx=>{
    if(!tx.date) return;
    const h = new Date(tx.date).getHours();
    hourMap[h] = (hourMap[h]||0) + 1;
  });

  // Day-of-week pattern
  const dayMap = {};
  sTxs.forEach(tx=>{
    if(!tx.date) return;
    const d = new Date(tx.date).getDay();
    dayMap[d] = (dayMap[d]||0) + 1;
  });

  // Purchase cadence (avg days between purchases)
  const dates = sTxs.map(tx=>new Date(tx.date).getTime()).sort((a,b)=>a-b);
  let cadence = 0;
  if(dates.length>1){
    const gaps = [];
    for(let i=1;i<dates.length;i++) gaps.push((dates[i]-dates[i-1])/86400000);
    cadence = gaps.reduce((s,g)=>s+g,0)/gaps.length;
  }

  // Segment + tags
  const segment = getSpenderSegment(ltv);
  const tags = [segment];
  if(ltv>2000) tags.push("whale");
  if(recencyDays>30) tags.push("cold");
  else if(recencyDays<=3) tags.push("hot");
  if(ca7d>ca30d*0.7 && ca30d>0) tags.push("accelerating");
  if(trend<-30) tags.push("declining");
  if(cnt>=10) tags.push("loyal");

  // Next best action
  let nextAction = "";
  if(recencyDays>14) nextAction = "relance";
  else if(ltv>1000 && topModels.length===1) nextAction = "upsell (nouveau modèle)";
  else if(ltv>500 && recencyDays<=3) nextAction = "VIP handling";
  else if(cnt===1) nextAction = "follow-up 1st purchase";
  else nextAction = "maintenir engagement";

  // OFM metadata from spender record
  const resume = spenderRecord?.resume || "";
  const prenom = spenderRecord?.prenom || "?";
  const age = spenderRecord?.age || "?";
  const metier = spenderRecord?.metier || "?";
  const contenu = spenderRecord?.contenu || "";
  const isTW = spenderRecord?.is_timewaster || false;
  const telegramId = spenderRecord?.telegram_id || "";
  if(isTW && !tags.includes("timewaster")) tags.push("timewaster");

  return {
    handle, ltv, validatedCA, pendingCA, cnt, aov, maxTicket,
    lastPurchase, firstPurchase, recencyDays,
    ca7d, ca30d, ca90d, trend, caPrev30d,
    topModels, topTypes, hourMap, dayMap, cadence,
    segment, tags, nextAction,
    txs: sTxs,
    // OFM metadata
    resume, prenom, age, metier, contenu, isTW, telegramId,
  };
};

  const [filterModel, setFilterModel] = useState("all");
  const [showDebug, setShowDebug] = useState(false);

  // ── DEFAULTS ──
  const malaProfile = profiles.find(p => p.role === "chatter" && (p.name || "").toLowerCase().includes("mala"));
