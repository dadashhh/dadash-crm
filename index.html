  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3ED%3C/text%3E%3C/svg%3E">
  <title>DADASH - OFM CRM v11</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    /* Safe area support for notched iPhones */
    @supports (padding: env(safe-area-inset-bottom)) {
      .sidebar { padding-bottom: env(safe-area-inset-bottom); }
      .login-wrap { padding-bottom: env(safe-area-inset-bottom); }
    }
    :root {
      --bg: #06080f;
      --bg2: #0c1020;
      --card: rgba(16,24,48,0.75);
      --primary: #6366f1;
      --accent: #8b5cf6;
      --pink: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e5e7eb;
      --text2: #9ca3af;
      --grad: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    /* ====== LIGHT THEME ====== */
    [data-theme="light"] {
      --bg: #f0f2f5;
      --bg2: #ffffff;
      --card: rgba(255,255,255,0.95);
      --text: #1a1a2e;
      --text2: #6b7280;
    }
    [data-theme="light"] .login-wrap { background: #f0f2f5; }
    [data-theme="light"] .login-orb { opacity: 0.08; }
    [data-theme="light"] .login-card { border-color: rgba(0,0,0,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
    [data-theme="light"] .sidebar { background: #ffffff; border-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .topbar { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.06); }
    [data-theme="light"] .kpi { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .card { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .spender-card { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .table th { background: rgba(99,102,241,0.06); }
    [data-theme="light"] .table td { border-color: rgba(0,0,0,0.04); }
    [data-theme="light"] .table tr:hover { background: rgba(99,102,241,0.03); }
    [data-theme="light"] .form-input { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.12); color: #1a1a2e; }
    [data-theme="light"] .form-input:focus { background: rgba(99,102,241,0.05); }
    [data-theme="light"] .filter-select { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.12); color: #1a1a2e; }
    [data-theme="light"] .filter-select option { background: #fff; color: #1a1a2e; }
    [data-theme="light"] .filter-chip { background: rgba(99,102,241,0.06); border-color: rgba(0,0,0,0.1); }
    [data-theme="light"] .filter-date { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.12); color: #1a1a2e; }
    [data-theme="light"] .sidebar-btn { color: #6b7280; }
    [data-theme="light"] .sidebar-btn:hover { color: #1a1a2e; background: rgba(99,102,241,0.06); }
    [data-theme="light"] .sidebar-btn.active { color: var(--accent); background: rgba(99,102,241,0.1); }
    [data-theme="light"] .sidebar-footer button { color: #6b7280; }
    [data-theme="light"] .info-box { background: rgba(99,102,241,0.06); border-color: rgba(99,102,241,0.12); }
    [data-theme="light"] .profile-panel { background: rgba(255,255,255,0.98); border-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .ai-card { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .heatmap-cell { background: rgba(99,102,241,0.06); border-color: rgba(99,102,241,0.1); }
    [data-theme="light"] .progress { background: rgba(0,0,0,0.06); }
    [data-theme="light"] .error-msg { background: rgba(239,68,68,0.06); }
    /* ====== TRANSITIONS (smooth theme switch) ====== */
    body, .sidebar, .topbar, .card, .kpi, .spender-card, .profile-panel, .ai-card, .form-input, .table th, .table td, .filter-chip, .filter-select, .filter-date, .info-box {
      transition: background-color 0.3s, border-color 0.3s, color 0.3s;
    }
    /* ====== TOAST NOTIFICATIONS ====== */
    .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { padding:12px 20px; border-radius:10px; color:white; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.3); animation:slideInToast 0.3s ease-out; pointer-events:auto; }
    .toast-success { background: #10b981; }
    .toast-error { background: #ef4444; }
    .toast-info { background: #6366f1; }
    @keyframes slideInToast { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    /* ====== CLICKABLE TAGS ====== */
    .tag-click { display:inline-block; padding:2px 8px; border-radius:4px; cursor:pointer; transition:all 0.2s; font-size:12px; font-weight:500; text-transform:uppercase; }
    .tag-click:hover { opacity:0.8; transform:scale(1.05); }
    .tag-spender { background:rgba(236,72,153,0.15); color:#f472b6; }
    .tag-model { background:rgba(99,102,241,0.15); color:#a5b4fc; }
    .tag-chatter { background:rgba(16,185,129,0.15); color:#6ee7b7; }
    .tag-provider { background:rgba(245,158,11,0.15); color:#fcd34d; }
    /* ====== FADE-IN ANIMATION ====== */
    .fade-in { animation: fadeInTab 0.25s ease-out; }
    @keyframes fadeInTab { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    /* ====== SORTABLE TABLE HEADERS ====== */
    .sort-th { cursor:pointer; user-select:none; }
    .sort-th:hover { background:rgba(139,92,246,0.12); }
    .sort-arrow { font-size:10px; margin-left:3px; opacity:0.4; }
    .sort-arrow.active { opacity:1; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg);
      position: relative; overflow: hidden;
    }
    .login-orb {
      position: absolute; border-radius: 50%;
      filter: blur(40px); opacity: 0.15;
    }
    .login-orb-1 { width: 300px; height: 300px; background: #6366f1; top: -100px; left: -100px; }
    .login-orb-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: -100px; right: -100px; }
    .login-card {
      background: var(--card); backdrop-filter: blur(20px);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 16px; padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: relative; z-index: 1;
    }
    .login-logo {
      width: 60px; height: 60px;
      background: var(--grad);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: bold;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }
    .login-title {
      text-align: center; font-size: 24px; font-weight: 700;
      margin-bottom: 10px;
    }
    .login-subtitle {
      text-align: center; color: var(--text2); font-size: 13px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text2); margin-bottom: 6px; text-transform: uppercase;
    }
    .form-input {
      width: 100%; padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      transition: all 0.3s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .form-input::placeholder { color: var(--text2); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: var(--grad);
      color: white;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99,102,241,0.3);
    }
    .lang-toggle {
      position: absolute; top: 20px; right: 20px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-toggle:hover { background: rgba(139,92,246,0.2); }
    .app-wrap { display: flex; height: 100vh; }
    .sidebar {
      width: 72px; background: rgba(12,16,32,0.8);
      border-right: 1px solid rgba(139,92,246,0.1);
      display: flex; flex-direction: column;
      align-items: center;
      padding: 16px 0;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: var(--grad);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      margin-bottom: 32px;
      cursor: pointer;
    }
    .sidebar-nav {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 8px;
    }
    .sidebar-btn {
      width: 50px; height: 50px;
      border: none;
      background: transparent;
      color: var(--text2);
      border-left: 3px solid transparent;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .sidebar-btn:hover { color: var(--text); background: rgba(139,92,246,0.1); }
    .sidebar-btn.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(139,92,246,0.15);
    }
    .sidebar-footer {
      display: flex; flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .sidebar-footer button {
      width: 50px; height: 50px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .sidebar-footer button:hover { color: var(--text); }
    .main-area {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      background: rgba(12,16,32,0.6);
      border-bottom: 1px solid rgba(139,92,246,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .user-name { color: var(--accent); font-weight: 600; font-size: 14px; text-transform:uppercase; }
    .role-badge {
      background: rgba(139,92,246,0.2);
      border: 1px solid rgba(139,92,246,0.3);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .section-title {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-bar {
      width: 3px; height: 20px;
      background: var(--grad);
      border-radius: 2px;
    }
    .filter-bar {
      display: flex; gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-chip {
      padding: 8px 12px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--grad);
      border-color: transparent;
      color: white;
    }
    .filter-chip:hover { border-color: rgba(139,92,246,0.4); }
    .filter-date {
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-date:focus { outline: none; border-color: var(--primary); }
    .filter-select {
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--primary); }
    .filter-select option { background: var(--bg2); color: var(--text); text-transform:uppercase; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(20px);
    }
    .kpi-label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .kpi-sublabel { font-size: 11px; color: var(--text2); margin-top: 6px; }
    .kpi.warning { border-color: rgba(245,158,11,0.2); }
    .kpi.warning .kpi-value {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }
    .grid-55-45 {
      display: grid;
      grid-template-columns: 55% 45%;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(20px);
    }
    .spender-card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(20px);
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
    }
    .spender-card:hover {
      border-color: rgba(139,92,246,0.3);
      background: rgba(16,24,48,0.95);
    }
    .spender-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .spender-name { font-weight: 600; font-size: 14px; text-transform:uppercase; }
    .spender-ltv {
      font-size: 16px;
      font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .spender-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 12px;
      color: var(--text2);
    }
    .spender-meta-item { display: flex; justify-content: space-between; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pending { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    .badge-validated { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .badge-refused { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .badge-whale { background: rgba(236,72,153,0.2); color: #f472b6; border: 1px solid rgba(236,72,153,0.3); }
    .badge-vip { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
    .badge-regular { background: rgba(139,92,246,0.2); color: #d8b4fe; border: 1px solid rgba(139,92,246,0.3); }
    .badge-dormant { background: rgba(107,114,128,0.2); color: #d1d5db; border: 1px solid rgba(107,114,128,0.3); }
    .badge-nouveau { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
    .badge-done { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th {
      background: rgba(139,92,246,0.1);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .table td { border-bottom: 1px solid rgba(139,92,246,0.05); padding: 12px; }
    .table tr:hover { background: rgba(139,92,246,0.05); }
    .progress {
      width: 100%; height: 6px;
      background: rgba(139,92,246,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar { height: 100%; background: var(--grad); transition: width 0.3s; }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin: 12px 0;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      background: rgba(99,102,241,0.1);
      border-radius: 4px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(99,102,241,0.2);
    }
    .heatmap-cell.active { background: var(--grad); border-color: transparent; }
    .ai-card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .ai-card:hover { border-color: rgba(139,92,246,0.3); background: rgba(16,24,48,0.95); }
    .ai-card-icon { font-size: 32px; margin-bottom: 8px; }
    .ai-card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .ai-card-desc { font-size: 12px; color: var(--text2); }
    .ai-result {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      color: #6ee7b7;
      font-size: 12px;
      line-height: 1.5;
    }
    .ai-loading {
      display: inline-block; width: 8px; height: 8px;
      background: var(--success); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .btn-danger { background: var(--danger); color: white; }

      date: txData.date || new Date().toISOString(),
      spender_handle: txData.spender_handle || "unknown",
      amount: parseFloat(txData.amount) || 0,
      status: "pending",
    }).select();
    if (!res.error) { console.log("[safeInsertTx] L4 OK (minimum), returned:", res.data); return res; }
    console.warn("[safeInsertTx] L4 fail:", res.error.message);
    return res;
  } catch(e) {
    return { data: null, error: { message: "All 4 insert levels failed: " + e.message } };
  }
};

// safeUpsertSpender: Fallback for spender upserts
const safeUpsertSpender = async (spenderData) => {
  let res = await sb.from("spenders").upsert(spenderData, {onConflict: "handle"});
  if (!res.error) return res;
  // Full upsert failed, try minimal fallback
  // Fallback: minimal
  return await sb.from("spenders").upsert(
    {handle: spenderData.handle, name: spenderData.name || spenderData.handle},
    {onConflict: "handle"}
  );
};

  const active = sort.key===sortKey;
  const arrow = active?(sort.dir==="asc"?"▲":"▼"):"▽";
  return <th className="sort-th" onClick={()=>onSort(sortKey)}>{label} <span className={`sort-arrow ${active?"active":""}`}>{arrow}</span></th>;
};
const useSortable = (defaultKey="date", defaultDir="desc") => {
  const [sort, setSort] = useState({key:defaultKey, dir:defaultDir});
  const onSort = (key) => setSort(prev=>({key, dir:prev.key===key&&prev.dir==="desc"?"asc":"desc"}));
  const doSort = (data, getters={}) => {
    return [...data].sort((a,b)=>{
      const g = getters[sort.key]||(x=>x[sort.key]);
      const va=g(a), vb=g(b);
      const cmp = typeof va==="string"? (va||"").localeCompare(vb||"") : (Number(va)||0)-(Number(vb)||0);
      return sort.dir==="asc"?cmp:-cmp;
    });
  };
  return {sort, onSort, doSort};
};

const MiniCalendar = ({lang, selected, onSelect, onClose, refEl}) => {
  const [viewDate, setViewDate] = useState(()=>selected?new Date(selected):new Date());
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const firstDay = new Date(year,month,1).getDay();
  const monthNames = lang==="fr"
    ?["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Aoû","Sep","Oct","Nov","Déc"]
    :["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayNames = lang==="fr"?["Lu","Ma","Me","Je","Ve","Sa","Di"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const prevMonth = () => setViewDate(new Date(year,month-1,1));
  const nextMonth = () => setViewDate(new Date(year,month+1,1));
  const today = new Date().toISOString().split("T")[0];
  // Adjust firstDay for Monday start (0=Mon..6=Sun)
  const startOffset = (firstDay+6)%7;
  const days = [];
  for(let i=0;i<startOffset;i++) days.push(null);
  for(let d=1;d<=daysInMonth;d++) days.push(d);

  return (
    <div style={{position:"absolute",top:"100%",left:0,zIndex:999,background:"var(--bg2)",border:"1px solid rgba(139,92,246,0.3)",borderRadius:12,padding:12,boxShadow:"0 8px 32px rgba(0,0,0,0.3)",minWidth:260,marginTop:4}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",color:"var(--accent)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>‹</button>
        <span style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{monthNames[month]} {year}</span>
        <button onClick={nextMonth} style={{background:"none",border:"none",color:"var(--accent)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,textAlign:"center"}}>
        {dayNames.map(d=><div key={d} style={{fontSize:10,fontWeight:600,color:"var(--text2)",padding:4}}>{d}</div>)}
        {days.map((d,i)=>{
          if(!d) return <div key={`e${i}`}></div>;
          const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const isSelected = dateStr===selected;
          const isToday = dateStr===today;
          return (
            <div key={i} onClick={()=>{onSelect(dateStr);onClose();}}
              style={{padding:"6px 2px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:isSelected||isToday?700:400,
                background:isSelected?"var(--accent)":isToday?"rgba(139,92,246,0.15)":"transparent",
                color:isSelected?"#fff":isToday?"var(--accent)":"var(--text)",
                transition:"all 0.15s"}}>
              {d}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
        <button onClick={()=>{onSelect(today);onClose();}} style={{fontSize:11,color:"var(--accent)",background:"none",border:"none",cursor:"pointer",fontWeight:600}}>
          {lang==="fr"?"Aujourd'hui":"Today"}
        </button>
        <button onClick={()=>{onSelect("");onClose();}} style={{fontSize:11,color:"var(--text2)",background:"none",border:"none",cursor:"pointer"}}>
          {lang==="fr"?"Effacer":"Clear"}
        </button>
      </div>
    </div>
  );
};

const DateRangeFilter = ({lang, startDate, endDate, setStartDate, setEndDate, activePreset, setActivePreset}) => {
  const [showCalStart, setShowCalStart] = useState(false);
  const [showCalEnd, setShowCalEnd] = useState(false);
  const calRef = useRef(null);

  // Close calendars on outside click
  useEffect(()=>{
    const handler = (e) => {
      if(calRef.current && !calRef.current.contains(e.target)) {
        setShowCalStart(false);
        setShowCalEnd(false);
      }
    };
    document.addEventListener("mousedown", handler);
    return ()=>document.removeEventListener("mousedown", handler);
  },[]);

  const presets = [
    {id:"today",label:t(lang,"today")||"Aujourd'hui"},
    {id:"7d",label:"7j"},
    {id:"30d",label:"30j"},
    {id:"this_month",label:t(lang,"this_month")||"Ce mois"},
    {id:"last_month",label:t(lang,"last_month")||"Mois dernier"},
    {id:"all",label:t(lang,"all_time")||"Tout"},
  ];
  const applyPreset = (id) => {
    const now = new Date();
    let s, e;
    if(id==="today"){ s=new Date(now.getFullYear(),now.getMonth(),now.getDate()); e=new Date(s); }
    else if(id==="7d"){ s=new Date(now.getTime()-7*24*60*60*1000); e=new Date(now); }
    else if(id==="30d"){ s=new Date(now.getTime()-30*24*60*60*1000); e=new Date(now); }
    else if(id==="this_month"){ s=new Date(now.getFullYear(),now.getMonth(),1); e=new Date(now); }
    else if(id==="last_month"){ s=new Date(now.getFullYear(),now.getMonth()-1,1); e=new Date(now.getFullYear(),now.getMonth(),0); }
    else { s=null; e=null; }
    setStartDate(s?s.toISOString().split("T")[0]:"");
    setEndDate(e?e.toISOString().split("T")[0]:"");
    setActivePreset(id);
    setShowCalStart(false);

    <div className="filter-bar" style={{marginBottom:16}} ref={calRef}>
      {presets.map(p=>(
        <button key={p.id} className={`filter-chip ${activePreset===p.id?"active":""}`} onClick={()=>applyPreset(p.id)}>{p.label}</button>

        {showCalStart && <MiniCalendar lang={lang} selected={startDate} onSelect={(d)=>{setStartDate(d);setActivePreset("");}} onClose={()=>setShowCalStart(false)} />}
      </div>
      <span style={{color:"var(--text2)",fontSize:14,fontWeight:600}}>→</span>
      <div style={{position:"relative",display:"inline-block"}}>
        <button onClick={()=>{setShowCalEnd(!showCalEnd);setShowCalStart(false);}}
          style={{background:"rgba(139,92,246,0.1)",border:"1px solid rgba(139,92,246,0.2)",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:endDate?"var(--text)":"var(--text2)",fontSize:12,fontWeight:endDate?600:400,display:"flex",alignItems:"center",gap:4}}>

const useDateRange = (defaultPreset="30d") => {
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [activePreset, setActivePreset] = useState(defaultPreset);
  useEffect(()=>{
    const now = new Date();
    let s;
    if(defaultPreset==="7d") s=new Date(now.getTime()-7*24*60*60*1000);
    else if(defaultPreset==="30d") s=new Date(now.getTime()-30*24*60*60*1000);
    else return;
    setStartDate(s.toISOString().split("T")[0]);
    setEndDate(now.toISOString().split("T")[0]);
  },[]);
  const filterByDate = (data, dateField="date") => {
    if(activePreset==="all"&&!startDate&&!endDate) return data;
    return data.filter(item=>{
      if(!item[dateField]) return false;
      const d = new Date(item[dateField]);
      if(startDate && d < new Date(startDate)) return false;
      if(endDate) { const end = new Date(endDate); end.setHours(23,59,59,999); if(d > end) return false; }
      return true;
    });
  };
  return {startDate, endDate, setStartDate, setEndDate, activePreset, setActivePreset, filterByDate};
};

// =============================================
const getBadges = (txs, chatterId) => {
  const myTx = txs.filter(tx=>tx.chatter_id===chatterId);
  const validated = myTx.filter(tx=>tx.status==="validated");
  const badges = [];
  if(validated.length>=10) badges.push({icon:"🏅",label:"10 TX"});
  if(validated.length>=50) badges.push({icon:"⭐",label:"50 TX"});
  if(validated.length>=100) badges.push({icon:"💎",label:"100 TX"});
  const totalCA = validated.reduce((s,tx)=>s+Number(tx.amount),0);
  if(totalCA>=1000) badges.push({icon:"🚀",label:"1K€"});
  if(totalCA>=5000) badges.push({icon:"🔥",label:"5K€"});
  if(totalCA>=10000) badges.push({icon:"👑",label:"10K€"});
  const dates = [...new Set(validated.map(tx=>tx.date?.split("T")[0]).filter(Boolean))].sort().reverse();
  let streak = 0;
  const today = new Date();
  for(let i=0;i<dates.length;i++){
    const expected = new Date(today);
    expected.setDate(expected.getDate()-i);
    if(dates[i]===expected.toISOString().split("T")[0]) streak++;
    else break;
  }
  if(streak>=3) badges.push({icon:"🔥",label:`${streak}j streak`});
  if(streak>=7) badges.push({icon:"💪",label:"7j streak!"});
  return {badges, streak};
};
const BadgeBar = ({badges}) => {
  if(!badges||badges.length===0) return null;
  return (
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
      {badges.map((b,i)=>(
        <span key={i} style={{background:"rgba(139,92,246,0.12)",border:"1px solid rgba(139,92,246,0.2)",borderRadius:20,padding:"4px 10px",fontSize:11,display:"flex",alignItems:"center",gap:4}}>
          {b.icon} {b.label}
        </span>
      ))}
    </div>
  );
};

    const set = new Set();
    (dbSpenders || []).forEach(s => set.add(s.handle || s.name));
    txs.forEach(tx => { if(tx.spender_handle) set.add(tx.spender_handle); });
    return [...set].sort();
  }, [dbSpenders, txs]);

  const handleCreate = async () => {
    if(!form.spender_handle||!form.amount) return;
    console.log("[handleCreate] START — form:", JSON.stringify(form));
    setSaving(true);
    try {
      // Step 1: UPSERT le Spender en DB
      const handle = form.spender_handle.replace(/^@/, "").trim();
      try {
        await safeUpsertSpender({handle, name: handle, status: "active", last_seen: new Date().toISOString()});
        console.log("[handleCreate] Spender upsert OK for:", handle);
      } catch(e) { console.warn("Spender upsert best-effort fail:", e); }

      // Step 2: INSERT transaction — only include FK fields if they look like valid UUIDs
      const isUUID = (v) => typeof v === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
      const txRow = {
        date: new Date().toISOString(),
        spender_handle: handle,
        amount: parseFloat(form.amount),
        status: "pending",
        notes: form.notes || null,
      };
      if(isUUID(form.model_id)) txRow.model_id = form.model_id;
      if(isUUID(form.provider_id)) txRow.provider_id = form.provider_id;
      if(isUUID(form.chatter_id)) txRow.chatter_id = form.chatter_id;
      if(form.currency && form.currency !== "EUR") txRow.currency = form.currency;
      if(form.product) txRow.product = form.product;
      if(form.tag) txRow.tag = form.tag;
      console.log("[handleCreate] txRow to insert:", JSON.stringify(txRow));

      const res = await safeInsertTx(txRow);
      console.log("[handleCreate] safeInsertTx result — data:", res.data, "error:", res.error);

      if(!res.error) {
        console.log("[handleCreate] Insert OK — calling onRefresh()...");
        setForm({spender_handle:"",amount:"",currency:"EUR",model_id:"",chatter_id:user.id,provider_id:"",product:"",tag:"",notes:""});
        setShowForm(false);
        setSaving(false);
        await onRefresh();
        console.log("[handleCreate] onRefresh() DONE — UI should be updated");
        addToast(t(lang,"tx_created")||"Transaction créée ✓","success");
      } else {
        setSaving(false);
        console.error("[handleCreate] TX insert final error:", res.error);
        addToast("Erreur: " + (res.error.message || "insert failed"),"error");
      }
    } catch(e) {
      setSaving(false);
      console.error("[handleCreate] threw:", e);
      addToast("Erreur: " + e.message, "error");
    }
  };
  const handleStatus = async (txId, newStatus) => {
    try {
      // Immutability guard: only pending transactions can change status
      const currentTx = txs.find(tx => tx.id === txId);
      if (currentTx && currentTx.status !== "pending") {
        addToast(t(lang,"tx_immutable"), "error");
        return;
      }
      const {error} = await sb.from("transactions").update({status:newStatus}).eq("id",txId);
      if(error) { addToast("Erreur: " + error.message, "error"); return; }
      await onRefresh();
      addToast(newStatus==="validated"?(t(lang,"tx_validated")||"Validée ✓"):(t(lang,"tx_refused")||"Refusée"), newStatus==="validated"?"success":"error");
    } catch(e) { addToast("Erreur: " + e.message, "error"); }
  };
  const handleEditSave = async (updates) => {
    if (!editingTx || editingTx.status !== "pending") {
      addToast(t(lang,"tx_immutable"), "error");
      setEditingTx(null);
      return;
    }
    setSaving(true);
    try {
      const {error} = await sb.from("transactions").update({
        amount: updates.amount, product: updates.product, tag: updates.tag,
      }).eq("id", editingTx.id).eq("status","pending");
      setSaving(false);
      if (error) { addToast("Erreur: " + error.message, "error"); return; }
      setEditingTx(null);
      await onRefresh();
      addToast(t(lang,"tx_updated")||"Transaction modifiée ✓","success");
    } catch(e) {
      setSaving(false);
      addToast("Erreur: " + e.message, "error");
    }
  };
  return (
    <div>
      <DateRangeFilter lang={lang} {...dr} />
      <div className="filter-bar" style={{marginBottom:16}}>
        <select className="filter-select" onChange={e=>setModel(e.target.value)} value={model}>
          <option value="">Tous les modeles</option>
          {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
        <select className="filter-select" onChange={e=>setStatus(e.target.value)} value={status}>
          <option value="">Tous les statuts</option>
          <option value="pending">{t(lang,"pending")}</option>
          <option value="validated">{t(lang,"validated")}</option>
          <option value="refused">{t(lang,"refused")}</option>
        </select>
        {user.role==="gerant"&&(
          <select className="filter-select" onChange={e=>setChatter(e.target.value)} value={chatter}>
            <option value="">Tous les chatters</option>
            {profiles.filter(u=>u.role==="chatter").map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
        )}
      </div>
      {(user.role==="gerant"||user.role==="chatter")&&(
        <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ {t(lang,"new_tx")}</button>
      )}
      {showForm&&(
        <div className="card" style={{marginBottom:20}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"spender")}</label>
              <input className="form-input" list="spender-list" value={form.spender_handle} onChange={e=>setForm({...form,spender_handle:e.target.value})} placeholder="@handle ou choisir existant" autoComplete="off" />
              <datalist id="spender-list">{spenderOptions.map(s=><option key={s} value={s}/>)}</datalist>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"amount")}</label>
              <input className="form-input" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"currency")}</label>
              <select className="filter-select" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>
                <option>EUR</option><option>CHF</option><option>USD</option>
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"model")}</label>
              <select className="filter-select" value={form.model_id} onChange={e=>setForm({...form,model_id:e.target.value})}>
                <option value="">Select</option>
                {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"provider")}</label>
              <select className="filter-select" value={form.provider_id} onChange={e=>setForm({...form,provider_id:e.target.value})}>
                <option value="">Select</option>
                {profiles.filter(u=>u.role==="provider").map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            {user.role==="gerant"&&(
              <div className="form-group-modal">
                <label className="form-label">Chatter</label>
                <select className="filter-select" value={form.chatter_id} onChange={e=>setForm({...form,chatter_id:e.target.value})}>
                  {profiles.filter(u=>u.role==="chatter").map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                </select>
              </div>
            )}
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"product")}</label>
              <select className="filter-select" value={form.product} onChange={e=>setForm({...form,product:e.target.value})}>
                <option value="">Select</option>
                {PRODUCTS.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"tag")}</label>
              <select className="filter-select" value={form.tag} onChange={e=>setForm({...form,tag:e.target.value})}>
                <option value="">Select</option>
                {TAGS.map(tag=><option key={tag} value={tag}>{tag}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:"flex",gap:12,marginTop:16}}>
            <button className="btn btn-success" onClick={handleCreate} disabled={saving}>{saving?"...":t(lang,"create")}</button>
            <button className="btn btn-danger" onClick={()=>setShowForm(false)}>{t(lang,"cancel")}</button>
          </div>
        </div>
      )}
      <div className="card">
        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr><th>{t(lang,"date")}</th><th>{lang==="fr"?"Heure":"Time"}</th><th>Spender</th><th>{t(lang,"amount")}</th><th>{lang==="fr"?"Devise":"Cur."}</th><th>Model</th><th>Provider</th><th>Chatter</th><th>{lang==="fr"?"Produit":"Product"}</th><th>{t(lang,"notes")}</th><th>{t(lang,"status")}</th>{(user.role==="gerant"||user.role==="chatter"||user.role==="provider")&&<th>{t(lang,"actions")}</th>}</tr>
            </thead>
            <tbody>
              {filtered.map(tx=>{
                const chName = profiles.find(u=>u.id===tx.chatter_id)?.name||"?";
                const provName = profiles.find(u=>u.id===tx.provider_id)?.name||"?";
                const canEdit = tx.status === "pending" && (user.role === "gerant" || user.role === "chatter" || (user.role === "provider" && tx.provider_id === user.id));
                return (
                  <tr key={tx.id}>
                    <td>{fmtDate(tx.date)}</td>
                    <td style={{fontSize:11,whiteSpace:"nowrap"}}>{fmtDayTime(tx.date)}</td>
                    <td><Tag type="spender" label={tx.spender_handle} id={tx.spender_handle}/></td>
                    <td style={{fontWeight:700}}>{tx.amount}€</td>
                    <td style={{fontSize:11}}>{tx.currency||"EUR"}</td>
                    <td><Tag type="model" label={models.find(m=>m.id===tx.model_id)?.name||"?"} id={tx.model_id}/></td>
                    <td><Tag type="provider" label={provName} id={tx.provider_id}/></td>
                    <td><Tag type="chatter" label={chName} id={tx.chatter_id}/></td>
                    <td style={{fontSize:11}}>{tx.product||"-"}</td>
                    <td style={{fontSize:11}}>{tx.notes||"-"}</td>
                    <td><StatusPill status={tx.status} lang={lang}/></td>
                    {(user.role==="gerant"||user.role==="chatter"||user.role==="provider")&&(
                      <td style={{whiteSpace:"nowrap"}}>
                        {canEdit && (
                          <button className="btn btn-small" style={{marginRight:4}} onClick={()=>setEditingTx(tx)}>✏️ {t(lang,"edit")}</button>
                        )}
                        {tx.status==="pending"&&(user.role==="gerant"||(user.role==="provider"&&tx.provider_id===user.id))&&(
                          <>
                            <button className="btn btn-success btn-small" onClick={()=>handleStatus(tx.id,"validated")}>{t(lang,"validate")}</button>{" "}
                            <button className="btn btn-danger btn-small" onClick={()=>handleStatus(tx.id,"refused")}>{t(lang,"refuse")}</button>
                          </>
                        )}
                      </td>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {editingTx && <EditTxModal tx={editingTx} lang={lang} onSave={handleEditSave} onCancel={() => setEditingTx(null)} saving={saving} />}
    </div>
  );
};

// =============================================
// SPENDERS TAB (v2 — with chatter/provider breakdowns + cross-page nav)
// =============================================
const SpendersTab = ({user, lang, txs, models, profiles, dbSpenders, selectedSpenderKey, setSelectedSpenderKey, onRefresh}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [sortBy, setSortBy] = useState("ltv");
  const [filterModel, setFilterModel] = useState("");
  const [selected, setSelected] = useState(null);
  const [detailModel, setDetailModel] = useState("");
  const [detailTab, setDetailTab] = useState("models");
  const [editingTx, setEditingTx] = useState(null);
  const [spSaving, setSpSaving] = useState(false);
  const handleSpStatus = async (txId, newStatus) => {
    try {
      const {error} = await sb.from("transactions").update({status:newStatus}).eq("id",txId);
      if(error) { addToast("Erreur: " + error.message, "error"); return; }
      await onRefresh();
      addToast(newStatus==="validated"?(t(lang,"tx_validated")):(t(lang,"tx_refused")), newStatus==="validated"?"success":"error");
    } catch(e) { addToast("Erreur: " + e.message, "error"); }
  };
  const handleSpEditSave = async (updates) => {
    if (!editingTx || editingTx.status !== "pending") { setEditingTx(null); return; }
    setSpSaving(true);
    try {
      const {error} = await sb.from("transactions").update({amount:updates.amount,product:updates.product,tag:updates.tag}).eq("id",editingTx.id).eq("status","pending");
      setSpSaving(false);
      if(error) { addToast("Erreur: " + error.message, "error"); return; }
      setEditingTx(null);
      await onRefresh();
      addToast(t(lang,"tx_updated"), "success");
    } catch(e) { setSpSaving(false); addToast("Erreur: " + e.message, "error"); }
  };

  // Build spender data: merge DB spenders + transactions + breakdowns
  const spenders = useMemo(()=>{
    const map = {};

    // 1) Seed from DB spenders table (source of truth for metadata)
    (dbSpenders || []).forEach(dbSp => {
      const h = dbSp.handle || dbSp.name;
      if (!h) return;
      let contactInfo = {};
      try { contactInfo = typeof dbSp.contact_info === "string" ? JSON.parse(dbSp.contact_info) : (dbSp.contact_info || {}); } catch(e) {}
      map[h] = {
        name: h,
        dbId: dbSp.id,
        telegramId: dbSp.telegram_id || null,
        dbTags: Array.isArray(dbSp.tags) ? dbSp.tags : [],
        dbStatus: dbSp.status || "active",
        contactInfo,
        dbNotes: dbSp.notes || "",
        totalSpentDb: Number(dbSp.total_spent) || 0,
        txs: [], byModel: {}, byChatter: {}, byProvider: {},
      };
    });

    // 2) Enrich with transactions
    txs.forEach(tx => {
      const h = tx.spender_handle;
      if (!h) return;
      if (!map[h]) map[h] = {name: h, dbId: null, telegramId: null, dbTags: [], dbStatus: "active", contactInfo: {}, dbNotes: "", totalSpentDb: 0, txs: [], byModel: {}, byChatter: {}, byProvider: {}};
      map[h].txs.push(tx);
      // Model breakdown
      const mid = tx.model_id;
      if (!map[h].byModel[mid]) map[h].byModel[mid] = {txs: [], ca: 0, validated: 0, pending: 0};
      map[h].byModel[mid].txs.push(tx);
      map[h].byModel[mid].ca += Number(tx.amount);
      if (tx.status === "validated") map[h].byModel[mid].validated += Number(tx.amount);
      if (tx.status === "pending") map[h].byModel[mid].pending += Number(tx.amount);
      // Chatter breakdown
      const cid = tx.chatter_id || "unknown";
      const cName = profiles.find(p => p.id === cid)?.name || "?";
      if (!map[h].byChatter[cid]) map[h].byChatter[cid] = {id: cid, name: cName, ca: 0, count: 0, validated: 0, pending: 0};
      map[h].byChatter[cid].ca += Number(tx.amount);
      map[h].byChatter[cid].count++;
      if (tx.status === "validated") map[h].byChatter[cid].validated += Number(tx.amount);
      if (tx.status === "pending") map[h].byChatter[cid].pending += Number(tx.amount);
      // Provider breakdown
      const pid = tx.provider_id || "unknown";
      const pName = profiles.find(p => p.id === pid)?.name || "?";
      if (!map[h].byProvider[pid]) map[h].byProvider[pid] = {id: pid, name: pName, ca: 0, count: 0, validated: 0, pending: 0};
      map[h].byProvider[pid].ca += Number(tx.amount);
      map[h].byProvider[pid].count++;
      if (tx.status === "validated") map[h].byProvider[pid].validated += Number(tx.amount);
      if (tx.status === "pending") map[h].byProvider[pid].pending += Number(tx.amount);
    });

    return Object.values(map).map(s => {
      const ltv = s.txs.reduce((sum, tx) => sum + Number(tx.amount), 0);
      const cnt = s.txs.length;
      const aov = cnt > 0 ? ltv / cnt : 0;
      const validCA = s.txs.filter(tx => tx.status === "validated").reduce((sum, tx) => sum + Number(tx.amount), 0);
      const pendingCA = s.txs.filter(tx => tx.status === "pending").reduce((sum, tx) => sum + Number(tx.amount), 0);
      const modelCount = Object.keys(s.byModel).length;
      const modelBreakdown = Object.entries(s.byModel).map(([mid, data]) => {
        const mName = models.find(m => m.id === mid)?.name || "?";
        return {id: mid, name: mName, ca: data.ca, validated: data.validated, pending: data.pending, txCount: data.txs.length, txs: data.txs, pct: ltv > 0 ? ((data.ca / ltv) * 100) : 0};
      }).sort((a, b) => b.ca - a.ca);
      const chatterBreakdown = Object.values(s.byChatter).sort((a, b) => b.ca - a.ca);
      const providerBreakdown = Object.values(s.byProvider).sort((a, b) => b.ca - a.ca);
      return {...s, ltv, cnt, aov, validCA, pendingCA, segment: getSpenderSegment(ltv), modelCount, modelBreakdown, chatterBreakdown, providerBreakdown};
    });
  }, [txs, models, profiles, dbSpenders]);

  // Auto-select from cross-page navigation
  useEffect(()=>{
    if(selectedSpenderKey && spenders.length > 0) {
      const found = spenders.find(s => s.name.toLowerCase() === selectedSpenderKey.toLowerCase());
      if(found) { setSelected(found); setDetailModel(""); setDetailTab("models"); }
      if(setSelectedSpenderKey) setSelectedSpenderKey(null);
    }
  },[selectedSpenderKey, spenders]);

  let filtered = filterModel ? spenders.filter(s=>s.byModel[filterModel]) : spenders;
  let sorted = [...filtered];
  if(sortBy==="frequency") sorted.sort((a,b)=>b.cnt-a.cnt);
  else if(sortBy==="recency") sorted.sort((a,b)=>new Date(b.txs[b.txs.length-1]?.date||0)-new Date(a.txs[a.txs.length-1]?.date||0));
  else if(sortBy==="model_ca" && filterModel) sorted.sort((a,b)=>(b.byModel[filterModel]?.ca||0)-(a.byModel[filterModel]?.ca||0));
  else sorted.sort((a,b)=>b.ltv-a.ltv);

  const avgLtv = sorted.length>0 ? sorted.reduce((s,x)=>s+x.ltv,0)/sorted.length : 0;
  const multiModelCount = sorted.filter(s=>s.modelCount>1).length;
  const totalValidated = sorted.reduce((s,x)=>s+x.validCA,0);
  const totalPending = sorted.reduce((s,x)=>s+x.pendingCA,0);

  return (
    <div>
      <div className="kpi-grid">
        <KPICard label={t(lang,"spenders")} value={`${sorted.length}`} />
        <KPICard label={t(lang,"avg_ltv")} value={`${avgLtv.toFixed(0)}€`} />
        <KPICard label={fr?"Valide":"Validated"} value={`${totalValidated.toFixed(0)}€`} />
        <KPICard label="Pending" value={`${totalPending.toFixed(0)}€`} />
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12,alignItems:"center"}}>
        <select className="filter-select" value={filterModel} onChange={e=>{setFilterModel(e.target.value);setSelected(null);}}>
          <option value="">{fr?"Tous les modeles":"All models"}</option>
          {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
        <button className={`filter-chip ${sortBy==="ltv"?"active":""}`} onClick={()=>setSortBy("ltv")}>LTV</button>
        <button className={`filter-chip ${sortBy==="frequency"?"active":""}`} onClick={()=>setSortBy("frequency")}>{t(lang,"frequency")}</button>
        <button className={`filter-chip ${sortBy==="recency"?"active":""}`} onClick={()=>setSortBy("recency")}>{t(lang,"recency")}</button>
        {filterModel && <button className={`filter-chip ${sortBy==="model_ca"?"active":""}`} onClick={()=>setSortBy("model_ca")}>{fr?"CA modele":"Model CA"}</button>}
      </div>

      <div className="grid-55-45">
        <div>
          {sorted.map(s=>(
            <div key={s.name} className="spender-card" onClick={()=>{setSelected(s);setDetailModel("");setDetailTab("models");}}>
              <div className="spender-top">
                <div className="spender-name"><Tag type="spender" label={s.name} id={s.name}/></div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  {s.modelCount>1 && <span style={{background:"rgba(139,92,246,0.15)",color:"var(--accent)",fontSize:10,padding:"2px 8px",borderRadius:10,fontWeight:600}}>{s.modelCount} models</span>}
                  <span className={`badge badge-${s.segment}`}>{s.segment}</span>
                </div>
              </div>
              <div className="spender-ltv">{filterModel ? (s.byModel[filterModel]?.ca||0) : s.ltv}€{filterModel && <span style={{fontSize:11,color:"var(--text2)",marginLeft:6}}>/ {s.ltv}€ total</span>}</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>
                {s.modelBreakdown.slice(0,3).map(mb=>(
                  <span key={mb.id} style={{fontSize:10,padding:"2px 8px",borderRadius:8,background:"rgba(139,92,246,0.08)",color:"var(--text)",display:"flex",gap:4,alignItems:"center"}}>
                    <span style={{color:"var(--accent)",fontWeight:600}}>{mb.name}</span>
                    <span>{mb.ca}€</span>
                  </span>
                ))}
              </div>
              {/* Chatter + Provider mini summary */}
              <div style={{display:"flex",gap:8,marginTop:4,fontSize:10,color:"var(--text3)"}}>
                {s.chatterBreakdown.length>0 && <span>💬 {s.chatterBreakdown.map(c=>c.name).join(", ")}</span>}
                {s.providerBreakdown.length>0 && <span>🔒 {s.providerBreakdown.map(p=>p.name).join(", ")}</span>}
              </div>
              <div className="spender-meta" style={{marginTop:6}}>
                <div className="spender-meta-item"><span>{t(lang,"aov")}</span><span>{s.aov.toFixed(0)}€</span></div>
                <div className="spender-meta-item"><span>{t(lang,"frequency")}</span><span>{s.cnt}</span></div>
                <div className="spender-meta-item"><span style={{color:"var(--success)"}}>✓</span><span style={{color:"var(--success)"}}>{s.validCA.toFixed(0)}€</span></div>
                <div className="spender-meta-item"><span style={{color:"var(--warning)"}}>⏳</span><span style={{color:"var(--warning)"}}>{s.pendingCA.toFixed(0)}€</span></div>
              </div>
            </div>
          ))}
          {sorted.length===0 && <div style={{color:"var(--text2)",textAlign:"center",padding:40}}>{fr?"Aucun spender":"No spenders"}</div>}
        </div>

        {/* Detail Panel */}
        {selected&&(
          <div className="profile-panel">
            <div className="profile-header">
              <div className="profile-name">{selected.name}</div>
              <button className="profile-close" onClick={()=>setSelected(null)}>X</button>
            </div>
            {/* KPIs */}
            <div className="profile-section">
              <div className="profile-section-title">KPIs</div>

const ObjectifsTab = ({user, lang, txs, profiles}) => {
  const today = new Date();
  const todayStr = today.toISOString().split("T")[0];
  const getStats = (chatterId) => {
    const chTx = txs.filter(tx=>tx.chatter_id===chatterId);
    const todayTx = chTx.filter(tx=>tx.date&&tx.date.startsWith(todayStr));
    const weekStart = new Date(today.getTime()-7*24*60*60*1000);
    const weekTx = chTx.filter(tx=>new Date(tx.date)>=weekStart);
    return {dailyCA:todayTx.reduce((s,tx)=>s+Number(tx.amount),0), weeklyCA:weekTx.reduce((s,tx)=>s+Number(tx.amount),0)};
  };
  const getHeatmap = (chatterId) => {
    return Array(7).fill(0).map((_,idx)=>{
      const d = new Date();
      d.setDate(d.getDate()-idx);
      const dStr = d.toISOString().split("T")[0];
      return txs.filter(tx=>tx.chatter_id===chatterId&&tx.date&&tx.date.startsWith(dStr)).length;
    });
  };
  if(user.role==="chatter") {
    const stats = getStats(user.id);
    const dGoal = Number(user.daily_goal)||1;
    const wGoal = Number(user.weekly_goal)||1;
    const hm = getHeatmap(user.id);
    const {badges} = getBadges(txs, user.id);
    return (
      <div className="card">
        <div className="section-title"><div className="section-bar"></div>{t(lang,"objectives")} - {user.name}</div>
        <BadgeBar badges={badges}/>
        <div style={{marginBottom:20}}>
          <div style={{marginBottom:8}}>
            <span>{t(lang,"daily_goal")}: {stats.dailyCA}/{dGoal}</span>
            <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.dailyCA/dGoal*100)}%`}}></div></div>
          </div>
          <div>
            <span>{t(lang,"weekly_goal")}: {stats.weeklyCA}/{wGoal}</span>
            <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.weeklyCA/wGoal*100)}%`}}></div></div>
          </div>
        </div>
        <div className="section-title"><div className="section-bar"></div>Activity Heatmap</div>
        <div className="heatmap-grid">
          {hm.map((cnt,idx)=><div key={idx} className={`heatmap-cell ${cnt>0?"active":""}`}>{cnt}</div>)}
        </div>
      </div>
    );
  }
  const chatters = profiles.filter(u=>u.role==="chatter");
  return (
    <div>
      {chatters.map(ch=>{
        const stats = getStats(ch.id);
        const dGoal = Number(ch.daily_goal)||1;
        const wGoal = Number(ch.weekly_goal)||1;
        const hm = getHeatmap(ch.id);
        return (
          <div key={ch.id} className="card" style={{marginBottom:20}}>
            <div className="section-title"><div className="section-bar"></div><Tag type="chatter" label={ch.name} id={ch.id}/></div>
            <div style={{marginBottom:16}}>
              <div style={{marginBottom:8}}>
                <span>{t(lang,"daily_goal")}: {stats.dailyCA}/{dGoal}</span>
                <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.dailyCA/dGoal*100)}%`}}></div></div>
              </div>
              <div>
                <span>{t(lang,"weekly_goal")}: {stats.weeklyCA}/{wGoal}</span>
                <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.weeklyCA/wGoal*100)}%`}}></div></div>
              </div>
            </div>
            <div className="heatmap-grid">
              {hm.map((cnt,idx)=><div key={idx} className={`heatmap-cell ${cnt>0?"active":""}`}>{cnt}</div>)}
            </div>
          </div>
        );
      })}
    </div>
  );
};

// COMPETITION TAB
// =============================================
const CompetitionTab = ({user, lang, txs, profiles}) => {
  const [period, setPeriod] = useState("week");
  const chatters = profiles.filter(u=>u.role==="chatter");
  const now = new Date();
  let start;
  if(period==="today") { start = new Date(now); start.setHours(0,0,0,0); }
  else if(period==="week") start = new Date(now.getTime()-7*24*60*60*1000);
  else start = new Date(now.getTime()-30*24*60*60*1000);
  const ranking = chatters.map(ch=>{
    const chTx = txs.filter(tx=>tx.chatter_id===ch.id && new Date(tx.date)>=start);
    return {user:ch, ca:chTx.reduce((s,tx)=>s+Number(tx.amount),0), cnt:chTx.length};
  }).sort((a,b)=>b.ca-a.ca);
  const top3 = ranking.slice(0,3);
  const maxCA = top3.length>0?top3[0].ca:1;
  const medals = ["🥇","🥈","🥉"];
  return (
    <div>
      <div className="trophy">🏆</div>
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        <button className={`filter-chip ${period==="today"?"active":""}`} onClick={()=>setPeriod("today")}>{t(lang,"today")}</button>
        <button className={`filter-chip ${period==="week"?"active":""}`} onClick={()=>setPeriod("week")}>{t(lang,"week")}</button>
        <button className={`filter-chip ${period==="month"?"active":""}`} onClick={()=>setPeriod("month")}>{t(lang,"month")}</button>
      </div>
      <div className="podium">
        {top3.map((r,idx)=>(
          <div key={r.user.id} className="podium-step">
            <div className="podium-rank">{medals[idx]}</div>
            <div className="podium-bar" style={{height:`${(r.ca/maxCA)*200}px`}}></div>
            <div className="podium-name">{r.user.name}</div>
            <div className="podium-ca">{r.ca}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="table-wrap">
          <table className="table">
            <thead><tr><th>#</th><th>Name</th><th>CA</th><th>Tx</th></tr></thead>
            <tbody>
              {ranking.map((r,idx)=>(
                <tr key={r.user.id}><td>{idx+1}</td><td><Tag type="chatter" label={r.user.name} id={r.user.id}/> {user.id===r.user.id&&t(lang,"you")}</td><td>{r.ca}</td><td>{r.cnt}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

const PayesTab = ({user, lang, txs, payouts, profiles, onRefresh}) => {
  const addToast = useToast();
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const chatters = profiles.filter(u=>u.role==="chatter");
  const [form, setForm] = useState({user_id:chatters[0]?.id||"",amount:"",method:"Virement",date:""});
  const getChatterData = (chatterId) => {
    const chTx = txs.filter(tx=>tx.chatter_id===chatterId && tx.status==="validated");
    const totalComm = chTx.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
    const paidAmount = payouts.filter(p=>p.user_id===chatterId && p.status==="done").reduce((s,p)=>s+Number(p.amount),0);
    return {totalEarned:totalComm, paidAmount, balance:totalComm-paidAmount};
  };
  const handleAddPayout = async () => {
    if(!form.amount||!form.date) return;
    setSaving(true);
    try {
      const {error} = await sb.from("payouts").insert({user_id:form.user_id, amount:parseFloat(form.amount), method:form.method, date:form.date, status:"pending"});
      if(error) { addToast("Erreur payout: " + error.message, "error"); setSaving(false); return; }
      setForm({user_id:chatters[0]?.id||"",amount:"",method:"Virement",date:""});
      setShowForm(false);
      await onRefresh();
      addToast(t(lang,"payout_added")||"Payout ajouté ✓","success");
    } catch(e) { addToast("Erreur payout: " + e.message, "error"); }
    setSaving(false);
  };
  return (
    <div>
      {chatters.map(ch=>{
        const data = getChatterData(ch.id);
        const chPayouts = payouts.filter(p=>p.user_id===ch.id);
        return (
          <div key={ch.id} className="card" style={{marginBottom:20}}>
            <div className="profile-header"><div className="profile-name"><Tag type="chatter" label={ch.name} id={ch.id}/></div></div>
            <div className="profile-section">
              <div className="profile-row"><span>{t(lang,"total_earned")}</span><span>{data.totalEarned.toFixed(0)}</span></div>
              <div className="profile-row"><span>{t(lang,"already_paid")}</span><span>{data.paidAmount.toFixed(0)}</span></div>
              <div className="profile-row"><span>{t(lang,"balance_due")}</span><span style={{color:data.balance>0?"var(--warning)":"var(--success)",fontWeight:700}}>{data.balance.toFixed(0)}</span></div>
            </div>
            <div style={{marginTop:16}}>
              <div className="section-title"><div className="section-bar"></div>{t(lang,"payment_history")}</div>
              <div className="table-wrap">
                <table className="table" style={{fontSize:12}}>
                  <thead><tr><th>{t(lang,"date")}</th><th>{t(lang,"amount")}</th><th>{t(lang,"method")}</th><th>{t(lang,"status")}</th></tr></thead>
                  <tbody>
                    {chPayouts.map(p=>(
                      <tr key={p.id}><td>{fmtDate(p.date)}</td><td>{p.amount}</td><td>{p.method}</td><td><span className={`badge ${p.status==="done"?"badge-done":"badge-pending"}`}>{p.status}</span></td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })}
      {user.role==="gerant"&&(
        <>
          <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ {t(lang,"add_payout")}</button>
          {showForm&&(
            <div className="card" style={{marginBottom:20}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
                <div className="form-group-modal">
                  <label className="form-label">Chatter</label>
                  <select className="filter-select" value={form.user_id} onChange={e=>setForm({...form,user_id:e.target.value})}>
                    {chatters.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                  </select>
                </div>
                <div className="form-group-modal">
                  <label className="form-label">{t(lang,"amount")}</label>
                  <input className="form-input" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
                </div>
                <div className="form-group-modal">

// =============================================
// SPENDER PROFILE ENGINE (computed from transactions)
// =============================================
const computeSpenderProfile = (handle, txs, models, profiles, spenders) => {
  const sTxs = txs.filter(tx=>tx.spender_handle===handle).sort((a,b)=>new Date(b.date)-new Date(a.date));
  // Also find spender record for OFM metadata (resume, info, contenu, tw)
  const spenderRecord = (spenders||[]).find(s=>(s.handle||s.name||"").toLowerCase()===handle.toLowerCase());
  if(sTxs.length===0 && !spenderRecord) return null;
  const now = new Date();
  const ltv = sTxs.reduce((s,tx)=>s+Number(tx.amount),0);
  const validatedCA = sTxs.filter(tx=>tx.status==="validated").reduce((s,tx)=>s+Number(tx.amount),0);
  const pendingCA = sTxs.filter(tx=>tx.status==="pending").reduce((s,tx)=>s+Number(tx.amount),0);
  const cnt = sTxs.length;
  const aov = ltv/cnt;
  const maxTicket = Math.max(...sTxs.map(tx=>Number(tx.amount)));
  const lastPurchase = sTxs[0]?.date;
  const firstPurchase = sTxs[sTxs.length-1]?.date;
  const recencyDays = lastPurchase ? Math.floor((now-new Date(lastPurchase))/(86400000)) : 999;

  // 7d/30d/90d splits
  const d7 = new Date(now.getTime()-7*86400000);
  const d30 = new Date(now.getTime()-30*86400000);
  const d90 = new Date(now.getTime()-90*86400000);
  const ca7d = sTxs.filter(tx=>new Date(tx.date)>=d7).reduce((s,tx)=>s+Number(tx.amount),0);
  const ca30d = sTxs.filter(tx=>new Date(tx.date)>=d30).reduce((s,tx)=>s+Number(tx.amount),0);
  const ca90d = sTxs.filter(tx=>new Date(tx.date)>=d90).reduce((s,tx)=>s+Number(tx.amount),0);

  // Trend 30d vs previous 30d
  const d60 = new Date(now.getTime()-60*86400000);
  const caPrev30d = sTxs.filter(tx=>{const d=new Date(tx.date);return d>=d60&&d<d30;}).reduce((s,tx)=>s+Number(tx.amount),0);
  const trend = caPrev30d>0 ? ((ca30d-caPrev30d)/caPrev30d*100).toFixed(0) : ca30d>0?"new":0;

  // Top models (rank + montant)
  const modelMap = {};
  sTxs.forEach(tx=>{
    if(!tx.model_id) return;
    if(!modelMap[tx.model_id]) modelMap[tx.model_id]={id:tx.model_id, ca:0, cnt:0};
    modelMap[tx.model_id].ca += Number(tx.amount);
    modelMap[tx.model_id].cnt++;
  });
  const topModels = Object.values(modelMap).map(m=>({...m, name:models.find(x=>x.id===m.id)?.name||"?", pct:ltv>0?((m.ca/ltv)*100):0})).sort((a,b)=>b.ca-a.ca);

  // Top content types
  const typeMap = {};
  sTxs.forEach(tx=>{
    const tp = tx.type||tx.product||tx.tag||"autre";
    if(!typeMap[tp]) typeMap[tp]={type:tp, ca:0, cnt:0};
    typeMap[tp].ca += Number(tx.amount);
    typeMap[tp].cnt++;
  });
  const topTypes = Object.values(typeMap).sort((a,b)=>b.ca-a.ca);

  // Time-of-day pattern (hour buckets)
  const hourMap = {};
  sTxs.forEach(tx=>{
    if(!tx.date) return;
    const h = new Date(tx.date).getHours();
    hourMap[h] = (hourMap[h]||0) + 1;
  });

  // Day-of-week pattern
  const dayMap = {};
  sTxs.forEach(tx=>{
    if(!tx.date) return;
    const d = new Date(tx.date).getDay();
    dayMap[d] = (dayMap[d]||0) + 1;
  });

  // Purchase cadence (avg days between purchases)
  const dates = sTxs.map(tx=>new Date(tx.date).getTime()).sort((a,b)=>a-b);
  let cadence = 0;
  if(dates.length>1){
    const gaps = [];
    for(let i=1;i<dates.length;i++) gaps.push((dates[i]-dates[i-1])/86400000);
    cadence = gaps.reduce((s,g)=>s+g,0)/gaps.length;
  }

  // Segment + tags
  const segment = getSpenderSegment(ltv);
  const tags = [segment];
  if(ltv>2000) tags.push("whale");
  if(recencyDays>30) tags.push("cold");
  else if(recencyDays<=3) tags.push("hot");
  if(ca7d>ca30d*0.7 && ca30d>0) tags.push("accelerating");
  if(trend<-30) tags.push("declining");
  if(cnt>=10) tags.push("loyal");

  // Next best action
  let nextAction = "";
  if(recencyDays>14) nextAction = "relance";
  else if(ltv>1000 && topModels.length===1) nextAction = "upsell (nouveau modèle)";
  else if(ltv>500 && recencyDays<=3) nextAction = "VIP handling";
  else if(cnt===1) nextAction = "follow-up 1st purchase";
  else nextAction = "maintenir engagement";

  // OFM metadata from spender record
  const resume = spenderRecord?.resume || "";
  const prenom = spenderRecord?.prenom || "?";
  const age = spenderRecord?.age || "?";
  const metier = spenderRecord?.metier || "?";
  const contenu = spenderRecord?.contenu || "";
  const isTW = spenderRecord?.is_timewaster || false;
  const telegramId = spenderRecord?.telegram_id || "";
  if(isTW && !tags.includes("timewaster")) tags.push("timewaster");

  return {
    handle, ltv, validatedCA, pendingCA, cnt, aov, maxTicket,
    lastPurchase, firstPurchase, recencyDays,
    ca7d, ca30d, ca90d, trend, caPrev30d,
    topModels, topTypes, hourMap, dayMap, cadence,
    segment, tags, nextAction,
    txs: sTxs,
    // OFM metadata
    resume, prenom, age, metier, contenu, isTW, telegramId,
  };
};

          <div><span style={{color:"var(--text2)"}}>Trend</span><br/><strong style={{color:Number(p.trend)>0?"var(--success)":Number(p.trend)<0?"var(--danger)":"var(--text)"}}>{p.trend==="new"?"NEW":p.trend>0?"+"+p.trend+"%":p.trend+"%"}</strong></div>

              <span style={{fontSize:11,fontWeight:600,minWidth:60,textAlign:"right"}}>{m.ca.toFixed(0)}€ ({m.pct.toFixed(0)}%)</span>

          ))}
        </div>

        {/* Top Content Types */}
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>{fr?"Types de contenu":"Content Types"}</div>
          {p.topTypes.slice(0,6).map(tp=>(
            <div key={tp.type} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12,borderBottom:"1px solid rgba(139,92,246,0.05)"}}>
