              <div><label className="form-label">Tag</label><input className="filter-select" style={{width:"100%"}} value={form.tag} onChange={e=>setForm({...form,tag:e.target.value})} placeholder={fr ? "Optionnel" : "Optional"} /></div>
            </div>
            <div style={{marginTop:12}}><label className="form-label">Notes</label><input className="filter-select" style={{width:"100%"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder={fr ? "Notes optionnelles" : "Optional notes"} /></div>
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button className="btn btn-primary" onClick={handleSubmit} disabled={saving}>{saving ? React.createElement(Spinner) : (editingTx ? (fr ? "Sauvegarder" : "Save") : (fr ? "Créer" : "Create"))}</button>
              <button className="btn" onClick={()=>{setShowForm(false);setEditingTx(null);}}>{fr ? "Annuler" : "Cancel"}</button>
            </div>
          </div>
        )}

        {/* Table */}
        <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,overflow:"hidden"}}>
          <div style={{overflowX:"auto"}}>
            <table className="table" style={{fontSize:12}}>
              <thead><tr>
                <SortTh label="Date" sortKey="date" sort={sort} onSort={onSort} />
                <SortTh label="Spender" sortKey="spender_handle" sort={sort} onSort={onSort} />
                <th>{fr ? "Modèle" : "Model"}</th>
                <th>{fr ? "Produit" : "Product"}</th>
                <SortTh label={fr ? "Montant" : "Amount"} sortKey="amount" sort={sort} onSort={onSort} />
                <th>{fr ? "Statut" : "Status"}</th>
                <th></th>
              </tr></thead>
              <tbody>
                {pag.paginatedData.map(tx => (
                  <tr key={tx.id}>
                    <td>{fmtDate(tx.date)}</td>
                    <td style={{fontWeight:600}}>@{tx.spender_handle}</td>
                    <td>{models.find(m=>m.id===tx.model_id)?.name || "—"}</td>
                    <td>{tx.product || "—"}{tx.tag ? ` (${tx.tag})` : ""}</td>
                    <td style={{fontWeight:700}}>{fmtAmount(tx.amount)}</td>
                    <td>{statusBadge(tx.status)}</td>
                    <td><button className="btn btn-small" onClick={()=>startEdit(tx)}>{fr ? "Modifier" : "Edit"}</button></td>
                  </tr>
                ))}
                {pag.paginatedData.length === 0 && <tr><td colSpan={7} style={{textAlign:"center",color:"var(--text-quaternary)",padding:30}}>{fr ? "Aucune transaction" : "No transactions"}</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
        <PaginationControls pag={pag} lang={lang} />
      </>)}
    </div>
  );
};

// =============================================
// CHATTER ROLE — SPENDERS
// =============================================
const ChatterSpendersTab = ({user, lang, spenders, txs, models, onRefresh}) => {
  const addToast = useToast();
  const { fmtAmount } = useCurrency();
  const fr = lang === "fr";
  const [search, setSearch] = useState("");
  const debouncedSearch = useDebounce(search, DEBOUNCE_DELAY);
  const [selectedSpender, setSelectedSpender] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [showCreate, setShowCreate] = useState(false);
  const [createForm, setCreateForm] = useState({handle:"",first_name:"",preferences:"",chatter_notes:"",langue:"FR"});

  const myModelIds = user.assigned_models || [];
  const myTxs = txs.filter(tx => myModelIds.includes(tx.model_id));

  const mySpenders = useMemo(() => {
    const handleSet = new Set(myTxs.map(tx => tx.spender_handle));
    let list = spenders.filter(sp => handleSet.has(sp.handle || sp.name));
    // Enrich with TX stats (matching gérant card fields)
    list = list.map(sp => {
      const spTxs = myTxs.filter(tx => tx.spender_handle === (sp.handle || sp.name));
      const validTxs = spTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
      const pendingTxs = spTxs.filter(tx => tx.status === "pending");
      const total = validTxs.reduce((s, tx) => s + Number(tx.amount || 0), 0);
      const pendingCA = pendingTxs.reduce((s, tx) => s + Number(tx.amount || 0), 0);
      const aov = validTxs.length > 0 ? total / validTxs.length : 0;
      const lastTx = spTxs.length > 0 ? spTxs.sort((a,b) => new Date(b.date) - new Date(a.date))[0] : null;
      return {...sp, total_spent: total, ltv: total, validCA: total, pendingCA, aov, tx_count: spTxs.length, cnt: spTxs.length, validCount: validTxs.length, pendingCount: pendingTxs.length, last_tx_date: lastTx?.date || null, txs: spTxs};
    });
    // Search
    if (debouncedSearch.trim()) {
      const q = debouncedSearch.toLowerCase();
      list = list.filter(sp => (sp.handle || "").toLowerCase().includes(q) || (sp.name || "").toLowerCase().includes(q) || (sp.first_name || "").toLowerCase().includes(q));
    }
    return list.sort((a, b) => b.total_spent - a.total_spent);
  }, [spenders, myTxs, debouncedSearch]);

  const spenderTxs = useMemo(() => {
    if (!selectedSpender) return [];
    return myTxs.filter(tx => tx.spender_handle === (selectedSpender.handle || selectedSpender.name)).sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [selectedSpender, myTxs]);

  const openDetail = (sp) => { setSelectedSpender(sp); setForm({...sp}); setEditMode(false); };

  const handleSave = async () => {
    setSaving(true);
    try {
      const updates = {first_name: form.first_name || null, preferences: form.preferences || null, personality_notes: form.personality_notes || null, chatter_notes: form.chatter_notes || null, favorite_content: form.favorite_content || null, city: form.city || null, country: form.country || null, telegram_username: form.telegram_username || null, whatsapp_phone: form.whatsapp_phone || null, relationship_status: form.relationship_status || null, job: form.job || null, age: form.age ? parseInt(form.age) : null, langue: form.langue || null, timezone: form.timezone || "Europe/Zurich", budget_range: form.budget_range || null, best_time: form.best_time || null};
      const {error} = await sb.from("spenders").update(updates).eq("id", form.id);
      if (error) { addToast("Erreur: " + error.message, "error"); setSaving(false); return; }
      setSaving(false);
      setEditMode(false);
      addToast(fr ? "Fiche sauvegardée" : "Profile saved", "success");
      await onRefresh();
      setSelectedSpender(null);
    } catch (e) {
      // Spender save failed
      setSaving(false);
      addToast("Erreur: " + e.message, "error");
    }
  };

  const handleCreate = async () => {
    if (!createForm.handle.trim()) { addToast(fr ? "Handle requis" : "Handle required", "error"); return; }
    setSaving(true);
    try {
      const handle = createForm.handle.trim().replace(/^@/, "");
      const {error} = await sb.from("spenders").upsert({handle, name: handle, status: "active", first_name: createForm.first_name || null, preferences: createForm.preferences || null, chatter_notes: createForm.chatter_notes || null, langue: createForm.langue || "FR", timezone: "Europe/Zurich"}, {onConflict: "handle"});
      if (error) { addToast("Erreur: " + error.message, "error"); setSaving(false); return; }
      setSaving(false);
      setShowCreate(false);
      setCreateForm({handle:"",first_name:"",preferences:"",chatter_notes:""});
      addToast(fr ? "Spender créé" : "Spender created", "success");
      await onRefresh();
    } catch (e) {
      // Spender create failed
      setSaving(false);
      addToast("Erreur: " + e.message, "error");
    }
  };

  // Detail view — enriched
  if (selectedSpender) {
    const spBadges = computeSpenderBadges(selectedSpender);
    const spVIP = computeVIPScore(selectedSpender);
    const totalValidated = spenderTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee").reduce((s, tx) => s + (tx.amount || 0), 0);
    const totalPending = spenderTxs.filter(tx => tx.status === "pending" || tx.status === "en_attente").reduce((s, tx) => s + (tx.amount || 0), 0);
    // Monthly sparkline data
    const monthlyMap = {};
    spenderTxs.forEach(tx => { const m = (tx.date || "").slice(0,7); if(m) monthlyMap[m] = (monthlyMap[m]||0) + (tx.amount||0); });
    const monthKeys = Object.keys(monthlyMap).sort();
    const sparkData = monthKeys.map(k => monthlyMap[k]);
    return (
      <div>
        <button className="btn" onClick={()=>setSelectedSpender(null)} style={{marginBottom:16}}>{"\u2190"} {fr ? "Retour" : "Back"}</button>
        <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,padding:24,marginBottom:20}}>
          {/* Header with avatar, flag, badges, VIP */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div className="avatar" style={{background:"var(--accent-muted)",color:"var(--accent)",width:48,height:48,fontSize:18}}>{selectedSpender.first_name?selectedSpender.first_name[0].toUpperCase():(selectedSpender.handle||selectedSpender.name||"?")[0].toUpperCase()}</div>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <h3 style={{fontSize:16,fontWeight:800,margin:0}}>@{selectedSpender.handle || selectedSpender.name}</h3>
                  {selectedSpender.langue && LANG_FLAGS[selectedSpender.langue] && <span style={{fontSize:16}}>{LANG_FLAGS[selectedSpender.langue]}</span>}
                </div>
                {selectedSpender.first_name && <div style={{fontSize:12,color:"var(--text-tertiary)",marginTop:2}}>{selectedSpender.first_name}</div>}
                <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
                  {spBadges.map(b=>(
                    <span key={b.label} style={{fontSize:9,padding:"2px 7px",borderRadius:8,background:b.bg,color:b.color,fontWeight:700}}>{b.icon} {b.label}</span>
                  ))}
                </div>
              </div>
            </div>
            <button className="btn btn-primary btn-small" onClick={()=>setEditMode(!editMode)}>{editMode ? (fr ? "Annuler" : "Cancel") : (fr ? "Modifier" : "Edit")}</button>
          </div>
          {/* KPI row */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}}>
            {[
              {l:"LTV",v:fmtAmount(selectedSpender.total_spent||0),c:"var(--success)"},
              {l:"TX",v:String(spenderTxs.length),c:"var(--accent)"},
              {l:fr?"Validé":"Validated",v:fmtAmount(totalValidated),c:"var(--success)"},
              {l:fr?"En attente":"Pending",v:fmtAmount(totalPending),c:"var(--warning)"}
            ].map(k=>(
              <div key={k.l} style={{background:"var(--bg-overlay)",borderRadius:10,padding:"8px 12px",textAlign:"center"}}>
                <div style={{fontSize:10,color:"var(--text-tertiary)",marginBottom:2}}>{k.l}</div>
                <div style={{fontSize:14,fontWeight:800,color:k.c}}>{k.v}</div>
              </div>
            ))}
          </div>
          <div style={{marginBottom:16}}><VIPScoreBar score={spVIP}/></div>
          {/* Edit / View mode */}
          {editMode ? (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div><label className="form-label">{fr ? "Prénom" : "First name"}</label><input className="filter-select" style={{width:"100%"}} value={form.first_name||""} onChange={e=>setForm({...form,first_name:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Langue" : "Language"}</label><select className="filter-select" style={{width:"100%"}} value={form.langue||"FR"} onChange={e=>setForm({...form,langue:e.target.value})}>{SPENDER_LANGUAGES.map(l=><option key={l} value={l}>{LANG_FLAGS[l]} {l}</option>)}</select></div>
              <div><label className="form-label">{fr ? "Ville" : "City"}</label><input className="filter-select" style={{width:"100%"}} value={form.city||""} onChange={e=>setForm({...form,city:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Pays" : "Country"}</label><input className="filter-select" style={{width:"100%"}} value={form.country||""} onChange={e=>setForm({...form,country:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Job" : "Job"}</label><input className="filter-select" style={{width:"100%"}} value={form.job||""} onChange={e=>setForm({...form,job:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Âge" : "Age"}</label><input className="filter-select" type="number" style={{width:"100%"}} value={form.age||""} onChange={e=>setForm({...form,age:e.target.value})} /></div>
              <div><label className="form-label">Telegram</label><input className="filter-select" style={{width:"100%"}} value={form.telegram_username||""} onChange={e=>setForm({...form,telegram_username:e.target.value})} /></div>
              <div><label className="form-label">WhatsApp</label><input className="filter-select" style={{width:"100%"}} value={form.whatsapp_phone||""} onChange={e=>setForm({...form,whatsapp_phone:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Statut relation" : "Relationship"}</label><input className="filter-select" style={{width:"100%"}} value={form.relationship_status||""} onChange={e=>setForm({...form,relationship_status:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Budget" : "Budget range"}</label><input className="filter-select" style={{width:"100%"}} value={form.budget_range||""} onChange={e=>setForm({...form,budget_range:e.target.value})} placeholder="e.g. 50-200 CHF" /></div>
              <div style={{gridColumn:"1/-1"}}><label className="form-label">{fr ? "Préférences" : "Preferences"}</label><input className="filter-select" style={{width:"100%"}} value={form.preferences||""} onChange={e=>setForm({...form,preferences:e.target.value})} /></div>
              <div style={{gridColumn:"1/-1"}}><label className="form-label">{fr ? "Contenu favori" : "Favorite content"}</label><input className="filter-select" style={{width:"100%"}} value={form.favorite_content||""} onChange={e=>setForm({...form,favorite_content:e.target.value})} /></div>
              <div style={{gridColumn:"1/-1"}}><label className="form-label">{fr ? "Meilleur moment" : "Best time"}</label><input className="filter-select" style={{width:"100%"}} value={form.best_time||""} onChange={e=>setForm({...form,best_time:e.target.value})} placeholder={fr ? "ex: Soir 20h-23h" : "e.g. Evening 8-11pm"} /></div>
              <div style={{gridColumn:"1/-1"}}><label className="form-label">{fr ? "Notes perso" : "Personal notes"}</label><textarea className="filter-select" style={{width:"100%",minHeight:60}} value={form.chatter_notes||""} onChange={e=>setForm({...form,chatter_notes:e.target.value})} /></div>
              <div><button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving ? React.createElement(Spinner) : (fr ? "Sauvegarder" : "Save")}</button></div>
            </div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:13}}>
              {[{l:fr?"Prénom":"First name",v:selectedSpender.first_name},{l:fr?"Langue":"Language",v:selectedSpender.langue ? (LANG_FLAGS[selectedSpender.langue]||"") + " " + selectedSpender.langue : null},{l:fr?"Ville":"City",v:selectedSpender.city},{l:fr?"Pays":"Country",v:selectedSpender.country},{l:"Job",v:selectedSpender.job},{l:fr?"Âge":"Age",v:selectedSpender.age},{l:"Telegram",v:selectedSpender.telegram_username},{l:"WhatsApp",v:selectedSpender.whatsapp_phone},{l:fr?"Relation":"Relationship",v:selectedSpender.relationship_status},{l:fr?"Budget":"Budget",v:selectedSpender.budget_range},{l:fr?"Préférences":"Preferences",v:selectedSpender.preferences},{l:fr?"Contenu favori":"Fav content",v:selectedSpender.favorite_content},{l:fr?"Meilleur moment":"Best time",v:selectedSpender.best_time}].map(f => (
                <div key={f.l}><span style={{color:"var(--text-tertiary)",fontSize:11}}>{f.l}:</span> <span style={{fontWeight:600}}>{f.v || "—"}</span></div>
              ))}
              {selectedSpender.chatter_notes && <div style={{gridColumn:"1/-1"}}><span style={{color:"var(--text-tertiary)",fontSize:11}}>{fr ? "Notes" : "Notes"}:</span> <span>{selectedSpender.chatter_notes}</span></div>}
            </div>
          )}
        </div>
        {/* TX history with sparkline */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:14,fontWeight:700}}>{fr ? "Historique TX" : "TX History"} ({spenderTxs.length})</div>
          {sparkData.length >= 2 && <MiniSparkline data={sparkData} width={100} height={24} color="var(--accent)"/>}
        </div>
        <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,overflow:"hidden"}}>
          <table className="table" style={{fontSize:12}}>
            <thead><tr><th>Date</th><th>{fr ? "Modèle" : "Model"}</th><th>{fr ? "Montant" : "Amount"}</th><th>{fr ? "Statut" : "Status"}</th></tr></thead>
            <tbody>
              {spenderTxs.map(tx => (
                <tr key={tx.id}>
                  <td>{fmtDate(tx.date)}</td>
                  <td>{models.find(m=>m.id===tx.model_id)?.name || "—"}</td>
                  <td style={{fontWeight:700}}>{fmtAmount(tx.amount)}</td>
                  <td><span style={{padding:"2px 8px",borderRadius:10,background:(tx.status==="validated"||tx.status==="confirmee"?"var(--success)":tx.status==="refused"?"var(--danger)":"var(--warning)")+"15",color:tx.status==="validated"||tx.status==="confirmee"?"var(--success)":tx.status==="refused"?"var(--danger)":"var(--warning)",fontSize:10,fontWeight:700}}>{tx.status}</span></td>
                </tr>
              ))}
              {spenderTxs.length === 0 && <tr><td colSpan={4} style={{textAlign:"center",color:"var(--text-quaternary)",padding:20}}>{fr ? "Aucune TX" : "No TX"}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u{1F464}"} {fr ? "Mes Spenders" : "My Spenders"}</h2>
          <p style={{fontSize:12,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{mySpenders.length} spenders</p>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowCreate(true)}>{fr ? "+ Nouveau Spender" : "+ New Spender"}</button>
      </div>

      {myModelIds.length === 0 && (
        <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr ? "Aucun modèle attribué" : "No models assigned"}</div>
      )}

      {myModelIds.length > 0 && (<>
        {/* Create form */}
        {showCreate && (
          <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,padding:20,marginBottom:20}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>{fr ? "Nouveau Spender" : "New Spender"}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div><label className="form-label">Handle *</label><input className="filter-select" style={{width:"100%"}} value={createForm.handle} onChange={e=>setCreateForm({...createForm,handle:e.target.value})} placeholder="@handle" /></div>
              <div><label className="form-label">{fr ? "Prénom" : "First name"}</label><input className="filter-select" style={{width:"100%"}} value={createForm.first_name} onChange={e=>setCreateForm({...createForm,first_name:e.target.value})} /></div>
              <div><label className="form-label">{fr ? "Langue" : "Language"}</label><select className="filter-select" style={{width:"100%"}} value={createForm.langue||"FR"} onChange={e=>setCreateForm({...createForm,langue:e.target.value})}>{SPENDER_LANGUAGES.map(l=><option key={l} value={l}>{LANG_FLAGS[l]} {l}</option>)}</select></div>
              <div style={{gridColumn:"1/-1"}}><label className="form-label">{fr ? "Préférences" : "Preferences"}</label><input className="filter-select" style={{width:"100%"}} value={createForm.preferences} onChange={e=>setCreateForm({...createForm,preferences:e.target.value})} /></div>
              <div style={{gridColumn:"1/-1"}}><label className="form-label">Notes</label><input className="filter-select" style={{width:"100%"}} value={createForm.chatter_notes} onChange={e=>setCreateForm({...createForm,chatter_notes:e.target.value})} /></div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button className="btn btn-primary" onClick={handleCreate} disabled={saving}>{saving ? React.createElement(Spinner) : (fr ? "Créer" : "Create")}</button>
              <button className="btn" onClick={()=>setShowCreate(false)}>{fr ? "Annuler" : "Cancel"}</button>
            </div>
          </div>
        )}

        {/* Search */}
        <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder={fr ? "Rechercher un spender..." : "Search spender..."} className="filter-select" style={{width:"100%",marginBottom:16,padding:"10px 14px"}} />

        {/* ═══ CHATTER SPENDER ALERTS IA ═══ */}
        {(()=>{
          const spAlerts = [];
          mySpenders.forEach(s => {
            const daysSince = s.last_tx_date ? Math.floor((Date.now() - new Date(s.last_tx_date).getTime()) / 86400000) : 999;
            if (daysSince > 10 && s.ltv > 100) spAlerts.push({ type:"danger", icon:"\ud83d\udd34", spender:s, message:`@${s.handle||s.name} ${fr?"inactif depuis":"inactive for"} ${daysSince}${fr?"j \u2014 relancer":"d \u2014 re-engage"}` });
          });
          mySpenders.forEach(s => {
            const pendingTxs = (s.txs||[]).filter(t => t.status === "pending");
            if (pendingTxs.length > 0) {
              const oldest = pendingTxs.sort((a,b) => new Date(a.date) - new Date(b.date))[0];
              const pendDays = Math.floor((Date.now() - new Date(oldest.date).getTime()) / 86400000);
              if (pendDays > 3) spAlerts.push({ type:"warning", icon:"\ud83d\udfe0", spender:s, message:`@${s.handle||s.name} ${fr?"a":"has"} ${fmtAmount(s.pendingCA)} pending ${fr?"non confirm\u00e9 depuis":"unconfirmed for"} ${pendDays}${fr?"j":"d"}` });
            }
          });
          mySpenders.forEach(s => {
            const thisWeek = (s.txs||[]).filter(t => (t.status === "validated" || t.status === "confirmee") && (Date.now() - new Date(t.date).getTime()) < 7 * 86400000);
            if (thisWeek.length >= 3) spAlerts.push({ type:"success", icon:"\ud83d\udfe2", spender:s, message:`@${s.handle||s.name} ${fr?"a achet\u00e9":"bought"} ${thisWeek.length}x ${fr?"cette semaine \u2014 proposer pack premium":"this week \u2014 offer premium pack"}` });
          });
          const incomplete = mySpenders.filter(s => !s.langue);
          if (incomplete.length > 0) spAlerts.push({ type:"info", icon:"\ud83d\udca1", spender:null, message:`${incomplete.length} spenders ${fr?"sans langue \u2014 compl\u00e9ter les fiches":"without language \u2014 complete profiles"}` });
          if (spAlerts.length === 0) return null;
          const alertColors = { danger:{bg:"rgba(248,113,113,0.1)",border:"rgba(248,113,113,0.3)",text:"var(--danger)"}, warning:{bg:"rgba(251,191,36,0.1)",border:"rgba(251,191,36,0.3)",text:"var(--warning)"}, success:{bg:"rgba(52,211,153,0.1)",border:"rgba(52,211,153,0.3)",text:"var(--success)"}, info:{bg:"rgba(139,92,246,0.1)",border:"rgba(139,92,246,0.3)",text:"var(--accent)"} };
          return (
            <div style={{marginBottom:20,display:"flex",flexDirection:"column",gap:8}}>
              {spAlerts.map((a,i) => {
                const ac = alertColors[a.type];
                return (
                  <div key={i} onClick={()=>a.spender&&openDetail(a.spender)} style={{padding:"12px 16px",borderRadius:12,cursor:a.spender?"pointer":"default",transition:"all 0.2s",background:ac.bg,border:`1px solid ${ac.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:16}}>{a.icon}</span>
                      <span style={{fontSize:13,fontWeight:600,color:ac.text}}>{a.message}</span>
                    </div>
                    {a.spender && <span style={{fontSize:11,fontWeight:700,color:ac.text,padding:"4px 12px",borderRadius:8,background:ac.bg,border:`1px solid ${ac.border}`}}>{fr?"Voir":"View"}</span>}
                  </div>
                );
              })}
            </div>
          );
        })()}

        {/* Cards */}
        {mySpenders.length === 0 && <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr ? "Aucun spender trouvé" : "No spenders found"}</div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:16}}>
          {mySpenders.map(sp => {
            const _vipScore = computeVIPScore(sp);
            const _vipColor = _vipScore >= 70 ? "var(--success)" : _vipScore >= 40 ? "var(--warning)" : "var(--danger)";
            const _lastTxRel = (() => { if (!sp.last_tx_date) return fr?"jamais":"never"; const d=Math.floor((Date.now()-new Date(sp.last_tx_date).getTime())/86400000); if(d===0) return fr?"aujourd'hui":"today"; if(d===1) return fr?"hier":"yesterday"; return `${fr?"il y a ":""}${d}${fr?"j":"d ago"}`; })();
            const _topBadge = computeSpenderBadges(sp)[0];
            return (
            <div key={sp.id || sp.handle} className="spender-card card-hover" onClick={()=>openDetail(sp)} style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:20,cursor:"pointer",transition:"all 0.2s"}}>
              {/* ── HEADER ── */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                  <div style={{width:42,height:42,borderRadius:"50%",background:"var(--accent-muted)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:800,color:"var(--accent)",flexShrink:0}}>
                    {sp.first_name?sp.first_name[0].toUpperCase():(sp.handle||sp.name||"?")[0].toUpperCase()}
                  </div>
                  <div style={{minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:14,fontWeight:800,color:"var(--text-primary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>@{sp.handle || sp.name}</span>
                      {sp.langue && LANG_FLAGS[sp.langue] && <span title={sp.langue} style={{fontSize:13}}>{LANG_FLAGS[sp.langue]}</span>}
                    </div>
                    <div style={{fontSize:10,color:"var(--text-tertiary)",marginTop:2}}>
                      {sp.tx_count} TX
                    </div>
                  </div>
                </div>
                <div style={{flexShrink:0}}>
                  {_topBadge && <span style={{padding:"3px 10px",borderRadius:12,background:_topBadge.bg,color:_topBadge.color,fontSize:10,fontWeight:700}}>{_topBadge.icon} {_topBadge.label}</span>}
                </div>
              </div>
              {/* ── KPI GRID 2×3 ── */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>{fr?"LTV Total":"Total LTV"}</div>
                  <div style={{fontSize:16,fontWeight:800,color:"var(--success)"}}>{fmtAmount(sp.total_spent)}</div>
                </div>
                <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>AOV</div>
                  <div style={{fontSize:16,fontWeight:800,color:"var(--text-primary)"}}>{fmtAmount(sp.aov)}</div>
                </div>
                <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>{fr?"Validé":"Validated"}</div>
                  <div style={{fontSize:16,fontWeight:800,color:"var(--success)"}}>{fmtAmount(sp.validCA)}</div>
                </div>
                <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>Pending</div>
                  <div style={{fontSize:16,fontWeight:800,color:sp.pendingCA>0?"var(--warning)":"var(--text-primary)"}}>{fmtAmount(sp.pendingCA)}</div>
                </div>
                <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>{fr?"Dernière TX":"Last TX"}</div>
                  <div style={{fontSize:13,fontWeight:700,color:"var(--text-secondary)"}}>{_lastTxRel}</div>
                </div>
                <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>{fr?"Fréquence":"Frequency"}</div>
                  <div style={{fontSize:13,fontWeight:700,color:"var(--text-secondary)"}}>{sp.tx_count} TX</div>
                </div>
              </div>
              {/* ── VIP SCORE BAR ── */}
              <div style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:9,color:"var(--text-tertiary)",textTransform:"uppercase"}}>VIP Score</span>
                  <span style={{fontSize:10,fontWeight:700,color:"var(--text-secondary)"}}>{_vipScore}/100</span>
                </div>
                <div style={{height:5,borderRadius:3,background:"rgba(255,255,255,0.06)",overflow:"hidden"}}>
                  <div style={{width:`${_vipScore}%`,height:"100%",borderRadius:3,background:_vipColor,transition:"width 0.3s"}}/>
                </div>
              </div>
              {/* ── COUNTERS ── */}
              <div style={{display:"flex",gap:14,marginTop:6}}>
                <span style={{fontSize:11,color:"var(--success)",fontWeight:600}}>{"\u2705"} {sp.validCount}</span>
                <span style={{fontSize:11,color:"var(--warning)",fontWeight:600}}>{"\u23F3"} {sp.pendingCount}</span>
              </div>
            </div>
          );})}
        </div>
      </>)}
    </div>
  );
};

// =============================================
// GÉRANT ROLE — MESSAGERIE (PR #15)
// =============================================
const GerantMessagerieTab = ({user, lang, spenders, profiles, models, txs, onRefresh, navigateToSpender}) => {
  const addToast = useToast();
  const { fmtAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const [conversations, setConversations] = useState([]);
  const [messages, setMessages] = useState([]);
  const [selectedConv, setSelectedConv] = useState(null);
  const [msgInput, setMsgInput] = useState("");
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const [filter, setFilter] = useState("all");
  const [assignDropdown, setAssignDropdown] = useState(null);
  const chatEndRef = useRef(null);

  // Load conversations
  const loadConversations = async () => {
    try {
      const {data} = await sb.from("conversations").select("*").order("updated_at",{ascending:false});
      setConversations(data||[]);
    } catch(e) { setConversations([]); }
    setLoading(false);
  };

  useEffect(()=>{ loadConversations(); },[]);

  // Supabase Realtime
  useEffect(()=>{
    const channel = sb.channel("gerant-messagerie")
      .on("postgres_changes",{event:"*",schema:"public",table:"conversations"},()=>loadConversations())
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},(payload)=>{
        if(selectedConv && payload.new && payload.new.conversation_id===selectedConv.id){
          setMessages(prev=>[...prev, payload.new]);
        }
      })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[selectedConv?.id]);

  // Auto-scroll to bottom when messages change
  useEffect(()=>{
    if(chatEndRef.current) chatEndRef.current.scrollIntoView({behavior:"smooth"});
  },[messages]);

  const loadMessages = async (convId) => {
    try {
      const {data} = await sb.from("messages").select("*").eq("conversation_id",convId).order("created_at",{ascending:true});
      setMessages(data||[]);
    } catch(e) { setMessages([]); }
  };

  const selectConv = (conv) => {
    setSelectedConv(conv);
    loadMessages(conv.id);
    setAssignDropdown(null);
  };

  // Send message as gérant
  const sendMessage = async () => {
    if(!msgInput.trim()||!selectedConv||sending) return;
    setSending(true);
    try {
      const {error} = await sb.from("messages").insert({conversation_id:selectedConv.id, sender_type:"human", sender_id:user.id, content:msgInput.trim()});
      if(error){ addToast("Erreur: "+error.message,"error"); setSending(false); return; }
      try { await sb.from("chatter_logs").insert({chatter_id:user.id, conversation_id:selectedConv.id, action:"gerant_message", content:msgInput.trim().slice(0,200)}); } catch(e){}
      setMsgInput("");
      await loadMessages(selectedConv.id);
      try { await sb.from("conversations").update({updated_at:new Date().toISOString()}).eq("id",selectedConv.id); } catch(e){}
    } catch(e){ addToast("Erreur: "+e.message,"error"); }
    setSending(false);
  };

  // Assign to chatter
  const assignToChatter = async (chatterId) => {
    if(!selectedConv) return;
    try {
      const {error} = await sb.from("conversations").update({chatter_id:chatterId, status:"human", escalated:false, escalation_reason:null}).eq("id",selectedConv.id);
      if(error){ addToast("Erreur: "+error.message,"error"); return; }
      try { await sb.from("chatter_logs").insert({chatter_id:user.id, conversation_id:selectedConv.id, action:"assign_chatter", content:`Assigned to ${chatterId}`}); } catch(e){}
      addToast(fr?"Conversation assignée":"Conversation assigned","success");
      setAssignDropdown(null);
      await loadConversations();
    } catch(e){ addToast("Erreur: "+e.message,"error"); }
  };

  // Hand back to bot
  const handBackToBot = async () => {
    if(!selectedConv) return;
    try {
      const {error} = await sb.from("conversations").update({status:"bot", chatter_id:null, escalated:false, escalation_reason:null}).eq("id",selectedConv.id);
      if(error){ addToast("Erreur: "+error.message,"error"); return; }
      try { await sb.from("chatter_logs").insert({chatter_id:user.id, conversation_id:selectedConv.id, action:"hand_back_bot"}); } catch(e){}
      addToast(fr?"Conversation rendue au bot":"Conversation handed back to bot","success");
      await loadConversations();
    } catch(e){ addToast("Erreur: "+e.message,"error"); }
  };

  // Helpers
  const getSpender = (conv) => spenders.find(s => s.handle===conv.spender_handle || s.name===conv.spender_handle || s.id===conv.spender_id);
  const getSpenderName = (conv) => { const sp=getSpender(conv); return sp?.first_name||sp?.handle||conv.spender_handle||"Spender"; };
  const relTime = (d) => { if(!d) return ""; const mins=Math.floor((Date.now()-new Date(d).getTime())/60000); if(mins<1) return fr?"à l'instant":"just now"; if(mins<60) return `${fr?"il y a ":""}${mins}${fr?" min":"m ago"}`; const hrs=Math.floor(mins/60); if(hrs<24) return `${fr?"il y a ":""}${hrs}${fr?"h":"h ago"}`; const days=Math.floor(hrs/24); return `${fr?"il y a ":""}${days}${fr?"j":"d ago"}`; };
  const getConvStatus = (conv) => { if(conv.escalation_reason && !conv.chatter_id) return "escalade"; if(conv.status==="bot"&&!conv.escalated) return "bot"; return "humain"; };
  const statusConfig = { escalade:{icon:"\ud83d\udd34",label:fr?"Escalade":"Escalation",color:"var(--danger)",bg:"rgba(248,113,113,0.15)"}, bot:{icon:"\ud83d\udfe2",label:"Bot",color:"var(--success)",bg:"rgba(52,211,153,0.15)"}, humain:{icon:"\ud83d\udd35",label:fr?"Humain":"Human",color:"var(--blue-accent,#60A5FA)",bg:"rgba(96,165,250,0.15)"} };
  const senderColors = { spender:"#2A2A3E", bot:"#1E3A5F", chatter:"#3B82F6", human:"#7C3AED", gerant:"#7C3AED" };
  const senderBadge = (type) => { const map={bot:{icon:"\ud83d\udfe2",label:"BOT"},chatter:{icon:"\ud83d\udd35",label:fr?"CHATTER":"CHATTER"},human:{icon:"\ud83d\udd35",label:fr?"HUMAIN":"HUMAN"},spender:{icon:"\u{1F464}",label:"SPENDER"}}; return map[type]||map.spender; };

  // Available chatters
  const chatters = profiles.filter(p => p.role==="chatter");

  // Filter conversations
  const sortedConvs = conversations.filter(c => {
    if(filter==="escalade") return getConvStatus(c)==="escalade";
    if(filter==="bot") return getConvStatus(c)==="bot";
    if(filter==="humain") return getConvStatus(c)==="humain";
    return true;
  }).sort((a,b)=>{
    const aEsc = getConvStatus(a)==="escalade" ? 0 : 1;
    const bEsc = getConvStatus(b)==="escalade" ? 0 : 1;
    if(aEsc!==bEsc) return aEsc-bEsc;
    return new Date(b.updated_at||0)-new Date(a.updated_at||0);
  });

  // Selected spender enrichment
  const selectedSpender = selectedConv ? getSpender(selectedConv) : null;
  const spEnriched = useMemo(()=>{
    if(!selectedSpender) return null;
    const spTxs = txs.filter(tx=>tx.spender_handle===(selectedSpender.handle||selectedSpender.name));
    const validTxs = spTxs.filter(tx=>tx.status==="validated"||tx.status==="confirmee");
    const ltv = validTxs.reduce((s,tx)=>s+Number(tx.amount||0),0);
    const aov = validTxs.length>0 ? ltv/validTxs.length : 0;
    const cnt = spTxs.length;
    const lastTx = spTxs.length>0 ? spTxs.sort((a,b)=>new Date(b.date)-new Date(a.date))[0] : null;
    const prodMap = {};
    spTxs.forEach(tx=>{ if(tx.product) prodMap[tx.product]=(prodMap[tx.product]||0)+1; });
    const favProducts = Object.entries(prodMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([p])=>p);
    return {...selectedSpender, ltv, aov, cnt, txs:spTxs, last_tx_date:lastTx?.date||null, favProducts};
  },[selectedSpender, txs]);

  return (
    <div>
      {/* Header */}
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:800,margin:0}}>{"\u{1F4AC}"} {fr?"Messagerie":"Messaging"}</h2>
        <p style={{fontSize:11,color:"var(--text-tertiary)",margin:"3px 0 0",fontStyle:"italic"}}>{fr?"Centre de conversations — escalades, assignation, contexte spender":"Conversation center — escalations, assignment, spender context"}</p>
      </div>

      {loading && <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{React.createElement(Spinner)} {fr?"Chargement...":"Loading..."}</div>}

      {!loading && (
        <div style={{display:"grid",gridTemplateColumns:"30% 45% 25%",gap:0,minHeight:"calc(100vh - 200px)",border:"1px solid var(--border-subtle)",borderRadius:16,overflow:"hidden"}}>

          {/* ═══ LEFT: Conversation List ═══ */}
          <div style={{background:"var(--card-bg)",borderRight:"1px solid var(--border-subtle)",display:"flex",flexDirection:"column"}}>
            {/* Filters */}
            <div style={{padding:"12px 14px",borderBottom:"1px solid var(--border-subtle)",display:"flex",gap:4,flexWrap:"wrap"}}>
              {[{id:"all",label:fr?"Toutes":"All"},{id:"escalade",label:"\ud83d\udd34 "+( fr?"Escalades":"Escalations")},{id:"bot",label:"\ud83d\udfe2 Bot"},{id:"humain",label:"\ud83d\udd35 "+(fr?"Humain":"Human")}].map(f=>(
                <button key={f.id} onClick={()=>setFilter(f.id)} style={{padding:"4px 10px",borderRadius:8,border:"1px solid "+(filter===f.id?"var(--accent)":"var(--border-subtle)"),background:filter===f.id?"var(--accent-muted)":"transparent",color:filter===f.id?"var(--accent)":"var(--text-tertiary)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{f.label}</button>
              ))}
            </div>
            {/* Conv list */}
            <div style={{flex:1,overflowY:"auto"}}>
              {sortedConvs.length===0 && <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:30,fontSize:13}}>{fr?"Aucune conversation":"No conversations"}</div>}
              {sortedConvs.map(conv=>{
                const st = statusConfig[getConvStatus(conv)];
                const sp = getSpender(conv);
                const langFlag = sp?.langue && LANG_FLAGS[sp.langue] ? LANG_FLAGS[sp.langue] : "";
                return (
                  <div key={conv.id} onClick={()=>selectConv(conv)} style={{padding:"14px 16px",borderBottom:"1px solid var(--border-subtle)",cursor:"pointer",background:selectedConv?.id===conv.id?"var(--accent-subtle)":"transparent",transition:"background 0.15s"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}>
                        <div style={{width:32,height:32,borderRadius:"50%",background:"var(--accent-muted)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:"var(--accent)",flexShrink:0}}>
                          {(sp?.first_name||conv.spender_handle||"?")[0].toUpperCase()}
                        </div>
                        <span style={{fontSize:13,fontWeight:700,color:"var(--text-primary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>@{conv.spender_handle||"?"}</span>
                        {langFlag && <span style={{fontSize:12}}>{langFlag}</span>}
                      </div>
                      <span style={{padding:"2px 8px",borderRadius:8,background:st.bg,color:st.color,fontSize:9,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>{st.icon} {st.label}</span>
                    </div>
                    <div style={{fontSize:11,color:"var(--text-tertiary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:2,paddingLeft:38}}>{conv.last_message||"..."}</div>
                    <div style={{fontSize:10,color:"var(--text-quaternary)",paddingLeft:38}}>{relTime(conv.updated_at)}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ═══ CENTER: Chat Area ═══ */}
          <div style={{background:"#111827",display:"flex",flexDirection:"column",borderRight:"1px solid var(--border-subtle)"}}>
            {!selectedConv && (
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-quaternary)",flexDirection:"column",gap:8}}>
                <span style={{fontSize:32}}>{"\u{1F4AC}"}</span>
                <span style={{fontSize:14}}>{fr?"Sélectionne une conversation":"Select a conversation"}</span>
              </div>
            )}
            {selectedConv && (<>
              {/* Chat header */}
              <div style={{padding:"12px 16px",borderBottom:"1px solid var(--border-subtle)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(0,0,0,0.2)"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:14,fontWeight:700}}>@{selectedConv.spender_handle}</span>
                  {(()=>{const st=statusConfig[getConvStatus(selectedConv)];return <span style={{padding:"2px 8px",borderRadius:8,background:st.bg,color:st.color,fontSize:10,fontWeight:700}}>{st.icon} {st.label}</span>;})()}
                  {selectedConv.escalation_reason && <span style={{fontSize:10,color:"var(--danger)",fontStyle:"italic"}}>{selectedConv.escalation_reason}</span>}
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center",position:"relative"}}>
                  <button className="btn btn-small" onClick={handBackToBot} style={{fontSize:11}}>{"\ud83e\udd16"} {fr?"Rendre au bot":"Back to bot"}</button>
                  <div style={{position:"relative"}}>
                    <button className="btn btn-small btn-primary" onClick={()=>setAssignDropdown(assignDropdown?null:selectedConv.id)} style={{fontSize:11}}>{"\u{1F464}"} {fr?"Assigner":"Assign"}</button>
                    {assignDropdown===selectedConv.id && (
                      <div style={{position:"absolute",right:0,top:"100%",marginTop:4,background:"var(--bg-raised)",border:"1px solid var(--border-default)",borderRadius:12,padding:6,zIndex:100,minWidth:180,boxShadow:"var(--shadow-lg)"}}>
                        {chatters.length===0 && <div style={{padding:8,fontSize:11,color:"var(--text-quaternary)"}}>{fr?"Aucun chatter":"No chatters"}</div>}
                        {chatters.map(ch=>(
                          <button key={ch.id} onClick={()=>assignToChatter(ch.id)} style={{display:"block",width:"100%",padding:"8px 12px",border:"none",background:"transparent",color:"var(--text-primary)",fontSize:12,fontWeight:600,cursor:"pointer",textAlign:"left",borderRadius:8,fontFamily:"'DM Sans',sans-serif"}} onMouseEnter={e=>e.target.style.background="var(--accent-muted)"} onMouseLeave={e=>e.target.style.background="transparent"}>
                            {ch.name||ch.email}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
              {/* Messages */}
              <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:10}}>
                {messages.map(msg=>{
                  const isSpender = msg.sender_type==="spender"||(!["bot","chatter","human","gerant"].includes(msg.sender_type));
                  const badge = senderBadge(msg.sender_type);
                  return (
                    <div key={msg.id} style={{alignSelf:isSpender?"flex-start":"flex-end",maxWidth:"75%"}}>

// CHATTER ROLE — MESSAGERIE
// =============================================
const BLOCKED_KEYWORDS = ["paypal","bitcoin","virement","iban","revolut","twint","crypto","bank","compte","transfer","wire"];
const BLOCKED_PATTERNS = [/https?:\/\//i, /www\./i, /\.com|\.fr|\.net|\.org/i, /@/i, /\b\d{8,}\b/];

const ChatterMessagerieTab = ({user, lang, spenders}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [conversations, setConversations] = useState([]);
  const [messages, setMessages] = useState([]);
  const [selectedConv, setSelectedConv] = useState(null);
  const [msgInput, setMsgInput] = useState("");
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);

  const myModelIds = user.assigned_models || [];

  useEffect(() => {
    const load = async () => {
      try {
        const {data} = await sb.from("conversations").select("*").in("model_id", myModelIds.length > 0 ? myModelIds : ["__none__"]).order("updated_at", {ascending: false});
        setConversations(data || []);
      } catch (e) {
        // Conversations load failed — table may not exist yet
        setConversations([]);
      }
      setLoading(false);
    };
    if (myModelIds.length > 0) load();
    else setLoading(false);
  }, [user.id]);

  const loadMessages = async (convId) => {
    try {
      const {data} = await sb.from("messages").select("*").eq("conversation_id", convId).order("created_at", {ascending: true});
      setMessages(data || []);
    } catch (e) {
      // Messages load failed
      setMessages([]);
    }
  };

  const selectConv = (conv) => {
    setSelectedConv(conv);
    loadMessages(conv.id);
  };

  const isBlocked = (text) => {
    const lower = text.toLowerCase();
    if (BLOCKED_KEYWORDS.some(kw => lower.includes(kw))) return true;
    if (BLOCKED_PATTERNS.some(pat => pat.test(text))) return true;
    return false;
  };

  const sendMessage = async () => {
    if (!msgInput.trim() || !selectedConv || sending) return;
    if (isBlocked(msgInput)) {
      addToast(fr ? "Message bloqué : contenu interdit" : "Message blocked: forbidden content", "error");
      return;
    }
    setSending(true);
    try {
      const {error} = await sb.from("messages").insert({conversation_id: selectedConv.id, sender_type: "chatter", sender_id: user.id, content: msgInput.trim()});
      if (error) { addToast("Erreur: " + error.message, "error"); setSending(false); return; }
      // Log
      try { await sb.from("chatter_logs").insert({chatter_id: user.id, conversation_id: selectedConv.id, action: "message_sent", content: msgInput.trim().slice(0, 200)}); } catch(e) { /* Chatter log write failed */ }
      setMsgInput("");
      await loadMessages(selectedConv.id);
      // Update conversation timestamp
      try { await sb.from("conversations").update({updated_at: new Date().toISOString()}).eq("id", selectedConv.id); } catch(e) { /* Conversation timestamp update failed */ }
    } catch (e) {
      // Message send failed
      addToast("Erreur: " + e.message, "error");
    }
    setSending(false);
  };

  const handBackToBot = async () => {
    if (!selectedConv) return;
    try {
      const {error} = await sb.from("conversations").update({status: "bot", escalated: false}).eq("id", selectedConv.id);
      if (error) { addToast("Erreur: " + error.message, "error"); return; }
      try { await sb.from("chatter_logs").insert({chatter_id: user.id, conversation_id: selectedConv.id, action: "hand_back_bot"}); } catch(e) { /* Chatter log write failed */ }
      addToast(fr ? "Conversation rendue au bot" : "Conversation handed back to bot", "success");
      setSelectedConv(null);
      setMessages([]);
      // Refresh conversations
      try {
        const {data} = await sb.from("conversations").select("*").in("model_id", myModelIds).order("updated_at", {ascending: false});
        setConversations(data || []);
      } catch(e) { /* Conversations refresh failed */ }
    } catch (e) {
      // Hand back to bot failed
      addToast("Erreur: " + e.message, "error");
    }
  };

  const getSpenderName = (conv) => {
    const sp = spenders.find(s => s.handle === conv.spender_handle || s.id === conv.spender_id);
    return sp?.first_name || sp?.handle || conv.spender_handle || "Spender";
  };

  return (
    <div>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u{1F4AC}"} {fr ? "Messagerie" : "Messaging"}</h2>
        <p style={{fontSize:12,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{fr ? "Conversations avec les spenders" : "Conversations with spenders"}</p>
      </div>

      {myModelIds.length === 0 && (
        <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr ? "Aucun modèle attribué" : "No models assigned"}</div>
      )}

      {loading && <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>Chargement...</div>}

      {!loading && myModelIds.length > 0 && conversations.length === 0 && (
        <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr ? "Aucune conversation" : "No conversations"}</div>
      )}

      {!loading && conversations.length > 0 && (
        <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:16,minHeight:500}}>
          {/* Conversation list */}
          <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:14,overflow:"hidden"}}>
            {conversations.map(conv => (
              <div key={conv.id} onClick={()=>selectConv(conv)} style={{padding:"14px 16px",borderBottom:"1px solid var(--border-subtle)",cursor:"pointer",background:selectedConv?.id===conv.id?"var(--accent-subtle)":"transparent",transition:"background 0.2s"}}>
                <div style={{fontSize:13,fontWeight:700}}>{getSpenderName(conv)}</div>
                <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{conv.last_message || "..."}</div>
                <div style={{fontSize:10,color:"var(--text-quaternary)",marginTop:2}}>{conv.updated_at ? fmtDate(conv.updated_at) : ""}</div>
              </div>
            ))}
          </div>

          {/* Chat area */}
          <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:14,display:"flex",flexDirection:"column"}}>
            {!selectedConv && (
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-quaternary)"}}>{fr ? "Sélectionne une conversation" : "Select a conversation"}</div>
            )}
            {selectedConv && (<>
              {/* Chat header */}
              <div style={{padding:"14px 20px",borderBottom:"1px solid var(--border-subtle)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:14,fontWeight:700}}>{getSpenderName(selectedConv)}</span>
                <button className="btn btn-small" onClick={handBackToBot}>{fr ? "Rendre au bot" : "Hand to bot"}</button>
              </div>
              {/* Messages */}
              <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:8}}>
                {messages.map(msg => (
                  <div key={msg.id} style={{alignSelf:msg.sender_type==="chatter"?"flex-end":"flex-start",maxWidth:"70%"}}>
                    <div style={{padding:"10px 14px",borderRadius:14,fontSize:13,background:msg.sender_type==="chatter"?"#3B82F6":"#2A2A3E",color:"#fff"}}>{msg.content}</div>
                    <div style={{fontSize:9,color:"var(--text-quaternary)",marginTop:2,textAlign:msg.sender_type==="chatter"?"right":"left"}}>{msg.created_at ? new Date(msg.created_at).toLocaleTimeString(fr?"fr-FR":"en-US",{hour:"2-digit",minute:"2-digit"}) : ""}</div>
                  </div>
                ))}
                {messages.length === 0 && <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:20}}>{fr ? "Aucun message" : "No messages"}</div>}
              </div>
              {/* Input */}
              <div style={{padding:14,borderTop:"1px solid var(--border-subtle)",display:"flex",gap:8}}>
                <textarea className="filter-select" style={{flex:1,resize:"none",minHeight:40,padding:"10px 12px"}} value={msgInput} onChange={e=>setMsgInput(e.target.value)} placeholder={fr ? "Écrire un message..." : "Write a message..."} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}} />
                <button className="btn btn-primary" onClick={sendMessage} disabled={sending} style={{alignSelf:"flex-end"}}>{sending ? React.createElement(Spinner) : (fr ? "Envoyer" : "Send")}</button>
              </div>
            </>)}
          </div>
        </div>
      )}
    </div>
  );
};
