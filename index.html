    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* ══════════════════════════════════════════════════════
       DESIGN SYSTEM V2 — CSS Custom Properties
       Ultra Dark Premium (Notion Dark × Linear × Vercel)
       ══════════════════════════════════════════════════════ */
    :root {
      /* — Backgrounds (6 levels, darkest → lightest) — */
      --bg-base: #09090b;
      --bg-raised: #0f0f12;
      --bg-overlay: #18181b;
      --bg-surface: #1e1e22;
      --bg-hover: #27272a;
      --bg-active: #303034;
      /* — Borders (4 levels) — */
      --border-subtle: rgba(255,255,255,0.06);
      --border-default: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.14);
      --border-accent: rgba(99,102,241,0.4);
      /* — Text (4 levels) — */
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --text-quaternary: #52525b;
      /* — Accent (Indigo) — */
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-muted: rgba(99,102,241,0.15);
      --accent-subtle: rgba(99,102,241,0.08);
      /* — Status colors — */
      --success: #34d399;
      --success-muted: rgba(52,211,153,0.15);
      --warning: #fbbf24;
      --warning-muted: rgba(251,191,36,0.15);
      --danger: #f87171;
      --danger-muted: rgba(248,113,113,0.15);
      --pink: #f472b6;
      --pink-muted: rgba(244,114,182,0.15);
      /* — Brand colors — */
      --brand-whatsapp: #25D366;
      --brand-whatsapp-muted: rgba(37,211,102,0.15);
      --brand-telegram: #0088cc;
      --brand-telegram-muted: rgba(0,136,204,0.15);
      --blue-accent: #60a5fa;
      --blue-accent-muted: rgba(96,165,250,0.15);
      --medal-silver: #c0c0c0;
      --medal-bronze: #cd7f32;
      /* — Semantic aliases — */
      --bg: var(--bg-base);
      --bg2: var(--bg-raised);
      --card: var(--bg-raised);
      --primary: #6366f1;
      --text: var(--text-primary);
      --text2: var(--text-secondary);
      --grad: linear-gradient(135deg, #818cf8, #6366f1);
      /* — Shadows — */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      /* — Radius — */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      /* — Sidebar — */
      --sidebar-bg: var(--bg-base);
      --sidebar-border: var(--border-subtle);
      --sidebar-btn-color: var(--text-tertiary);
      --sidebar-btn-hover-bg: var(--bg-hover);
      --sidebar-btn-hover-color: var(--text-primary);
      --sidebar-btn-active-bg: var(--accent-muted);
      --sidebar-btn-active-color: var(--accent);
      /* — Topbar — */
      --topbar-bg: var(--bg-base);
      --topbar-border: var(--border-subtle);
      /* — Card — */
      --card-bg: var(--bg-raised);
      --card-border: var(--border-default);
      --card-hover-border: var(--border-strong);
      /* — Table — */
      --table-header-bg: var(--bg-overlay);
      --table-header-color: var(--text-tertiary);
      --table-row-hover: var(--bg-overlay);
      --table-border: var(--border-subtle);
      /* — Modal — */
      --modal-backdrop: rgba(0,0,0,0.6);
      --modal-bg: var(--bg-raised);
      /* — Input — */
      --input-bg: var(--bg-overlay);
      --input-border: var(--border-default);
      --input-focus-border: var(--accent);
      --input-focus-ring: rgba(99,102,241,0.15);
      --input-color: var(--text-primary);
      /* — Filter Chip — */
      --chip-bg: transparent;
      --chip-border: var(--border-default);
      --chip-color: var(--text-secondary);
      --chip-active-bg: var(--accent-muted);
      --chip-active-border: var(--border-accent);
      --chip-active-color: var(--accent);
    }
    /* ====== LIGHT THEME ====== */
    [data-theme="light"] {
      --bg-base: #f8f9fa;
      --bg-raised: #ffffff;
      --bg-overlay: #f1f3f5;
      --bg-surface: #e9ecef;
      --bg-hover: #f1f3f5;
      --bg-active: #e9ecef;
      --border-subtle: rgba(0,0,0,0.06);
      --border-default: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.16);
      --border-accent: rgba(99,102,241,0.5);
      --text-primary: #111113;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --text-quaternary: #d1d5db;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-muted: rgba(99,102,241,0.1);
      --accent-subtle: rgba(99,102,241,0.05);
      --success: #059669;
      --success-muted: rgba(5,150,105,0.1);
      --warning: #d97706;
      --warning-muted: rgba(217,119,6,0.1);
      --danger: #dc2626;
      --danger-muted: rgba(220,38,38,0.1);
      --pink: #db2777;
      --pink-muted: rgba(219,39,119,0.1);
      --brand-whatsapp: #25D366;
      --brand-whatsapp-muted: rgba(37,211,102,0.15);
      --brand-telegram: #0088cc;
      --brand-telegram-muted: rgba(0,136,204,0.15);
      --blue-accent: #3b82f6;
      --blue-accent-muted: rgba(59,130,246,0.1);
      --medal-silver: #9ca3af;
      --medal-bronze: #b45309;
      --bg: var(--bg-base);
      --bg2: var(--bg-raised);
      --card: var(--bg-raised);
      --text: var(--text-primary);
      --text2: var(--text-secondary);
      --grad: linear-gradient(135deg, #6366f1, #4f46e5);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --sidebar-bg: var(--bg-raised);
      --sidebar-border: var(--border-subtle);
      --sidebar-btn-color: var(--text-secondary);
      --sidebar-btn-hover-bg: var(--bg-hover);
      --sidebar-btn-hover-color: var(--text-primary);
      --sidebar-btn-active-bg: var(--accent-muted);
      --sidebar-btn-active-color: var(--accent);
      --topbar-bg: rgba(255,255,255,0.95);
      --topbar-border: var(--border-subtle);
      --card-bg: var(--bg-raised);
      --card-border: var(--border-default);
      --card-hover-border: var(--border-strong);
      --table-header-bg: var(--bg-overlay);
      --table-header-color: var(--text-secondary);
      --table-row-hover: var(--bg-hover);
      --table-border: var(--border-subtle);
      --modal-backdrop: rgba(0,0,0,0.4);
      --modal-bg: var(--bg-raised);
      --input-bg: var(--bg-base);
      --input-border: var(--border-default);
      --input-focus-border: var(--accent);
      --input-focus-ring: rgba(99,102,241,0.12);
      --input-color: var(--text-primary);
      --chip-bg: var(--bg-overlay);
      --chip-border: var(--border-default);
      --chip-color: var(--text-secondary);
      --chip-active-bg: var(--accent-muted);
      --chip-active-border: var(--border-accent);
      --chip-active-color: var(--accent);
    }
    /* ====== TRANSITIONS (smooth theme switch) ====== */
    body, .sidebar, .topbar, .card, .kpi, .spender-card, .profile-panel, .ai-card, .form-input, .table th, .table td, .filter-chip, .filter-select, .filter-date, .info-box, .login-wrap, .login-card {
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }
    /* ====== TOAST NOTIFICATIONS ====== */
    .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { padding:12px 20px; border-radius:10px; color:white; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.3); animation:slideInToast 0.3s ease-out; pointer-events:auto; }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--accent); }
    @keyframes slideInToast { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    /* ====== CLICKABLE TAGS ====== */
    .tag-click { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); cursor:pointer; transition:all 0.15s; font-size:12px; font-weight:500; text-transform:uppercase; }
    .tag-click:hover { opacity:0.8; }
    .tag-spender { background:var(--pink-muted); color:var(--pink); }
    .tag-model { background:var(--accent-muted); color:var(--accent); }
    .tag-chatter { background:var(--success-muted); color:var(--success); }
    .tag-provider { background:var(--warning-muted); color:var(--warning); }
    /* ====== FADE-IN ANIMATION ====== */
    .fade-in { animation: fadeInTab 0.25s ease-out; }
    @keyframes fadeInTab { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    /* ====== SORTABLE TABLE HEADERS ====== */
    .sort-th { cursor:pointer; user-select:none; }
    .sort-th:hover { background:var(--accent-subtle); }
    .sort-arrow { font-size:10px; margin-left:3px; opacity:0.4; }
    .sort-arrow.active { opacity:1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-overlay); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      overflow: hidden;
    }
    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg-base);
      position: relative; overflow: hidden;
    }
    .login-orb {
      position: absolute; border-radius: 50%;
      filter: blur(40px); opacity: 0.1;
    }
    .login-orb-1 { width: 300px; height: 300px; background: var(--accent); top: -100px; left: -100px; }
    .login-orb-2 { width: 300px; height: 300px; background: var(--pink); bottom: -100px; right: -100px; }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg); padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: var(--shadow-lg);
      position: relative; z-index: 1;
    }
    .login-logo {
      width: 60px; height: 60px;
      background: var(--grad);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: bold;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.25);
    }
    .login-title {
      text-align: center; font-size: 24px; font-weight: 700;
      margin-bottom: 10px; color: var(--text-primary);
    }
    .login-subtitle {
      text-align: center; color: var(--text-secondary); font-size: 13px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase;
    }
    .form-input {
      width: 100%; padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--input-color);
      font-size: 13px;
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3px var(--input-focus-ring);
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(99,102,241,0.25);
    }
    .lang-toggle {
      position: absolute; top: 20px; right: 20px;
      background: var(--accent-subtle);
      border: 1px solid var(--border-default);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-toggle:hover { background: var(--accent-muted); }
    .app-wrap { display: flex; height: 100vh; }
    .sidebar {
      width: 72px; background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex; flex-direction: column;
      align-items: center;
      padding: 16px 0;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: var(--grad);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      margin-bottom: 32px;
      cursor: pointer;
    }
    .sidebar-nav {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 4px;
    }
    .sidebar-btn {
      width: 44px; height: 44px;
      border: none;
      background: transparent;
      color: var(--sidebar-btn-color);
      border-left: 2px solid transparent;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
    }
    .sidebar-btn:hover { color: var(--sidebar-btn-hover-color); background: var(--sidebar-btn-hover-bg); }
    .sidebar-btn.active {
      color: var(--sidebar-btn-active-color);
      border-left-color: var(--sidebar-btn-active-color);
      background: var(--sidebar-btn-active-bg);
    }
    .sidebar-footer {
      display: flex; flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .sidebar-footer button {
      width: 44px; height: 44px;
      border: none;
      background: transparent;
      color: var(--sidebar-btn-color);
      cursor: pointer;
      font-size: 20px;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
    }
    .sidebar-footer button:hover { color: var(--sidebar-btn-hover-color); background: var(--sidebar-btn-hover-bg); }
    .main-area {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-primary); }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .user-name { color: var(--accent); font-weight: 600; font-size: 14px; text-transform:uppercase; }
    .role-badge {
      background: var(--accent-muted);
      border: 1px solid var(--border-accent);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .section-title {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
      color: var(--text-primary);
    }
    .section-bar {
      width: 3px; height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }
    .filter-bar {
      display: flex; gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-chip {
      padding: 7px 14px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: var(--radius-sm);
      color: var(--chip-color);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--chip-active-bg);
      border-color: var(--chip-active-border);
      color: var(--chip-active-color);
    }
    .filter-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .filter-date {
      padding: 7px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--input-color);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-date:focus { outline: none; border-color: var(--input-focus-border); }
    .filter-select {
      padding: 7px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--input-color);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--input-focus-border); }
    .filter-select option { background: var(--bg-raised); color: var(--text-primary); text-transform:uppercase; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: all 0.2s;
    }
    .kpi:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .kpi-label {
      font-size: 11px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 0.8px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .kpi-sublabel { font-size: 12px; color: var(--success); margin-top: 6px; font-weight: 600; }
    .kpi.warning { border-color: var(--warning-muted); }
    .kpi.warning .kpi-value {
      color: var(--warning);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }
    .grid-55-45 {
      display: grid;
      grid-template-columns: 55% 45%;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: all 0.2s;
    }
    .spender-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      cursor: pointer;

      margin-bottom: 12px;

    .spender-card:hover {

    }
    .spender-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .spender-name { font-weight: 600; font-size: 14px; text-transform:uppercase; color: var(--text-primary); }
    .spender-ltv {

      font-weight: 700;
      color: var(--accent);
    }
    .spender-meta {

      gap: 12px;

      color: var(--text-secondary);
    }
    .spender-meta-item { display: flex; justify-content: space-between; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pending { background: var(--warning-muted); color: var(--warning); border: 1px solid transparent; }
    .badge-validated { background: var(--success-muted); color: var(--success); border: 1px solid transparent; }
    .badge-refused { background: var(--danger-muted); color: var(--danger); border: 1px solid transparent; }
    .badge-whale { background: var(--pink-muted); color: var(--pink); border: 1px solid transparent; }
    .badge-vip { background: var(--accent-muted); color: var(--accent); border: 1px solid transparent; }
    .badge-regular { background: var(--accent-muted); color: var(--accent); border: 1px solid transparent; }
    .badge-dormant { background: var(--bg-overlay); color: var(--text-tertiary); border: 1px solid transparent; }
    .badge-nouveau { background: var(--success-muted); color: var(--success); border: 1px solid transparent; }
    .badge-done { background: var(--success-muted); color: var(--success); border: 1px solid transparent; }
    .table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 13px; }
    .table th {
      padding: 10px 14px;
      text-align: left;
      font-size: 10px;

      color: var(--table-header-color);

      border-bottom: 1px solid var(--table-border);
    }
    .table td { border-bottom: none; padding: 10px 14px; color: var(--text-secondary); }
    .table tr:hover { background: var(--table-row-hover); }
    .table tr.pending-row { background: var(--warning-muted); }
    .table tr.pending-row:hover { background: rgba(251,191,36,0.1); }
    .table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; transition: color 0.15s; }
    .table th.sortable:hover { color: var(--accent); }
    .table th.sortable .sort-icon { font-size: 10px; margin-left: 3px; opacity: 0.3; }
    .table th.sortable.sort-active .sort-icon { opacity: 1; color: var(--accent); }
    .pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--border-subtle); margin-top: 8px; }
    .pagination-info { font-size: 11px; color: var(--text-tertiary); }
    .pagination-controls { display: flex; gap: 4px; align-items: center; }
    .pagination-btn { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-default); background: var(--accent-subtle); color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; line-height: 1; }
    .pagination-btn:hover:not(:disabled) { background: var(--accent-muted); border-color: var(--border-accent); }
    .pagination-btn:disabled { background: transparent; color: var(--text-quaternary); border-color: var(--border-subtle); cursor: default; }
    .pagination-page { padding: 5px 8px; font-size: 11px; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; }
    /* Inline button spinner */
    .btn-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
    /* Skeleton loading */
    @keyframes skeleton-pulse { 0%,100%{opacity:.06} 50%{opacity:.12} }
    .skeleton { background: var(--text-primary); border-radius: var(--radius-md); animation: skeleton-pulse 1.5s ease-in-out infinite; }
    .skeleton-card { height: 90px; }
    .skeleton-chart { height: 300px; margin-bottom: 24px; }
    .skeleton-row { height: 40px; margin-bottom: 6px; }
    /* Empty state */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; color: var(--text-quaternary); gap: 8px; }
    .empty-state-icon { font-size: 36px; opacity: 0.5; }
    .empty-state-text { font-size: 13px; font-weight: 600; }
    .empty-state-sub { font-size: 11px; color: var(--text-quaternary); }
    /* Confirm dialog */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .confirm-dialog { background: var(--bg-raised); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 28px 24px; max-width: 400px; width: 90%; box-shadow: var(--shadow-lg); }
    .confirm-dialog h3 { font-size: 16px; font-weight: 700; margin: 0 0 8px; color: var(--text-primary); }
    .confirm-dialog p { font-size: 13px; color: var(--text-secondary); margin: 0 0 24px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .field-error { color: var(--danger); font-size: 11px; margin-top: 4px; font-weight: 600; }
    .form-input.input-error, .filter-select.input-error { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(239,68,68,0.15); }
    .progress {
      width: 100%; height: 4px;
      background: var(--bg-overlay);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar { height: 100%; background: var(--accent); transition: width 0.3s; border-radius: 2px; }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin: 12px 0;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      background: var(--accent-subtle);
      border-radius: 3px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid var(--border-subtle);
    }
    .heatmap-cell.active { background: var(--accent); border-color: transparent; }
    .ai-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .ai-card:hover { border-color: var(--card-hover-border); box-shadow: var(--shadow-sm); }
    .ai-card-icon { font-size: 32px; margin-bottom: 8px; }
    .ai-card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--text-primary); }
    .ai-card-desc { font-size: 12px; color: var(--text-secondary); }
    .ai-result {
      background: var(--success-muted);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-top: 12px;
      color: var(--success);
      font-size: 12px;
      line-height: 1.5;
    }
    .ai-loading {
      display: inline-block; width: 8px; height: 8px;
      background: var(--success); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-backdrop);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { opacity: 0.9; }
    .btn-small { padding: 6px 12px; font-size: 11px; border-radius: var(--radius-sm); }
    .btn-edit {
      padding: 5px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--warning-muted);
      background: var(--warning-muted);
      color: var(--warning);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-edit:hover { background: rgba(251,191,36,0.2); }
    .podium {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 20px; margin-bottom: 32px; height: 200px;
    }
    .podium-step { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .podium-rank { font-size: 32px; margin-bottom: 8px; }
    .podium-bar {
      background: var(--accent); width: 80px;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: all 0.2s;
    }
    .podium-bar:hover { box-shadow: 0 0 16px rgba(99,102,241,0.3); }
    .podium-name { margin-top: 8px; font-weight: 600; font-size: 13px; text-transform:uppercase; color: var(--text-primary); }
    .podium-ca { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .trophy { font-size: 40px; text-align: center; margin-bottom: 24px; }
    .profile-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-height: 600px;
      overflow-y: auto;
    }
    .profile-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .profile-name { font-size: 18px; font-weight: 700; text-transform:uppercase; color: var(--text-primary); }
    .profile-close { background: none; border: none; color: var(--text-tertiary); font-size: 20px; cursor: pointer; }
    .profile-section { margin-bottom: 20px; }
    .profile-section-title {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;
    }
    .profile-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: var(--text-secondary); }
    .form-group-modal { margin-bottom: 16px; }
    .error-msg { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; }
    .loading-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-base); }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--accent-muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); } 50% { opacity: 0.6; transform: translateX(-50%) scale(1.1); } }
    @keyframes wave { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 8px rgba(251,191,36,0.3); } 50% { box-shadow: 0 0 20px rgba(251,191,36,0.6); } }
    .info-box { background: var(--accent-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
    /* ============================================= */
    /* TABLET (max 1200px)                           */
    /* ============================================= */
    @media (max-width: 1200px) {
      .grid-55-45 { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ============================================= */
    /* MOBILE — LARGE PHONES + SMALL TABLETS         */
    /* iPhone 16 Pro Max (430px), Galaxy S24 (412px) */
    /* ============================================= */
    @media (max-width: 768px) {
      /* --- GLOBAL RESET --- */
      html { font-size: 14px; }
      body { overflow: auto; -webkit-text-size-adjust: 100%; }
      * { -webkit-tap-highlight-color: transparent; }

      /* --- APP LAYOUT --- */
      .app-wrap { flex-direction: column; height: 100vh; height: 100dvh; }

      /* --- BOTTOM NAV BAR --- */
      .sidebar {
        position: fixed; bottom: 0; left: 0; right: 0;
        width: 100%; height: 60px;
        flex-direction: row; padding: 0; z-index: 100;
        border-right: none;
        border-top: 1px solid var(--border-default);
        background: var(--sidebar-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        justify-content: space-between;
        align-items: stretch;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar-logo { display: none; }
      .sidebar-nav {
        flex-direction: row;
        gap: 0;
        flex: 1;
        justify-content: space-evenly;
        align-items: center;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .sidebar-nav::-webkit-scrollbar { display: none; }
      .sidebar-btn {
        width: 48px; height: 48px;
        min-width: 48px;
        font-size: 20px;
        border-left: none;
        border-radius: 10px;
        border-bottom: 2px solid transparent;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.15s ease;
      }
      .sidebar-btn:active { transform: scale(0.92); background: var(--accent-muted); }
      .sidebar-btn.active {
        border-left-color: transparent;
        border-bottom-color: var(--accent);
        background: var(--sidebar-btn-active-bg);
      }
      .sidebar-footer {
        flex-direction: row;
        gap: 0;
        padding: 0 4px;
        align-items: center;
      }
      .sidebar-footer button {
        width: 40px; height: 40px;
        min-width: 40px;
        font-size: 16px;
        border-radius: 8px;
      }
      .sidebar-footer button:active { transform: scale(0.9); }

      /* --- MAIN AREA --- */
      .main-area {
        padding-bottom: 60px;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
      }

      /* --- TOPBAR (STICKY) --- */
      .topbar {
        height: 48px;
        padding: 0 12px;
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--topbar-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        flex-shrink: 0;
      }
      .topbar-left { font-size: 13px; gap: 6px; }
      .topbar-left span:first-child { font-size: 16px; }
      .topbar-right { gap: 6px; }
      .user-name { font-size: 11px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .role-badge { font-size: 9px; padding: 2px 6px; }

      /* --- CONTENT AREA --- */
      .content {
        padding: 12px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* --- KPI CARDS (2x2 grid) --- */
      .kpi-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .kpi {
        padding: 10px;
        border-radius: 10px;
      }
      .kpi-label { font-size: 9px; margin-bottom: 3px; letter-spacing: 0.3px; }
      .kpi-value { font-size: 18px; line-height: 1.2; }
      .kpi-sublabel { font-size: 9px; margin-top: 3px; }

      /* --- GRIDS → SINGLE COLUMN --- */
      .grid-2 { grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
      .grid-55-45 { grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }

      /* --- FILTER BAR (horizontal scroll) --- */
      .filter-bar {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 6px;
        scrollbar-width: none;
        flex-wrap: nowrap;
      }
      .filter-bar::-webkit-scrollbar { display: none; }
      .filter-chip {
        padding: 8px 12px;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
        min-height: 36px;
        display: flex; align-items: center;
      }
      .filter-chip:active { transform: scale(0.95); }
      .filter-date {
        padding: 8px 10px;
        font-size: 12px;
        min-width: 130px;
        flex-shrink: 0;
        min-height: 36px;
      }
      .filter-select {
        padding: 8px 10px;
        font-size: 12px;
        flex-shrink: 0;
        min-height: 36px;
        max-width: 160px;
      }

      /* --- TABLES (horizontal scroll wrapper) --- */
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin: 0 -12px;
        padding: 0 12px 8px;
        scrollbar-width: none;
      }
      .table-wrap::-webkit-scrollbar { display: none; }
      .table { font-size: 11px; min-width: 520px; }
      .table th {
        padding: 10px 8px;
        font-size: 9px;
        letter-spacing: 0.3px;
        white-space: nowrap;
        position: sticky;
        top: 0;
        background: var(--table-header-bg);
        z-index: 2;
      }
      .table td {
        padding: 10px 8px;
        white-space: nowrap;
      }

      /* --- CARDS --- */
      .card {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .section-title { font-size: 13px; margin-bottom: 10px; }
      .section-bar { width: 3px; height: 16px; }

      /* --- SPENDER CARDS (touch-friendly) --- */
      .spender-card {
        padding: 12px;
        margin-bottom: 8px;
        min-height: 60px;
      }
      .spender-card:active { transform: scale(0.98); background: var(--bg-hover); }
      .spender-name { font-size: 13px; }
      .spender-ltv { font-size: 15px; }
      .spender-meta { font-size: 11px; gap: 8px; }

      /* --- PROFILE PANEL (full width on mobile) --- */
      .profile-panel {
        max-height: none;
        border-radius: 10px;
        margin-top: 10px;
      }
      .profile-header { margin-bottom: 12px; padding-bottom: 10px; }
      .profile-name { font-size: 16px; }
      .profile-close {
        font-size: 24px;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
      }
      .profile-section { margin-bottom: 14px; }
      .profile-section-title { font-size: 10px; margin-bottom: 6px; }
      .profile-row { padding: 6px 0; font-size: 12px; }

      /* --- PODIUM --- */
      .podium { height: 130px; gap: 10px; margin-bottom: 20px; }
      .podium-step { min-width: 70px; }
      .podium-bar { width: 56px; border-radius: 6px 6px 0 0; }
      .podium-rank { font-size: 22px; margin-bottom: 4px; }
      .podium-name { font-size: 11px; margin-top: 6px; }
      .podium-ca { font-size: 10px; }
      .trophy { font-size: 32px; margin-bottom: 16px; }

      /* --- LOGIN (full mobile) --- */
      .login-wrap { padding: 16px; }
      .login-card {
        padding: 24px 20px;
        margin: 0;
        max-width: 100%;
        border-radius: 12px;
      }
      .login-logo { width: 50px; height: 50px; font-size: 22px; margin-bottom: 16px; }
      .login-title { font-size: 20px; margin-bottom: 6px; }
      .login-subtitle { font-size: 12px; margin-bottom: 20px; }
      .lang-toggle { top: 12px; right: 12px; padding: 5px 10px; font-size: 11px; }

      /* --- FORMS (touch inputs) --- */
      .form-group { margin-bottom: 12px; }
      .form-label { font-size: 11px; margin-bottom: 5px; }
      .form-input {
        padding: 12px;
        font-size: 16px; /* prevents iOS zoom on focus */
        border-radius: 10px;
        min-height: 44px;
      }
      .form-group-modal { margin-bottom: 12px; }

      /* --- BUTTONS (thumb-friendly 48px touch targets) --- */
      .btn {
        padding: 12px 16px;
        font-size: 14px;
        min-height: 48px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary { border-radius: 10px; }
      .btn-small {
        padding: 10px 14px;
        font-size: 12px;
        min-height: 40px;
        border-radius: 8px;
      }
      .btn-success, .btn-danger { min-height: 44px; }

      /* --- FORM CREATE GRID → 1 column on mobile --- */
      .form-grid-mobile {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }

      /* --- AI CARDS --- */
      .ai-card {
        padding: 14px;
        min-height: 80px;
      }
      .ai-card:active { transform: scale(0.97); }
      .ai-card-icon { font-size: 26px; margin-bottom: 6px; }
      .ai-card-title { font-size: 13px; }
      .ai-card-desc { font-size: 11px; }
      .ai-result { padding: 10px; font-size: 11px; }

      /* --- HEATMAP --- */
      .heatmap-grid { gap: 3px; margin: 8px 0; }
      .heatmap-cell { font-size: 9px; border-radius: 3px; }

      /* --- PROGRESS BARS --- */
      .progress { height: 8px; border-radius: 4px; margin-top: 6px; }

      /* --- INFO BOX --- */
      .info-box { font-size: 11px; padding: 10px; border-radius: 8px; line-height: 1.5; }

      /* --- BADGES --- */
      .badge { font-size: 10px; padding: 3px 6px; }

      /* --- MODAL (slide-up on mobile) --- */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      /* --- FAB BUTTON (floating action) --- */
      .fab-btn {
        position: fixed;
        bottom: 76px;
        right: 16px;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--grad);
        border: none;
        color: white;
        font-size: 22px;
        box-shadow: 0 4px 20px rgba(99,102,241,0.5);
        z-index: 90;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .fab-btn:active { transform: scale(0.9); box-shadow: 0 2px 10px rgba(99,102,241,0.6); }

      /* --- CHECKBOX GROUP (admin model assignment) --- */
      .checkbox-group { gap: 6px; flex-wrap: wrap; }
      .checkbox-item {
        padding: 6px 10px;
        font-size: 12px;
        min-height: 36px;
        display: flex; align-items: center;

// safeInsertTx: ULTRA-BULLETPROOF transaction insert with try-catch at EVERY level
const safeInsertTx = async (txData) => {
  // Level 1: try full insert
  try {
    const res = await sb.from("transactions").insert(txData).select();
    if (!res.error) { return res; }
  } catch(e) { /* L1 fallback */ }

  // Level 2: strip optional columns (currency, product, tag)
  try {
    const l2 = {...txData};
    delete l2.currency; delete l2.product; delete l2.tag;
    const res = await sb.from("transactions").insert(l2).select();
    if (!res.error) { return res; }
  } catch(e) { /* L2 fallback */ }

  // Level 3: strip ALL FK columns
  try {
    const l3 = {
      date: txData.date,
      spender_handle: txData.spender_handle,
      amount: txData.amount,
      status: txData.status || "pending",
      notes: txData.notes || null,
    };
    const res = await sb.from("transactions").insert(l3).select();
    if (!res.error) { return res; }
  } catch(e) { /* L3 fallback */ }

  // Level 4: absolute minimum — only required columns
  try {
    const res = await sb.from("transactions").insert({
      date: txData.date || new Date().toISOString(),
      spender_handle: txData.spender_handle || "unknown",
      amount: parseFloat(txData.amount) || 0,
      status: "pending",
    }).select();
    if (!res.error) { return res; }
    return res;
  } catch(e) {
    return { data: null, error: { message: "All 4 insert levels failed: " + e.message } };
  }
};

};

    if(this.state.hasError) {
      return React.createElement("div", {style:{padding:40,textAlign:"center",color:"var(--danger)"}},
        React.createElement("h2", null, "Erreur"),
        React.createElement("p", null, String(this.state.error)),
        React.createElement("button", {onClick:()=>this.setState({hasError:false}),className:"btn btn-primary",style:{marginTop:20,width:"auto"}}, "Recharger")
      );
    }
    return this.props.children;
  }
}

// Legacy sortable hook (used by drill-down detail views)
const useSortable = (defaultKey="date", defaultDir="desc") => {
  const [sort, setSort] = useState({key:defaultKey, dir:defaultDir});
  const onSort = (keyOrObj) => {
    if (typeof keyOrObj === "object" && keyOrObj !== null && "key" in keyOrObj) {
      setSort(keyOrObj);
    } else {
      setSort(prev=>({key:keyOrObj, dir:prev.key===keyOrObj&&prev.dir==="desc"?"asc":"desc"}));
    }
  };
  const doSort = (data, getters={}) => {
    return [...data].sort((a,b)=>{
      const g = getters[sort.key]||(x=>x[sort.key]);
      const va=g(a), vb=g(b);
      const cmp = typeof va==="string"? (va||"").localeCompare(vb||"") : (Number(va)||0)-(Number(vb)||0);
      return sort.dir==="asc"?cmp:-cmp;
    });
  };
  return {sort, onSort, doSort};
};

const MiniCalendar = ({lang, selected, onSelect, onClose, refEl}) => {
  const [viewDate, setViewDate] = useState(()=>selected?new Date(selected):new Date());
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const firstDay = new Date(year,month,1).getDay();
  const monthNames = lang==="fr"
    ?["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Aoû","Sep","Oct","Nov","Déc"]
    :["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayNames = lang==="fr"?["Lu","Ma","Me","Je","Ve","Sa","Di"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const prevMonth = () => setViewDate(new Date(year,month-1,1));
  const nextMonth = () => setViewDate(new Date(year,month+1,1));
  const _now = new Date();
  const today = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,"0")}-${String(_now.getDate()).padStart(2,"0")}`;
  // Adjust firstDay for Monday start (0=Mon..6=Sun)
  const startOffset = (firstDay+6)%7;
  const days = [];
  for(let i=0;i<startOffset;i++) days.push(null);
  for(let d=1;d<=daysInMonth;d++) days.push(d);

  return (
    <div style={{position:"absolute",top:"100%",left:0,zIndex:999,background:"var(--bg2)",border:"1px solid var(--border-accent)",borderRadius:12,padding:12,boxShadow:"var(--shadow-lg)",minWidth:260,marginTop:4}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",color:"var(--accent)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>‹</button>
        <span style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{monthNames[month]} {year}</span>
        <button onClick={nextMonth} style={{background:"none",border:"none",color:"var(--accent)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,textAlign:"center"}}>
        {dayNames.map(d=><div key={d} style={{fontSize:10,fontWeight:600,color:"var(--text2)",padding:4}}>{d}</div>)}
        {days.map((d,i)=>{
          if(!d) return <div key={`e${i}`}></div>;
          const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const isSelected = dateStr===selected;
          const isToday = dateStr===today;
          return (
            <div key={i} onClick={()=>{onSelect(dateStr);onClose();}}
              style={{padding:"6px 2px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:isSelected||isToday?700:400,
                background:isSelected?"var(--accent)":isToday?"var(--accent-muted)":"transparent",
                color:isSelected?"var(--text-primary)":isToday?"var(--accent)":"var(--text)",
                transition:"all 0.15s"}}>
              {d}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
        <button onClick={()=>{onSelect(today);onClose();}} style={{fontSize:11,color:"var(--accent)",background:"none",border:"none",cursor:"pointer",fontWeight:600}}>
          {lang==="fr"?"Aujourd'hui":"Today"}
        </button>
        <button onClick={()=>{onSelect("");onClose();}} style={{fontSize:11,color:"var(--text2)",background:"none",border:"none",cursor:"pointer"}}>
          {lang==="fr"?"Effacer":"Clear"}
        </button>
      </div>
    </div>
  );
};

const DateRangeFilter = ({lang, startDate, endDate, setStartDate, setEndDate, activePreset, setActivePreset}) => {
  const [showCalStart, setShowCalStart] = useState(false);
  const [showCalEnd, setShowCalEnd] = useState(false);
  const calRef = useRef(null);

  // Close calendars on outside click
  useEffect(()=>{
    const handler = (e) => {
      if(calRef.current && !calRef.current.contains(e.target)) {
        setShowCalStart(false);
        setShowCalEnd(false);
      }
    };
    document.addEventListener("mousedown", handler);
    return ()=>document.removeEventListener("mousedown", handler);
  },[]);

  const presets = [
    {id:"today",label:t(lang,"today")||"Aujourd'hui"},
    {id:"7d",label:"7j"},
    {id:"30d",label:"30j"},
    {id:"this_month",label:t(lang,"this_month")||"Ce mois"},
    {id:"last_month",label:t(lang,"last_month")||"Mois dernier"},
    {id:"all",label:t(lang,"all_time")||"Tout"},
  ];
  const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const applyPreset = (id) => {
    const now = new Date();
    let s, e;
    if(id==="today"){ s=new Date(now.getFullYear(),now.getMonth(),now.getDate()); e=new Date(s); }
    else if(id==="7d"){ s=new Date(now.getTime()-7*24*60*60*1000); e=new Date(now); }
    else if(id==="30d"){ s=new Date(now.getTime()-30*24*60*60*1000); e=new Date(now); }
    else if(id==="this_month"){ s=new Date(now.getFullYear(),now.getMonth(),1); e=new Date(now); }
    else if(id==="last_month"){ s=new Date(now.getFullYear(),now.getMonth()-1,1); e=new Date(now.getFullYear(),now.getMonth(),0); }
    else { s=null; e=null; }
    setStartDate(s?localDateStr(s):"");
    setEndDate(e?localDateStr(e):"");
    setActivePreset(id);
    setShowCalStart(false);
    setShowCalEnd(false);
  };

  const fmtDisplay = (d) => {
    if(!d) return lang==="fr"?"Début":"Start";
    const dt = new Date(d);
    const day = dt.toLocaleDateString(lang==="fr"?"fr-FR":"en-US",{day:"numeric",month:"short", timeZone: _tz.current});
    return day;
  };
  const fmtDisplayEnd = (d) => {
    if(!d) return lang==="fr"?"Fin":"End";
    const dt = new Date(d);
    return dt.toLocaleDateString(lang==="fr"?"fr-FR":"en-US",{day:"numeric",month:"short", timeZone: _tz.current});
  };

  return (
    <div className="filter-bar" style={{marginBottom:16}} ref={calRef}>
      {presets.map(p=>(
        <button key={p.id} className={`filter-chip ${activePreset===p.id?"active":""}`} onClick={()=>applyPreset(p.id)}>{p.label}</button>
      ))}
      <div style={{position:"relative",display:"inline-block"}}>
        <button onClick={()=>{setShowCalStart(!showCalStart);setShowCalEnd(false);}}
          style={{background:"var(--accent-subtle)",border:"1px solid var(--accent-muted)",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:startDate?"var(--text)":"var(--text2)",fontSize:12,fontWeight:startDate?600:400,display:"flex",alignItems:"center",gap:4}}>
          📅 {fmtDisplay(startDate)}
        </button>
        {showCalStart && <MiniCalendar lang={lang} selected={startDate} onSelect={(d)=>{setStartDate(d);setActivePreset("");}} onClose={()=>setShowCalStart(false)} />}
      </div>
      <span style={{color:"var(--text2)",fontSize:14,fontWeight:600}}>→</span>
      <div style={{position:"relative",display:"inline-block"}}>
        <button onClick={()=>{setShowCalEnd(!showCalEnd);setShowCalStart(false);}}
          style={{background:"var(--accent-subtle)",border:"1px solid var(--accent-muted)",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:endDate?"var(--text)":"var(--text2)",fontSize:12,fontWeight:endDate?600:400,display:"flex",alignItems:"center",gap:4}}>

      </div>

};
const useDateRange = (defaultPreset="30d") => {
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [activePreset, setActivePreset] = useState(defaultPreset);
  useEffect(()=>{
    const now = new Date();
    let s;
    if(defaultPreset==="7d") s=new Date(now.getTime()-7*24*60*60*1000);
    else if(defaultPreset==="30d") s=new Date(now.getTime()-30*24*60*60*1000);
    else return;
    const ld = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    setStartDate(ld(s));
    setEndDate(ld(now));
  },[]);
  const filterByDate = (data, dateField="date") => {
    if(activePreset==="all"&&!startDate&&!endDate) return data;
    return data.filter(item=>{
      if(!item[dateField]) return false;
      const d = new Date(item[dateField]);
      if(startDate) {
        const [sy,sm,sd] = startDate.split("-").map(Number);
        if(d < new Date(sy, sm-1, sd, 0, 0, 0, 0)) return false;
      }
      if(endDate) {
        const [ey,em,ed] = endDate.split("-").map(Number);
        if(d > new Date(ey, em-1, ed, 23, 59, 59, 999)) return false;
      }
      return true;
    });
  };
  return {startDate, endDate, setStartDate, setEndDate, activePreset, setActivePreset, filterByDate};
};

const Pagination = ({currentPage, setPage, totalItems, pageSize = PAGE_SIZE, lang = "fr"}) => {
  if (totalItems <= pageSize) return null;
  const totalPages = Math.ceil(totalItems / pageSize);
  const from = currentPage * pageSize + 1;
  const to = Math.min((currentPage + 1) * pageSize, totalItems);
  const fr = lang === "fr";
  return (
    <div className="pagination-bar">
      <span className="pagination-info">
        {fr ? `Résultats ${from} à ${to} sur ${totalItems} total` : `Results ${from} to ${to} of ${totalItems} total`}
      </span>
      <div className="pagination-controls">
        <button className="pagination-btn" disabled={currentPage===0} onClick={()=>setPage(0)} title={fr?"Première page":"First page"}>«</button>
        <button className="pagination-btn" disabled={currentPage===0} onClick={()=>setPage(p=>Math.max(0,p-1))} title={fr?"Page précédente":"Previous page"}>‹</button>
        <span className="pagination-page">{currentPage+1} / {totalPages}</span>
        <button className="pagination-btn" disabled={currentPage>=totalPages-1} onClick={()=>setPage(p=>Math.min(totalPages-1,p+1))} title={fr?"Page suivante":"Next page"}>›</button>
        <button className="pagination-btn" disabled={currentPage>=totalPages-1} onClick={()=>setPage(totalPages-1)} title={fr?"Dernière page":"Last page"}>»</button>
      </div>
    </div>
  );
};

const SortTh = ({label, sortKey, sort, onSort, style, children}) => {
  const active = sort && sort.key === sortKey;
  const dir = active ? sort.dir : null;
  const handleClick = () => {
    if (!active) onSort({key: sortKey, dir: "asc"});
    else if (dir === "asc") onSort({key: sortKey, dir: "desc"});
    else onSort({key: null, dir: null});
  };
  return (
    <th className={`sortable${active?" sort-active":""}`} style={style} onClick={handleClick}>
      {label || children}
      <span className="sort-icon">{dir === "asc" ? "↑" : dir === "desc" ? "↓" : "↕"}</span>
    </th>
  );
};

const sortData = (data, sort, getters = {}) => {
  if (!sort || !sort.key || !sort.dir) return data;
  const getter = getters[sort.key] || (item => item[sort.key]);
  return [...data].sort((a, b) => {
    let va = getter(a), vb = getter(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    // Date strings
    if (typeof va === "string" && typeof vb === "string" && /^\d{4}-\d{2}/.test(va) && /^\d{4}-\d{2}/.test(vb)) {
      return sort.dir === "asc" ? new Date(va) - new Date(vb) : new Date(vb) - new Date(va);
    }
    // Numbers
    if (typeof va === "number" && typeof vb === "number") {
      return sort.dir === "asc" ? va - vb : vb - va;
    }
    // Strings
    va = String(va).toLowerCase();
    vb = String(vb).toLowerCase();
    return sort.dir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
  });
};

const paginate = (data, page, pageSize = PAGE_SIZE) => data.slice(page * pageSize, (page + 1) * pageSize);

const useDebounce = (value, delay = 300) => {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(timer);
  }, [value, delay]);
  return debounced;
};

  if(validated.length>=50) badges.push({icon:"⭐",label:"50 TX"});
  if(validated.length>=100) badges.push({icon:"💎",label:"100 TX"});
  const totalCA = validated.reduce((s,tx)=>s+Number(tx.amount),0);
  if(totalCA>=1000) badges.push({icon:"🚀",label:"1K€"});
  if(totalCA>=5000) badges.push({icon:"🔥",label:"5K€"});
  if(totalCA>=10000) badges.push({icon:"👑",label:"10K€"});
  const dates = [...new Set(validated.map(tx=>tx.date?.split("T")[0]).filter(Boolean))].sort().reverse();
  let streak = 0;
  const today = new Date();
  for(let i=0;i<dates.length;i++){
    const expected = new Date(today);
    expected.setDate(expected.getDate()-i);
    const expStr = `${expected.getFullYear()}-${String(expected.getMonth()+1).padStart(2,"0")}-${String(expected.getDate()).padStart(2,"0")}`;
    if(dates[i]===expStr) streak++;
    else break;
  }
  if(streak>=3) badges.push({icon:"🔥",label:`${streak}j streak`});
  if(streak>=7) badges.push({icon:"💪",label:"7j streak!"});
  return {badges, streak};
};

// =============================================
// SPENDER PROFILE ENGINE (computed from transactions)
// =============================================
const computeSpenderProfile = (handle, txs, models, profiles, spenders) => {
  const sTxs = txs.filter(tx=>tx.spender_handle===handle).sort((a,b)=>new Date(b.date)-new Date(a.date));
  // Also find spender record for OFM metadata (resume, info, contenu, tw)
  const spenderRecord = (spenders||[]).find(s=>(s.handle||s.name||"").toLowerCase()===handle.toLowerCase());
  if(sTxs.length===0 && !spenderRecord) return null;
  const now = new Date();
  const ltv = sTxs.reduce((s,tx)=>s+Number(tx.amount),0);
  const validatedCA = sTxs.filter(tx=>tx.status==="validated").reduce((s,tx)=>s+Number(tx.amount),0);
  const pendingCA = sTxs.filter(tx=>tx.status==="pending").reduce((s,tx)=>s+Number(tx.amount),0);
  const cnt = sTxs.length;
  const aov = ltv/cnt;
  const maxTicket = Math.max(...sTxs.map(tx=>Number(tx.amount)));
  const lastPurchase = sTxs[0]?.date;
  const firstPurchase = sTxs[sTxs.length-1]?.date;
  const recencyDays = lastPurchase ? Math.floor((now-new Date(lastPurchase))/(86400000)) : 999;

  // 7d/30d/90d splits
  const d7 = new Date(now.getTime()-7*86400000);
  const d30 = new Date(now.getTime()-30*86400000);
  const d90 = new Date(now.getTime()-90*86400000);
  const ca7d = sTxs.filter(tx=>new Date(tx.date)>=d7).reduce((s,tx)=>s+Number(tx.amount),0);
  const ca30d = sTxs.filter(tx=>new Date(tx.date)>=d30).reduce((s,tx)=>s+Number(tx.amount),0);
  const ca90d = sTxs.filter(tx=>new Date(tx.date)>=d90).reduce((s,tx)=>s+Number(tx.amount),0);

  // Trend 30d vs previous 30d
  const d60 = new Date(now.getTime()-60*86400000);
  const caPrev30d = sTxs.filter(tx=>{const d=new Date(tx.date);return d>=d60&&d<d30;}).reduce((s,tx)=>s+Number(tx.amount),0);
  const trend = caPrev30d>0 ? ((ca30d-caPrev30d)/caPrev30d*100).toFixed(0) : ca30d>0?"new":0;

  // Top models (rank + montant)
  const modelMap = {};
  sTxs.forEach(tx=>{
    if(!tx.model_id) return;
    if(!modelMap[tx.model_id]) modelMap[tx.model_id]={id:tx.model_id, ca:0, cnt:0};
    modelMap[tx.model_id].ca += Number(tx.amount);
    modelMap[tx.model_id].cnt++;
  });
  const topModels = Object.values(modelMap).map(m=>({...m, name:models.find(x=>x.id===m.id)?.name||"?", pct:ltv>0?((m.ca/ltv)*100):0})).sort((a,b)=>b.ca-a.ca);

  // Top content types
  const typeMap = {};
  sTxs.forEach(tx=>{
    const tp = tx.type||tx.product||tx.tag||"autre";
    if(!typeMap[tp]) typeMap[tp]={type:tp, ca:0, cnt:0};
    typeMap[tp].ca += Number(tx.amount);
    typeMap[tp].cnt++;
  });
  const topTypes = Object.values(typeMap).sort((a,b)=>b.ca-a.ca);

  // Time-of-day pattern (hour buckets)
  const hourMap = {};
  sTxs.forEach(tx=>{
    if(!tx.date) return;
    const h = new Date(tx.date).getHours();
    hourMap[h] = (hourMap[h]||0) + 1;
  });

  // Day-of-week pattern
  const dayMap = {};
  sTxs.forEach(tx=>{
    if(!tx.date) return;
    const d = new Date(tx.date).getDay();
    dayMap[d] = (dayMap[d]||0) + 1;
  });

  // Purchase cadence (avg days between purchases)
  const dates = sTxs.map(tx=>new Date(tx.date).getTime()).sort((a,b)=>a-b);
  let cadence = 0;
  if(dates.length>1){
    const gaps = [];
    for(let i=1;i<dates.length;i++) gaps.push((dates[i]-dates[i-1])/86400000);
    cadence = gaps.reduce((s,g)=>s+g,0)/gaps.length;
  }

  // Segment + tags
  const segment = getSpenderSegment(ltv);
  const tags = [segment];
  if(ltv>2000) tags.push("whale");
  if(recencyDays>30) tags.push("cold");
  else if(recencyDays<=3) tags.push("hot");
  if(ca7d>ca30d*0.7 && ca30d>0) tags.push("accelerating");
  if(trend<-30) tags.push("declining");
  if(cnt>=10) tags.push("loyal");

  // Next best action
  let nextAction = "";
  if(recencyDays>14) nextAction = "relance";
  else if(ltv>1000 && topModels.length===1) nextAction = "upsell (nouveau modèle)";
  else if(ltv>500 && recencyDays<=3) nextAction = "VIP handling";
  else if(cnt===1) nextAction = "follow-up 1st purchase";
  else nextAction = "maintenir engagement";

  // OFM metadata from spender record
  const resume = spenderRecord?.resume || "";
  const prenom = spenderRecord?.prenom || "?";
  const age = spenderRecord?.age || "?";
  const metier = spenderRecord?.metier || "?";
  const contenu = spenderRecord?.contenu || "";
  const isTW = spenderRecord?.is_timewaster || false;
  const telegramId = spenderRecord?.telegram_id || "";
  if(isTW && !tags.includes("timewaster")) tags.push("timewaster");

  return {
    handle, ltv, validatedCA, pendingCA, cnt, aov, maxTicket,
    lastPurchase, firstPurchase, recencyDays,
    ca7d, ca30d, ca90d, trend, caPrev30d,
    topModels, topTypes, hourMap, dayMap, cadence,
    segment, tags, nextAction,
    txs: sTxs,
    // OFM metadata
    resume, prenom, age, metier, contenu, isTW, telegramId,
  };
};

        </div>
      </div>

          {p.nextAction.includes("follow-up") && (fr?"Premier achat. Engager la conversation pour fidéliser.":"First purchase. Engage to build loyalty.")}
          {p.nextAction.includes("maintenir") && (fr?"Spender régulier. Continuer le bon travail.":"Regular spender. Keep it up.")}

      </div>

        </div>

// =============================================
// TONIGHT RULES — deterministic helpers
// =============================================
const _hashStr = (str) => {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return Math.abs(h);
};
const tonightDate = (txId) => {
  const h = _hashStr(txId);
  const day = 13 + (h % 7);
  const hour = h % 24;
  const min = (h >>> 5) % 60;
  return `2026-02-${String(day).padStart(2,"0")}T${String(hour).padStart(2,"0")}:${String(min).padStart(2,"0")}:00.000Z`;
};
const tonightStatus = (txId, idx, total) => {
  // Exactly 2 pending — the 2 txs with highest hash are pending
  const h = _hashStr(txId + "_status");
  // We'll mark pending if idx is one of the 2 "chosen" positions (deterministic)
  if (total <= 2) return "pending";
  const pos1 = _hashStr("pending_slot_0") % total;
  const pos2 = (_hashStr("pending_slot_1") % (total - 1));
  const slot2 = pos2 >= pos1 ? pos2 + 1 : pos2;
  return (idx === pos1 || idx === slot2) ? "pending" : "validated";
};

const q_spender_transactions = (spender) => spender ? spender.txList.sort((a,b) => (b.txDate||"").localeCompare(a.txDate||"")) : [];
const q_spender_kpis = (spender) => {

const XP_LEVELS = [
  { name: "Rookie",  icon: "\u{1F331}", min: 0,     color: "#94a3b8" },
  { name: "Hustler", icon: "\u{1F4AA}", min: 1000,  color: "var(--success)" },
  { name: "Closer",  icon: "\u{1F3AF}", min: 5000,  color: "var(--accent)" },
  { name: "Elite",   icon: "\u26A1",    min: 15000, color: "var(--warning)" },
  { name: "Legend",  icon: "\u{1F451}", min: 50000, color: "var(--pink)" },
];
const getLevel = (xp) => {
  let level = XP_LEVELS[0];
  for (const l of XP_LEVELS) { if (xp >= l.min) level = l; }
  const idx = XP_LEVELS.indexOf(level);
  const next = XP_LEVELS[idx + 1] || null;
  const progress = next ? Math.min(100, ((xp - level.min) / (next.min - level.min)) * 100) : 100;
  return { ...level, xp, progress, nextLevel: next };
};
const calculateXP = (chatterId, txs, convertAmount) => {
  return txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee"))
    .reduce((s, tx) => s + Math.round(convertAmount(Number(tx.amount), tx.currency)), 0);
};
const calculateStreak = (chatterId, txs) => {
  const dates = txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee"))
    .map(tx => new Date(tx.date).toISOString().slice(0, 10))
    .filter((v, i, a) => a.indexOf(v) === i)
    .sort().reverse();
  if (!dates.length) return 0;
  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (dates[0] !== today && dates[0] !== yesterday) return 0;
  let streak = 1;
  for (let i = 0; i < dates.length - 1; i++) {
    const diff = (new Date(dates[i]) - new Date(dates[i + 1])) / 86400000;
    if (diff === 1) streak++; else break;
  }
  return streak;
};
const STREAK_BADGES = [
  { min: 7,  name: "On Fire",     icon: "\u{1F525}", color: "var(--warning)" },
  { min: 14, name: "Unstoppable", icon: "\u26A1",    color: "var(--accent)" },
  { min: 30, name: "Machine",     icon: "\u{1F916}", color: "var(--pink)" },
];
const getStreakBadges = (streak) => STREAK_BADGES.filter(b => streak >= b.min);

const getDailyProgress = (chatterId, txs, convertAmount) => {
  const today = new Date().toISOString().slice(0, 10);
  return txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee") && tx.date && tx.date.startsWith(today))
    .reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
};
const getWeeklyProgress = (chatterId, txs, convertAmount) => {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  return txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee") && new Date(tx.date) >= monday)
    .reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
};

const AgencyHealthScore = ({txs, profiles}) => {
  const score = useMemo(() => {
    let s = 100;
    const now = Date.now();
    const pendingOld = txs.filter(tx => tx.status === "pending" && (now - new Date(tx.date).getTime()) > 24 * 3600000);
    s -= Math.min(pendingOld.length * 2, 20);
    const decided = txs.filter(tx => tx.status !== "pending");
    const validated = txs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
    const convRate = decided.length > 0 ? (validated.length / decided.length) * 100 : 100;
    if (convRate < 60) s -= 15; else if (convRate < 75) s -= 5;
    const chatters = profiles.filter(p => p.role === "chatter");
    const weekAgo = now - 7 * 86400000;
    const inactiveChatters = chatters.filter(ch => !txs.some(tx => tx.chatter_id === ch.id && new Date(tx.date).getTime() > weekAgo));
    s -= Math.min(inactiveChatters.length * 5, 15);
    return Math.max(0, Math.min(100, Math.round(s)));
  }, [txs, profiles]);

  const color = score > 70 ? "var(--success)" : score > 40 ? "var(--warning)" : "var(--danger)";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
      <div style={{
        width: 80, height: 80, borderRadius: "50%",
        background: `conic-gradient(${color} ${score * 3.6}deg, var(--bg-overlay) ${score * 3.6}deg)`,
        display: "flex", alignItems: "center", justifyContent: "center",
        boxShadow: `0 0 20px ${color}25`,
      }}>
        <div style={{ width: 64, height: 64, borderRadius: "50%", background: "var(--bg-raised)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 20, fontWeight: 800, color }}>{score}</span>
          <span style={{ fontSize: 8, color: "var(--text-quaternary)", textTransform: "uppercase", letterSpacing: 1 }}>Sant\u00E9</span>
        </div>
      </div>
      <div>
        <div style={{ fontSize: 13, fontWeight: 700 }}>{score > 70 ? "\u2705 Excellente" : score > 40 ? "\u26A0\uFE0F Attention" : "\u{1F6A8} Critique"}</div>
        <div style={{ fontSize: 10, color: "var(--text-tertiary)" }}>Score de sant\u00E9 de l'agence</div>
      </div>
    </div>
  );
};

const AgencyAchievements = ({txs, profiles, models, expenses, convertAmount}) => {
  const stats = useMemo(() => {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); monday.setHours(0, 0, 0, 0);
    const validated = txs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
    const monthlyCA = validated.filter(tx => new Date(tx.date) >= monthStart).reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
    const weeklyTxCount = txs.filter(tx => new Date(tx.date) >= monday && (tx.status === "validated" || tx.status === "confirmee")).length;
    const modelStats = models.map(m => {
      const mTxs = validated.filter(tx => tx.model_id === m.id);
      const ca = mTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const mExp = (expenses || []).filter(e => e.model_id === m.id).reduce((s, e) => s + Number(e.amount), 0);
      return { margin: ca > 0 ? ((ca - mExp) / ca) * 100 : 0 };
    });
    const highMarginModels = modelStats.filter(m => m.margin >= 80).length;
    const now48h = Date.now() - 48 * 3600000;
    const oldPending = txs.filter(tx => tx.status === "pending" && new Date(tx.date).getTime() < now48h).length;
    const chatters = profiles.filter(p => p.role === "chatter");
    const allGoalsMet = chatters.length > 0 && chatters.every(ch => {
      const goal = Number(ch.daily_goal) || 500;
      const daily = getDailyProgress(ch.id, txs, convertAmount);
      return daily >= goal;
    });
    const allStreaks7 = chatters.length > 0 && chatters.every(ch => calculateStreak(ch.id, txs) >= 7);
    const spenderWeekly = {};
    txs.filter(tx => new Date(tx.date) >= monday && (tx.status === "validated" || tx.status === "confirmee")).forEach(tx => {
      const k = tx.spender_handle || "?";
      spenderWeekly[k] = (spenderWeekly[k] || 0) + convertAmount(Number(tx.amount), tx.currency);
    });
    const topWeeklySpender = Math.max(0, ...Object.values(spenderWeekly));
    return { monthlyCA, weeklyTxCount, highMarginModels, oldPending, allGoalsMet, allStreaks7, topWeeklySpender };
  }, [txs, profiles, models, expenses, convertAmount]);

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
      {AGENCY_ACHIEVEMENTS.map(a => {
        const unlocked = a.check(stats);
        return (
          <div key={a.id} style={{
            padding: "18px 14px", borderRadius: 16, textAlign: "center",
            background: unlocked ? "var(--accent-subtle)" : "var(--bg-overlay)",
            border: "1px solid " + (unlocked ? "var(--accent-muted)" : "var(--border-subtle)"),
            opacity: unlocked ? 1 : 0.35, transition: "all 0.3s",
          }}>
            <div style={{ fontSize: 32 }}>{a.icon}</div>
            <div style={{ fontSize: 12, fontWeight: 700, marginTop: 8 }}>{a.name}</div>
            <div style={{ fontSize: 10, color: "var(--text-tertiary)", marginTop: 3 }}>{a.desc}</div>
            {unlocked && <div style={{ fontSize: 9, color: "var(--success)", marginTop: 6, fontWeight: 600 }}>{"\u2705"} D\u00C9BLOQU\u00C9</div>}
          </div>
        );
      })}
    </div>
  );
};

// =============================================
// GÉRANT — ACTIVITY HEATMAP (365 days)
// =============================================
const ActivityHeatmap = ({txs, convertAmount, currencySymbol}) => {
  const heatmapData = useMemo(() => {
    const data = {};
    txs.forEach(tx => {
      if (tx.status === "validated" || tx.status === "confirmee") {
        const day = new Date(tx.date).toISOString().slice(0, 10);
        if (!data[day]) data[day] = 0;
        data[day] += convertAmount(Number(tx.amount), tx.currency);
      }
    });
    return data;
  }, [txs, convertAmount]);
  const maxCA = Math.max(1, ...Object.values(heatmapData));

  const cells = [];
  for (let i = 364; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toISOString().slice(0, 10);
    const ca = heatmapData[key] || 0;
    const intensity = ca / maxCA;
    cells.push(
      <div key={key} title={`${key} \u2014 ${Math.round(ca).toLocaleString()}${currencySymbol}`}
        style={{ width: 12, height: 12, borderRadius: 3, background: ca === 0 ? "var(--card-bg)" : `rgba(99,102,241,${0.15 + intensity * 0.85})`, cursor: "pointer", opacity: ca === 0 ? 1 : undefined }} />
    );
  }

  return (
    <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 12, padding: 20 }}>

const ChallengesSection = ({user, lang, txs, profiles, convertAmount, currencySymbol}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [challenges, setChallenges] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", metric: "ca", start_date: "", end_date: "", reward: "" });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const load = async () => {
      const { data } = await sb.from("challenges").select("*").order("created_at", { ascending: false });
      setChallenges(data || []);
    };
    load();
  }, []);

  const handleCreate = async () => {
    if (!form.title || !form.start_date || !form.end_date) return;
    setSaving(true);
    const { error } = await sb.from("challenges").insert({ ...form, created_by: user.id });
    setSaving(false);
    if (error) { addToast("Erreur: " + error.message, "error"); return; }
    setForm({ title: "", metric: "ca", start_date: "", end_date: "", reward: "" });
    setShowForm(false);
    const { data } = await sb.from("challenges").select("*").order("created_at", { ascending: false });
    setChallenges(data || []);
    addToast(fr ? "Challenge cr\u00E9\u00E9 \u{1F3C6}" : "Challenge created \u{1F3C6}", "success");
  };

  const now = new Date();
  const active = challenges.filter(c => c.active && new Date(c.end_date) >= now);
  const past = challenges.filter(c => !c.active || new Date(c.end_date) < now);

  const getChallengeRanking = (ch) => {
    const start = new Date(ch.start_date);
    const end = new Date(ch.end_date);
    const chatters = profiles.filter(p => p.role === "chatter");
    return chatters.map(chatter => {
      const cTxs = txs.filter(tx => tx.chatter_id === chatter.id && new Date(tx.date) >= start && new Date(tx.date) <= end && (tx.status === "validated" || tx.status === "confirmee"));
      let val = 0;
      if (ch.metric === "ca") val = cTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      else if (ch.metric === "tx_count") val = cTxs.length;
      else if (ch.metric === "avg_ticket") val = cTxs.length > 0 ? cTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0) / cTxs.length : 0;
      return { chatter, val };
    }).sort((a, b) => b.val - a.val);
  };

  return (
    <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 12, padding: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>{"\u{1F3C6}"} Challenges</h3>
        <button onClick={() => setShowForm(!showForm)} className="btn btn-primary" style={{ fontSize: 11, padding: "5px 14px" }}>+ {fr ? "Cr\u00E9er" : "Create"}</button>
      </div>
      {showForm && (
        <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-default)", borderRadius: 14, padding: 16, marginBottom: 14 }}>
          <input placeholder={fr ? "Titre du challenge" : "Challenge title"} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="input" style={{ marginBottom: 8, width: "100%" }} />
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <select value={form.metric} onChange={e => setForm({ ...form, metric: e.target.value })} className="filter-select">
              <option value="ca">CA Brut</option><option value="tx_count">Nombre TX</option><option value="avg_ticket">Panier Moyen</option>
            </select>
            <input type="datetime-local" value={form.start_date} onChange={e => setForm({ ...form, start_date: e.target.value })} className="filter-date" />
            <input type="datetime-local" value={form.end_date} onChange={e => setForm({ ...form, end_date: e.target.value })} className="filter-date" />
          </div>
          <input placeholder={fr ? "R\u00E9compense (texte libre)" : "Reward"} value={form.reward} onChange={e => setForm({ ...form, reward: e.target.value })} className="input" style={{ marginBottom: 8, width: "100%" }} />
          <button onClick={handleCreate} disabled={saving} className="btn btn-primary" style={{ fontSize: 11 }}>{saving ? "..." : (fr ? "Cr\u00E9er le challenge" : "Create challenge")}</button>
        </div>
      )}
      {active.length === 0 && past.length === 0 && <div style={{ color: "var(--text-quaternary)", textAlign: "center", padding: 20 }}>{fr ? "Aucun challenge" : "No challenges"}</div>}
      {active.map(ch => {
        const ranking = getChallengeRanking(ch);
        const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];
        return (
          <div key={ch.id} style={{ border: "1px solid var(--accent-muted)", borderRadius: 14, padding: 14, marginBottom: 10, background: "var(--accent-subtle)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 700 }}>{"\u{1F525}"} {ch.title}</span>
              <span style={{ fontSize: 10, color: "var(--success)", fontWeight: 600 }}>ACTIF</span>
            </div>
            {ch.reward && <div style={{ fontSize: 10, color: "var(--warning)", marginBottom: 8 }}>{"\u{1F381}"} {ch.reward}</div>}
            {ranking.slice(0, 5).map((r, i) => (
              <div key={r.chatter.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 0" }}>
                <span style={{ fontSize: 14, width: 20 }}>{medals[i] || (i + 1)}</span>
                <span style={{ flex: 1, fontSize: 12, fontWeight: 600 }}>{r.chatter.name}</span>
                <span style={{ fontSize: 12, fontWeight: 700, color: "var(--accent)" }}>{Math.round(r.val).toLocaleString()}{ch.metric === "ca" ? currencySymbol : ch.metric === "tx_count" ? " TX" : currencySymbol}</span>
              </div>
            ))}
          </div>
        );
      })}
      {past.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 11, color: "var(--text-quaternary)", marginBottom: 6 }}>{fr ? "Challenges pass\u00E9s" : "Past challenges"}</div>
          {past.slice(0, 3).map(ch => (
            <div key={ch.id} style={{ fontSize: 11, color: "var(--text-quaternary)", padding: "4px 0" }}>{ch.title} \u2014 {fmtDate(ch.end_date)}</div>
          ))}
        </div>
      )}
    </div>
  );
};

// Invoice number generator
const getNextInvoiceNumber = async () => {
  const year = new Date().getFullYear();
  try {
    const { data: counter } = await sb.from("invoice_counter").select("*").eq("id", 1).single();
    let nextNum;
    if (!counter || counter.year !== year) {
      nextNum = 1;
      await sb.from("invoice_counter").upsert({ id: 1, year, last_number: 1 });
    } else {
      nextNum = counter.last_number + 1;
      await sb.from("invoice_counter").update({ last_number: nextNum }).eq("id", 1);
    }
    return `DADASH-${year}-${String(nextNum).padStart(4, "0")}`;
  } catch (e) {
    // Invoice counter error
    return `DADASH-${year}-${String(Date.now()).slice(-4)}`;
  }
};
