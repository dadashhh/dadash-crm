// CHATTER ROLE — COMPETITION + GAMIFICATION
// =============================================
const CHATTER_LEVELS = [
  { name: "Débutant", icon: "\u{1F331}", minScore: 0, color: "#6B7280" },
  { name: "Apprenti", icon: "\u2B50", minScore: 500, color: "#3B82F6" },
  { name: "Confirmé", icon: "\u{1F525}", minScore: 2000, color: "#F59E0B" },
  { name: "Expert", icon: "\u{1F48E}", minScore: 5000, color: "#8B5CF6" },
  { name: "Légende", icon: "\u{1F451}", minScore: 10000, color: "#EF4444" },
];

const getChatterLevel = (score) => {
  let lvl = CHATTER_LEVELS[0];
  for (const l of CHATTER_LEVELS) { if (score >= l.minScore) lvl = l; }
  return lvl;
};

const getNextLevel = (score) => {
  for (const l of CHATTER_LEVELS) { if (score < l.minScore) return l; }
  return null;
};

const ChatterCompetitionTab = ({user, lang, txs, spenders, models, profiles}) => {
  const { fmtAmount, convertAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const [period, setPeriod] = useState("month");
  const [section, setSection] = useState("classement");

  const chatters = useMemo(() => profiles.filter(p => p.role === "chatter"), [profiles]);

  const periodFilter = useMemo(() => {
    const now = new Date();
    if (period === "week") {
      const d = new Date(now); d.setDate(d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1));
      d.setHours(0,0,0,0);
      return d;
    }
    if (period === "month") return new Date(now.getFullYear(), now.getMonth(), 1);
    if (period === "last_month") return new Date(now.getFullYear(), now.getMonth() - 1, 1);
    if (period === "3months") { const d = new Date(now); d.setMonth(d.getMonth() - 3); return d; }
    return new Date(0);
  }, [period]);

  const periodEnd = useMemo(() => {
    if (period === "last_month") return new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    return new Date();
  }, [period]);

  const ranking = useMemo(() => {
    return chatters.map(ch => {
      const chModelIds = ch.assigned_models || [];
      const chTxs = txs.filter(tx => chModelIds.includes(tx.model_id) && new Date(tx.date) >= periodFilter && new Date(tx.date) < periodEnd);
      const validTxs = chTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
      const ca = validTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount || 0), tx.currency), 0);
      const nbTx = chTxs.length;
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 3600000);
      const spenderHandles = new Set(chTxs.filter(tx => new Date(tx.date) >= thirtyDaysAgo).map(tx => tx.spender_handle));
      const activeSpenders = spenderHandles.size;
      const allSpenderHandles = new Set(txs.filter(tx => chModelIds.includes(tx.model_id)).map(tx => tx.spender_handle));
      const totalSpenders = allSpenderHandles.size;
      const convRate = totalSpenders > 0 ? Math.round((activeSpenders / totalSpenders) * 100) : 0;
      const score = Math.round((ca / 10) + (nbTx * 5) + (activeSpenders * 10) + (convRate * 3));
      return { user: ch, ca, nbTx, activeSpenders, totalSpenders, convRate, score };
    }).sort((a, b) => b.score - a.score);
  }, [chatters, txs, periodFilter, periodEnd, convertAmount]);

  // My stats
  const myRank = useMemo(() => ranking.find(r => r.user.id === user.id), [ranking, user.id]);
  const myIdx = useMemo(() => ranking.findIndex(r => r.user.id === user.id), [ranking, user.id]);
  const myScore = myRank?.score || 0;
  const myLevel = getChatterLevel(myScore);
  const nextLevel = getNextLevel(myScore);

  // Previous month stats for variation %
  const prevMonthStats = useMemo(() => {
    const now = new Date();
    const prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const prevEnd = new Date(now.getFullYear(), now.getMonth(), 1);
    const chModelIds = user.assigned_models || [];
    const prevTxs = txs.filter(tx => chModelIds.includes(tx.model_id) && new Date(tx.date) >= prevStart && new Date(tx.date) < prevEnd);
    const prevValid = prevTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
    const prevCA = prevValid.reduce((s, tx) => s + convertAmount(Number(tx.amount || 0), tx.currency), 0);
    const prevSpenders = new Set(prevTxs.map(tx => tx.spender_handle)).size;
    return { ca: prevCA, nbTx: prevTxs.length, spenders: prevSpenders };
  }, [txs, user.assigned_models, convertAmount]);

  // Badges computation
  const badges = useMemo(() => {
    const chModelIds = user.assigned_models || [];
    const allMyTxs = txs.filter(tx => chModelIds.includes(tx.model_id));
    const validMyTxs = allMyTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");

    // First Blood: first TX created
    const firstBlood = allMyTxs.length > 0;

    // Centurion: 100 TX total
    const centurion = allMyTxs.length >= 100;

    // Whale Hunter: 1 spender with TX > 500 CHF
    const whaleHunter = validMyTxs.some(tx => convertAmount(Number(tx.amount || 0), tx.currency) > 500);

    // On Fire: 10 TX in 1 day
    const txByDay = {};
    allMyTxs.forEach(tx => { const d = (tx.date || "").slice(0, 10); txByDay[d] = (txByDay[d] || 0) + 1; });
    const onFire = Object.values(txByDay).some(c => c >= 10);

    // Top Dog: #1 in current ranking
    const topDog = myIdx === 0 && ranking.length > 1;

    // Rising Star: best progression % vs last month
    const currCA = myRank?.ca || 0;
    const prevCA = prevMonthStats.ca;
    let isBestProgression = false;
    if (prevCA > 0 && chatters.length > 1) {
      const now = new Date();
      const prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const prevEnd = new Date(now.getFullYear(), now.getMonth(), 1);
      const curStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const progressions = chatters.map(ch => {
        const ids = ch.assigned_models || [];
        const pTxs = txs.filter(tx => ids.includes(tx.model_id) && new Date(tx.date) >= prevStart && new Date(tx.date) < prevEnd);
        const pCA = pTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee").reduce((s, tx) => s + convertAmount(Number(tx.amount || 0), tx.currency), 0);
        const cTxs = txs.filter(tx => ids.includes(tx.model_id) && new Date(tx.date) >= curStart);
        const cCA = cTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee").reduce((s, tx) => s + convertAmount(Number(tx.amount || 0), tx.currency), 0);
        const prog = pCA > 0 ? ((cCA - pCA) / pCA) * 100 : 0;
        return { id: ch.id, prog };
      });
      const best = progressions.sort((a, b) => b.prog - a.prog)[0];
      isBestProgression = best && best.id === user.id && best.prog > 0;
    }

    return [
      { id: "first_blood", icon: "\u{1F3AF}", name: "First Blood", desc: fr ? "Première TX créée" : "First TX created", unlocked: firstBlood },
      { id: "centurion", icon: "\u{1F4AF}", name: "Centurion", desc: fr ? "100 TX au total" : "100 TX total", unlocked: centurion },
      { id: "whale_hunter", icon: "\u{1F40B}", name: "Whale Hunter", desc: fr ? "1 spender avec TX > 500 CHF" : "1 spender with TX > 500 CHF", unlocked: whaleHunter },
      { id: "on_fire", icon: "\u{1F525}", name: "On Fire", desc: fr ? "10 TX en 1 journée" : "10 TX in 1 day", unlocked: onFire },
      { id: "top_dog", icon: "\u{1F451}", name: "Top Dog", desc: fr ? "#1 du classement" : "#1 in ranking", unlocked: topDog },
      { id: "rising_star", icon: "\u{1F31F}", name: "Rising Star", desc: fr ? "Meilleure progression % vs mois dernier" : "Best progression % vs last month", unlocked: isBestProgression },
    ];
  }, [txs, user, myIdx, myRank, prevMonthStats, ranking, chatters, convertAmount, fr]);

  // Score history (6 last months)
  const scoreHistory = useMemo(() => {
    const now = new Date();
    const months = [];
    const chModelIds = user.assigned_models || [];
    for (let i = 5; i >= 0; i--) {
      const mStart = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mEnd = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      const label = mStart.toLocaleDateString(fr ? "fr-FR" : "en-US", { month: "short" });
      const mTxs = txs.filter(tx => chModelIds.includes(tx.model_id) && new Date(tx.date) >= mStart && new Date(tx.date) < mEnd);
      const valid = mTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
      const ca = valid.reduce((s, tx) => s + convertAmount(Number(tx.amount || 0), tx.currency), 0);
      const spH = new Set(mTxs.map(tx => tx.spender_handle)).size;
      const totalSp = new Set(txs.filter(tx => chModelIds.includes(tx.model_id)).map(tx => tx.spender_handle)).size;
      const conv = totalSp > 0 ? Math.round((spH / totalSp) * 100) : 0;
      const sc = Math.round((ca / 10) + (mTxs.length * 5) + (spH * 10) + (conv * 3));
      months.push({ name: label, score: sc });
    }
    return months;
  }, [txs, user.assigned_models, convertAmount, fr]);

  const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];
  const medalColors = ["#FFD700", "#C0C0C0", "#CD7F32"];
  const top3 = ranking.slice(0, 3);
  const rest = ranking.slice(3);
  const maxScore = top3.length > 0 ? top3[0].score : 1;

  const getInitials = (name) => (name || "?").split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
  const avatarColor = (id) => { let h = 0; for (let i = 0; i < (id || "").length; i++) h = (id || "").charCodeAt(i) + ((h << 5) - h); return `hsl(${Math.abs(h) % 360}, 60%, 50%)`; };

  const periodOpts = [
    { k: "week", l: fr ? "Cette semaine" : "This week" },
    { k: "month", l: fr ? "Ce mois" : "This month" },
    { k: "last_month", l: fr ? "Mois dernier" : "Last month" },
    { k: "3months", l: fr ? "3 mois" : "3 months" },
  ];

  const varPct = (curr, prev) => {
    if (!prev || prev === 0) return null;
    return Math.round(((curr - prev) / prev) * 100);
  };

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u{1F3C6}"} {fr ? "Compétition" : "Competition"}</h2>
        <p style={{fontSize:12,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{fr ? "Classement & Gamification" : "Rankings & Gamification"}</p>
      </div>

      {/* Section toggle */}
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {[{k:"classement",l:fr?"Classement":"Rankings",ic:"\u{1F3C6}"},{k:"stats",l:fr?"Mes Stats":"My Stats",ic:"\u{1F4CA}"}].map(s => (
          <button key={s.k} onClick={() => setSection(s.k)} style={{padding:"8px 18px",borderRadius:12,border:"1px solid "+(section===s.k?"#8B5CF6":"var(--border-subtle)"),background:section===s.k?"rgba(139,92,246,0.15)":"var(--card-bg)",color:section===s.k?"#8B5CF6":"var(--text-secondary)",fontWeight:700,fontSize:13,cursor:"pointer"}}>{s.ic} {s.l}</button>
        ))}
      </div>

      {/* ─── SECTION: CLASSEMENT ─── */}
      {section === "classement" && (<>
        {/* Period filters */}
        <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
          {periodOpts.map(p => (
            <button key={p.k} onClick={() => setPeriod(p.k)} className={`filter-chip ${period===p.k?"active":""}`} style={{fontSize:12}}>{p.l}</button>
          ))}
        </div>

        {chatters.length === 0 && (
          <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:60}}>{fr ? "Aucun chatter trouvé" : "No chatters found"}</div>
        )}

        {/* Podium Top 3 */}
        {top3.length > 0 && (
          <div style={{display:"grid",gridTemplateColumns:top3.length >= 3 ? "1fr 1fr 1fr" : `repeat(${top3.length}, 1fr)`,gap:16,marginBottom:28}}>
            {top3.map((r, idx) => {
              const isMe = r.user.id === user.id;
              const lvl = getChatterLevel(r.score);
              return (
                <div key={r.user.id} style={{background:isMe ? "rgba(139,92,246,0.12)" : "#1A1A2E",border:`2px solid ${medalColors[idx]}`,borderRadius:16,padding:24,textAlign:"center",position:"relative",transition:"all 0.2s"}}>
                  <div style={{fontSize:32,marginBottom:8}}>{medals[idx]}</div>
                  <div style={{width:56,height:56,borderRadius:"50%",background:avatarColor(r.user.id),display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:800,color:"#fff",margin:"0 auto 10px"}}>{getInitials(r.user.name)}</div>
                  <div style={{fontSize:15,fontWeight:800,marginBottom:2}}>{r.user.name}</div>
                  <div style={{fontSize:11,color:lvl.color,marginBottom:10}}>{lvl.icon} {lvl.name}</div>
                  <div style={{fontSize:11,color:"var(--text-tertiary)",marginBottom:4}}>CA</div>
                  <div style={{fontSize:20,fontWeight:800,color:"var(--accent)",marginBottom:8}}>{fmtAmount(r.ca)}</div>
                  <div style={{display:"flex",justifyContent:"center",gap:12,fontSize:11,color:"var(--text-tertiary)",marginBottom:12}}>
                    <span>{r.nbTx} TX</span>
                    <span>{r.activeSpenders} {"\u{1F525}"}</span>
                  </div>
                  <div style={{fontSize:11,color:"var(--text-tertiary)",marginBottom:6}}>Score</div>
                  <div style={{fontSize:18,fontWeight:800,color:medalColors[idx]}}>{r.score.toLocaleString()}</div>
                  {/* Progress bar */}
                  <div style={{marginTop:12,height:6,borderRadius:3,background:"rgba(255,255,255,0.08)",overflow:"hidden"}}>
                    <div style={{height:"100%",borderRadius:3,background:medalColors[idx],width:`${Math.min(100, (r.score / maxScore) * 100)}%`,transition:"width 0.5s"}} />
                  </div>
                  {isMe && <div style={{position:"absolute",top:8,right:10,fontSize:9,color:"#8B5CF6",fontWeight:700,background:"rgba(139,92,246,0.15)",padding:"2px 8px",borderRadius:8}}>{fr ? "Toi" : "You"}</div>}
                </div>
              );
            })}
          </div>
        )}

        {/* Rest of ranking — Table */}
        {rest.length > 0 && (
          <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,overflow:"hidden",marginBottom:20}}>
            <div style={{overflowX:"auto"}}>
              <table className="table">
                <thead><tr>
                  <th style={{width:50}}>#</th>
                  <th>{fr ? "Chatter" : "Chatter"}</th>
                  <th>{fr ? "CA Généré" : "Revenue"}</th>
                  <th>{fr ? "Nb TX" : "TX Count"}</th>
                  <th>{fr ? "Spenders Actifs" : "Active Spenders"}</th>
                  <th>{fr ? "Taux Conv." : "Conv. Rate"}</th>
                  <th>Score</th>
                </tr></thead>
                <tbody>
                  {rest.map((r, idx) => {
                    const isMe = r.user.id === user.id;
                    const lvl = getChatterLevel(r.score);
                    return (
                      <tr key={r.user.id} style={{background:isMe ? "rgba(139,92,246,0.1)" : ""}}>
                        <td style={{fontWeight:700,color:"var(--text-tertiary)"}}>{idx + 4}</td>
                        <td>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{width:28,height:28,borderRadius:"50%",background:avatarColor(r.user.id),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#fff"}}>{getInitials(r.user.name)}</div>
                            <span style={{fontWeight:600}}>{r.user.name}</span>
                            <span style={{fontSize:10,color:lvl.color}}>{lvl.icon}</span>
                            {isMe && <span style={{fontSize:9,color:"#8B5CF6",fontWeight:700}}>({fr ? "Toi" : "You"})</span>}
                          </div>
                        </td>
                        <td style={{fontWeight:700}}>{fmtAmount(r.ca)}</td>
                        <td>{r.nbTx}</td>
                        <td>{r.activeSpenders}</td>
                        <td>
                          <span style={{padding:"2px 8px",borderRadius:10,background:r.convRate >= 50 ? "rgba(16,185,129,0.15)" : r.convRate >= 25 ? "rgba(245,158,11,0.15)" : "rgba(239,68,68,0.15)",color:r.convRate >= 50 ? "#10B981" : r.convRate >= 25 ? "#F59E0B" : "#EF4444",fontSize:11,fontWeight:700}}>{r.convRate}%</span>
                        </td>
                        <td style={{fontWeight:700}}>{r.score.toLocaleString()}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </>)}

      {/* ─── SECTION: MES STATS ─── */}
      {section === "stats" && (<>
        {/* 4 KPI Cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:14,marginBottom:24}}>
          {[
            { label: fr ? "CA Généré" : "Revenue", value: fmtAmount(myRank?.ca || 0), prev: prevMonthStats.ca, curr: myRank?.ca || 0, icon: "\u{1F4B0}", color: "var(--accent)" },
            { label: fr ? "Nb TX ce mois" : "TX this month", value: myRank?.nbTx || 0, prev: prevMonthStats.nbTx, curr: myRank?.nbTx || 0, icon: "\u{1F4B8}", color: "var(--success)" },
            { label: fr ? "Spenders Actifs" : "Active Spenders", value: myRank?.activeSpenders || 0, prev: prevMonthStats.spenders, curr: myRank?.activeSpenders || 0, icon: "\u{1F465}", color: "#EC4899" },
            { label: fr ? "Taux de Conversion" : "Conv. Rate", value: (myRank?.convRate || 0) + "%", prev: null, curr: null, icon: "\u{1F3AF}", color: "#8B5CF6" },
          ].map(k => {
            const vPct = k.prev !== null ? varPct(k.curr, k.prev) : null;
            return (
              <div key={k.label} style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:"20px 22px"}}>
                <div style={{fontSize:10,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>{k.icon} {k.label}</div>
                <div style={{fontSize:26,fontWeight:800,color:k.color}}>{k.value}</div>
                {vPct !== null && (
                  <div style={{fontSize:11,marginTop:6,color:vPct >= 0 ? "#10B981" : "#EF4444",fontWeight:600}}>
                    {vPct >= 0 ? "\u2191" : "\u2193"} {Math.abs(vPct)}% {fr ? "vs mois dernier" : "vs last month"}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Rank display */}
        <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:20,marginBottom:20,display:"flex",alignItems:"center",gap:16}}>
          <div style={{width:48,height:48,borderRadius:"50%",background:avatarColor(user.id),display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:"#fff"}}>{getInitials(user.name)}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:700}}>{user.name}</div>
            <div style={{fontSize:12,color:"var(--text-tertiary)"}}>{fr ? "Classement" : "Rank"}: <span style={{fontWeight:800,color:"#8B5CF6"}}>#{myIdx + 1}</span> / {ranking.length}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:22,fontWeight:800,color:"var(--accent)"}}>{myScore.toLocaleString()}</div>
            <div style={{fontSize:10,color:"var(--text-tertiary)"}}>Score</div>
          </div>
        </div>

        {/* Level card */}
        <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:24,marginBottom:20,textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:8}}>{myLevel.icon}</div>
          <div style={{fontSize:18,fontWeight:800,color:myLevel.color,marginBottom:4}}>{myLevel.name}</div>
          <div style={{fontSize:12,color:"var(--text-tertiary)",marginBottom:16}}>Score: {myScore.toLocaleString()}</div>
          {nextLevel ? (
            <div>
              <div style={{fontSize:11,color:"var(--text-tertiary)",marginBottom:8}}>{fr ? "Prochain niveau" : "Next level"}: <span style={{color:nextLevel.color,fontWeight:700}}>{nextLevel.icon} {nextLevel.name}</span> ({nextLevel.minScore.toLocaleString()} pts)</div>
              <div style={{height:10,borderRadius:5,background:"rgba(255,255,255,0.08)",overflow:"hidden",maxWidth:400,margin:"0 auto"}}>
                <div style={{height:"100%",borderRadius:5,background:`linear-gradient(90deg, ${myLevel.color}, ${nextLevel.color})`,width:`${Math.min(100, ((myScore - myLevel.minScore) / (nextLevel.minScore - myLevel.minScore)) * 100)}%`,transition:"width 0.5s"}} />
              </div>
              <div style={{fontSize:10,color:"var(--text-quaternary)",marginTop:6}}>{Math.max(0, nextLevel.minScore - myScore).toLocaleString()} {fr ? "points restants" : "points remaining"}</div>
            </div>
          ) : (
            <div style={{fontSize:12,color:"#EF4444",fontWeight:700}}>{fr ? "Niveau maximum atteint !" : "Max level reached!"}</div>
          )}
        </div>

        {/* Badges grid */}
        <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>{"\u{1F396}\uFE0F"} {fr ? "Badges" : "Badges"}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12,marginBottom:24}}>
          {badges.map(b => (
            <div key={b.id} style={{background:b.unlocked ? "#1A1A2E" : "rgba(26,26,46,0.5)",border:"1px solid "+(b.unlocked ? "#2A2A3E" : "rgba(42,42,62,0.4)"),borderRadius:16,padding:20,textAlign:"center",opacity:b.unlocked ? 1 : 0.5,position:"relative"}}>
              <div style={{fontSize:36,marginBottom:8,filter:b.unlocked ? "none" : "grayscale(100%)"}}>{b.icon}</div>
              <div style={{fontSize:13,fontWeight:700,marginBottom:4,color:b.unlocked ? "#fff" : "var(--text-quaternary)"}}>{b.name}</div>
              <div style={{fontSize:11,color:b.unlocked ? "var(--text-tertiary)" : "var(--text-quaternary)"}}>{b.desc}</div>
              {!b.unlocked && <div style={{position:"absolute",top:8,right:10,fontSize:14}}>{"\u{1F512}"}</div>}
              {b.unlocked && <div style={{marginTop:8,fontSize:10,color:"#10B981",fontWeight:700}}>{"\u2713"} {fr ? "Débloqué" : "Unlocked"}</div>}
            </div>
          ))}
        </div>

        {/* Score history chart */}
        <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>{"\u{1F4C8}"} {fr ? "Évolution du Score" : "Score History"}</div>
        <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:20,marginBottom:20}}>
          {rechartsReady && LineChart ? (
            <ResponsiveContainer width="100%" height={220}>
              <LineChart data={scoreHistory}>
                <CartesianGrid strokeDasharray="3 3" stroke="#2A2A3E" />
                <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill:"#9CA3AF",fontSize:11}} />
                <YAxis axisLine={false} tickLine={false} tick={{fill:"#9CA3AF",fontSize:11}} />
                <RechartsTooltip contentStyle={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:8,fontSize:12}} />
                <Line type="monotone" dataKey="score" stroke="#8B5CF6" strokeWidth={3} dot={{fill:"#8B5CF6",r:5}} activeDot={{r:7}} name="Score" />
              </LineChart>
            </ResponsiveContainer>
          ) : (
            <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr ? "Graphique non disponible" : "Chart unavailable"}</div>
          )}
        </div>
      </>)}
    </div>
  );
};

// =============================================
// MODEL ROLE — CONTENT LIST TAB
// =============================================
const ModelContentTab = ({user, lang, contentList}) => {
  const fr = lang === "fr";
  const [weekOffset, setWeekOffset] = useState(0);

  const getWeekRange = (offset) => {
    const now = new Date();
    const day = now.getDay();
    const mondayDiff = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + mondayDiff + offset * 7);
    monday.setHours(0, 0, 0, 0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 999);
    return {start: monday, end: sunday};
  };

  const {start, end} = getWeekRange(weekOffset);
  const fmtShort = (d) => d.toLocaleDateString(fr ? "fr-FR" : "en-US", {day:"numeric", month:"short"});

  const myContent = (contentList || []).filter(c => c.model_id === user.id);
  const weekContent = myContent.filter(c => {
    if (!c.due_date) return false;
    const d = new Date(c.due_date);
    return d >= start && d <= end;
  }).sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

  const typeIcon = (t) => t === "photo" ? "\u{1F4F8}" : t === "video" ? "\u{1F3A5}" : t === "reel" ? "\u{1F3AC}" : t === "story" ? "\u{1F4F1}" : t === "live" ? "\u{1F534}" : "\u{1F4E6}";
  const statusColor = (s) => s === "published" ? "var(--success)" : s === "ready" ? "#10B981" : s === "editing" ? "var(--pink)" : s === "shooting" ? "var(--accent)" : "var(--warning)";
  const statusLabel = (s) => {
    if (s === "published") return fr ? "Publié" : "Published";
    if (s === "ready") return fr ? "Prêt" : "Ready";
    if (s === "editing") return fr ? "Montage" : "Editing";
    if (s === "shooting") return "Shooting";
    return fr ? "En attente" : "Pending";
  };

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u{1F4DD}"} {fr ? "Mon Planning Contenu" : "My Content Schedule"}</h2>
        <p style={{fontSize:12,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{fr ? "Semaine par semaine" : "Week by week"}</p>

      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,marginBottom:24}}>
        <button className="btn" onClick={() => setWeekOffset(w => w - 1)} style={{padding:"6px 14px",fontSize:13}}>{"\u2190"}</button>
        <span style={{fontSize:14,fontWeight:700,minWidth:200,textAlign:"center"}}>{fmtShort(start)} — {fmtShort(end)}{weekOffset === 0 ? (fr ? " (cette semaine)" : " (this week)") : ""}</span>
        <button className="btn" onClick={() => setWeekOffset(w => w + 1)} style={{padding:"6px 14px",fontSize:13}}>{"\u2192"}</button>
      </div>

      {weekContent.length === 0 && (
        <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr ? "Aucun contenu prévu cette semaine" : "No content scheduled this week"}</div>
      )}

      {weekContent.map(item => (
        <div key={item.id} style={{
          display:"flex",alignItems:"center",gap:16,padding:"16px 20px",
          background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,marginBottom:8,
          borderLeft:"4px solid "+statusColor(item.status),
        }}>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:700}}>{item.title}</div>
            {item.description && <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:3}}>{item.description}</div>}
            <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
              <span style={{fontSize:10,padding:"1px 6px",borderRadius:6,background:"var(--accent-subtle)",color:"var(--accent)",fontWeight:600}}>{typeIcon(item.content_type)} {item.content_type}</span>
              {item.platform && <span style={{fontSize:10,padding:"1px 6px",borderRadius:6,background:"var(--bg-overlay)",color:"var(--text-secondary)",fontWeight:600}}>{item.platform}</span>}
              {item.due_date && <span style={{fontSize:10,color:"var(--text-quaternary)"}}>{"\u{1F4C5}"} {fmtDate(item.due_date)}</span>}
            </div>
          </div>
          <span style={{padding:"3px 10px",borderRadius:10,background:statusColor(item.status)+"15",color:statusColor(item.status),fontSize:11,fontWeight:700}}>{statusLabel(item.status)}</span>
        </div>

      <div style={{marginTop:24,textAlign:"center"}}>

  const now = new Date();

  const totalBonus = tasks.filter(t => t.status === "done").reduce((s, t) => s + Number(t.bonus_amount || 0), 0);

  // Streak: consecutive days with a completed task
  const doneDates = tasks.filter(t => t.status === "done" && t.completed_at).map(t => new Date(t.completed_at).toISOString().slice(0, 10)).filter((v, i, a) => a.indexOf(v) === i).sort().reverse();

    const today = new Date().toISOString().slice(0, 10);
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (doneDates[0] === today || doneDates[0] === yesterday) {
      streak = 1;
      for (let i = 0; i < doneDates.length - 1; i++) {

const ContentTaskManager = ({modelId, lang, onRefresh}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [tasks, setTasks] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", description: "", category: "photo", priority: "medium", due_date: "", bonus_amount: 0 });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const load = async () => {
      const { data } = await sb.from("content_tasks").select("*").eq("model_id", modelId).order("created_at", { ascending: false });
      setTasks(data || []);
    };
    load();
  }, [modelId]);

  const handleAdd = async () => {
    if (!form.title) return;
    setSaving(true);
    const { error } = await sb.from("content_tasks").insert({
      model_id: modelId, title: form.title, description: form.description,
      category: form.category, priority: form.priority,
      due_date: form.due_date || null, bonus_amount: Number(form.bonus_amount) || 0,
    });
    setSaving(false);
    if (error) { addToast("Erreur: " + error.message, "error"); return; }
    setForm({ title: "", description: "", category: "photo", priority: "medium", due_date: "", bonus_amount: 0 });
    setShowForm(false);
    const { data } = await sb.from("content_tasks").select("*").eq("model_id", modelId).order("created_at", { ascending: false });
    setTasks(data || []);
    addToast(fr ? "T\u00E2che ajout\u00E9e \u2705" : "Task added \u2705", "success");
  };

  const updateStatus = async (taskId, newStatus) => {
    await sb.from("content_tasks").update({ status: newStatus, completed_at: newStatus === "done" ? new Date().toISOString() : null }).eq("id", taskId);
    setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
  };

  const catIcon = (c) => c === "photo" ? "\u{1F4F8}" : c === "video" ? "\u{1F3A5}" : c === "live" ? "\u{1F534}" : "\u{1F4E6}";
  const stColor = (s) => s === "done" ? "var(--success)" : s === "in_progress" ? "var(--accent)" : s === "review" ? "var(--pink)" : "var(--warning)";

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <span style={{ fontSize: 13, fontWeight: 700 }}>{"\u{1F4CB}"} Content List ({tasks.length})</span>
        <button onClick={() => setShowForm(!showForm)} className="btn btn-primary" style={{ fontSize: 11, padding: "5px 14px" }}>+ {fr ? "Ajouter" : "Add"}</button>
      </div>
      {showForm && (
        <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-default)", borderRadius: 14, padding: 16, marginBottom: 12 }}>
          <input placeholder={fr ? "Titre de la t\u00E2che" : "Task title"} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="input" style={{ marginBottom: 8, width: "100%" }} />
          <input placeholder="Description" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} className="input" style={{ marginBottom: 8, width: "100%" }} />
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="filter-select">
              <option value="photo">{"\u{1F4F8}"} Photo</option><option value="video">{"\u{1F3A5}"} Vid\u00E9o</option><option value="live">{"\u{1F534}"} Live</option><option value="custom">{"\u{1F4E6}"} Custom</option>
            </select>
            <select value={form.priority} onChange={e => setForm({ ...form, priority: e.target.value })} className="filter-select">
              <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option>
            </select>
            <input type="date" value={form.due_date} onChange={e => setForm({ ...form, due_date: e.target.value })} className="filter-date" />
            <input type="number" placeholder="Bonus \u20AC" value={form.bonus_amount} onChange={e => setForm({ ...form, bonus_amount: e.target.value })} className="input" style={{ width: 80 }} />
          </div>
          <button onClick={handleAdd} disabled={saving} className="btn btn-primary" style={{ fontSize: 11 }}>{saving ? "..." : (fr ? "Ajouter" : "Add")}</button>
        </div>
      )}

        <div key={task.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid var(--border-subtle)" }}>
          <div style={{ width: 6, height: 6, borderRadius: "50%", background: stColor(task.status), flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <span style={{ fontSize: 12, fontWeight: 600, textDecoration: task.status === "done" ? "line-through" : "none", opacity: task.status === "done" ? 0.5 : 1 }}>{task.title}</span>
            <div style={{ fontSize: 9, color: "var(--text-quaternary)" }}>{catIcon(task.category)} {task.category} {task.due_date ? "\u00B7 " + fmtDate(task.due_date) : ""} {task.bonus_amount > 0 ? "\u00B7 +" + task.bonus_amount + "\u20AC" : ""}</div>
          </div>
          <select value={task.status} onChange={e => updateStatus(task.id, e.target.value)} className="filter-select" style={{ fontSize: 10, padding: "3px 6px" }}>
            <option value="todo">Todo</option><option value="in_progress">En cours</option><option value="review">Review</option><option value="done">Done</option>
          </select>
        </div>
      ))}
    </div>
  );
};

// GÉRANT — MODÈLES MANAGEMENT TAB
// =============================================
const ModelManagementTab = ({user, lang, models, profiles, modelTasks, contentList, checklistTemplates, checklistInstances, onRefresh}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [selectedModelId, setSelectedModelId] = useState(null);
  const [subView, setSubView] = useState("tasks");
  const [showTaskModal, setShowTaskModal] = useState(false);
  const [showContentModal, setShowContentModal] = useState(false);
  const [showTemplateEditor, setShowTemplateEditor] = useState(false);
  const [taskForm, setTaskForm] = useState({title:"",description:"",category:"general",priority:"medium",due_date:""});
  const [contentForm, setContentForm] = useState({title:"",description:"",content_type:"photo",platform:"onlyfans",due_date:"",bonus_amount:0});
  const [templateForm, setTemplateForm] = useState({name:"",items:[]});
  const [newItem, setNewItem] = useState("");
  const [saving, setSaving] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const modeleProfiles = profiles.filter(p => p.role === "modele");
  const today = new Date().toISOString().slice(0, 10);

  // Ensure today's checklist instances exist for all models
  const ensureInstances = async (modelId) => {
    const activeTemplates = checklistTemplates.filter(t => t.active);
    for (const tpl of activeTemplates) {
      const exists = checklistInstances.find(ci => ci.model_id === modelId && ci.template_id === tpl.id && ci.date === today);
      if (!exists) {
        const items = (tpl.items || []).map(it => ({title: it.title, checked: false}));
        await sb.from("checklist_instances").insert({model_id: modelId, template_id: tpl.id, date: today, items});
      }
    }
  };

  // Model health: checklist completion %
  const getModelHealth = (modelId) => {
    const todayInstances = checklistInstances.filter(ci => ci.model_id === modelId && ci.date === today);
    if (todayInstances.length === 0) return null;
    const allItems = todayInstances.flatMap(ci => ci.items || []);
    if (allItems.length === 0) return null;
    const checked = allItems.filter(i => i.checked).length;
    return Math.round((checked / allItems.length) * 100);
  };

  // Model card stats
  const modelCards = modeleProfiles.map(m => {
    const tasks = modelTasks.filter(t => t.model_id === m.id);
    const todoCount = tasks.filter(t => t.status === "todo").length;
    const inProgressCount = tasks.filter(t => t.status === "in_progress").length;
    const urgentCount = tasks.filter(t => t.priority === "urgent" && t.status !== "done").length;
    const contents = contentList.filter(c => c.model_id === m.id);
    const pendingContent = contents.filter(c => c.status !== "published").length;
    const health = getModelHealth(m.id);
    return {...m, tasks, todoCount, inProgressCount, urgentCount, contents, pendingContent, health};
  });

  const sel = selectedModelId ? modelCards.find(m => m.id === selectedModelId) : null;

  // ── TASK CRUD ──
  const handleAddTask = async () => {
    if (!(taskForm.title||"").trim()) { addToast(fr?"Titre requis":"Title required","error"); return; }
    if (!selectedModelId) return;
    setSaving(true);
    const {error} = await sb.from("model_tasks").insert({
      model_id: selectedModelId, assigned_by: user.id,
      title: taskForm.title.trim(), description: taskForm.description,
      category: taskForm.category, priority: taskForm.priority,
      due_date: taskForm.due_date || null,
    });
    setSaving(false);
    if (error) { addToast("Erreur: " + error.message, "error"); return; }
    setTaskForm({title:"",description:"",category:"general",priority:"medium",due_date:""});
    setShowTaskModal(false);
    await onRefresh();
    addToast(fr ? "Tâche ajoutée" : "Task added", "success");
  };

  const updateTaskStatus = async (taskId, newStatus) => {
    try {
      const updates = {status: newStatus};
      if (newStatus === "done") updates.completed_at = new Date().toISOString();
      else updates.completed_at = null;
      await sb.from("model_tasks").update(updates).eq("id", taskId);
      await onRefresh();
    } catch(e) { /* Task status update failed */ addToast(fr?"Erreur mise à jour tâche":"Task update error","error"); }
  };

  const deleteTask = async (taskId) => {
    await sb.from("model_tasks").delete().eq("id", taskId);
    await onRefresh();
    addToast(fr ? "Tâche supprimée" : "Task deleted", "success");
  };

  // ── CONTENT CRUD ──
  const handleAddContent = async () => {
    if (!(contentForm.title||"").trim()) { addToast(fr?"Titre requis":"Title required","error"); return; }
    if (!selectedModelId) return;
    setSaving(true);
    const {error} = await sb.from("content_list").insert({
      model_id: selectedModelId, assigned_by: user.id,
      title: contentForm.title.trim(), description: contentForm.description,
      content_type: contentForm.content_type, platform: contentForm.platform,
      due_date: contentForm.due_date || null, bonus_amount: Number(contentForm.bonus_amount) || 0,
    });
    setSaving(false);
    if (error) { addToast("Erreur: " + error.message, "error"); return; }
    setContentForm({title:"",description:"",content_type:"photo",platform:"onlyfans",due_date:"",bonus_amount:0});
    setShowContentModal(false);
    await onRefresh();
    addToast(fr ? "Contenu ajouté" : "Content added", "success");
  };

  const updateContentStatus = async (contentId, newStatus) => {
    try {
      const updates = {status: newStatus};
      if (newStatus === "published") updates.completed_at = new Date().toISOString();
      else updates.completed_at = null;
      await sb.from("content_list").update(updates).eq("id", contentId);
      await onRefresh();
    } catch(e) { /* Content status update failed */ addToast(fr?"Erreur mise à jour contenu":"Content update error","error"); }
  };

  const deleteContent = async (contentId) => {
    await sb.from("content_list").delete().eq("id", contentId);
    await onRefresh();
    addToast(fr ? "Contenu supprimé" : "Content deleted", "success");
  };

  // ── CHECKLIST TEMPLATE CRUD ──
  const handleSaveTemplate = async () => {
    if (!(templateForm.name||"").trim()) { addToast(fr?"Nom requis":"Name required","error"); return; }
    setSaving(true);
    const items = templateForm.items.map((t, i) => ({title: t, sort_order: i}));
    if (templateForm.id) {
      await sb.from("checklist_templates").update({name: templateForm.name, items}).eq("id", templateForm.id);
    } else {
      await sb.from("checklist_templates").insert({name: templateForm.name, items});
    }
    setSaving(false);
    setShowTemplateEditor(false);
    setTemplateForm({name:"",items:[]});
    await onRefresh();
    addToast(fr ? "Template sauvegardé" : "Template saved", "success");
  };

  const toggleChecklistItem = async (instanceId, itemIdx) => {
    const inst = checklistInstances.find(ci => ci.id === instanceId);
    if (!inst) return;
    const updatedItems = inst.items.map((it, i) => i === itemIdx ? {...it, checked: !it.checked} : it);
    await sb.from("checklist_instances").update({items: updatedItems}).eq("id", instanceId);
    await onRefresh();
  };

  const catIcon = (c) => c === "social" ? "\u{1F4F1}" : c === "admin" ? "\u{1F4CB}" : c === "content" ? "\u{1F4F8}" : c === "communication" ? "\u{1F4AC}" : "\u{1F4CC}";
  const contentTypeIcon = (t) => t === "photo" ? "\u{1F4F8}" : t === "video" ? "\u{1F3A5}" : t === "live" ? "\u{1F534}" : "\u{1F4E6}";
  const priorityColor = (p) => p === "urgent" ? "var(--danger)" : p === "high" ? "var(--warning)" : p === "medium" ? "var(--accent)" : "var(--text-tertiary)";
  const statusColor = (s) => s === "done" || s === "published" ? "var(--success)" : s === "in_progress" || s === "shooting" || s === "editing" ? "var(--accent)" : s === "ready" ? "var(--pink)" : "var(--warning)";
  const healthColor = (h) => h === null ? "var(--text-quaternary)" : h >= 70 ? "var(--success)" : h >= 40 ? "var(--warning)" : "var(--danger)";

  // ── OVERVIEW (no model selected) ──
  if (!selectedModelId) {
    const totalTasks = modelTasks.filter(t => t.status !== "done").length;
    const urgentTasks = modelTasks.filter(t => t.priority === "urgent" && t.status !== "done").length;
    const pendingContents = contentList.filter(c => c.status !== "published").length;

    return (
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u{1F469}"} {fr?"Modèles Management":"Models Management"}</h2>
            <p style={{fontSize:11,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{fr?"Tâches, contenu et checklists":"Tasks, content and checklists"}</p>
          </div>
          <button onClick={()=>setShowTemplateEditor(true)} className="btn btn-primary" style={{fontSize:11,padding:"7px 16px"}}>
            {"\u2699\uFE0F"} {fr?"Templates Checklist":"Checklist Templates"}
          </button>
        </div>

        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>
          {[
            {label:fr?"Modèles":"Models",value:modeleProfiles.length,icon:"\u{1F469}",color:"var(--accent)"},
            {label:fr?"Tâches actives":"Active tasks",value:totalTasks,icon:"\u{1F4CB}",color:"var(--warning)"},
            {label:fr?"Urgentes":"Urgent",value:urgentTasks,icon:"\u{1F6A8}",color:"var(--danger)"},
            {label:fr?"Contenus en cours":"Pending content",value:pendingContents,icon:"\u{1F4F8}",color:"var(--pink)"},
          ].map((k,i)=>(
            <div key={k.label} style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,padding:"14px 16px"}}>
              <div style={{fontSize:10,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>{k.icon} {k.label}</div>
              <div style={{fontSize:22,fontWeight:800,color:k.color}}>{k.value}</div>
            </div>
          ))}
        </div>

        {/* Model cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280,1fr))",gap:16}}>
          {modelCards.map(m => (
            <div key={m.id} onClick={async()=>{await ensureInstances(m.id);setSelectedModelId(m.id);setSubView("tasks");}} style={{
              background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:18,padding:"20px",cursor:"pointer",
              transition:"all 0.2s",borderLeft:"4px solid "+healthColor(m.health),
            }}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <div style={{width:44,height:44,borderRadius:14,background:"var(--accent-muted)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:18,color:"var(--accent)"}}>{m.name?m.name[0]:"?"}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700}}>{m.name}</div>
                  <div style={{fontSize:10,color:"var(--text-tertiary)"}}>{m.email||""}</div>
                </div>
                {m.health !== null && (
                  <div style={{width:36,height:36,borderRadius:"50%",background:`conic-gradient(${healthColor(m.health)} ${m.health*3.6}deg, var(--bg-overlay) ${m.health*3.6}deg)`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:"var(--card-bg)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,color:healthColor(m.health)}}>{m.health}%</div>
                  </div>
                )}
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {m.todoCount > 0 && <span style={{fontSize:9,padding:"3px 8px",borderRadius:10,background:"var(--warning-muted)",color:"var(--warning)",fontWeight:700}}>{"\u{1F4CB}"} {m.todoCount} {fr?"à faire":"todo"}</span>}
                {m.inProgressCount > 0 && <span style={{fontSize:9,padding:"3px 8px",borderRadius:10,background:"var(--accent-subtle)",color:"var(--accent)",fontWeight:700}}>{"\u{1F504}"} {m.inProgressCount} {fr?"en cours":"ongoing"}</span>}
                {m.urgentCount > 0 && <span style={{fontSize:9,padding:"3px 8px",borderRadius:10,background:"var(--danger-muted)",color:"var(--danger)",fontWeight:700}}>{"\u{1F6A8}"} {m.urgentCount} {fr?"urgent":"urgent"}</span>}
                {m.pendingContent > 0 && <span style={{fontSize:9,padding:"3px 8px",borderRadius:10,background:"var(--pink-muted,var(--accent-subtle))",color:"var(--pink)",fontWeight:700}}>{"\u{1F4F8}"} {m.pendingContent} {fr?"contenus":"content"}</span>}
              </div>
            </div>
          ))}
          {modeleProfiles.length === 0 && <div style={{gridColumn:"1/-1",textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr?"Aucun modèle trouvé":"No models found"}</div>}
        </div>

        {/* Template Editor Modal */}
        {showTemplateEditor && (
          <div style={{position:"fixed",inset:0,background:"var(--modal-backdrop)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}} onClick={()=>setShowTemplateEditor(false)}>
            <div style={{background:"var(--modal-bg)",borderRadius:20,padding:28,width:520,maxHeight:"80vh",overflow:"auto"}} onClick={e=>e.stopPropagation()}>
              <h3 style={{fontSize:16,fontWeight:800,marginBottom:16}}>{"\u2699\uFE0F"} {fr?"Templates Checklists":"Checklist Templates"}</h3>
              {checklistTemplates.map(tpl => (
                <div key={tpl.id} style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:14,padding:16,marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <span style={{fontSize:13,fontWeight:700}}>{tpl.name}</span>
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>{setTemplateForm({id:tpl.id,name:tpl.name,items:(tpl.items||[]).map(i=>i.title)});}} className="btn" style={{fontSize:10,padding:"3px 10px"}}>{fr?"Modifier":"Edit"}</button>
                      <span style={{fontSize:9,padding:"3px 8px",borderRadius:8,background:tpl.active?"var(--success-muted,var(--accent-subtle))":"var(--bg-overlay)",color:tpl.active?"var(--success)":"var(--text-quaternary)",fontWeight:700}}>{tpl.active?(fr?"Actif":"Active"):(fr?"Inactif":"Inactive")}</span>
                    </div>
                  </div>
                  <div style={{fontSize:11,color:"var(--text-secondary)"}}>
                    {(tpl.items||[]).map((it,i) => <div key={`${it.title}-${i}`} style={{padding:"3px 0"}}>{"\u2022"} {it.title}</div>)}
                  </div>
                </div>
              ))}
              {/* Edit/Create form */}
              {templateForm.name !== undefined && (
                <div style={{background:"var(--bg-overlay)",borderRadius:14,padding:16,marginTop:12}}>
                  <input placeholder={fr?"Nom du template":"Template name"} value={templateForm.name} onChange={e=>setTemplateForm({...templateForm,name:e.target.value})} className="input" style={{marginBottom:8,width:"100%"}} />
                  {(templateForm.items||[]).map((it,i)=>(
                    <div key={`${it}-${i}`} style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>
                      <span style={{flex:1,fontSize:12}}>{i+1}. {it}</span>
                      <button onClick={()=>setTemplateForm({...templateForm,items:templateForm.items.filter((_,j)=>j!==i)})} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:14}}>{"\u{1F5D1}"}</button>
                    </div>
                  ))}
                  <div style={{display:"flex",gap:6,marginTop:8}}>
                    <input placeholder={fr?"Nouvel item...":"New item..."} value={newItem} onChange={e=>setNewItem(e.target.value)} className="input" style={{flex:1}} onKeyDown={e=>{if(e.key==="Enter"&&newItem){setTemplateForm({...templateForm,items:[...templateForm.items,newItem]});setNewItem("");}}} />
                    <button onClick={()=>{if(newItem){setTemplateForm({...templateForm,items:[...templateForm.items,newItem]});setNewItem("");}}} className="btn btn-primary" style={{fontSize:11}}>+</button>
                  </div>
                  <div style={{display:"flex",gap:8,marginTop:12}}>
                    <button onClick={handleSaveTemplate} disabled={saving} className="btn btn-primary" style={{fontSize:11}}>{saving?"...":(fr?"Sauvegarder":"Save")}</button>
                    <button onClick={()=>setTemplateForm({name:"",items:[]})} className="btn" style={{fontSize:11}}>{fr?"Nouveau":"New"}</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    );
  }

  // ── DETAIL VIEW (model selected) ──
  const mTasks = modelTasks.filter(t => t.model_id === selectedModelId);
  const mContents = contentList.filter(c => c.model_id === selectedModelId);
  const todayInstances = checklistInstances.filter(ci => ci.model_id === selectedModelId && ci.date === today);

  const tasksByStatus = (status) => mTasks.filter(t => t.status === status);
  const isOverdue = (d) => d && new Date(d) < new Date(today);

  const CONTENT_STATUSES = [
    {value:"pending",label:fr?"En attente":"Pending",color:"var(--warning)"},
    {value:"shooting",label:fr?"Shooting":"Shooting",color:"var(--accent)"},
    {value:"editing",label:fr?"Montage":"Editing",color:"var(--pink)"},
    {value:"ready",label:fr?"Prêt":"Ready",color:"var(--success)"},
    {value:"published",label:fr?"Publié":"Published",color:"var(--success)"},
  ];

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button onClick={()=>setSelectedModelId(null)} className="btn" style={{fontSize:12,padding:"6px 14px"}}>{"\u2190"} {fr?"Retour":"Back"}</button>
        <div style={{width:40,height:40,borderRadius:12,background:"var(--accent-muted)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:16,color:"var(--accent)"}}>{sel?.name?.[0]||"?"}</div>
        <div>
          <h2 style={{fontSize:17,fontWeight:800,margin:0}}>{sel?.name}</h2>
          <p style={{fontSize:11,color:"var(--text-tertiary)",margin:0}}>{sel?.email||""}</p>
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",gap:0,borderRadius:14,border:"1px solid var(--border-default)",overflow:"hidden",marginBottom:20}}>
        {[
          {id:"tasks",label:fr?"Tâches":"Tasks",icon:"\u{1F4CB}",count:mTasks.filter(t=>t.status!=="done").length},
          {id:"content",label:fr?"Contenu":"Content",icon:"\u{1F4F8}",count:mContents.filter(c=>c.status!=="published").length},
          {id:"checklist",label:"Checklist",icon:"\u2705",count:null},
        ].map(st=>(
          <button key={st.id} onClick={()=>setSubView(st.id)} style={{
            padding:"8px 18px",border:"none",background:subView===st.id?"var(--accent-muted)":"transparent",
            color:subView===st.id?"var(--accent)":"var(--text-tertiary)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",
            display:"flex",alignItems:"center",gap:6,
          }}>
            {st.icon} {st.label} {st.count!==null&&st.count>0&&<span style={{fontSize:9,padding:"1px 6px",borderRadius:8,background:"var(--danger-muted)",color:"var(--danger)",fontWeight:800}}>{st.count}</span>}
          </button>
        ))}
      </div>

      {/* ── TASKS SUB-VIEW: Kanban ── */}
      {subView==="tasks"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <span style={{fontSize:14,fontWeight:700}}>{"\u{1F4CB}"} {fr?"Tâches assignées":"Assigned tasks"} ({mTasks.length})</span>
            <button onClick={()=>setShowTaskModal(true)} className="btn btn-primary" style={{fontSize:11,padding:"6px 14px"}}>+ {fr?"Nouvelle tâche":"New task"}</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
            {[
              {status:"todo",label:fr?"À faire":"To do",color:"var(--warning)",icon:"\u{1F4DD}"},
              {status:"in_progress",label:fr?"En cours":"In progress",color:"var(--accent)",icon:"\u{1F504}"},
              {status:"done",label:fr?"Terminé":"Done",color:"var(--success)",icon:"\u2705"},
            ].map(col=>(
              <div key={col.status} style={{background:"var(--bg-overlay)",borderRadius:16,padding:14,minHeight:200}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}>
                  <span style={{fontSize:14}}>{col.icon}</span>
                  <span style={{fontSize:12,fontWeight:700,color:col.color}}>{col.label}</span>
                  <span style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:"var(--bg-overlay)",color:"var(--text-quaternary)",fontWeight:700}}>{tasksByStatus(col.status).length}</span>
                </div>
                {tasksByStatus(col.status).map(task=>(
                  <div key={task.id} style={{
                    background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:14,padding:"12px 14px",marginBottom:8,
                    borderLeft:"3px solid "+priorityColor(task.priority),
                  }}>
                    <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>{task.title}</div>
                    {task.description && <div style={{fontSize:10,color:"var(--text-tertiary)",marginBottom:6}}>{task.description}</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                      <span style={{fontSize:9,padding:"2px 6px",borderRadius:6,background:"var(--accent-subtle)",color:"var(--accent)",fontWeight:600}}>{catIcon(task.category)} {task.category}</span>
                      {task.due_date && <span style={{fontSize:9,color:isOverdue(task.due_date)&&task.status!=="done"?"var(--danger)":"var(--text-quaternary)"}}>{"\u{1F4C5}"} {fmtDate(task.due_date)}</span>}
                      {task.priority==="urgent"&&<span style={{fontSize:9,color:"var(--danger)",fontWeight:700}}>{"\u{1F6A8}"}</span>}
                    </div>
                    <div style={{display:"flex",gap:4,justifyContent:"space-between",alignItems:"center"}}>
                      <select value={task.status} onChange={e=>updateTaskStatus(task.id,e.target.value)} className="filter-select" style={{fontSize:10,padding:"3px 6px"}}>
                        <option value="todo">{fr?"À faire":"Todo"}</option>
                        <option value="in_progress">{fr?"En cours":"In progress"}</option>
                        <option value="done">{fr?"Terminé":"Done"}</option>
                      </select>
                      <button onClick={()=>setConfirmDelete({type:"task",id:task.id,label:task.title})} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:12,opacity:0.6}}>{"\u{1F5D1}"}</button>
                    </div>
                  </div>
                ))}
                {tasksByStatus(col.status).length===0&&<div style={{textAlign:"center",color:"var(--text-quaternary)",fontSize:10,padding:20}}>{fr?"Aucune tâche":"No tasks"}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── CONTENT SUB-VIEW: Table ── */}
      {subView==="content"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <span style={{fontSize:14,fontWeight:700}}>{"\u{1F4F8}"} {fr?"Contenu à produire":"Content to produce"} ({mContents.length})</span>
            <button onClick={()=>setShowContentModal(true)} className="btn btn-primary" style={{fontSize:11,padding:"6px 14px"}}>+ {fr?"Nouveau contenu":"New content"}</button>
          </div>
          {mContents.length === 0 && <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr?"Aucun contenu":"No content"}</div>}
          {mContents.length > 0 && (
            <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:14,overflow:"hidden"}}>
              <table className="table" style={{fontSize:12}}>
                <thead><tr>
                  <th>{fr?"Titre":"Title"}</th><th>Type</th><th>{fr?"Plateforme":"Platform"}</th><th>{fr?"Statut":"Status"}</th><th>{fr?"Échéance":"Due"}</th><th>Bonus</th><th></th>
                </tr></thead>
                <tbody>
                  {mContents.map(c=>(
                    <tr key={c.id}>
                      <td>
                        <div style={{fontWeight:600}}>{c.title}</div>
                        {c.description&&<div style={{fontSize:10,color:"var(--text-tertiary)"}}>{c.description}</div>}
                      </td>
                      <td><span style={{fontSize:10}}>{contentTypeIcon(c.content_type)} {c.content_type}</span></td>
                      <td><span style={{fontSize:10,textTransform:"capitalize"}}>{c.platform||"\u2014"}</span></td>
                      <td>
                        <select value={c.status} onChange={e=>updateContentStatus(c.id,e.target.value)} className="filter-select" style={{fontSize:10,padding:"3px 6px"}}>
                          {CONTENT_STATUSES.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                        </select>
                      </td>
                      <td style={{fontSize:10,color:isOverdue(c.due_date)&&c.status!=="published"?"var(--danger)":"var(--text-secondary)"}}>{c.due_date?fmtDate(c.due_date):"\u2014"}</td>
                      <td style={{fontWeight:600,color:"var(--success)"}}>{c.bonus_amount>0?`+${c.bonus_amount}\u20AC`:"\u2014"}</td>
                      <td><button onClick={()=>setConfirmDelete({type:"content",id:c.id,label:c.title})} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:12,opacity:0.6}}>{"\u{1F5D1}"}</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {/* ── CHECKLIST SUB-VIEW ── */}
      {subView==="checklist"&&(
        <div>
          <div style={{marginBottom:16}}>
            <span style={{fontSize:14,fontWeight:700}}>{"\u2705"} Checklist du {today}</span>
          </div>
          {todayInstances.length===0&&<div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr?"Aucune checklist pour aujourd'hui. Créez un template d'abord.":"No checklist for today. Create a template first."}</div>}
          {todayInstances.map(inst=>{
            const tpl = checklistTemplates.find(t=>t.id===inst.template_id);
            const items = inst.items||[];
            const checked = items.filter(i=>i.checked).length;
            const pct = items.length>0?Math.round((checked/items.length)*100):0;
            return (

const ModelChecklistTab = ({user, lang, checklistInstances, onRefresh}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [localItems, setLocalItems] = useState(null);
  const [instanceId, setInstanceId] = useState(null);
  const [saving, setSaving] = useState(false);

  const ONBOARDING_ITEMS = [
    {title: fr ? "Photo profil uploadée" : "Profile photo uploaded"},
    {title: fr ? "Bio rédigée" : "Bio written"},
    {title: fr ? "Tarifs validés par le gérant" : "Rates validated by manager"},
    {title: fr ? "Première vidéo envoyée" : "First video sent"},
    {title: fr ? "Premier post publié" : "First post published"},
    {title: fr ? "Compte vérifié" : "Account verified"},
  ];

  useEffect(() => {
    const myInstances = (checklistInstances || []).filter(ci => ci.model_id === user.id);
    if (myInstances.length > 0) {
      const inst = myInstances[0];
      setInstanceId(inst.id);
      setLocalItems(inst.items || ONBOARDING_ITEMS.map(it => ({...it, checked: false})));
    } else {
      setLocalItems(null);
      setInstanceId(null);
    }
  }, [checklistInstances, user.id]);

  const initChecklist = async () => {
    const items = ONBOARDING_ITEMS.map(it => ({title: it.title, checked: false}));
    try {
      const {data, error} = await sb.from("checklist_instances").insert({model_id: user.id, date: new Date().toISOString().slice(0, 10), items}).select().single();
      if (error) { addToast(fr ? "Erreur création checklist" : "Checklist creation error", "error"); return; }
      setInstanceId(data.id);
      setLocalItems(data.items);
      if (onRefresh) onRefresh();
    } catch (e) {
      // Checklist instance creation failed
      addToast(fr ? "Erreur création checklist" : "Checklist creation error", "error");
    }
  };

  const toggleItem = async (itemIdx) => {
    if (!instanceId || !localItems || saving) return;
    const updatedItems = localItems.map((it, i) => i === itemIdx ? {...it, checked: !it.checked} : it);
    setSaving(true);
    try {
      const {error} = await sb.from("checklist_instances").update({items: updatedItems}).eq("id", instanceId);
      if (error) { addToast(fr ? "Erreur mise à jour" : "Update error", "error"); setSaving(false); return; }
      setLocalItems(updatedItems);
    } catch (e) {
      // Checklist item toggle failed
      addToast(fr ? "Erreur mise à jour" : "Update error", "error");
    }
    setSaving(false);
  };

  const items = localItems || ONBOARDING_ITEMS.map(it => ({...it, checked: false}));
  const totalChecked = items.filter(i => i.checked).length;
  const pct = Math.round((totalChecked / items.length) * 100);

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u2705"} {fr ? "Ma Checklist Onboarding" : "My Onboarding Checklist"}</h2>
        <p style={{fontSize:12,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{fr ? "Complète ces étapes pour démarrer" : "Complete these steps to get started"}</p>
      </div>

      {/* Progress bar */}
      <div style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,padding:"18px 20px",marginBottom:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:700}}>{fr ? "Progression" : "Progress"}</span>
          <span style={{fontSize:15,fontWeight:800,color:pct===100?"#10B981":"var(--text-secondary)"}}>{pct}%</span>
        </div>
        <div style={{height:10,borderRadius:5,background:"var(--bg-overlay)"}}>
          <div style={{height:10,borderRadius:5,background:"#10B981",width:pct+"%",transition:"width 0.3s"}}/>
        </div>
        <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:6}}>{totalChecked}/{items.length} {fr ? "complétés" : "completed"}</div>
      </div>

      {!instanceId && !localItems && (
        <div style={{textAlign:"center",padding:40}}>
          <p style={{color:"var(--text-quaternary)",marginBottom:16}}>{fr ? "Aucune checklist. Clique pour démarrer ton onboarding." : "No checklist. Click to start your onboarding."}</p>
          <button className="btn btn-primary" onClick={initChecklist}>{fr ? "Démarrer ma checklist" : "Start my checklist"}</button>
        </div>
      )}

      {items.length > 0 && instanceId && (
        <div style={{display:"grid",gap:10}}>
          {items.map((item, idx) => {
            const itemPct = item.checked ? 100 : 0;
            return (
              <div key={idx} onClick={() => toggleItem(idx)} className="card card-hover" style={{
                padding:"16px 20px",cursor:saving?"not-allowed":"pointer",
                borderLeft: item.checked ? "4px solid #10B981" : "4px solid var(--border-subtle)",
              }}>
                <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:8}}>
                  <div style={{width:28,height:28,borderRadius:8,border:"2px solid "+(item.checked?"#10B981":"var(--border-default)"),background:item.checked?"#10B981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}>
                    {item.checked && <span style={{color:"#fff",fontSize:14,fontWeight:800}}>{"\u2713"}</span>}
                  </div>
                  <span style={{fontSize:14,fontWeight:600,textDecoration:item.checked?"line-through":"none",opacity:item.checked?0.6:1,flex:1}}>{item.checked?"\u2705":"\u2B1C"} {item.title}</span>
                </div>
                <div style={{fontSize:11,color:"var(--text-tertiary)",marginBottom:6}}>{item.checked?(fr?"Compl\u00E9t\u00E9":"Completed"):(fr?"Non compl\u00E9t\u00E9":"Not completed")}</div>
                <div style={{height:4,borderRadius:2,background:"#2A2A3E"}}>
                  <div style={{height:"100%",borderRadius:2,background:"#10B981",width:itemPct+"%",transition:"width 0.3s"}}/>
                </div>
                <div style={{fontSize:10,color:"var(--text-quaternary)",marginTop:4,textAlign:"right"}}>{itemPct}%</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

// =============================================
// MODEL ROLE — MES TÂCHES (from model_tasks)
// =============================================
const ModelTasksTab = ({user, lang, modelTasks, onRefresh}) => {
  const addToast = useToast();
  const fr = lang === "fr";
  const [saving, setSaving] = useState(false);

  const myTasks = (modelTasks || []).filter(t => t.model_id === user.id);
  const sortByDue = (arr) => [...arr].sort((a, b) => {
    if (!a.due_date && !b.due_date) return 0;
    if (!a.due_date) return 1;
    if (!b.due_date) return -1;
    return new Date(a.due_date) - new Date(b.due_date);
  });
  const todo = sortByDue(myTasks.filter(t => t.status === "todo"));
  const inProgress = sortByDue(myTasks.filter(t => t.status === "in_progress"));
  const done = sortByDue(myTasks.filter(t => t.status === "done"));

  const updateStatus = async (taskId, newStatus) => {
    if (saving) return;
    setSaving(true);
    const updates = {status: newStatus};
    if (newStatus === "done") updates.completed_at = new Date().toISOString();
    else updates.completed_at = null;
    try {
      const {error} = await sb.from("model_tasks").update(updates).eq("id", taskId);
      if (error) { addToast(fr ? "Erreur mise à jour" : "Update error", "error"); setSaving(false); return; }
      if (onRefresh) onRefresh();
      if (newStatus === "done") addToast(fr ? "Tâche terminée" : "Task completed", "success");
    } catch (e) {
      // Task status update failed
      addToast(fr ? "Erreur mise à jour" : "Update error", "error");
    }
    setSaving(false);
  };

  const isOverdue = (d) => d && new Date(d) < new Date(new Date().toISOString().slice(0, 10));
  const catIcon = (c) => c === "social" ? "\u{1F4F1}" : c === "admin" ? "\u{1F4CB}" : c === "content" ? "\u{1F4F8}" : c === "communication" ? "\u{1F4AC}" : "\u{1F4CC}";

  const renderTask = (task) => (
    <div key={task.id} style={{
      display:"flex",alignItems:"center",gap:14,padding:"14px 18px",
      background:"var(--card-bg)",border:"1px solid "+(task.priority==="urgent"?"var(--danger-muted)":task.priority==="high"?"var(--warning-muted)":"var(--border-subtle)"),
      borderRadius:14,marginBottom:8,
    }}>
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,textDecoration:task.status==="done"?"line-through":"none",opacity:task.status==="done"?0.5:1}}>{task.title}</div>
        {task.description && <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:3}}>{task.description}</div>}
        <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
          {task.category && <span style={{fontSize:10,padding:"1px 6px",borderRadius:6,background:"var(--accent-subtle)",color:"var(--accent)",fontWeight:600}}>{catIcon(task.category)} {task.category}</span>}
          {task.due_date && <span style={{fontSize:10,color:isOverdue(task.due_date)&&task.status!=="done"?"var(--danger)":"var(--text-quaternary)"}}>{"\u{1F4C5}"} {fmtDate(task.due_date)}</span>}
          {task.priority==="urgent"&&<span style={{fontSize:10,color:"var(--danger)",fontWeight:700}}>{"\u{1F6A8}"} URGENT</span>}
          {task.priority==="high"&&<span style={{fontSize:10,color:"var(--warning)",fontWeight:600}}>{"\u26A0\uFE0F"} {fr?"Prioritaire":"High"}</span>}
        </div>
      </div>
      <select value={task.status} onChange={e=>updateStatus(task.id,e.target.value)} disabled={saving} className="filter-select" style={{fontSize:11,padding:"5px 8px"}}>
        <option value="todo">{fr?"À faire":"To do"}</option>
        <option value="in_progress">{fr?"En cours":"In progress"}</option>
        <option value="done">{fr?"Terminé":"Done"}</option>
      </select>
    </div>
  );

  const renderSection = (title, icon, color, tasks) => (
    <div style={{marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <span>{icon}</span>
        <span style={{fontSize:14,fontWeight:700,color}}>{title}</span>
        <span style={{fontSize:12,color:"var(--text-quaternary)",fontWeight:600}}>({tasks.length})</span>
      </div>
      {tasks.length === 0 && <div style={{fontSize:12,color:"var(--text-quaternary)",padding:"12px 18px",background:"var(--card-bg)",borderRadius:12,border:"1px solid var(--border-subtle)"}}>{fr?"Aucune tâche":"No tasks"}</div>}
      {tasks.map(renderTask)}
    </div>
  );

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h2 style={{fontSize:18,fontWeight:800,margin:0}}>{"\u{1F4CB}"} {fr?"Mes Tâches":"My Tasks"}</h2>
        <p style={{fontSize:12,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{todo.length} {fr?"à faire":"to do"} {"\u00B7"} {inProgress.length} {fr?"en cours":"in progress"} {"\u00B7"} {done.length} {fr?"terminées":"done"}</p>
      </div>

      {myTasks.length === 0 && (
        <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:40}}>{fr?"Aucune tâche assignée":"No tasks assigned"}</div>
      )}

      {myTasks.length > 0 && (<>
        {renderSection(fr?"À faire":"To do", "\u{1F4DD}", "var(--warning)", todo)}
        {renderSection(fr?"En cours":"In progress", "\u{1F504}", "var(--accent)", inProgress)}
        {renderSection(fr?"Terminées":"Done", "\u2705", "var(--success)", done)}
      </>)}
    </div>
  );
};

// =============================================
// GÉRANT — AGENCY HEALTH SCORE
// =============================================
const AgencyHealthScore = ({txs, profiles}) => {
  const score = useMemo(() => {
    let s = 100;
    const now = Date.now();
    const pendingOld = txs.filter(tx => tx.status === "pending" && (now - new Date(tx.date).getTime()) > 24 * 3600000);
    s -= Math.min(pendingOld.length * 2, 20);
    const decided = txs.filter(tx => tx.status !== "pending");
    const validated = txs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
    const convRate = decided.length > 0 ? (validated.length / decided.length) * 100 : 100;
    if (convRate < 60) s -= 15; else if (convRate < 75) s -= 5;
    const chatters = profiles.filter(p => p.role === "chatter");
    const weekAgo = now - 7 * 86400000;
    const inactiveChatters = chatters.filter(ch => !txs.some(tx => tx.chatter_id === ch.id && new Date(tx.date).getTime() > weekAgo));
    s -= Math.min(inactiveChatters.length * 5, 15);
    return Math.max(0, Math.min(100, Math.round(s)));
  }, [txs, profiles]);

  const color = score > 70 ? "var(--success)" : score > 40 ? "var(--warning)" : "var(--danger)";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
      <div style={{
        width: 80, height: 80, borderRadius: "50%",
        background: `conic-gradient(${color} ${score * 3.6}deg, var(--bg-overlay) ${score * 3.6}deg)`,
        display: "flex", alignItems: "center", justifyContent: "center",
        boxShadow: `0 0 20px ${color}25`,
      }}>
        <div style={{ width: 64, height: 64, borderRadius: "50%", background: "var(--bg-raised)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 20, fontWeight: 800, color }}>{score}</span>
          <span style={{ fontSize: 8, color: "var(--text-quaternary)", textTransform: "uppercase", letterSpacing: 1 }}>Sant\u00E9</span>
        </div>
      </div>
      <div>
        <div style={{ fontSize: 13, fontWeight: 700 }}>{score > 70 ? "\u2705 Excellente" : score > 40 ? "\u26A0\uFE0F Attention" : "\u{1F6A8} Critique"}</div>
        <div style={{ fontSize: 10, color: "var(--text-tertiary)" }}>Score de sant\u00E9 de l'agence</div>
      </div>
    </div>
  );
};

// =============================================
// GÉRANT — AGENCY ACHIEVEMENTS
// =============================================
const AgencyAchievements = ({txs, profiles, models, expenses, convertAmount}) => {
  const stats = useMemo(() => {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); monday.setHours(0, 0, 0, 0);
    const validated = txs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
    const monthlyCA = validated.filter(tx => new Date(tx.date) >= monthStart).reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
    const weeklyTxCount = txs.filter(tx => new Date(tx.date) >= monday && (tx.status === "validated" || tx.status === "confirmee")).length;
    const modelStats = models.map(m => {
      const mTxs = validated.filter(tx => tx.model_id === m.id);
      const ca = mTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const mExp = (expenses || []).filter(e => e.model_id === m.id).reduce((s, e) => s + Number(e.amount), 0);
      return { margin: ca > 0 ? ((ca - mExp) / ca) * 100 : 0 };
    });
    const highMarginModels = modelStats.filter(m => m.margin >= 80).length;
    const now48h = Date.now() - 48 * 3600000;
    const oldPending = txs.filter(tx => tx.status === "pending" && new Date(tx.date).getTime() < now48h).length;
    const chatters = profiles.filter(p => p.role === "chatter");
    const allGoalsMet = chatters.length > 0 && chatters.every(ch => {
      const goal = Number(ch.daily_goal) || 500;
      const daily = getDailyProgress(ch.id, txs, convertAmount);
      return daily >= goal;
    });
    const allStreaks7 = chatters.length > 0 && chatters.every(ch => calculateStreak(ch.id, txs) >= 7);
    const spenderWeekly = {};
    txs.filter(tx => new Date(tx.date) >= monday && (tx.status === "validated" || tx.status === "confirmee")).forEach(tx => {
      const k = tx.spender_handle || "?";
      spenderWeekly[k] = (spenderWeekly[k] || 0) + convertAmount(Number(tx.amount), tx.currency);
    });
    const topWeeklySpender = Math.max(0, ...Object.values(spenderWeekly));
    return { monthlyCA, weeklyTxCount, highMarginModels, oldPending, allGoalsMet, allStreaks7, topWeeklySpender };
  }, [txs, profiles, models, expenses, convertAmount]);

  return (

// GÉRANT — ACTIVITY HEATMAP (365 days)
// =============================================
const ActivityHeatmap = ({txs, convertAmount, currencySymbol}) => {
  const heatmapData = useMemo(() => {
    const data = {};
    txs.forEach(tx => {
      if (tx.status === "validated" || tx.status === "confirmee") {
        const day = new Date(tx.date).toISOString().slice(0, 10);
        if (!data[day]) data[day] = 0;
        data[day] += convertAmount(Number(tx.amount), tx.currency);
      }
    });
    return data;
  }, [txs, convertAmount]);
  const maxCA = Math.max(1, ...Object.values(heatmapData));

  const cells = [];
  for (let i = 364; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toISOString().slice(0, 10);
    const ca = heatmapData[key] || 0;
    const intensity = ca / maxCA;
    cells.push(
      <div key={key} title={`${key} \u2014 ${Math.round(ca).toLocaleString()}${currencySymbol}`}
        style={{ width: 12, height: 12, borderRadius: 3, background: ca === 0 ? "var(--card-bg)" : `rgba(99,102,241,${0.15 + intensity * 0.85})`, cursor: "pointer", opacity: ca === 0 ? 1 : undefined }} />
    );
  }

  return (
    <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 12, padding: 20 }}>
      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>{"\u{1F4C5}"} Activit\u00E9 de l'agence \u2014 12 derniers mois</h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(53, 12px)", gridTemplateRows: "repeat(7, 12px)", gap: 2, gridAutoFlow: "column", overflowX: "auto" }}>
        {cells}
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
        <span style={{ fontSize: 10, color: "var(--text-quaternary)" }}>Moins</span>
        {[0.1, 0.3, 0.5, 0.7, 1].map((op, i) => (
          <div key={op} style={{ width: 12, height: 12, borderRadius: 3, background: `rgba(99,102,241,${0.15 + op * 0.85})` }} />
        ))}
        <span style={{ fontSize: 10, color: "var(--text-quaternary)" }}>Plus</span>
      </div>
    </div>
  );
};

      {active.map(ch => {

// WHATSAPP ANALYZER
