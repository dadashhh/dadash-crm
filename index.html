<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06080f">
  <title>DADASH - OFM CRM v10</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    /* Safe area support for notched iPhones */
    @supports (padding: env(safe-area-inset-bottom)) {
      .sidebar { padding-bottom: env(safe-area-inset-bottom); }
      .login-wrap { padding-bottom: env(safe-area-inset-bottom); }
    }
    :root {
      --bg: #06080f;
      --bg2: #0c1020;
      --card: rgba(16,24,48,0.75);
      --primary: #6366f1;
      --accent: #8b5cf6;
      --pink: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e5e7eb;
      --text2: #9ca3af;
      --grad: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg);
      position: relative; overflow: hidden;
    }
    .login-orb {
      position: absolute; border-radius: 50%;
      filter: blur(40px); opacity: 0.15;
    }
    .login-orb-1 { width: 300px; height: 300px; background: #6366f1; top: -100px; left: -100px; }
    .login-orb-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: -100px; right: -100px; }
    .login-card {
      background: var(--card); backdrop-filter: blur(20px);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 16px; padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: relative; z-index: 1;
    }
    .login-logo {
      width: 60px; height: 60px;
      background: var(--grad);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: bold;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }
    .login-title {
      text-align: center; font-size: 24px; font-weight: 700;
      margin-bottom: 10px;
    }
    .login-subtitle {
      text-align: center; color: var(--text2); font-size: 13px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text2); margin-bottom: 6px; text-transform: uppercase;
    }
    .form-input {
      width: 100%; padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      transition: all 0.3s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .form-input::placeholder { color: var(--text2); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: var(--grad);
      color: white;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99,102,241,0.3);
    }
    .lang-toggle {
      position: absolute; top: 20px; right: 20px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-toggle:hover { background: rgba(139,92,246,0.2); }
    .app-wrap { display: flex; height: 100vh; }
    .sidebar {
      width: 72px; background: rgba(12,16,32,0.8);
      border-right: 1px solid rgba(139,92,246,0.1);
      display: flex; flex-direction: column;
      align-items: center;
      padding: 16px 0;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: var(--grad);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      margin-bottom: 32px;
      cursor: pointer;
    }
    .sidebar-nav {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 8px;
    }
    .sidebar-btn {
      width: 50px; height: 50px;
      border: none;
      background: transparent;
      color: var(--text2);
      border-left: 3px solid transparent;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .sidebar-btn:hover { color: var(--text); background: rgba(139,92,246,0.1); }
    .sidebar-btn.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(139,92,246,0.15);
    }
    .sidebar-footer {
      display: flex; flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .sidebar-footer button {
      width: 50px; height: 50px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .sidebar-footer button:hover { color: var(--text); }
    .main-area {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      background: rgba(12,16,32,0.6);
      border-bottom: 1px solid rgba(139,92,246,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .user-name { color: var(--accent); font-weight: 600; font-size: 14px; }
    .role-badge {
      background: rgba(139,92,246,0.2);
      border: 1px solid rgba(139,92,246,0.3);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .section-title {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-bar {
      width: 3px; height: 20px;
      background: var(--grad);
      border-radius: 2px;
    }
    .filter-bar {
      display: flex; gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-chip {
      padding: 8px 12px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--grad);
      border-color: transparent;
      color: white;
    }
    .filter-chip:hover { border-color: rgba(139,92,246,0.4); }
    .filter-date {
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-date:focus { outline: none; border-color: var(--primary); }
    .filter-select {
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--primary); }
    .filter-select option { background: var(--bg2); color: var(--text); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(20px);
    }
    .kpi-label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .kpi-sublabel { font-size: 11px; color: var(--text2); margin-top: 6px; }
    .kpi.warning { border-color: rgba(245,158,11,0.2); }
    .kpi.warning .kpi-value {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }
    .grid-55-45 {
      display: grid;
      grid-template-columns: 55% 45%;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(20px);
    }
    .spender-card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(20px);
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
    }
    .spender-card:hover {
      border-color: rgba(139,92,246,0.3);
      background: rgba(16,24,48,0.95);
    }
    .spender-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .spender-name { font-weight: 600; font-size: 14px; }
    .spender-ltv {
      font-size: 16px;
      font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .spender-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 12px;
      color: var(--text2);
    }
    .spender-meta-item { display: flex; justify-content: space-between; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pending { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    .badge-validated { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .badge-refused { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .badge-whale { background: rgba(236,72,153,0.2); color: #f472b6; border: 1px solid rgba(236,72,153,0.3); }
    .badge-vip { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
    .badge-regular { background: rgba(139,92,246,0.2); color: #d8b4fe; border: 1px solid rgba(139,92,246,0.3); }
    .badge-dormant { background: rgba(107,114,128,0.2); color: #d1d5db; border: 1px solid rgba(107,114,128,0.3); }
    .badge-nouveau { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
    .badge-done { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th {
      background: rgba(139,92,246,0.1);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .table td { border-bottom: 1px solid rgba(139,92,246,0.05); padding: 12px; }
    .table tr:hover { background: rgba(139,92,246,0.05); }
    .progress {
      width: 100%; height: 6px;
      background: rgba(139,92,246,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar { height: 100%; background: var(--grad); transition: width 0.3s; }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin: 12px 0;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      background: rgba(99,102,241,0.1);
      border-radius: 4px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(99,102,241,0.2);
    }
    .heatmap-cell.active { background: var(--grad); border-color: transparent; }
    .ai-card {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .ai-card:hover { border-color: rgba(139,92,246,0.3); background: rgba(16,24,48,0.95); }
    .ai-card-icon { font-size: 32px; margin-bottom: 8px; }
    .ai-card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .ai-card-desc { font-size: 12px; color: var(--text2); }
    .ai-result {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      color: #6ee7b7;
      font-size: 12px;
      line-height: 1.5;
    }
    .ai-loading {
      display: inline-block; width: 8px; height: 8px;
      background: var(--success); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { opacity: 0.9; }
    .btn-small { padding: 6px 12px; font-size: 11px; }
    .podium {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 20px; margin-bottom: 32px; height: 200px;
    }
    .podium-step { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .podium-rank { font-size: 32px; margin-bottom: 8px; }
    .podium-bar {
      background: var(--grad); width: 80px;
      border-radius: 8px 8px 0 0; transition: all 0.3s;
    }
    .podium-bar:hover { box-shadow: 0 0 20px rgba(99,102,241,0.5); }
    .podium-name { margin-top: 8px; font-weight: 600; font-size: 13px; }
    .podium-ca { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .trophy { font-size: 40px; text-align: center; margin-bottom: 24px; }
    .profile-panel {
      background: var(--card);
      border: 1px solid rgba(139,92,246,0.1);
      border-radius: 12px;
      padding: 20px;
      max-height: 600px;
      overflow-y: auto;
    }
    .profile-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 1px solid rgba(139,92,246,0.1);
    }
    .profile-name { font-size: 18px; font-weight: 700; }
    .profile-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }
    .profile-section { margin-bottom: 20px; }
    .profile-section-title {
      font-size: 12px; font-weight: 600; color: var(--text2);
      text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;
    }
    .profile-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
    .form-group-modal { margin-bottom: 16px; }
    .error-msg { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; }
    .loading-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(139,92,246,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info-box { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px; padding: 12px; font-size: 12px; color: var(--text2); margin-bottom: 16px; }
    /* ============================================= */
    /* TABLET (max 1200px)                           */
    /* ============================================= */
    @media (max-width: 1200px) {
      .grid-55-45 { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ============================================= */
    /* MOBILE — LARGE PHONES + SMALL TABLETS         */
    /* iPhone 16 Pro Max (430px), Galaxy S24 (412px) */
    /* ============================================= */
    @media (max-width: 768px) {
      /* --- GLOBAL RESET --- */
      html { font-size: 14px; }
      body { overflow: auto; -webkit-text-size-adjust: 100%; }
      * { -webkit-tap-highlight-color: transparent; }

      /* --- APP LAYOUT --- */
      .app-wrap { flex-direction: column; height: 100vh; height: 100dvh; }

      /* --- BOTTOM NAV BAR --- */
      .sidebar {
        position: fixed; bottom: 0; left: 0; right: 0;
        width: 100%; height: 60px;
        flex-direction: row; padding: 0; z-index: 100;
        border-right: none;
        border-top: 1px solid rgba(139,92,246,0.25);
        background: rgba(6,8,15,0.97);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        justify-content: space-between;
        align-items: stretch;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar-logo { display: none; }
      .sidebar-nav {
        flex-direction: row;
        gap: 0;
        flex: 1;
        justify-content: space-evenly;
        align-items: center;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .sidebar-nav::-webkit-scrollbar { display: none; }
      .sidebar-btn {
        width: 48px; height: 48px;
        min-width: 48px;
        font-size: 20px;
        border-left: none;
        border-radius: 10px;
        border-bottom: 2px solid transparent;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.15s ease;
      }
      .sidebar-btn:active { transform: scale(0.92); background: rgba(139,92,246,0.2); }
      .sidebar-btn.active {
        border-left-color: transparent;
        border-bottom-color: var(--accent);
        background: rgba(139,92,246,0.12);
      }
      .sidebar-footer {
        flex-direction: row;
        gap: 0;
        padding: 0 4px;
        align-items: center;
      }
      .sidebar-footer button {
        width: 40px; height: 40px;
        min-width: 40px;
        font-size: 16px;
        border-radius: 8px;
      }
      .sidebar-footer button:active { transform: scale(0.9); }

      /* --- MAIN AREA --- */
      .main-area {
        padding-bottom: 60px;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
      }

      /* --- TOPBAR (STICKY) --- */
      .topbar {
        height: 48px;
        padding: 0 12px;
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(6,8,15,0.97);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        flex-shrink: 0;
      }
      .topbar-left { font-size: 13px; gap: 6px; }
      .topbar-left span:first-child { font-size: 16px; }
      .topbar-right { gap: 6px; }
      .user-name { font-size: 11px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .role-badge { font-size: 9px; padding: 2px 6px; }

      /* --- CONTENT AREA --- */
      .content {
        padding: 12px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* --- KPI CARDS (2x2 grid) --- */
      .kpi-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .kpi {
        padding: 10px;
        border-radius: 10px;
      }

    else if(key==="model") setModel(val);
    else if(key==="status") setStatus(val);
    else if(key==="chatter") setChatter(val);
  };
  let filtered = txs;
  if(model) filtered = filtered.filter(tx=>tx.model_id===model);
  if(status) filtered = filtered.filter(tx=>tx.status===status);
  if(chatter) filtered = filtered.filter(tx=>tx.chatter_id===chatter);
  const cutoff = getDateRange(period);
  filtered = filtered.filter(tx=>new Date(tx.date)>=cutoff);
  const pending = filtered.filter(tx=>tx.status==="pending");
  const validated = filtered.filter(tx=>tx.status==="validated");
  const caGross = filtered.reduce((s,tx)=>s+Number(tx.amount),0);
  const commTotal = filtered.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
  const caNet = filtered.reduce((s,tx)=>s+Number(tx.net_amount||0),0);
  const caPending = pending.reduce((s,tx)=>s+Number(tx.amount),0);
  const caValidated = validated.reduce((s,tx)=>s+Number(tx.amount),0);
  return (
    <div>
      <FilterBar lang={lang} onFilterChange={handleFilter} period={period} modelFilter={model} statusFilter={status} chatterFilter={chatter} role={user.role} models={models} profiles={profiles} />
      <div className="kpi-grid">
        {user.role==="gerant"?
          <><KPICard label={t(lang,"ca_brut")} value={`${caGross}`} /><KPICard label={t(lang,"net_agence")} value={`${caNet.toFixed(0)}`} /></>
          :<KPICard label={t(lang,"mon_ca")} value={`${caGross}`} />
        }
        <KPICard label={t(lang,"nb_txs")} value={`${filtered.length}`} />
        <KPICard label={t(lang,"marge_comm")} value={`${(caNet-commTotal).toFixed(0)}/${commTotal.toFixed(0)}`} />

      <div className="kpi-grid">
        <KPICard label={t(lang,"ca_pending")} value={`${caPending}`} className="warning" />
        <KPICard label={t(lang,"nb_pending")} value={`${pending.length}`} className="warning" />
        <KPICard label={t(lang,"ca_validated")} value={`${caValidated}`} className="warning" />
        <KPICard label={t(lang,"nb_validated")} value={`${validated.length}`} className="warning" />
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>{t(lang,"revenue_by_model")}</div>
          <div className="table-wrap">
            <table className="table"><thead><tr><th>Model</th><th>CA</th></tr></thead>
            <tbody>
              {models.map(m=>{
                const ca = filtered.filter(tx=>tx.model_id===m.id).reduce((s,tx)=>s+Number(tx.amount),0);
                return <tr key={m.id}><td>{m.name}</td><td>{ca}</td></tr>;
              })}
            </tbody></table>
          </div>
        </div>
        {user.role==="gerant"?
          <div className="card">
            <div className="section-title"><div className="section-bar"></div>{t(lang,"revenue_by_chatter")}</div>
            <div className="table-wrap">
              <table className="table"><thead><tr><th>Chatter</th><th>CA</th></tr></thead>
              <tbody>
                {profiles.filter(u=>u.role==="chatter").map(u=>{
                  const ca = filtered.filter(tx=>tx.chatter_id===u.id).reduce((s,tx)=>s+Number(tx.amount),0);
                  return <tr key={u.id}><td>{u.name}</td><td>{ca}</td></tr>;
                })}
              </tbody></table>
            </div>
          </div>
          :
          <div className="card">
            <div className="section-title"><div className="section-bar"></div>{t(lang,"recent_tx")}</div>
            <div className="table-wrap">
              <table className="table"><thead><tr><th>{t(lang,"date")}</th><th>Spender</th><th>{t(lang,"amount")}</th></tr></thead>
              <tbody>
                {filtered.slice(0,5).map(tx=>(
                  <tr key={tx.id}><td>{fmtDate(tx.date)}</td><td>{tx.spender_handle}</td><td>{tx.amount}</td></tr>
                ))}
              </tbody></table>
            </div>

const TransactionsTab = ({user, lang, txs, models, providers, profiles, onRefresh}) => {
  const [period, setPeriod] = useState("7j");
  const [model, setModel] = useState("");
  const [status, setStatus] = useState("");
  const [chatter, setChatter] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({spender_handle:"",amount:"",currency:"EUR",model_id:"",chatter_id:user.id,provider_id:"",product:"",tag:"",notes:""});
  const handleFilter = (key, val) => {
    if(key==="period") setPeriod(val);
    else if(key==="model") setModel(val);
    else if(key==="status") setStatus(val);
    else if(key==="chatter") setChatter(val);
  };
  let filtered = txs;
  if(model) filtered = filtered.filter(tx=>tx.model_id===model);
  if(status) filtered = filtered.filter(tx=>tx.status===status);
  if(chatter) filtered = filtered.filter(tx=>tx.chatter_id===chatter);
  const cutoff = getDateRange(period);
  filtered = filtered.filter(tx=>new Date(tx.date)>=cutoff);

  const handleCreate = async () => {
    if(!form.spender_handle||!form.amount||!form.model_id||!form.provider_id) return;
    setSaving(true);
    const {error} = await sb.from("transactions").insert({
      spender_handle: form.spender_handle,
      amount: parseFloat(form.amount),
      currency: form.currency,
      model_id: form.model_id,
      chatter_id: form.chatter_id,
      provider_id: form.provider_id,
      product: form.product,
      tag: form.tag,
      notes: form.notes,
      status: "pending"
    });
    setSaving(false);
    if(!error) {
      setForm({spender_handle:"",amount:"",currency:"EUR",model_id:"",chatter_id:user.id,provider_id:"",product:"",tag:"",notes:""});
      setShowForm(false);
      onRefresh();
    }
  };
  const handleStatus = async (txId, newStatus) => {
    await sb.from("transactions").update({status:newStatus}).eq("id",txId);
    onRefresh();
  };
  return (
    <div>
      <FilterBar lang={lang} onFilterChange={handleFilter} period={period} modelFilter={model} statusFilter={status} chatterFilter={chatter} role={user.role} models={models} profiles={profiles} />
      {(user.role==="gerant"||user.role==="chatter")&&(
        <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ {t(lang,"new_tx")}</button>
      )}
      {showForm&&(
        <div className="card" style={{marginBottom:20}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"spender")}</label>
              <input className="form-input" value={form.spender_handle} onChange={e=>setForm({...form,spender_handle:e.target.value})} placeholder="@handle" />
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"amount")}</label>
              <input className="form-input" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"currency")}</label>
              <select className="filter-select" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>
                <option>EUR</option><option>CHF</option><option>USD</option>
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"model")}</label>
              <select className="filter-select" value={form.model_id} onChange={e=>setForm({...form,model_id:e.target.value})}>
                <option value="">Select</option>
                {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"provider")}</label>
              <select className="filter-select" value={form.provider_id} onChange={e=>setForm({...form,provider_id:e.target.value})}>
                <option value="">Select</option>
                {providers.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            {user.role==="gerant"&&(
              <div className="form-group-modal">

                <select className="filter-select" value={form.chatter_id} onChange={e=>setForm({...form,chatter_id:e.target.value})}>
                  {profiles.filter(u=>u.role==="chatter").map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                </select>
              </div>
            )}
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"product")}</label>
              <select className="filter-select" value={form.product} onChange={e=>setForm({...form,product:e.target.value})}>

                {PRODUCTS.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"tag")}</label>
              <select className="filter-select" value={form.tag} onChange={e=>setForm({...form,tag:e.target.value})}>
                <option value="">Select</option>
                {TAGS.map(tag=><option key={tag} value={tag}>{tag}</option>)}

            <button className="btn btn-danger" onClick={()=>setShowForm(false)}>{t(lang,"cancel")}</button>

        </div>

        <div className="table-wrap">
          <table className="table">

              <tr><th>{t(lang,"date")}</th><th>Spender</th><th>Model</th><th>Chatter</th><th>{t(lang,"amount")}</th><th>{t(lang,"fees")}</th><th>{t(lang,"commission")}</th><th>{t(lang,"status")}</th>{user.role==="gerant"&&<th>{t(lang,"actions")}</th>}</tr>

              {filtered.map(tx=>{

                const chName = profiles.find(u=>u.id===tx.chatter_id)?.name||"?";

    </div>
  );
};

const SpendersTab = ({user, lang, txs, models}) => {
  const [sortBy, setSortBy] = useState("ltv");
  const [selected, setSelected] = useState(null);
  const spenders = useMemo(()=>{
    const map = {};
    txs.forEach(tx=>{
      const h = tx.spender_handle;
      if(!map[h]) map[h] = {name:h,txs:[]};
      map[h].txs.push(tx);
    });
    return Object.values(map).map(s=>{
      const ltv = s.txs.reduce((sum,tx)=>sum+Number(tx.amount),0);
      const cnt = s.txs.length;
      const aov = ltv/cnt;
      const validCA = s.txs.filter(tx=>tx.status==="validated").reduce((sum,tx)=>sum+Number(tx.amount),0);
      return {...s,ltv,cnt,aov,validCA,segment:getSpenderSegment(ltv)};
    });
  },[txs]);
  let sorted = [...spenders];
  if(sortBy==="frequency") sorted.sort((a,b)=>b.cnt-a.cnt);
  else if(sortBy==="recency") sorted.sort((a,b)=>new Date(b.txs[b.txs.length-1].date)-new Date(a.txs[a.txs.length-1].date));
  else sorted.sort((a,b)=>b.ltv-a.ltv);
  const avgLtv = sorted.length>0 ? sorted.reduce((s,x)=>s+x.ltv,0)/sorted.length : 0;
  return (
    <div>
      <div className="kpi-grid">
        <KPICard label={t(lang,"spenders")} value={`${sorted.length}`} />
        <KPICard label={t(lang,"avg_ltv")} value={`${avgLtv.toFixed(0)}`} />
        <KPICard label="At Risk" value={`${sorted.filter(s=>s.segment==="dormant").length}`} />
        <KPICard label="Top Spender" value={sorted[0]?sorted[0].name:"N/A"} />
      </div>
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        <button className={`filter-chip ${sortBy==="ltv"?"active":""}`} onClick={()=>setSortBy("ltv")}>LTV</button>
        <button className={`filter-chip ${sortBy==="frequency"?"active":""}`} onClick={()=>setSortBy("frequency")}>{t(lang,"frequency")}</button>
        <button className={`filter-chip ${sortBy==="recency"?"active":""}`} onClick={()=>setSortBy("recency")}>{t(lang,"recency")}</button>
      </div>
      <div className="grid-55-45">
        <div>
          {sorted.map(s=>(
            <div key={s.name} className="spender-card" onClick={()=>setSelected(s)}>
              <div className="spender-top">
                <div className="spender-name">{s.name}</div>
                <span className={`badge badge-${s.segment}`}>{s.segment}</span>
              </div>
              <div className="spender-ltv">{s.ltv}</div>
              <div className="spender-meta">
                <div className="spender-meta-item"><span>{t(lang,"aov")}</span><span>{s.aov.toFixed(0)}</span></div>
                <div className="spender-meta-item"><span>{t(lang,"frequency")}</span><span>{s.cnt}</span></div>
              </div>
            </div>
          ))}
        </div>
        {selected&&(
          <div className="profile-panel">
            <div className="profile-header">
              <div className="profile-name">{selected.name}</div>
              <button className="profile-close" onClick={()=>setSelected(null)}>X</button>
            </div>
            <div className="profile-section">
              <div className="profile-section-title">KPIs</div>
              <div className="profile-row"><span>LTV</span><span>{selected.ltv}</span></div>
              <div className="profile-row"><span>{t(lang,"aov")}</span><span>{selected.aov.toFixed(0)}</span></div>
              <div className="profile-row"><span>Validated CA</span><span>{selected.validCA}</span></div>
              <div className="profile-row"><span>Pending CA</span><span>{selected.txs.filter(tx=>tx.status==="pending").reduce((s,tx)=>s+Number(tx.amount),0)}</span></div>
            </div>

              <div className="profile-row"><span>{t(lang,"last_activity")}</span><span>{fmtDate(selected.txs[0].date)}</span></div>
              <div className="profile-row"><span>{t(lang,"frequency")}</span><span>{selected.cnt} tx</span></div>
            </div>
            <div className="profile-section">

const ObjectifsTab = ({user, lang, txs, profiles}) => {
  const today = new Date();
  const todayStr = today.toISOString().split("T")[0];
  const getStats = (chatterId) => {
    const chTx = txs.filter(tx=>tx.chatter_id===chatterId);
    const todayTx = chTx.filter(tx=>tx.date&&tx.date.startsWith(todayStr));
    const weekStart = new Date(today.getTime()-7*24*60*60*1000);
    const weekTx = chTx.filter(tx=>new Date(tx.date)>=weekStart);
    return {dailyCA:todayTx.reduce((s,tx)=>s+Number(tx.amount),0), weeklyCA:weekTx.reduce((s,tx)=>s+Number(tx.amount),0)};
  };
  const getHeatmap = (chatterId) => {
    return Array(7).fill(0).map((_,idx)=>{
      const d = new Date();
      d.setDate(d.getDate()-idx);
      const dStr = d.toISOString().split("T")[0];
      return txs.filter(tx=>tx.chatter_id===chatterId&&tx.date&&tx.date.startsWith(dStr)).length;
    });
  };
  if(user.role==="chatter") {
    const stats = getStats(user.id);
    const dGoal = Number(user.daily_goal)||1;
    const wGoal = Number(user.weekly_goal)||1;
    const hm = getHeatmap(user.id);
    return (
      <div className="card">
        <div className="section-title"><div className="section-bar"></div>{t(lang,"objectives")} - {user.name}</div>
        <div style={{marginBottom:20}}>
          <div style={{marginBottom:8}}>
            <span>{t(lang,"daily_goal")}: {stats.dailyCA}/{dGoal}</span>
            <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.dailyCA/dGoal*100)}%`}}></div></div>
          </div>
          <div>
            <span>{t(lang,"weekly_goal")}: {stats.weeklyCA}/{wGoal}</span>
            <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.weeklyCA/wGoal*100)}%`}}></div></div>
          </div>
        </div>
        <div className="section-title"><div className="section-bar"></div>Activity Heatmap</div>
        <div className="heatmap-grid">
          {hm.map((cnt,idx)=><div key={idx} className={`heatmap-cell ${cnt>0?"active":""}`}>{cnt}</div>)}
        </div>
      </div>
    );
  }
  const chatters = profiles.filter(u=>u.role==="chatter");
  return (
    <div>
      {chatters.map(ch=>{
        const stats = getStats(ch.id);
        const dGoal = Number(ch.daily_goal)||1;
        const wGoal = Number(ch.weekly_goal)||1;
        const hm = getHeatmap(ch.id);
        return (
          <div key={ch.id} className="card" style={{marginBottom:20}}>
            <div className="section-title"><div className="section-bar"></div>{ch.name}</div>
            <div style={{marginBottom:16}}>
              <div style={{marginBottom:8}}>
                <span>{t(lang,"daily_goal")}: {stats.dailyCA}/{dGoal}</span>
                <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.dailyCA/dGoal*100)}%`}}></div></div>
              </div>
              <div>
                <span>{t(lang,"weekly_goal")}: {stats.weeklyCA}/{wGoal}</span>
                <div className="progress"><div className="progress-bar" style={{width:`${Math.min(100,stats.weeklyCA/wGoal*100)}%`}}></div></div>
              </div>
            </div>
            <div className="heatmap-grid">
              {hm.map((cnt,idx)=><div key={idx} className={`heatmap-cell ${cnt>0?"active":""}`}>{cnt}</div>)}
            </div>
          </div>
        );
      })}
    </div>
  );
};

// =============================================
const CompetitionTab = ({user, lang, txs, profiles}) => {
  const [period, setPeriod] = useState("week");
  const chatters = profiles.filter(u=>u.role==="chatter");
  const now = new Date();
  let start;
  if(period==="today") { start = new Date(now); start.setHours(0,0,0,0); }
  else if(period==="week") start = new Date(now.getTime()-7*24*60*60*1000);
  else start = new Date(now.getTime()-30*24*60*60*1000);
  const ranking = chatters.map(ch=>{
    const chTx = txs.filter(tx=>tx.chatter_id===ch.id && new Date(tx.date)>=start);
    return {user:ch, ca:chTx.reduce((s,tx)=>s+Number(tx.amount),0), cnt:chTx.length};
  }).sort((a,b)=>b.ca-a.ca);
  const top3 = ranking.slice(0,3);
  const maxCA = top3.length>0?top3[0].ca:1;
  const medals = ["🥇","🥈","🥉"];
  return (
    <div>
      <div className="trophy">🏆</div>
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        <button className={`filter-chip ${period==="today"?"active":""}`} onClick={()=>setPeriod("today")}>{t(lang,"today")}</button>
        <button className={`filter-chip ${period==="week"?"active":""}`} onClick={()=>setPeriod("week")}>{t(lang,"week")}</button>
        <button className={`filter-chip ${period==="month"?"active":""}`} onClick={()=>setPeriod("month")}>{t(lang,"month")}</button>
      </div>
      <div className="podium">
        {top3.map((r,idx)=>(
          <div key={r.user.id} className="podium-step">
            <div className="podium-rank">{medals[idx]}</div>
            <div className="podium-bar" style={{height:`${(r.ca/maxCA)*200}px`}}></div>
            <div className="podium-name">{r.user.name}</div>

const PayesTab = ({user, lang, txs, payouts, profiles, onRefresh}) => {
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const chatters = profiles.filter(u=>u.role==="chatter");
  const [form, setForm] = useState({user_id:chatters[0]?.id||"",amount:"",method:"Virement",date:""});
  const getChatterData = (chatterId) => {
    const chTx = txs.filter(tx=>tx.chatter_id===chatterId && tx.status==="validated");
    const totalComm = chTx.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
    const paidAmount = payouts.filter(p=>p.user_id===chatterId && p.status==="done").reduce((s,p)=>s+Number(p.amount),0);
    return {totalEarned:totalComm, paidAmount, balance:totalComm-paidAmount};
  };
  const handleAddPayout = async () => {
    if(!form.amount||!form.date) return;
    setSaving(true);
    await sb.from("payouts").insert({user_id:form.user_id, amount:parseFloat(form.amount), method:form.method, date:form.date, status:"pending"});
    setSaving(false);
    setForm({user_id:chatters[0]?.id||"",amount:"",method:"Virement",date:""});
    setShowForm(false);
    onRefresh();
  };
  return (
    <div>
      {chatters.map(ch=>{
        const data = getChatterData(ch.id);
        const chPayouts = payouts.filter(p=>p.user_id===ch.id);
        return (
          <div key={ch.id} className="card" style={{marginBottom:20}}>
            <div className="profile-header"><div className="profile-name">{ch.name}</div></div>
            <div className="profile-section">
              <div className="profile-row"><span>{t(lang,"total_earned")}</span><span>{data.totalEarned.toFixed(0)}</span></div>
              <div className="profile-row"><span>{t(lang,"already_paid")}</span><span>{data.paidAmount.toFixed(0)}</span></div>
              <div className="profile-row"><span>{t(lang,"balance_due")}</span><span style={{color:data.balance>0?"var(--warning)":"var(--success)",fontWeight:700}}>{data.balance.toFixed(0)}</span></div>
            </div>
            <div style={{marginTop:16}}>
              <div className="section-title"><div className="section-bar"></div>{t(lang,"payment_history")}</div>
              <div className="table-wrap">
                <table className="table" style={{fontSize:12}}>
                  <thead><tr><th>{t(lang,"date")}</th><th>{t(lang,"amount")}</th><th>{t(lang,"method")}</th><th>{t(lang,"status")}</th></tr></thead>
                  <tbody>
                    {chPayouts.map(p=>(
                      <tr key={p.id}><td>{fmtDate(p.date)}</td><td>{p.amount}</td><td>{p.method}</td><td><span className={`badge ${p.status==="done"?"badge-done":"badge-pending"}`}>{p.status}</span></td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })}
      {user.role==="gerant"&&(
        <>
          <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ {t(lang,"add_payout")}</button>
          {showForm&&(
            <div className="card" style={{marginBottom:20}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
                <div className="form-group-modal">
                  <label className="form-label">Chatter</label>
                  <select className="filter-select" value={form.user_id} onChange={e=>setForm({...form,user_id:e.target.value})}>
                    {chatters.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                  </select>
                </div>
                <div className="form-group-modal">
                  <label className="form-label">{t(lang,"amount")}</label>
                  <input className="form-input" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />

const ChattersTab = ({user, lang, txs, profiles, models}) => {
  const [selectedId, setSelectedId] = useState(null);
  const chatters = profiles.filter(u=>u.role==="chatter");
  const getStats = (chatterId) => {
    const chTx = txs.filter(tx=>tx.chatter_id===chatterId);
    const validTx = chTx.filter(tx=>tx.status==="validated");
    const validCA = validTx.reduce((s,tx)=>s+Number(tx.amount),0);
    const pendingCA = chTx.filter(tx=>tx.status==="pending").reduce((s,tx)=>s+Number(tx.amount),0);
    const refusedCount = chTx.filter(tx=>tx.status==="refused").length;
    const commDue = validTx.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
    const avgTicket = validTx.length ? validCA/validTx.length : 0;
    const spenders = [...new Set(chTx.map(tx=>tx.spender_handle))];
    return {validCA, validCount:validTx.length, pendingCA, pendingCount:chTx.filter(tx=>tx.status==="pending").length, refusedCount, commDue, avgTicket, spenders};
  };
  const totalValidCA = chatters.reduce((s,ch)=>s+getStats(ch.id).validCA,0);
  const totalCommOwed = chatters.reduce((s,ch)=>s+getStats(ch.id).commDue,0);
  const totalPendingCA = chatters.reduce((s,ch)=>s+getStats(ch.id).pendingCA,0);
  const selected = selectedId ? chatters.find(c=>c.id===selectedId) : null;
  const selStats = selected ? getStats(selected.id) : null;
  const medals = ["🥇","🥈","🥉"];
  return (
    <div>
      <div className="kpi-grid">
        <KPICard label={t(lang,"active_chatters")} value={String(chatters.length)} />
        <KPICard label={t(lang,"ca_validated")} value={String(totalValidCA)} />
        <KPICard label={t(lang,"total_comm_owed")} value={totalCommOwed.toFixed(0)} />
        <KPICard label={t(lang,"ca_pending")} value={String(totalPendingCA)} className="warning" />
      </div>
      <div style={{display:"grid",gridTemplateColumns:selected?"300px 1fr":"1fr",gap:16}}>
        <div>
          {chatters.map((ch,i)=>{
            const stats = getStats(ch.id);
            return (
              <div key={ch.id} className="spender-card" onClick={()=>setSelectedId(selectedId===ch.id?null:ch.id)}
                style={{border:selectedId===ch.id?"1px solid var(--accent)":""}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:20}}>{medals[i]||("#"+(i+1))}</span>
                    <div>
                      <div className="spender-name">{ch.name}</div>
                      <div style={{fontSize:11,color:"var(--text2)"}}>{ch.commission_pct}%</div>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="spender-ltv">{stats.validCA} EUR</div>
                    <div style={{fontSize:10,color:"var(--text2)"}}>{stats.validCount} ventes</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        {selected && selStats && (
          <div className="profile-panel">
            <div className="profile-header">
              <div className="profile-name">{selected.name}</div>
              <button className="profile-close" onClick={()=>setSelectedId(null)}>X</button>
            </div>
            <div style={{fontSize:12,color:"var(--text2)",marginBottom:12}}>Commission: {selected.commission_pct}%</div>
            <div className="profile-section">
              <div className="profile-section-title">KPIs</div>
              <div className="profile-row"><span>{t(lang,"ca_validated")}</span><span style={{color:"var(--accent)",fontWeight:700}}>{selStats.validCA} EUR</span></div>
              <div className="profile-row"><span>{t(lang,"ca_pending")}</span><span style={{color:"var(--warning)",fontWeight:700}}>{selStats.pendingCA} EUR</span></div>
              <div className="profile-row"><span>{t(lang,"total_comm_owed")}</span><span style={{color:selStats.commDue>0?"var(--warning)":"var(--success)",fontWeight:700}}>{selStats.commDue.toFixed(0)} EUR</span></div>
              <div className="profile-row"><span>Panier moyen</span><span>{selStats.avgTicket.toFixed(0)} EUR</span></div>
            </div>
            <div className="profile-section">
              <div className="profile-section-title">{t(lang,"stats")}</div>
              <div className="profile-row"><span>{t(lang,"validated")}</span><span>{selStats.validCount}</span></div>
              <div className="profile-row"><span>{t(lang,"pending")}</span><span>{selStats.pendingCount}</span></div>
              <div className="profile-row"><span>{t(lang,"refused")}</span><span>{selStats.refusedCount}</span></div>
            </div>
            <div className="profile-section">
              <div className="profile-section-title">{t(lang,"managed_spenders")} ({selStats.spenders.length})</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {selStats.spenders.map(sp=>(
                  <span key={sp} style={{background:"rgba(139,92,246,0.1)",color:"var(--accent)",padding:"4px 8px",borderRadius:4,fontSize:11}}>{sp}</span>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const ComptaTab = ({user, lang, txs, expenses, models, profiles, onRefresh}) => {
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({name:"",amount:"",category:"ops"});
  const validTxs = txs.filter(tx=>tx.status==="validated");
  const grossRev = validTxs.reduce((s,tx)=>s+Number(tx.amount),0);
  const totalProvFees = validTxs.reduce((s,tx)=>s+Number(tx.provider_fee||0),0);
  const totalDadaFees = validTxs.reduce((s,tx)=>s+Number(tx.dada_fee||0),0);
  const totalNet = validTxs.reduce((s,tx)=>s+Number(tx.net_amount||0),0);
  const totalComms = validTxs.reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
  const totalExpenses = expenses.reduce((s,e)=>s+Number(e.amount),0);
  const netProfit = totalNet - totalComms - totalExpenses;
  const handleAdd = async () => {
    if(!form.name||!form.amount) return;
    setSaving(true);
    await sb.from("expenses").insert({name:form.name, amount:parseFloat(form.amount), category:form.category});
    setSaving(false);
    setForm({name:"",amount:"",category:"ops"});
    setShowForm(false);
    onRefresh();
  };
  return (
    <div>
      <div className="card" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>P&L Statement</div>
        <div className="table-wrap">
          <table className="table" style={{fontSize:13}}>
            <tbody>
              <tr><td>{t(lang,"gross_rev")}</td><td>{grossRev}</td></tr>
              <tr><td>{t(lang,"provider_fees")}</td><td>-{totalProvFees.toFixed(0)}</td></tr>
              <tr><td>{t(lang,"dada_fee")}</td><td>-{totalDadaFees.toFixed(0)}</td></tr>
              <tr><td style={{fontWeight:600}}>{t(lang,"net")}</td><td style={{fontWeight:600}}>{totalNet.toFixed(0)}</td></tr>
              <tr><td>{t(lang,"chatter_comms")}</td><td>-{totalComms.toFixed(0)}</td></tr>
              <tr><td style={{fontWeight:600}}>{t(lang,"gross_margin")}</td><td style={{fontWeight:600}}>{(totalNet-totalComms).toFixed(0)}</td></tr>
              <tr><td>{t(lang,"expenses")}</td><td>-{totalExpenses.toFixed(0)}</td></tr>
              <tr><td style={{fontWeight:600,color:"var(--success)"}}>{t(lang,"net_profit")}</td><td style={{fontWeight:600,color:"var(--success)"}}>{netProfit.toFixed(0)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>{t(lang,"revenue_by_model")}</div>
          <div className="table-wrap">
            <table className="table"><thead><tr><th>Model</th><th>CA</th></tr></thead>
            <tbody>
              {models.map(m=>{
                const ca = validTxs.filter(tx=>tx.model_id===m.id).reduce((s,tx)=>s+Number(tx.amount),0);
                return <tr key={m.id}><td>{m.name}</td><td>{ca}</td></tr>;
              })}
            </tbody></table>
          </div>
        </div>
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>Commission Distribution</div>
          <table className="table"><thead><tr><th>Chatter</th><th>Comm</th></tr></thead>
          <tbody>
            {profiles.filter(u=>u.role==="chatter").map(u=>{
              const comm = validTxs.filter(tx=>tx.chatter_id===u.id).reduce((s,tx)=>s+Number(tx.chatter_commission||0),0);
              return <tr key={u.id}><td>{u.name}</td><td>{comm.toFixed(0)}</td></tr>;
            })}
          </tbody></table>
        </div>
      </div>
      <div className="card" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>{t(lang,"expenses")}</div>
        <button className="btn btn-primary" style={{marginBottom:12,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ Add Expense</button>
        {showForm&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:12}}>
            <input className="form-input" placeholder="Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} />
            <input className="form-input" type="number" placeholder="Amount" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
            <select className="filter-select" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
              <option value="ops">Operations</option><option value="modele">Model Salary</option><option value="marketing">Marketing</option><option value="autre">Autre</option>
            </select>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-success" onClick={handleAdd} disabled={saving} style={{flex:1}}>{saving?"...":"Add"}</button>
              <button className="btn btn-danger" onClick={()=>setShowForm(false)} style={{flex:1}}>Cancel</button>
            </div>
          </div>
        )}
        <table className="table"><thead><tr><th>Name</th><th>Category</th><th>Amount</th></tr></thead>
        <tbody>
          {expenses.map(e=>(
            <tr key={e.id}><td>{e.name}</td><td>{e.category}</td><td>{e.amount}</td></tr>
          ))}
        </tbody></table>
      </div>
    </div>
  );
};

                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {models.map(m=>(
                      <label key={m.id} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                        <input type="checkbox" checked={(form.assigned_models||[]).includes(m.id)} onChange={()=>handleModelToggle(m.id)} />
                        {m.name}
                      </label>
                    ))}
                  </div>
                </div>
              )}
              <div className="form-group-modal">
                <label className="form-label">Commission %</label>
                <input className="form-input" type="number" value={form.commission_pct} onChange={e=>setForm({...form,commission_pct:e.target.value})} />
              </div>
              <div className="form-group-modal">
                <label className="form-label">{t(lang,"daily_goal")}</label>
                <input className="form-input" type="number" value={form.daily_goal} onChange={e=>setForm({...form,daily_goal:e.target.value})} />
              </div>
              <div className="form-group-modal">
                <label className="form-label">{t(lang,"weekly_goal")}</label>
                <input className="form-input" type="number" value={form.weekly_goal} onChange={e=>setForm({...form,weekly_goal:e.target.value})} />
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-success" onClick={saveEdit} disabled={saving}>{saving?"...":t(lang,"save")}</button>
                <button className="btn btn-danger" onClick={()=>setSelectedUser(null)}>{t(lang,"cancel")}</button>
              </div>
            </div>
          )}
        </div>
        <div>
          <div className="card" style={{marginBottom:20}}>
            <div className="section-title"><div className="section-bar"></div>{t(lang,"models")}</div>
            <table className="table"><thead><tr><th>Name</th><th>Platform</th><th>Cost</th></tr></thead>
            <tbody>
              {models.map(m=>(<tr key={m.id}><td>{m.name}</td><td>{m.platform}</td><td>{m.monthly_cost}</td></tr>))}
            </tbody></table>
          </div>
          <div className="card">
            <div className="section-title"><div className="section-bar"></div>{t(lang,"providers")}</div>
            <table className="table"><thead><tr><th>Name</th><th>Fee %</th><th>Email</th></tr></thead>
            <tbody>
              {providers.map(p=>(<tr key={p.id}><td>{p.name}</td><td>{p.fee_pct}%</td><td>{p.email}</td></tr>))}
            </tbody></table>
          </div>
        </div>
      </div>
    </div>
  );
};

// =============================================
// LOGIN PAGE
// =============================================
const LoginPage = ({onLogin, lang, setLang}) => {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const handleLogin = async () => {
    setError("");
    setLoading(true);
    const {data, error: authErr} = await sb.auth.signInWithPassword({email, password: pass});
    if(authErr) {
      setError(t(lang,"login_error"));
      setLoading(false);
      return;
    }
    const {data: profile} = await sb.from("profiles").select("*").eq("id", data.user.id).single();
    setLoading(false);
    if(profile) {
      onLogin({...profile, email: data.user.email});
    } else {
      setError("Profil non trouve. Contacte l'admin.");
    }
  };
  return (
    <div className="login-wrap">
      <div className="login-orb login-orb-1"></div>
      <div className="login-orb login-orb-2"></div>
      <button className="lang-toggle" onClick={()=>setLang(lang==="fr"?"en":"fr")}>{lang==="fr"?"EN":"FR"}</button>
      <div className="login-card">
        <div className="login-logo">D</div>
        <div className="login-title">DADASH</div>
        <div className="login-subtitle">OnlyFans Management CRM</div>
        <div className="form-group">
          <label className="form-label">{t(lang,"email")}</label>
          <input className="form-input" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>e.key==="Enter"&&handleLogin()} />
        </div>
        <div className="form-group">
          <label className="form-label">{t(lang,"password")}</label>
          <input className="form-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="********" onKeyDown={e=>e.key==="Enter"&&handleLogin()} />
        </div>
        <button className="btn btn-primary" onClick={handleLogin} disabled={loading}>
          {loading ? "..." : t(lang,"login_btn")}
        </button>
        {error && <div className="error-msg">{error}</div>}
      </div>
    </div>
  );
};

// =============================================
// MAIN APP
// =============================================
const App = () => {
  const [user, setUser] = useState(null);
  const [lang, setLang] = useState("fr");
  const [tab, setTab] = useState("dashboard");
  const [loading, setLoading] = useState(true);
  const [txs, setTxs] = useState([]);
  const [profiles, setProfiles] = useState([]);
  const [models, setModels] = useState([]);
  const [providers, setProviders] = useState([]);
  const [payouts, setPayouts] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [spenders, setSpenders] = useState([]);

  const loadData = async (currentUser = null) => {
    const [txR, spR, prR, moR, pvR, paR, exR] = await Promise.all([
      sb.from("transactions").select("*").order("date",{ascending:false}),
      sb.from("spenders").select("*"),
      sb.from("profiles").select("*"),
      sb.from("models").select("*"),
      sb.from("providers").select("*"),
      sb.from("payouts").select("*").order("date",{ascending:false}),
      sb.from("expenses").select("*"),
    ]);
    let txData = txR.data||[];
    let modelData = moR.data||[];

    // Filter data based on user role
    if(currentUser) {
      if(currentUser.role==="chatter" && currentUser.assigned_models && currentUser.assigned_models.length>0) {
        txData = txData.filter(tx=>currentUser.assigned_models.includes(tx.model_id));
        modelData = modelData.filter(m=>currentUser.assigned_models.includes(m.id));
      } else if(currentUser.role==="provider") {
        txData = txData.filter(tx=>tx.provider_id===currentUser.id);
        const modelIds = new Set(txData.map(tx=>tx.model_id));
        modelData = modelData.filter(m=>modelIds.has(m.id));
      }
    }

    setTxs(txData);
    setSpenders(spR.data||[]);
    setProfiles(prR.data||[]);
    setModels(modelData);
    setProviders(pvR.data||[]);
    setPayouts(paR.data||[]);
    setExpenses(exR.data||[]);
  };

  useEffect(()=>{
    const init = async () => {
      const {data:{session}} = await sb.auth.getSession();
      if(session) {
        const {data:profile} = await sb.from("profiles").select("*").eq("id",session.user.id).single();
        if(profile) {
          const fullUser = {...profile, email:session.user.email};
          setUser(fullUser);
          await loadData(fullUser);
        }
      }
      setLoading(false);
    };
    init();
  },[]);

  const handleLogin = async (u) => {
    setUser(u);
    setLoading(true);
    await loadData(u);
    setLoading(false);
  };

  const handleLogout = async () => {
    await sb.auth.signOut();
    setUser(null);
    setTxs([]);
    setProfiles([]);
    setModels([]);
    setProviders([]);
    setPayouts([]);
    setExpenses([]);
    setSpenders([]);
  };

  const onRefresh = async () => { await loadData(user); };

  if(loading) return <div className="loading-wrap"><div className="spinner"></div></div>;
  if(!user) return <LoginPage onLogin={handleLogin} lang={lang} setLang={setLang} />;

  const tabs = [
    {id:"dashboard",icon:"📊",label:t(lang,"dashboard"),show:user.role!=="provider"},
    {id:"transactions",icon:"📋",label:user.role==="provider"?"Mes Transactions":t(lang,"transactions"),show:true},
    {id:"spenders",icon:"👥",label:t(lang,"spenders"),show:user.role!=="provider"},
    {id:"objectifs",icon:"🎯",label:t(lang,"objectifs"),show:user.role!=="provider"},
    {id:"competition",icon:"🏆",label:t(lang,"competition"),show:user.role!=="provider"},
    {id:"paies",icon:"💳",label:t(lang,"paies"),show:user.role!=="provider"},
    {id:"chatters",icon:"💬",label:t(lang,"chatters"),show:user.role==="gerant"},
    {id:"compta",icon:"📈",label:t(lang,"compta"),show:user.role==="gerant"},
    {id:"provider_compta",icon:"💰",label:"Provider Compta",show:user.role==="provider"},
    {id:"ia",icon:"🤖",label:t(lang,"ia"),show:user.role!=="provider"},
    {id:"admin",icon:"⚙",label:t(lang,"admin"),show:user.role==="gerant"},
  ];

  return (
    <div className="app-wrap">
      <div className="sidebar">
        <div className="sidebar-logo">D</div>
        <div className="sidebar-nav">
          {tabs.filter(x=>x.show).map(x=>(
            <button key={x.id} className={`sidebar-btn ${tab===x.id?"active":""}`} onClick={()=>setTab(x.id)} title={x.label}>
              {x.icon}
            </button>
          ))}
        </div>
        <div className="sidebar-footer">
          <button onClick={onRefresh} title={t(lang,"refresh")}>🔄</button>
          <button onClick={()=>setLang(lang==="fr"?"en":"fr")} title="Language">{lang==="fr"?"EN":"FR"}</button>
          <button onClick={handleLogout} title={t(lang,"logout")}>🚪</button>
        </div>
      </div>
      <div className="main-area">
        <div className="topbar">
          <div className="topbar-left">
            <span style={{fontSize:20}}>{tabs.find(x=>x.id===tab)?.icon}</span>
            <span style={{fontWeight:600}}>{tabs.find(x=>x.id===tab)?.label}</span>
          </div>
          <div className="topbar-right">
            <span className="user-name">{user.name}</span>
            <span className="role-badge">{user.role}</span>
          </div>
        </div>
        <div className="content">
          {tab==="dashboard"&&user.role!=="provider"&&<DashboardTab user={user} lang={lang} txs={txs} models={models} profiles={profiles} />}
          {tab==="transactions"&&<TransactionsTab user={user} lang={lang} txs={txs} models={models} providers={providers} profiles={profiles} onRefresh={onRefresh} />}
          {tab==="spenders"&&user.role!=="provider"&&<SpendersTab user={user} lang={lang} txs={txs} models={models} />}
          {tab==="objectifs"&&user.role!=="provider"&&<ObjectifsTab user={user} lang={lang} txs={txs} profiles={profiles} />}
          {tab==="competition"&&user.role!=="provider"&&<CompetitionTab user={user} lang={lang} txs={txs} profiles={profiles} />}
          {tab==="paies"&&user.role!=="provider"&&<PayesTab user={user} lang={lang} txs={txs} payouts={payouts} profiles={profiles} onRefresh={onRefresh} />}
          {tab==="chatters"&&user.role==="gerant"&&<ChattersTab user={user} lang={lang} txs={txs} profiles={profiles} models={models} />}
          {tab==="compta"&&user.role==="gerant"&&<ComptaTab user={user} lang={lang} txs={txs} expenses={expenses} models={models} profiles={profiles} onRefresh={onRefresh} />}
          {tab==="provider_compta"&&user.role==="provider"&&<ProviderComptaTab user={user} lang={lang} txs={txs} payouts={payouts} profiles={profiles} models={models} />}
          {tab==="ia"&&user.role!=="provider"&&<IATab lang={lang} />}
          {tab==="admin"&&user.role==="gerant"&&<AdminTab lang={lang} profiles={profiles} models={models} providers={providers} onRefresh={onRefresh} />}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
  </script>
</body>
</html>
