                            <td>{tx.product || "\u2014"}</td>
                            <td><StatusPill status={tx.status} lang={lang} /></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <PaginationControls pag={modalTxPag} lang={lang} />
              </>)}

              {/* ── TAB: REVERSEMENTS ── */}
              {modalTab === "reversements" && (()=>{
                const provPayouts = selectedProv.provAllPP.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                const provValidatedPP = provPayouts.filter(p => p.status === "validated");
                const provPendingPP = provPayouts.filter(p => p.status === "pending");
                const totalRevAmt = provValidatedPP.reduce((s, p) => s + Number(p.amount), 0);
                const avgDelayVal = selectedProv.avgDelay;
                return (<>
                  {/* KPIs */}
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 16 }}>
                    {[
                      { label: fr ? "Total Revers\u00E9" : "Total Reversed", value: totalRevAmt.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + currencySymbol, color: "var(--success)" },
                      { label: fr ? "Nb Reversements" : "Nb Payouts", value: provValidatedPP.length, color: "var(--accent)" },
                      { label: fr ? "D\u00E9lai Moyen" : "Avg Delay", value: avgDelayVal + (fr ? " jours" : " days"), color: "var(--text-secondary)" },
                    ].map(k => (
                      <div key={k.label} style={{ padding: "10px 14px", borderRadius: 12, background: "rgba(255,255,255,0.04)", textAlign: "center" }}>
                        <div style={{ fontSize: 9, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 4 }}>{k.label}</div>
                        <div style={{ fontSize: 18, fontWeight: 800, color: k.color }}>{k.value}</div>
                      </div>
                    ))}
                  </div>

                  {/* Pending payouts with validate button */}
                  {provPendingPP.length > 0 && (
                    <div style={{ marginBottom: 16, padding: 14, borderRadius: 12, background: "rgba(251,191,36,0.06)", border: "1px solid rgba(251,191,36,0.2)" }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: "var(--warning)", marginBottom: 10 }}>{"\u23F3"} {fr ? "En attente de validation" : "Pending validation"} ({provPendingPP.length})</div>
                      {provPendingPP.map(pp => (
                        <div key={pp.id} style={{ padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.06)", display: "flex", alignItems: "center", gap: 12 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontWeight: 700, fontSize: 13 }}>{Number(pp.amount).toLocaleString("fr-FR", { maximumFractionDigits: 0 })}{pp.currency === "EUR" ? "\u20AC" : "CHF"}</div>
                            <div style={{ fontSize: 10, color: "var(--text-tertiary)", marginTop: 2 }}>
                              {pp.payment_method || "\u2014"} {"\u00B7"} {fmtDate(pp.created_at)} {pp.reference ? `\u00B7 R\u00E9f: ${pp.reference}` : ""}
                            </div>
                            {pp.notes && <div style={{ fontSize: 10, color: "var(--text-secondary)", marginTop: 2, fontStyle: "italic" }}>{pp.notes}</div>}
                          </div>
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            {rejectId === pp.id ? (
                              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                <input className="form-input" style={{ width: 160, fontSize: 11 }} placeholder={fr ? "Raison du refus *" : "Rejection reason *"} value={rejectNotes} onChange={e => setRejectNotes(e.target.value)} />
                                <button className="btn btn-danger" style={{ padding: "5px 10px", fontSize: 11 }} onClick={() => handleReject(pp.id)} disabled={actionLoading === pp.id}>{actionLoading === pp.id ? "..." : "\u274C"}</button>
                                <button style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-tertiary)", fontSize: 11 }} onClick={() => { setRejectId(null); setRejectNotes(""); }}>X</button>
                              </div>
                            ) : (
                              <>
                                <button className="btn btn-success" style={{ padding: "5px 12px", fontSize: 11 }} onClick={() => handleValidate(pp.id)} disabled={actionLoading === pp.id}>{actionLoading === pp.id ? "..." : "\u2705 Valider"}</button>
                                <button className="btn btn-danger" style={{ padding: "5px 12px", fontSize: 11 }} onClick={() => setRejectId(pp.id)}>{"\u274C"}</button>
                              </>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Full history */}
                  <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8, color: "var(--text-primary)" }}>{fr ? "Historique des reversements" : "Payout history"}</div>
                  {provPayouts.length === 0 ? (
                    <div style={{ textAlign: "center", color: "var(--text-quaternary)", padding: 30 }}>{fr ? "Aucun reversement" : "No payouts"}</div>
                  ) : (
                    <div style={{ maxHeight: 300, overflowY: "auto" }}>
                      <table className="table" style={{ fontSize: 11 }}>
                        <thead><tr>
                          <th>Date</th><th>{t(lang, "amount")}</th><th>{fr ? "M\u00E9thode" : "Method"}</th><th>{t(lang, "status")}</th><th>{fr ? "Valid\u00E9 par" : "Validated by"}</th><th>Notes</th>
                        </tr></thead>
                        <tbody>
                          {provPayouts.map(pp => {
                            const validatorName = pp.validated_by ? profiles.find(p => p.id === pp.validated_by)?.name || "?" : "\u2014";
                            const stMap = { pending: { bg: "var(--warning-muted)", color: "var(--warning)", icon: "\u23F3" }, validated: { bg: "var(--success-muted)", color: "var(--success)", icon: "\u2705" }, rejected: { bg: "var(--danger-muted)", color: "var(--danger)", icon: "\u274C" } };
                            const st = stMap[pp.status] || stMap.pending;
                            return (
                              <tr key={pp.id}>
                                <td>{fmtDate(pp.created_at)}</td>
                                <td style={{ fontWeight: 700 }}>{Number(pp.amount).toLocaleString("fr-FR", { maximumFractionDigits: 0 })}{pp.currency === "EUR" ? "\u20AC" : "CHF"}</td>
                                <td>{pp.payment_method || "\u2014"}</td>
                                <td><span style={{ padding: "3px 8px", borderRadius: 10, background: st.bg, color: st.color, fontSize: 10, fontWeight: 700 }}>{st.icon} {pp.status}</span></td>
                                <td>{validatorName}</td>
                                <td style={{ fontSize: 10, maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis" }}>{pp.notes || "\u2014"}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </>);
              })()}

              {/* ── TAB: PERFORMANCE ── */}
              {modalTab === "performance" && (()=>{
                // Chart data: TX par mois (6 derniers mois)
                const now = new Date();
                const months = [];
                for (let i = 5; i >= 0; i--) {
                  const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                  months.push({ year: d.getFullYear(), month: d.getMonth(), label: d.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" }) });
                }
                const txChartData = months.map(m => {
                  const mTxs = selectedProv.pTxs.filter(tx => { const d = new Date(tx.date); return d.getFullYear() === m.year && d.getMonth() === m.month; });
                  const validated = mTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
                  const ca = validated.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
                  return { name: m.label, tx: mTxs.length, ca: Math.round(ca) };
                });

                // Delay chart data
                const delayChartData = months.map(m => {
                  const mPP = selectedProv.provAllPP.filter(pp => {
                    const d = new Date(pp.created_at);
                    return d.getFullYear() === m.year && d.getMonth() === m.month && pp.status === "validated";
                  });
                  if (mPP.length === 0) return { name: m.label, delay: 0 };
                  const delays = mPP.map(pp => {
                    const ppDate = new Date(pp.validated_at || pp.created_at);
                    const validTxs = selectedProv.pTxs.filter(tx => (tx.status === "validated" || tx.status === "confirmee") && new Date(tx.date) <= ppDate);
                    if (validTxs.length === 0) return 0;
                    const lastTx = validTxs.sort((a, b) => new Date(b.date) - new Date(a.date))[0];
                    return Math.max(0, (ppDate - new Date(lastTx.date)) / 86400000);
                  });
                  return { name: m.label, delay: Math.round(delays.reduce((s, d) => s + d, 0) / delays.length * 10) / 10 };
                });

                // Rank among all providers
                const sortedByCA = [...providerStats].sort((a, b) => b.totalCA - a.totalCA);
                const rank = sortedByCA.findIndex(ps => ps.provider.id === selectedProv.provider.id) + 1;

                return (<>
                  {/* Summary KPIs */}
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 20 }}>
                    {[
                      { label: fr ? "Taux Validation" : "Validation Rate", value: selectedProv.validationRate + "%", color: selectedProv.validationRate >= 80 ? "var(--success)" : "var(--danger)" },
                      { label: fr ? "D\u00E9lai Moyen" : "Avg Delay", value: selectedProv.avgDelay + (fr ? "j" : "d"), color: "var(--text-secondary)" },
                      { label: fr ? "Rang CA" : "CA Rank", value: `#${rank}/${totalProviders}`, color: rank <= 3 ? "var(--success)" : "var(--text-primary)" },
                      { label: fr ? "% Revers\u00E9" : "% Reversed", value: selectedProv.reversePct + "%", color: selectedProv.reversePct >= 80 ? "var(--success)" : "var(--warning)" },
                    ].map(k => (
                      <div key={k.label} style={{ padding: "10px 14px", borderRadius: 12, background: "rgba(255,255,255,0.04)", textAlign: "center" }}>
                        <div style={{ fontSize: 9, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 4 }}>{k.label}</div>
                        <div style={{ fontSize: 18, fontWeight: 800, color: k.color }}>{k.value}</div>
                      </div>
                    ))}
                  </div>

                  {/* BarChart: TX par mois */}
                  <div style={{ marginBottom: 24 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 10 }}>{"\u{1F4CA}"} {fr ? "CA par mois (6 derniers mois)" : "Revenue by month (last 6 months)"}</div>
                    {rechartsReady && BarChart ? (
                      <ResponsiveContainer width="100%" height={200}>
                        <BarChart data={txChartData}>
                          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.06)" />
                          <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fill: "var(--text-tertiary)", fontSize: 11 }} />
                          <YAxis axisLine={false} tickLine={false} tick={{ fill: "var(--text-tertiary)", fontSize: 11 }} tickFormatter={v => v >= 1000 ? (v / 1000).toFixed(1) + "K" : v} />
                          <RechartsTooltip contentStyle={{ background: "#1A1A2E", border: "1px solid #2A2A3E", borderRadius: 8, fontSize: 12 }} />
                          <Bar dataKey="ca" fill="#8B5CF6" radius={[6, 6, 0, 0]} name="CA" />
                        </BarChart>
                      </ResponsiveContainer>
                    ) : (
                      <div style={{ height: 200, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-quaternary)", fontSize: 12 }}>Recharts loading...</div>
                    )}
                  </div>

                  {/* LineChart: Délai moyen par mois */}
                  <div style={{ marginBottom: 24 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 10 }}>{"\u{1F4C8}"} {fr ? "D\u00E9lai moyen de reversement par mois" : "Avg payout delay by month"}</div>
                    {rechartsReady && LineChart ? (
                      <ResponsiveContainer width="100%" height={200}>
                        <LineChart data={delayChartData}>
                          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.06)" />
                          <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fill: "var(--text-tertiary)", fontSize: 11 }} />
                          <YAxis axisLine={false} tickLine={false} tick={{ fill: "var(--text-tertiary)", fontSize: 11 }} unit={fr ? "j" : "d"} />
                          <RechartsTooltip contentStyle={{ background: "#1A1A2E", border: "1px solid #2A2A3E", borderRadius: 8, fontSize: 12 }} />
                          <Line type="monotone" dataKey="delay" stroke="var(--warning)" strokeWidth={2} dot={{ fill: "var(--warning)", r: 4 }} name={fr ? "D\u00E9lai" : "Delay"} />
                        </LineChart>
                      </ResponsiveContainer>
                    ) : (
                      <div style={{ height: 200, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-quaternary)", fontSize: 12 }}>Recharts loading...</div>
                    )}
                  </div>

                  {/* Model breakdown */}
                  <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 10 }}>{"\u{1F4CA}"} {fr ? "R\u00E9partition par mod\u00E8le" : "Breakdown by model"}</div>
                  <div style={{ marginBottom: 20 }}>
                    {selectedProv.modelBreakdown.map(mb => {
                      const maxCA = selectedProv.modelBreakdown.length > 0 ? selectedProv.modelBreakdown[0].ca : 1;
                      return (
                        <div key={mb.modelId} style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                          <span style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{mb.modelName}</span>
                          <span style={{ fontSize: 13, fontWeight: 700 }}>{mb.ca.toLocaleString("fr-FR", { maximumFractionDigits: 0 })}{currencySymbol}</span>
                          <span style={{ fontSize: 11, color: "var(--text-tertiary)", width: 50, textAlign: "right" }}>{mb.txCount} TX</span>
                          <div style={{ width: 80, height: 4, borderRadius: 2, background: "rgba(255,255,255,0.06)" }}>
                            <div style={{ width: (maxCA > 0 ? (mb.ca / maxCA * 100) : 0) + "%", height: "100%", borderRadius: 2, background: "#8B5CF6" }} />
                          </div>
                        </div>
                      );
                    })}
                    {selectedProv.modelBreakdown.length === 0 && <div style={{ color: "var(--text-quaternary)", fontSize: 12, textAlign: "center", padding: 16 }}>{fr ? "Aucun mod\u00E8le" : "No models"}</div>}
                  </div>
                </>);
              })()}

              {/* ── TAB: COMPTES ── */}
              {modalTab === "comptes" && (()=>{
                const provMethods = (ppmData || []).filter(pm => pm.provider_id === selectedProv.provider.id).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
                const activeMethods = provMethods.filter(pm => pm.active !== false);
                const inactiveMethods = provMethods.filter(pm => pm.active === false);
                return (<>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>{fr ? "Moyens de paiement" : "Payment methods"} ({activeMethods.length})</div>
                    <button className="btn btn-success" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => setPpmEditModal({ mode: "add", providerId: selectedProv.provider.id, data: { type: "Twint", label: "", detail: "", currency: "CHF", is_primary: activeMethods.length === 0, active: true } })}>
                      {"\u2795"} {fr ? "Ajouter" : "Add"}
                    </button>
                  </div>

                  {activeMethods.length === 0 && (
                    <div style={{ textAlign: "center", color: "var(--text-quaternary)", padding: 30, fontSize: 12 }}>
                      {fr ? "Aucun moyen de paiement configur\u00E9" : "No payment methods configured"}
                    </div>
                  )}

                  {activeMethods.map(pm => {
                    const ptc = PAYMENT_TYPE_COLORS[pm.type] || PAYMENT_TYPE_COLORS["Autre"];
                    return (
                      <div key={pm.id} style={{ padding: "14px 16px", marginBottom: 10, borderRadius: 14, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)", display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 36, height: 36, borderRadius: 10, background: ptc.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{ptc.icon}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={{ fontWeight: 700, fontSize: 13 }}>{pm.label || pm.type}</span>
                            {pm.is_primary && <span style={{ padding: "1px 8px", borderRadius: 8, background: "var(--warning-muted)", color: "var(--warning)", fontSize: 10, fontWeight: 700 }}>{"\u2B50"} PRINCIPAL</span>}
                          </div>
                          <div style={{ fontSize: 12, color: "var(--text-secondary)", marginTop: 2 }}>{pm.detail}</div>
                          <div style={{ fontSize: 10, color: "var(--text-tertiary)", marginTop: 2 }}>{pm.currency || "CHF"}</div>
                        </div>
                        <div style={{ display: "flex", gap: 6 }}>
                          <button onClick={() => setPpmEditModal({ mode: "edit", providerId: selectedProv.provider.id, data: { ...pm } })} style={{ width: 28, height: 28, borderRadius: 8, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.08)", color: "var(--text-tertiary)", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>{"\u270F\uFE0F"}</button>
                          <button onClick={() => setPpmDeleteConfirm(pm)} style={{ width: 28, height: 28, borderRadius: 8, background: "rgba(248,113,113,0.1)", border: "1px solid rgba(248,113,113,0.2)", color: "var(--danger)", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>{"\u{1F5D1}\uFE0F"}</button>
                        </div>
                      </div>
                    );
                  })}

                  {inactiveMethods.length > 0 && (<>
                    <div style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", marginTop: 16, marginBottom: 8 }}>{fr ? "D\u00E9sactiv\u00E9s" : "Deactivated"} ({inactiveMethods.length})</div>
                    {inactiveMethods.map(pm => {
                      const ptc = PAYMENT_TYPE_COLORS[pm.type] || PAYMENT_TYPE_COLORS["Autre"];
                      return (
                        <div key={pm.id} style={{ padding: "10px 14px", marginBottom: 6, borderRadius: 12, background: "rgba(255,255,255,0.02)", border: "1px dashed rgba(255,255,255,0.06)", opacity: 0.5, display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ fontSize: 14 }}>{ptc.icon}</span>
                          <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{pm.label || pm.type} \u2014 {pm.detail} ({pm.currency || "CHF"})</span>
                          <button onClick={() => setPpmEditModal({ mode: "edit", providerId: selectedProv.provider.id, data: { ...pm, active: true } })} style={{ marginLeft: "auto", fontSize: 10, color: "var(--accent)", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>{fr ? "R\u00E9activer" : "Reactivate"}</button>
                        </div>
                      );
                    })}
                  </>)}
                </>);
              })()}
            </div>
          </div>
        </div>
      )}

      {/* PPM Edit/Add Modal */}
      {ppmEditModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 6000 }} onClick={() => setPpmEditModal(null)}>
          <div style={{ width: 440, background: "#1A1A2E", border: "1px solid #2A2A3E", borderRadius: 16, padding: 24 }} onClick={e => e.stopPropagation()}>
            {(()=>{
              const [formType, setFormType] = [ppmEditModal.data.type, (v) => setPpmEditModal(prev => ({...prev, data: {...prev.data, type: v}}))];
              const [formLabel, setFormLabel] = [ppmEditModal.data.label || "", (v) => setPpmEditModal(prev => ({...prev, data: {...prev.data, label: v}}))];
              const [formDetail, setFormDetail] = [ppmEditModal.data.detail || "", (v) => setPpmEditModal(prev => ({...prev, data: {...prev.data, detail: v}}))];
              const [formCurrency, setFormCurrency] = [ppmEditModal.data.currency || "CHF", (v) => setPpmEditModal(prev => ({...prev, data: {...prev.data, currency: v}}))];
              const [formPrimary, setFormPrimary] = [!!ppmEditModal.data.is_primary, (v) => setPpmEditModal(prev => ({...prev, data: {...prev.data, is_primary: v}}))];
              const [formActive, setFormActive] = [ppmEditModal.data.active !== false, (v) => setPpmEditModal(prev => ({...prev, data: {...prev.data, active: v}}))];
              const placeholder = PAYMENT_TYPE_PLACEHOLDERS[formType] || PAYMENT_TYPE_PLACEHOLDERS["Autre"];
              const ptc = PAYMENT_TYPE_COLORS[formType] || PAYMENT_TYPE_COLORS["Autre"];
              return (<>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                  <h3 style={{ margin: 0, fontSize: 16, fontWeight: 800 }}>{ppmEditModal.mode === "edit" ? (fr ? "Modifier le compte" : "Edit account") : (fr ? "Ajouter un compte" : "Add account")}</h3>
                  <button onClick={() => setPpmEditModal(null)} style={{ width: 28, height: 28, borderRadius: 8, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.08)", color: "var(--text-tertiary)", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>{"\u2715"}</button>
                </div>
                <div style={{ display: "grid", gap: 14 }}>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", display: "block", marginBottom: 4 }}>Type</label>
                    <select className="filter-select" style={{ width: "100%" }} value={formType} onChange={e => setFormType(e.target.value)}>
                      {Object.keys(PAYMENT_TYPE_COLORS).map(t => { const c = PAYMENT_TYPE_COLORS[t]; return <option key={t} value={t}>{c.icon} {t}</option>; })}
                    </select>
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", display: "block", marginBottom: 4 }}>Label ({fr ? "optionnel" : "optional"})</label>
                    <input className="form-input" value={formLabel} onChange={e => setFormLabel(e.target.value)} placeholder={`ex: ${formType} perso`} style={{ width: "100%" }} />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", display: "block", marginBottom: 4 }}>{fr ? "D\u00E9tail" : "Detail"} *</label>
                    <input className="form-input" value={formDetail} onChange={e => setFormDetail(e.target.value)} placeholder={placeholder} style={{ width: "100%" }} required />
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", display: "block", marginBottom: 4 }}>{fr ? "Devise" : "Currency"}</label>
                      <select className="filter-select" style={{ width: "100%" }} value={formCurrency} onChange={e => setFormCurrency(e.target.value)}>
                        <option>CHF</option><option>EUR</option>
                      </select>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      <label style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginTop: 18 }}>
                        <input type="checkbox" checked={formPrimary} onChange={e => setFormPrimary(e.target.checked)} /> {"\u2B50"} Principal
                      </label>
                      <label style={{ fontSize: 11, fontWeight: 600, color: "var(--text-tertiary)", display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                        <input type="checkbox" checked={formActive} onChange={e => setFormActive(e.target.checked)} /> {fr ? "Actif" : "Active"}
                      </label>
                    </div>
                  </div>
                  {/* Preview */}
                  <div style={{ padding: 12, borderRadius: 12, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)", display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ width: 32, height: 32, borderRadius: 8, background: ptc.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{ptc.icon}</div>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 700 }}>{formLabel || formType}</div>
                      <div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{formDetail || placeholder} ({formCurrency})</div>
                    </div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
                  <button className="btn" onClick={() => setPpmEditModal(null)} style={{ flex: 1 }}>{fr ? "Annuler" : "Cancel"}</button>
                  <button className="btn btn-success" disabled={ppmSaving || !formDetail.trim()} onClick={() => handlePpmSave({ ...ppmEditModal.data, type: formType, label: formLabel, detail: formDetail, currency: formCurrency, is_primary: formPrimary, active: formActive, provider_id: ppmEditModal.providerId })} style={{ flex: 1 }}>{ppmSaving ? "..." : (fr ? "Enregistrer" : "Save")}</button>
                </div>
              </>);
            })()}
          </div>
        </div>
      )}

      {/* PPM Delete Confirm */}
      <ConfirmModal open={!!ppmDeleteConfirm} title={fr ? "Supprimer ce moyen de paiement ?" : "Delete this payment method?"} message={ppmDeleteConfirm ? `${(PAYMENT_TYPE_COLORS[ppmDeleteConfirm.type] || PAYMENT_TYPE_COLORS["Autre"]).icon} ${ppmDeleteConfirm.label || ppmDeleteConfirm.type} \u2014 ${ppmDeleteConfirm.detail}` : ""} lang={lang} onConfirm={() => ppmDeleteConfirm && handlePpmDelete(ppmDeleteConfirm.id)} onCancel={() => setPpmDeleteConfirm(null)} />
      </>)}

      {/* ═══ PAIEMENTS SUB-TAB ═══ */}
      {subTab==="paiements"&&(()=>{
        const pendingPP = allPP.filter(p=>p.status==="pending");
        const validatedPP = allPP.filter(p=>p.status==="validated");
        const rejectedPP = allPP.filter(p=>p.status==="rejected");
        const totalPendingAmt = pendingPP.reduce((s,p)=>s+Number(p.amount),0);
        const now = new Date();
        const mStart = new Date(now.getFullYear(),now.getMonth(),1);
        const thisMonthValidated = validatedPP.filter(p=>p.validated_at&&new Date(p.validated_at)>=mStart);
        const thisMonthAmt = thisMonthValidated.reduce((s,p)=>s+Number(p.amount),0);

        const providerBalances = providers.map(prov=>{
          const pTxs = txs.filter(tx=>tx.provider_id===prov.id&&(tx.status==="validated"||tx.status==="confirmee"));
          const caValide = pTxs.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
          const paidPP = validatedPP.filter(p=>p.provider_id===prov.id).reduce((s,p)=>s+Number(p.amount),0);
          const pendPP = pendingPP.filter(p=>p.provider_id===prov.id).reduce((s,p)=>s+Number(p.amount),0);
          return {provider:prov,caValide,paid:paidPP,pending:pendPP,solde:caValide-paidPP};
        });
        const lateProviders = providerBalances.filter(pb=>pb.solde>100);

        return (<div>
          {/* KPIs paiements */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>
            {[
              {label:fr?"En attente de validation":"Pending validation",value:totalPendingAmt.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:"\u23F3",color:"var(--warning)",sub:pendingPP.length+" "+(fr?"paiements":"payments")},
              {label:fr?"Re\u00E7u ce mois":"Received this month",value:thisMonthAmt.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:"\u2705",color:"var(--success)",sub:thisMonthValidated.length+" "+(fr?"valid\u00E9s":"validated")},
              {label:fr?"Providers en retard":"Late providers",value:lateProviders.length,icon:"\u26A0\uFE0F",color:lateProviders.length>0?"var(--danger)":"var(--success)",sub:lateProviders.length>0?lateProviders.map(l=>l.provider.name).join(", "):fr?"Aucun":"None"},
              {label:fr?"Total valid\u00E9 (all-time)":"Total validated (all-time)",value:validatedPP.reduce((s,p)=>s+Number(p.amount),0).toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:"\u{1F4B0}",color:"var(--success)",sub:validatedPP.length+" paiements"},
            ].map((k,i)=>(
              <div key={k.label} style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:"14px 16px"}}>
                <div style={{fontSize:10,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>{k.icon} {k.label}</div>
                <div style={{fontSize:22,fontWeight:800,color:k.color||"var(--text-primary)"}}>{k.value}</div>
                {k.sub&&<div style={{fontSize:10,color:"var(--text-tertiary)",marginTop:4}}>{k.sub}</div>}
              </div>
            ))}
          </div>

          {/* Solde par provider */}
          <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:18,marginBottom:20}}>
            <div className="section-title"><div className="section-bar"></div>{fr?"Solde par prestataire":"Balance per provider"}</div>
            <div className="table-wrap">
              <table className="table" style={{fontSize:12}}>
                <thead><tr>
                  <th>{fr?"Prestataire":"Provider"}</th>
                  <th>CA {fr?"Valid\u00E9":"Validated"}</th>
                  <th>{fr?"Pay\u00E9 (valid\u00E9)":"Paid (validated)"}</th>
                  <th>{fr?"En attente":"Pending"}</th>
                  <th>{fr?"Solde d\u00FB":"Balance due"}</th>
                </tr></thead>
                <tbody>
                  {providerBalances.map(pb=>(
                    <tr key={pb.provider.id}>
                      <td style={{fontWeight:700}}>{pb.provider.name}</td>
                      <td>{pb.caValide.toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}</td>
                      <td style={{color:"var(--success)"}}>{pb.paid.toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}</td>
                      <td style={{color:"var(--warning)"}}>{pb.pending.toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}</td>
                      <td>
                        <span style={{fontWeight:800,color:pb.solde>100?"var(--danger)":pb.solde>0?"var(--warning)":"var(--success)"}}>
                          {pb.solde>100&&"\u26A0\uFE0F "}{pb.solde.toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Pending payouts — validate/reject */}
          {pendingPP.length>0&&(
            <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:18,marginBottom:20}}>
              <div className="section-title"><div className="section-bar"></div>{"\u23F3"} {fr?"Paiements en attente de validation":"Pending payments"} ({pendingPP.length})</div>
              {pendingPP.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(pp=>{
                const provName=profiles.find(p=>p.id===pp.provider_id)?.name||"?";
                return (
                  <div key={pp.id} style={{padding:16,borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",alignItems:"center",gap:16}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14}}>{provName} \u2014 {Number(pp.amount).toLocaleString("fr-FR",{maximumFractionDigits:0})}{pp.currency==="EUR"?"\u20AC":"CHF"}</div>
                      <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:4}}>
                        {fr?"P\u00E9riode":"Period"}: {fmtDate(pp.period_from)} \u2192 {fmtDate(pp.period_to)} {"\u00B7"} {pp.payment_method||"\u2014"} {pp.reference?`\u00B7 R\u00E9f: ${pp.reference}`:""}
                      </div>
                      {pp.notes&&<div style={{fontSize:11,color:"var(--text-secondary)",marginTop:2,fontStyle:"italic"}}>{pp.notes}</div>}
                      <div style={{fontSize:10,color:"var(--text-quaternary)",marginTop:4}}>{fr?"D\u00E9clar\u00E9 le":"Declared"} {fmtDate(pp.created_at)}</div>
                    </div>
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                      {rejectId===pp.id?(
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <input className="form-input" style={{width:200,fontSize:11}} placeholder={fr?"Raison du refus *":"Rejection reason *"} value={rejectNotes} onChange={e=>setRejectNotes(e.target.value)}/>
                          <button className="btn btn-danger" style={{padding:"6px 12px",fontSize:11}} onClick={()=>handleReject(pp.id)} disabled={actionLoading===pp.id}>{actionLoading===pp.id?"...":"\u274C"}</button>
                          <button style={{background:"none",border:"none",cursor:"pointer",color:"var(--text-tertiary)",fontSize:12}} onClick={()=>{setRejectId(null);setRejectNotes("");}}>Annuler</button>
                        </div>
                      ):(
                        <>
                          <button className="btn btn-success" style={{padding:"6px 14px",fontSize:12}} onClick={()=>handleValidate(pp.id)} disabled={actionLoading===pp.id}>{actionLoading===pp.id?"...":"\u2705 Valider"}</button>
                          <button className="btn btn-danger" style={{padding:"6px 14px",fontSize:12}} onClick={()=>setRejectId(pp.id)}>{"\u274C Refuser"}</button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Full history table */}
          <div style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:18}}>
            <div className="section-title"><div className="section-bar"></div>{fr?"Historique complet":"Full history"} ({allPP.length})</div>
            {allPP.length===0?(
              <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:30}}>{fr?"Aucun paiement":"No payments"}</div>
            ):(
              <div className="table-wrap">
                <table className="table" style={{fontSize:12}}>
                  <thead><tr>
                    <th>{t(lang,"date")}</th><th>{fr?"Prestataire":"Provider"}</th><th>{t(lang,"amount")}</th>
                    <th>{fr?"P\u00E9riode":"Period"}</th><th>{fr?"M\u00E9thode":"Method"}</th><th>{fr?"R\u00E9f\u00E9rence":"Ref"}</th>
                    <th>{t(lang,"status")}</th><th>{fr?"Valid\u00E9 par":"Validated by"}</th><th>Notes</th>
                  </tr></thead>
                  <tbody>
                    {allPP.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(pp=>{
                      const provName=profiles.find(p=>p.id===pp.provider_id)?.name||"?";
                      const validatorName=pp.validated_by?profiles.find(p=>p.id===pp.validated_by)?.name||"?":"\u2014";
                      const stMap={pending:{bg:"var(--warning-muted)",color:"var(--warning)",icon:"\u23F3"},validated:{bg:"var(--success-muted)",color:"var(--success)",icon:"\u2705"},rejected:{bg:"var(--danger-muted)",color:"var(--danger)",icon:"\u274C"}};
                      const st=stMap[pp.status]||stMap.pending;
                      return (
                        <tr key={pp.id}>
                          <td>{fmtDate(pp.created_at)}</td>
                          <td style={{fontWeight:600}}>{provName}</td>
                          <td style={{fontWeight:700}}>{Number(pp.amount).toLocaleString("fr-FR",{maximumFractionDigits:0})}{pp.currency==="EUR"?"\u20AC":"CHF"}</td>
                          <td style={{fontSize:10}}>{fmtDate(pp.period_from)} \u2192 {fmtDate(pp.period_to)}</td>
                          <td>{pp.payment_method||"\u2014"}</td>
                          <td style={{fontSize:10,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis"}}>{pp.reference||"\u2014"}</td>
                          <td><span style={{padding:"3px 10px",borderRadius:12,background:st.bg,color:st.color,fontSize:11,fontWeight:700}}>{st.icon} {pp.status}</span></td>
                          <td>{validatorName}</td>
                          <td style={{fontSize:10,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis"}}>{pp.notes||"\u2014"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>);
      })()}
    </div>
  );
});

// =============================================
// PRODUCT CATALOG TAB (Phase 2)
// =============================================
const ProductCatalogTab = ({user, lang, txs, models, profiles, products, productTags, modelPrices, onRefresh}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const dr = useDateRange("all");
  const [view, setView] = useState("produits");
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [priceEdits, setPriceEdits] = useState({});
  const [savingPrices, setSavingPrices] = useState(false);
  // CRUD state for products
  const [prodModal, setProdModal] = useState(null); // null | {mode:"create"} | {mode:"edit", data:{...}}
  const [prodForm, setProdForm] = useState({name:"",icon:"\u{1F4F9}",category:"Cam",price_chf:"",duration_minutes:"",active:true});
  const [prodSaving, setProdSaving] = useState(false);
  // CRUD state for tags
  const [tagModal, setTagModal] = useState(null);
  const [tagForm, setTagForm] = useState({name:"",product_id:"",default_price:"",duration_minutes:"",active:true});
  const [tagSaving, setTagSaving] = useState(false);

  const activeProducts = products.filter(p => p.active !== false);
  const activeTags = productTags.filter(t => t.active !== false);
  const filteredTxs = dr.filterByDate(txs, "date");
  const activeModels = models.filter(m => m.active !== false);

  // Build product stats from TX data
  const productStats = useMemo(() => {
    return activeProducts.map(prod => {
      const tags = activeTags.filter(t => t.product_id === prod.id);
      const tagIds = tags.map(t => t.id);
      // Match TXs by product_id FK or by product text field
      const pTxs = filteredTxs.filter(tx =>
        tx.product_id === prod.id ||
        (tx.product && tx.product.toLowerCase().includes(prod.name.toLowerCase()))
      );
      const validTxs = pTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
      const ca = validTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const sales = validTxs.length;
      const avgPrice = sales > 0 ? Math.round(ca / sales) : 0;
      // Top tags by CA
      const tagStats = tags.map(tag => {
        const tTxs = pTxs.filter(tx =>
          tx.product_tag_id === tag.id ||
          (tx.tag && tx.tag.toLowerCase().includes(tag.name.toLowerCase()))
        );
        const tValid = tTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
        const tCA = tValid.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
        return { tag, txCount: tTxs.length, validCount: tValid.length, ca: tCA };
      }).sort((a, b) => b.ca - a.ca);
      return { product: prod, tags, pTxs, validTxs, ca, sales, avgPrice, tagStats };
    }).sort((a, b) => b.ca - a.ca);
  }, [activeProducts, activeTags, filteredTxs, convertAmount]);

  // Global KPIs
  const totalActiveProducts = activeProducts.length;
  const totalActiveTags = activeTags.length;
  const totalCA = productStats.reduce((s, ps) => s + ps.ca, 0);
  const topProduct = productStats[0];
  const allTagStats = productStats.flatMap(ps => ps.tagStats).sort((a, b) => b.ca - a.ca);
  const topTag = allTagStats[0];
  const totalSales = productStats.reduce((s, ps) => s + ps.sales, 0);
  const avgBasket = totalSales > 0 ? Math.round(totalCA / totalSales) : 0;

  const medals = ["\u{1F947}", "\u{1F948}", "\u{1F949}"];

  // Save model price overrides
  const handleSavePrices = async () => {
    const entries = Object.entries(priceEdits);
    if (entries.length === 0) return;
    setSavingPrices(true);
    try {
      for (const [key, price] of entries) {
        const [modelId, tagId] = key.split("__");
        if (!price && price !== 0) {
          await sb.from("model_prices").delete().eq("model_id", modelId).eq("product_tag_id", tagId);
        } else {
          await sb.from("model_prices").upsert({ model_id: modelId, product_tag_id: tagId, price: parseFloat(price), currency: "EUR" }, { onConflict: "model_id,product_tag_id" });
        }
      }
      setPriceEdits({});
      await onRefresh();
      addToast(fr ? "Prix sauvegard\u00E9s" : "Prices saved", "success");
    } catch(e) { /* Model prices save failed */ addToast("Erreur: " + e.message, "error"); }
    setSavingPrices(false);
  };

  const getModelPrice = (modelId, tagId) => {
    const mp = modelPrices.find(p => p.model_id === modelId && p.product_tag_id === tagId);
    return mp ? Number(mp.price) : null;
  };

  // ── CRUD: Products ──
  const openProdCreate = () => { setProdForm({name:"",icon:"\u{1F4F9}",category:"Cam",price_chf:"",duration_minutes:"",active:true}); setProdModal({mode:"create"}); };
  const openProdEdit = (p) => { setProdForm({name:p.name||"",icon:p.icon||"\u{1F4F9}",category:p.category||"Cam",price_chf:p.price_chf||"",duration_minutes:p.duration_minutes||"",active:p.active!==false}); setProdModal({mode:"edit",data:p}); };
  const saveProd = async () => {
    if(!prodForm.name.trim()){addToast(fr?"Nom requis":"Name required","error");return;}
    setProdSaving(true);
    try {
      const row = {name:prodForm.name.trim(),icon:prodForm.icon,category:prodForm.category,price_chf:prodForm.price_chf?parseFloat(prodForm.price_chf):null,duration_minutes:prodForm.duration_minutes?parseInt(prodForm.duration_minutes):null,active:prodForm.active,has_duration:!!prodForm.duration_minutes};
      if(prodModal.mode==="edit") { await sb.from("products").update(row).eq("id",prodModal.data.id); }
      else { row.sort_order=products.length; await sb.from("products").insert(row); }
      await onRefresh(); setProdModal(null); addToast(fr?"Produit sauvegard\u00E9":"Product saved","success");
    } catch(e){addToast("Erreur: "+e.message,"error");}
    setProdSaving(false);
  };

  // ── CRUD: Tags ──
  const openTagCreate = () => { setTagForm({name:"",product_id:activeProducts[0]?.id||"",default_price:"",duration_minutes:"",active:true}); setTagModal({mode:"create"}); };
  const openTagEdit = (t) => { setTagForm({name:t.name||"",product_id:t.product_id||"",default_price:t.default_price||"",duration_minutes:t.duration_minutes||"",active:t.active!==false}); setTagModal({mode:"edit",data:t}); };
  const saveTag = async () => {
    if(!tagForm.name.trim()){addToast(fr?"Nom requis":"Name required","error");return;}
    setTagSaving(true);
    try {
      const row = {name:tagForm.name.trim(),product_id:tagForm.product_id||null,default_price:tagForm.default_price?parseFloat(tagForm.default_price):0,duration_minutes:tagForm.duration_minutes?parseInt(tagForm.duration_minutes):null,active:tagForm.active};
      if(tagModal.mode==="edit") { await sb.from("product_tags").update(row).eq("id",tagModal.data.id); }
      else { row.sort_order=productTags.length; await sb.from("product_tags").insert(row); }
      await onRefresh(); setTagModal(null); addToast(fr?"Contenu sauvegard\u00E9":"Content saved","success");
    } catch(e){addToast("Erreur: "+e.message,"error");}
    setTagSaving(false);
  };

  // Tab definitions
  const catTabs = [
    {id:"produits",label:fr?"Produits":"Products",icon:"\u{1F6CD}\uFE0F"},
    {id:"contenu",label:fr?"Contenu Associ\u00E9":"Associated Content",icon:"\u{1F3F7}\uFE0F"},
    {id:"analytics",label:"Analytics",icon:"\u{1F4CA}"},
  ];

  return (
    <div>
      <GlobalFilterBar lang={lang} dr={dr} />

      {/* KPIs */}
      <div className="kpi-grid" style={{marginBottom: 20}}>
        <KPICard label={fr ? "Produits actifs" : "Active Products"} value={totalActiveProducts} icon="\u{1F6CD}\uFE0F" />
        <KPICard label={fr ? "Tags actifs" : "Active Tags"} value={totalActiveTags} icon="\u{1F3F7}\uFE0F" />
        <KPICard label="CA Total" value={`${totalCA.toLocaleString("fr-FR",{maximumFractionDigits:0})}${currencySymbol}`} icon="\u{1F4B0}" />
        <KPICard label={fr ? "Top produit" : "Top Product"} value={topProduct ? `${topProduct.product.icon} ${topProduct.product.name}` : "\u2014"} icon="\u{1F947}" />
        <KPICard label={fr ? "Top tag" : "Top Tag"} value={topTag ? topTag.tag.name : "\u2014"} icon="\u{1F31F}" />
        <KPICard label={fr ? "Panier moyen" : "Avg Basket"} value={`${avgBasket}${currencySymbol}`} icon="\u{1F6D2}" />
      </div>

      {/* ═══ TABS BAR ═══ */}
      <div style={{display:"flex",gap:0,borderBottom:"1px solid #2A2A3E",marginBottom:24}}>
        {catTabs.map(ct=>(
          <button key={ct.id} onClick={()=>setView(ct.id)} style={{padding:"12px 20px",background:"none",border:"none",borderBottom:view===ct.id?"2px solid #8B5CF6":"2px solid transparent",color:view===ct.id?"#fff":"#6B7280",cursor:"pointer",fontSize:14,fontWeight:600,transition:"all 0.2s",fontFamily:"'DM Sans',sans-serif"}}>{ct.icon} {ct.label}</button>
        ))}
      </div>

      {/* ═══ TAB PRODUITS — CRUD CARDS ═══ */}
      {view === "produits" && (<>
        <button className="btn btn-primary" style={{marginBottom:20}} onClick={openProdCreate}>{"\u2795"} {fr?"Nouveau produit":"New product"}</button>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14,marginBottom:28}}>
          {products.map(p=>{
            const ps = productStats.find(s=>s.product.id===p.id);
            const tags = (productTags||[]).filter(t=>t.product_id===p.id);
            return (
              <div key={p.id} className="card-hover" onClick={()=>openProdEdit(p)} style={{background:"#1A1A2E",border:"1px solid #2A2A3E",borderRadius:16,padding:20,cursor:"pointer",transition:"all 0.2s"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:28}}>{p.icon||"\u{1F4E6}"}</span>
                    <div>
                      <div style={{fontSize:15,fontWeight:800,color:"var(--text-primary)"}}>{p.name}</div>
                      <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{fr?"Cat\u00E9gorie":"Category"}: {p.category||"Autre"}</div>
                    </div>
                  </div>
                  <span style={{padding:"3px 10px",borderRadius:12,fontSize:10,fontWeight:700,background:p.active!==false?"var(--success-muted)":"var(--bg-overlay)",color:p.active!==false?"var(--success)":"var(--text-quaternary)"}}>{p.active!==false?"\u25CF Actif":"\u25CB Inactif"}</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                  <div style={{padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.04)"}}>
                    <div style={{fontSize:9,fontWeight:600,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>{fr?"Prix":"Price"}</div>

                  const ca = mTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee")
                    .reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);

              return (

                    </tr>
                  </thead>
                  <tbody>
                    {activeProducts.map(prod => {
                      const rowTotal = activeModels.reduce((s, m) => s + (heatData[prod.id]?.[m.id] || 0), 0);
                      return (
                        <tr key={prod.id}>
                          <td style={{padding:"6px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{prod.icon} {prod.name}</td>
                          {activeModels.map(m => {
                            const val = heatData[prod.id]?.[m.id] || 0;
                            const intensity = maxVal > 0 ? val / maxVal : 0;
                            return (
                              <td key={m.id} style={{
                                textAlign:"center",padding:"6px 8px",fontWeight:600,fontSize:11,
                                background: val > 0 ? `var(--accent-subtle)` : "transparent",
                                color: val > 0 ? "var(--accent)" : "var(--text-quaternary)",
                                borderRadius:4,
                                opacity: val > 0 ? (0.4 + intensity * 0.6) : 1,
                              }}>{val > 0 ? val.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol : "\u2014"}</td>
                            );
                          })}
                          <td style={{textAlign:"center",padding:"6px 8px",fontWeight:800,color:"var(--text-primary)"}}>{rowTotal.toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}</td>
                        </tr>
                      );
                    })}
                    {/* Totals row */}
                    <tr style={{borderTop:"2px solid var(--border-default)"}}>
                      <td style={{padding:"8px 10px",fontWeight:800}}>Total</td>
                      {activeModels.map(m => {
                        const colTotal = activeProducts.reduce((s, prod) => s + (heatData[prod.id]?.[m.id] || 0), 0);
                        return <td key={m.id} style={{textAlign:"center",padding:"8px",fontWeight:800,color:"var(--text-primary)"}}>{colTotal > 0 ? colTotal.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol : "\u2014"}</td>;
                      })}
                      <td style={{textAlign:"center",padding:"8px",fontWeight:800,color:"var(--accent)"}}>{totalCA.toLocaleString("fr-FR",{maximumFractionDigits:0})}{currencySymbol}</td>
                    </tr>
                  </tbody>
                </table>
              );
            })()}
          </div>
        </div>
      </>)}
    </div>
  );
};

function useCountUp(target, duration) {
  const d = duration || 1000;
  const [value, setValue] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    if (target === prev.current) return;
    prev.current = target;
    let start = 0;
    const step = target / (d / 16);
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { setValue(target); clearInterval(timer); }
      else setValue(Math.round(start));
    }, 16);
    return () => clearInterval(timer);
  }, [target, d]);
  return value;
}

// ADMIN TAB (gerant only)
// =============================================
const AdminTab = ({lang, profiles, models, onRefresh, exchangeRate, setExchangeRate}) => {
  const addToast = useToast();
  const { currencySymbol } = useCurrency();
  const [selectedUser, setSelectedUser] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const startEdit = (u) => {
    setSelectedUser(u.id);
    setForm({
      commission_pct:u.commission_pct||0,
      daily_goal:u.daily_goal||0,
      weekly_goal:u.weekly_goal||0,
      role: u.role||"chatter",
      assigned_models: u.assigned_models||[]
    });
  };
  const saveEdit = async () => {
    setSaving(true);
    try {
      const {error} = await sb.from("profiles").update({
        commission_pct: parseFloat(form.commission_pct),
        daily_goal: parseFloat(form.daily_goal),
        weekly_goal: parseFloat(form.weekly_goal),
        role: form.role,
        assigned_models: form.assigned_models
      }).eq("id", selectedUser);
      if(error) { addToast("Erreur profil: " + error.message, "error"); setSaving(false); return; }
      setSelectedUser(null);
      await onRefresh();
      addToast(t(lang,"settings_saved")||"Sauvegardé ✓","success");
    } catch(e) { /* Profile update failed */ addToast("Erreur profil: " + e.message, "error"); }
    setSaving(false);
  };
  const handleModelToggle = (modelId) => {
    const current = form.assigned_models || [];
    if(current.includes(modelId)) {
      setForm({...form, assigned_models: current.filter(m=>m!==modelId)});
    } else {
      setForm({...form, assigned_models: [...current, modelId]});
    }
  };
  return (
    <div>
      <div className="info-box">
        Pour ajouter un membre, va dans le dashboard Supabase &gt; Authentication &gt; Users &gt; Add User.
        Remplis l'email et un mot de passe. Le profil sera cree automatiquement.
        Tu peux ensuite modifier le role et la commission ici.
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="section-title"><div className="section-bar"></div>{t(lang,"users")}</div>
          <table className="table" style={{fontSize:12}}>
            <thead><tr><th>Name</th><th>{t(lang,"role")}</th><th>Models</th><th>Comm %</th><th>Action</th></tr></thead>
            <tbody>
              {profiles.map(u=>(
                <tr key={u.id}>
                  <td>{u.name}</td>
                  <td>{u.role}</td>
                  <td>{u.role==="chatter"?(u.assigned_models||[]).map(mid=>models.find(m=>m.id===mid)?.name).filter(Boolean).join(", ")||"none":"—"}</td>
                  <td>{u.commission_pct}%</td>
                  <td><button className="btn btn-primary btn-small" onClick={()=>startEdit(u)}>{t(lang,"edit")}</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          {selectedUser&&(
            <div style={{marginTop:16,padding:12,background:"rgba(99,102,241,0.1)",borderRadius:8}}>
              <div className="form-group-modal">
                <label className="form-label">{t(lang,"role")}</label>
                <select className="filter-select" value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                  <option value="gerant">gerant</option>
                  <option value="modele">modele</option>
                  <option value="chatter">chatter</option>
                  <option value="provider">provider</option>
                </select>
              </div>
              {form.role==="chatter"&&(
                <div className="form-group-modal">
                  <label className="form-label">Assigned Models</label>
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {models.map(m=>(
                      <label key={m.id} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                        <input type="checkbox" checked={(form.assigned_models||[]).includes(m.id)} onChange={()=>handleModelToggle(m.id)} />
                        {m.name}
                      </label>
                    ))}
                  </div>
                </div>
              )}
              <div className="form-group-modal">
                <label className="form-label">Commission %</label>
                <input className="form-input" type="number" value={form.commission_pct} onChange={e=>setForm({...form,commission_pct:e.target.value})} />
              </div>
              <div className="form-group-modal">
                <label className="form-label">{t(lang,"daily_goal")}</label>
                <input className="form-input" type="number" value={form.daily_goal} onChange={e=>setForm({...form,daily_goal:e.target.value})} />
              </div>
              <div className="form-group-modal">
                <label className="form-label">{t(lang,"weekly_goal")}</label>
                <input className="form-input" type="number" value={form.weekly_goal} onChange={e=>setForm({...form,weekly_goal:e.target.value})} />
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-success" onClick={saveEdit} disabled={saving}>{saving?"...":t(lang,"save")}</button>
                <button className="btn btn-danger" onClick={()=>setSelectedUser(null)}>{t(lang,"cancel")}</button>
              </div>
            </div>
          )}
        </div>
        <div>
          <div className="card" style={{marginBottom:20}}>
            <div className="section-title"><div className="section-bar"></div>{t(lang,"models")}</div>
            <table className="table"><thead><tr><th>Name</th><th>Platform</th><th>Cost</th></tr></thead>
            <tbody>
              {models.map(m=>(<tr key={m.id}><td>{m.name}</td><td>{m.platform}</td><td>{m.monthly_cost}</td></tr>))}
            </tbody></table>
          </div>
          <div className="card">
            <div className="section-title"><div className="section-bar"></div>{t(lang,"providers")}</div>
            <table className="table"><thead><tr><th>Name</th><th>Commission %</th><th>Email</th></tr></thead>
            <tbody>
              {profiles.filter(u=>u.role==="provider").map(p=>(<tr key={p.id}><td>{p.name}</td><td>{p.commission_pct||0}%</td><td>{p.email||""}</td></tr>))}
            </tbody></table>
          </div>
        </div>
      </div>
      {/* Exchange Rate Config */}
      <div className="card" style={{marginTop:20}}>
        <div className="section-title"><div className="section-bar"></div>{lang==="fr"?"Taux de change":"Exchange Rate"}</div>
        <div style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0"}}>
          <span style={{fontSize:13,fontWeight:600}}>1 EUR =</span>
          <input type="number" step="0.01" value={exchangeRate||EXCHANGE_RATE_EUR_CHF} onChange={(e)=>setExchangeRate&&setExchangeRate(Number(e.target.value))} style={{width:80,padding:"6px 10px",borderRadius:8,border:"1px solid var(--border-default)",background:"var(--bg-overlay)",color:"var(--text)",fontSize:14,fontWeight:700,textAlign:"center"}} />
          <span style={{fontSize:13,fontWeight:600}}>CHF</span>
          <span style={{fontSize:11,color:"var(--text2)",marginLeft:8}}>{lang==="fr"?"(modifiable en temps réel)":"(live editable)"}</span>
        </div>
      </div>
      {/* Agency Details Config for Invoicing */}
      <AgencyConfigSection lang={lang} />
    </div>
  );
};

// =============================================
// TONIGHT RULES — deterministic helpers
// =============================================
const _hashStr = (str) => {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return Math.abs(h);
};
const tonightDate = (txId) => {
  const h = _hashStr(txId);
  const day = 13 + (h % 7);
  const hour = h % 24;
  const min = (h >>> 5) % 60;
  return `2026-02-${String(day).padStart(2,"0")}T${String(hour).padStart(2,"0")}:${String(min).padStart(2,"0")}:00.000Z`;
};
const tonightStatus = (txId, idx, total) => {
  // Exactly 2 pending — the 2 txs with highest hash are pending
  const h = _hashStr(txId + "_status");
  // We'll mark pending if idx is one of the 2 "chosen" positions (deterministic)
  if (total <= 2) return "pending";
  const pos1 = _hashStr("pending_slot_0") % total;
  const pos2 = (_hashStr("pending_slot_1") % (total - 1));
  const slot2 = pos2 >= pos1 ? pos2 + 1 : pos2;
  return (idx === pos1 || idx === slot2) ? "pending" : "validated";
};

// =============================================
// STANDARDIZED QUERIES (q_ helpers)
// =============================================
const q_spender_profile = (spendersList, key) => spendersList.find(s => s.spenderKey === key || s.handle.toLowerCase() === (key||"").toLowerCase()) || null;
const q_spender_transactions = (spender) => spender ? spender.txList.sort((a,b) => (b.txDate||"").localeCompare(a.txDate||"")) : [];
const q_spender_kpis = (spender) => {
  if (!spender) return {ltv:0, nbTx:0, avgTicket:0, maxTicket:0, validatedCA:0, pendingCA:0};
  const validatedCA = spender.txList.filter(t=>t.status==="validated").reduce((s,t)=>s+t.amount,0);
  const pendingCA = spender.txList.filter(t=>t.status==="pending").reduce((s,t)=>s+t.amount,0);
  return {ltv:spender.ltv, nbTx:spender.nbTx, avgTicket:spender.avgTicket, maxTicket:spender.maxTicket, validatedCA, pendingCA};
};
const q_spender_breakdown_models = (spender) => {
  if (!spender || !spender.txList.length) return [];

  spender.txList.forEach(tx => {

    m[mn].ca += tx.amount; m[mn].count++; m[mn].txs.push(tx);
  });
  return Object.values(m).sort((a,b) => b.ca - a.ca);
};

const XP_LEVELS = [
  { name: "Rookie",  icon: "\u{1F331}", min: 0,     color: "#94a3b8" },
  { name: "Hustler", icon: "\u{1F4AA}", min: 1000,  color: "var(--success)" },
  { name: "Closer",  icon: "\u{1F3AF}", min: 5000,  color: "var(--accent)" },
  { name: "Elite",   icon: "\u26A1",    min: 15000, color: "var(--warning)" },
  { name: "Legend",  icon: "\u{1F451}", min: 50000, color: "var(--pink)" },
];
const getLevel = (xp) => {
  let level = XP_LEVELS[0];
  for (const l of XP_LEVELS) { if (xp >= l.min) level = l; }
  const idx = XP_LEVELS.indexOf(level);
  const next = XP_LEVELS[idx + 1] || null;
  const progress = next ? Math.min(100, ((xp - level.min) / (next.min - level.min)) * 100) : 100;
  return { ...level, xp, progress, nextLevel: next };
};
const calculateXP = (chatterId, txs, convertAmount) => {
  return txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee"))
    .reduce((s, tx) => s + Math.round(convertAmount(Number(tx.amount), tx.currency)), 0);
};
const calculateStreak = (chatterId, txs) => {
  const dates = txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee"))
    .map(tx => new Date(tx.date).toISOString().slice(0, 10))
    .filter((v, i, a) => a.indexOf(v) === i)
    .sort().reverse();
  if (!dates.length) return 0;
  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (dates[0] !== today && dates[0] !== yesterday) return 0;
  let streak = 1;
  for (let i = 0; i < dates.length - 1; i++) {
    const diff = (new Date(dates[i]) - new Date(dates[i + 1])) / 86400000;
    if (diff === 1) streak++; else break;
  }
  return streak;
};
const STREAK_BADGES = [
  { min: 7,  name: "On Fire",     icon: "\u{1F525}", color: "var(--warning)" },
  { min: 14, name: "Unstoppable", icon: "\u26A1",    color: "var(--accent)" },

];
const getStreakBadges = (streak) => STREAK_BADGES.filter(b => streak >= b.min);

const getDailyProgress = (chatterId, txs, convertAmount) => {
  const today = new Date().toISOString().slice(0, 10);
  return txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee") && tx.date && tx.date.startsWith(today))
    .reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
};
const getWeeklyProgress = (chatterId, txs, convertAmount) => {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));

  return txs
    .filter(tx => tx.chatter_id === chatterId && (tx.status === "validated" || tx.status === "confirmee") && new Date(tx.date) >= monday)
    .reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
};
