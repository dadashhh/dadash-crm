  const defaultChatterName = malaProfile?.name || "Mala";

  // ── HELPERS ──
  const cleanName = (raw) => {
    if (!raw || raw === "?" || raw === ".") return null;
    // Remove: (VALIDÉ 150), (DE RETOUR), (valide 50) pack, emoji, amounts like "0E", "/ ? / ?"
    let s = raw
      .replace(/\(.*?\)/g, "")           // remove parenthetical: (VALIDÉ 150), (DE RETOUR)
      .replace(/\s*\d+E\b/gi, "")        // remove "0E", "150E"
      .replace(/[❤️🍑💎🔥✨💋👑🎀]/gu, "") // remove emojis
      .replace(/\s*\/\s*\?\s*/g, "")     // remove "/ ?"
      .replace(/\bpack\b/gi, "")         // remove "pack"
      .replace(/\bTIMEWASTER\b/gi, "")   // remove TIMEWASTER label
      .replace(/\bVALID[ÉE]?\b/gi, "")   // remove VALIDÉ
      .replace(/\s+/g, " ")              // collapse whitespace
      .trim();
    if (!s || s === "?" || s === "." || s.length < 2) return null;
    return s;
  };

  const extractBestName = (entry, telegramId) => {
    // Priority 1: info.prenom (if real)
    if (entry.info && entry.info.prenom && entry.info.prenom !== "?" && entry.info.prenom.length > 1) {
      return entry.info.prenom;
    }
    // Priority 2: "new" field — format "Nom / MontantE / Age / Metier"
    if (entry.new) {
      const firstPart = entry.new.split("/")[0].trim();
      const cleaned = cleanName(firstPart);
      if (cleaned) return cleaned;
    }
    // Priority 3: "orig" field — real Telegram name but with noise
    if (entry.orig) {
      const cleaned = cleanName(entry.orig);
      if (cleaned) return cleaned;
    }
    return "Contact_" + telegramId.substring(0, 6);
  };

  const modelNameFromFile = (filename) => {
    const base = filename.replace(/\.json$/i, "").replace(/[-_]/g, " ");
    return base.charAt(0).toUpperCase() + base.slice(1).toLowerCase();
  };

  // ══════════════════════════════════════════════
  // STEP 2 — NORMALIZE TRANSACTIONS (tonight rules)
  // Dates: deterministic Feb 13-19 2026
  // Chatter: always Mala | Provider: always Leo
  // Status: validated except exactly 2 pending
  // ══════════════════════════════════════════════
  const normalizedTxs = useMemo(() => {
    const out = [];
    rawData.forEach(({telegramId, entry, modelName}) => {
      const handle = extractBestName(entry, telegramId);
      const depense = Number(entry.depense) || 0;
      const isSpender = entry.spender === true;
      const txsArr = Array.isArray(entry.transactions) ? entry.transactions : [];
      const contenu = Array.isArray(entry.contenu) ? entry.contenu : [];

      let added = false;
      txsArr.forEach((tx, txIdx) => {
        const montant = Number(tx.montant) || 0;
        if (montant <= 0) return;
        const txId = telegramId + "_" + txIdx;
        out.push({
          txId,
          txDate: tonightDate(txId),
          amount: montant,
          spenderKey: telegramId,
          spenderHandle: handle,
          modelName: modelName,
          chatterName: defaultChatterName,
          chatterId: defaultChatterId,
          providerName: leoProfile?.name || "Leo",
          providerId: leoProfile?.id || null,
          status: "validated",
          description: tx.description || "",
          type: contenu[0] || "telegram_import",
        });
        added = true;
      });

      if (!added && depense > 0 && isSpender) {
        const txId = telegramId + "_synth";
        out.push({
          txId,
          txDate: tonightDate(txId),
          amount: depense,
          spenderKey: telegramId,
          spenderHandle: handle,
          modelName: modelName,
          chatterName: defaultChatterName,
          chatterId: defaultChatterId,
          providerName: leoProfile?.name || "Leo",
          providerId: leoProfile?.id || null,
          status: "validated",
          description: entry.resume ? entry.resume.substring(0, 100) : "",
          type: contenu[0] || "telegram_import",
        });
      }
    });
    // Apply tonight rule: exactly 2 pending (deterministic)
    if (out.length > 2) {
      const total = out.length;
      const pos1 = _hashStr("pending_slot_0") % total;
      let pos2 = _hashStr("pending_slot_1") % (total - 1);
      if (pos2 >= pos1) pos2++;
      out.forEach((tx, i) => { tx.status = (i === pos1 || i === pos2) ? "pending" : "validated"; });
    }
    return out;
  }, [rawData, defaultChatterId, defaultChatterName, leoProfile]);

  // ══════════════════════════════════════════════
  // STEP 3 — BUILD SPENDERS (from raw + normalized)
  // ══════════════════════════════════════════════
  const spendersList = useMemo(() => {
    const map = {};

    // First: seed ALL rawData entries (even those with 0 tx)
    rawData.forEach(({telegramId, entry, modelName}) => {
      const handle = extractBestName(entry, telegramId);
      if (!map[telegramId]) {
        map[telegramId] = {
          spenderKey: telegramId,
          handle: handle,
          isSpender: entry.spender === true,
          isTW: entry.tw === true,
          contenu: Array.isArray(entry.contenu) ? entry.contenu : [],
          resume: entry.resume || "",
          info: entry.info || {},
          modelName: modelName,
          ltv: 0, nbTx: 0, avgTicket: 0, maxTicket: 0,
          firstSeen: null, lastSeen: null,
          txList: [],
        };
      }
    });

    // Enrich with normalizedTxs
    normalizedTxs.forEach(tx => {
      const key = tx.spenderKey;
      if (!map[key]) {
        map[key] = {
          spenderKey: key, handle: tx.spenderHandle,
          isSpender: true, isTW: false,
          contenu: [], resume: "", info: {},
          modelName: tx.modelName,
          ltv: 0, nbTx: 0, avgTicket: 0, maxTicket: 0,
          firstSeen: null, lastSeen: null, txList: [],
        };
      }
      const s = map[key];
      s.ltv += tx.amount;
      s.nbTx++;
      s.maxTicket = Math.max(s.maxTicket, tx.amount);
      s.txList.push(tx);
      if (!s.firstSeen || tx.txDate < s.firstSeen) s.firstSeen = tx.txDate;
      if (!s.lastSeen || tx.txDate > s.lastSeen) s.lastSeen = tx.txDate;
    });

    // Also merge Supabase txs (from props)
    txs.forEach(tx => {
      const handle = tx.spender_handle;
      if (!handle) return;
      let found = Object.values(map).find(s => s.handle.toLowerCase() === handle.toLowerCase());
      if (!found) {
        const key = "supa_" + handle.toLowerCase();
        map[key] = {
          spenderKey: key, handle: handle,
          isSpender: true, isTW: false,
          contenu: [], resume: "", info: {},
          modelName: models.find(m => m.id === tx.model_id)?.name || "?",
          ltv: 0, nbTx: 0, avgTicket: 0, maxTicket: 0,
          firstSeen: null, lastSeen: null, txList: [],
        };
        found = map[key];
      }
      found.ltv += Number(tx.amount) || 0;
      found.nbTx++;
      found.maxTicket = Math.max(found.maxTicket, Number(tx.amount) || 0);
      const txDate = tx.date || tx.created_at || "";
      if (txDate && (!found.firstSeen || txDate < found.firstSeen)) found.firstSeen = txDate;
      if (txDate && (!found.lastSeen || txDate > found.lastSeen)) found.lastSeen = txDate;
      found.txList.push({
        txId: tx.id, txDate: txDate, amount: Number(tx.amount) || 0,
        spenderKey: found.spenderKey, spenderHandle: handle,
        modelName: models.find(m => m.id === tx.model_id)?.name || "?",
        providerName: profiles.find(p => p.id === tx.provider_id)?.name || "?",
        status: tx.status || "pending", description: tx.notes || "", type: tx.type || "",
      });
    });

    // Finalize: compute derived fields
    return Object.values(map).map(s => {
      s.avgTicket = s.nbTx > 0 ? s.ltv / s.nbTx : 0;
      s.segment = getSpenderSegment(s.ltv);
      const tags = [];
      if (s.isTW) tags.push("timewaster");
      if (s.isSpender && s.ltv > 0) tags.push("spender");
      if (s.ltv >= 500) tags.push("whale");
      else if (s.ltv >= 200) tags.push("vip");
      if (s.ltv >= 100 && (!s.info?.prenom || s.info.prenom === "?")) tags.push("silent_whale");
      const now = new Date();
      const lastDate = s.lastSeen ? new Date(s.lastSeen) : null;
      s.recencyDays = lastDate ? Math.floor((now - lastDate) / 86400000) : 999;
      if (s.recencyDays > 14) tags.push("cold");
      s.tags = [...new Set(tags)];
      return s;
    }).sort((a, b) => b.ltv - a.ltv);
  }, [rawData, normalizedTxs, txs, models, profiles]);

  // ── FILTERED SPENDERS ──
  const filteredSpenders = useMemo(() => {
    return spendersList.filter(s => {
      const q = debouncedSearchQuery.toLowerCase();
      const matchSearch = !q || s.handle.toLowerCase().includes(q) || (s.info?.prenom || "").toLowerCase().includes(q) || s.spenderKey.includes(q);
      const matchFilter =
        activeFilter === "all" ||
        (activeFilter === "spenders" && (s.isSpender || s.ltv > 0)) ||
        (activeFilter === "vip" && s.ltv >= 200) ||
        (activeFilter === "tw" && s.isTW) ||
        (activeFilter === "silent_whale" && s.tags.includes("silent_whale")) ||
        (activeFilter === "cold" && s.recencyDays > 14);
      const matchModel = filterModel === "all" || s.modelName === filterModel;
      return matchSearch && matchFilter && matchModel;
    });
  }, [spendersList, debouncedSearchQuery, activeFilter, filterModel]);

  // ── METRICS ──
  const metrics = useMemo(() => {
    const withLTV = spendersList.filter(s => s.ltv > 0);
    const totalCA = withLTV.reduce((acc, s) => acc + s.ltv, 0);
    const totalTx = normalizedTxs.length + txs.length;
    const avgTicket = totalTx > 0 ? totalCA / totalTx : 0;
    const whales = withLTV.filter(s => s.ltv >= 200);
    const silentWhales = spendersList.filter(s => s.tags.includes("silent_whale"));
    const twCount = spendersList.filter(s => s.isTW).length;
    const hourMap = Array(24).fill(0);
    normalizedTxs.forEach(tx => { const h = new Date(tx.txDate).getHours(); hourMap[h]++; });
    txs.forEach(tx => { if (tx.date) { const h = new Date(tx.date).getHours(); hourMap[h]++; } });
    const maxH = Math.max(...hourMap, 1);
    return { totalCA, spenderCount: withLTV.length, twCount, avgTicket, whales, silentWhales, hourMap, maxH };
  }, [spendersList, normalizedTxs, txs]);

  // ── BY MODEL ──
  const byModelData = useMemo(() => {
    const mm = {};
    spendersList.forEach(s => {
      const mn = s.modelName || "?";
      if (!mm[mn]) mm[mn] = {name: mn, contacts: [], totalCA: 0, nbTx: 0};
      mm[mn].contacts.push(s);
      mm[mn].totalCA += s.ltv;
      mm[mn].nbTx += s.nbTx;
    });
    return Object.values(mm).sort((a, b) => b.totalCA - a.totalCA);
  }, [spendersList]);

  const modelNames = useMemo(() => [...new Set(spendersList.map(s => s.modelName).filter(Boolean))], [spendersList]);

  // ══════════════════════════════════════════════
  // STEP 1 — IMPORT HANDLER
  // ══════════════════════════════════════════════
  const handleImportJSON = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setImporting(true);
    setImportLog([{type: "info", msg: fr ? `${files.length} fichier(s) detecte(s)...` : `${files.length} file(s) detected...`}]);

    const allRaw = [];
    let totalEntries = 0, totalSpenders = 0, totalTW = 0;
    let dbSpOk = 0, dbSpFail = 0, dbTxOk = 0, dbTxFail = 0;
    let lastDbErr = "";

    for (const file of files) {
      const modelName = modelNameFromFile(file.name);
      setImportLog(prev => [...prev, {type: "info", msg: `📂 ${file.name} → Modele: ${modelName}`}]);

      let data;
      try {
        const text = await file.text();
        data = JSON.parse(text);
      } catch (err) { /* JSON parse failed, skip entry */
        setImportLog(prev => [...prev, {type: "error", msg: `❌ JSON parse error: ${err.message}`}]);
        continue;
      }

      const entries = Object.entries(data);
      setImportLog(prev => [...prev, {type: "info", msg: `🔍 ${entries.length} entrees parsees`}]);

      const matchedModel = models.find(m => m.name.toLowerCase() === modelName.toLowerCase())
        || models.find(m => m.name.toLowerCase().includes(modelName.toLowerCase().substring(0, 4)))
        || null;
      const modelId = matchedModel?.id || models[0]?.id || null;

      if (matchedModel) {
        setImportLog(prev => [...prev, {type: "info", msg: `✅ Modele DB trouve: ${matchedModel.name}`}]);
      } else {
        setImportLog(prev => [...prev, {type: "info", msg: `⚠️ Modele "${modelName}" non trouve en DB`}]);
      }

      let fileCA = 0, fileTxCount = 0;

      for (const [telegramId, entry] of entries) {
        if (!entry || typeof entry !== "object") continue;
        totalEntries++;
        if (entry.spender) totalSpenders++;
        if (entry.tw) totalTW++;

        allRaw.push({telegramId, entry, fileName: file.name, modelName: matchedModel?.name || modelName});

        const handle = extractBestName(entry, telegramId);
        const depense = Number(entry.depense) || 0;
        const txsArr = Array.isArray(entry.transactions) ? entry.transactions : [];
        const contenu = Array.isArray(entry.contenu) ? entry.contenu : [];

        // Count local TX
        let wroteAny = false;
        for (let txIdx = 0; txIdx < txsArr.length; txIdx++) {
          const montant = Number(txsArr[txIdx].montant) || 0;
          if (montant <= 0) continue;
          fileTxCount++;
          fileCA += montant;
          wroteAny = true;
        }
        if (!wroteAny && depense > 0 && entry.spender) {
          fileTxCount++;
          fileCA += depense;
        }

        // ── UPSERT SPENDER en DB (enrichi) via bulletproof helper ──
        try {
          const spenderRow = {
            handle, name: handle, telegram_id: telegramId, model_id: modelId,
            total_spent: depense, status: entry.spender ? "active" : (entry.tw ? "timewaster" : "lead"),
            notes: entry.resume ? entry.resume.substring(0, 500) : null,
            source: "telegram_scan", last_seen: new Date().toISOString(),
            contact_info: entry.info ? JSON.stringify(entry.info) : null,
          };
          const res = await safeUpsertSpender(spenderRow);
          if (res.error) { dbSpFail++; lastDbErr = res.error.message; } else { dbSpOk++; }
        } catch (e) { /* Spender import insert failed */ dbSpFail++; lastDbErr = e.message; }

        // ── Write transactions to DB (10 champs) ──
        const txToWrite = [];
        for (let txIdx = 0; txIdx < txsArr.length; txIdx++) {
          const montant = Number(txsArr[txIdx].montant) || 0;
          if (montant <= 0) continue;
          txToWrite.push({montant, desc: txsArr[txIdx].description || "", idx: txIdx});
        }
        if (txToWrite.length === 0 && depense > 0 && entry.spender) {
          txToWrite.push({montant: depense, desc: (entry.resume || "").substring(0, 200), idx: 0});
        }

        for (const tw of txToWrite) {
          try {
            const txId = telegramId + "_" + tw.idx;
            const isUUID = (v) => typeof v === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
            const txRow = {
              date: tonightDate(txId),
              spender_handle: handle,
              amount: tw.montant,
              status: "validated",
              notes: tw.desc || null,
            };
            if(isUUID(modelId)) txRow.model_id = modelId;
            if(isUUID(leoProfile?.id)) txRow.provider_id = leoProfile.id;
            if(isUUID(defaultChatterId)) txRow.chatter_id = defaultChatterId;
            const res = await safeInsertTx(txRow);
            if (res.error) { dbTxFail++; lastDbErr = res.error.message; } else { dbTxOk++; }
          } catch (e) { /* TX import insert failed */ dbTxFail++; lastDbErr = e.message; }
        }
      }

      setImportLog(prev => [...prev,
        {type: "success", msg: `📊 ${modelName}: ${entries.length} contacts | ${fileTxCount} TX | ${fileCA.toFixed(0)}${currencySymbol}`},
      ]);
    }

    setImportLog(prev => [...prev,
      {type: "success", msg: `━━━━━━━━━━━━━━━━━━━━━━━━`},
      {type: "success", msg: `📇 TOTAL: ${totalEntries} contacts (${totalSpenders} spenders, ${totalTW} TW)`},
      {type: "info", msg: `💾 DB spenders: ${dbSpOk} ok / ${dbSpFail} fail`},
      {type: "info", msg: `💾 DB transactions: ${dbTxOk} ok / ${dbTxFail} fail`},
      lastDbErr ? {type: "error", msg: `⚠️ Derniere erreur DB: ${lastDbErr}`} : null,
      {type: "success", msg: `✅ Import termine ! Clique sur Fiches Spenders.`},
    ].filter(Boolean));

    // CRITICAL: store raw data in state — drives ALL downstream computations
    setRawData(prev => [...prev, ...allRaw]);
    setImporting(false);
    e.target.value = "";

    try { await onRefresh(); } catch (e) { /* best effort */ }
    addToast(fr ? `Import: ${totalEntries} contacts ✓` : `Import: ${totalEntries} contacts ✓`, "success");
    setTimeout(() => setActiveView("fiches"), 600);
  };

  // ── QUICK ADD ──
  const [quickForm, setQuickForm] = useState({spender: "", amount: "", model_id: "", type: ""});
  const [saving, setSaving] = useState(false);
  const handleQuickAdd = async () => {
    if (!quickForm.spender || !quickForm.amount) return;
    setSaving(true);
    const isUUID = (v) => typeof v === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
    try {
      const now = new Date().toISOString();
      try {
        await safeUpsertSpender({handle: quickForm.spender, name: quickForm.spender, status: "active", last_seen: now});
      } catch(e) { /* QA spender upsert best-effort */ }
      const txRow = {
        date: now,
        spender_handle: quickForm.spender,
        amount: Number(quickForm.amount),
        status: "pending",
        notes: null,
      };
      const mid = quickForm.model_id || models[0]?.id || null;
      if(isUUID(mid)) txRow.model_id = mid;
      if(isUUID(leoProfile?.id)) txRow.provider_id = leoProfile.id;
      if(isUUID(defaultChatterId)) txRow.chatter_id = defaultChatterId;
      if(quickForm.type) txRow.product = quickForm.type;
      const res = await safeInsertTx(txRow);
      if (!res.error) {
        addToast(`${quickForm.spender} — ${quickForm.amount}${currencySymbol} ✓`, "success");
        setQuickForm({spender: "", amount: "", model_id: quickForm.model_id, type: ""});
        await onRefresh();
      } else {
        addToast("Erreur: " + res.error.message, "error");
      }
    } catch(e) { /* Quick TX creation failed */
      addToast("Erreur: " + e.message, "error");
    }
    setSaving(false);
  };

  // ── Selected spender ──
  const selectedSpender = useMemo(() => {
    if (!selectedSpenderKey) return null;
    return spendersList.find(s => s.spenderKey === selectedSpenderKey) || null;
  }, [selectedSpenderKey, spendersList]);

  // ══════════════════════════════════════════════
  // RENDER
  // ══════════════════════════════════════════════
  return (
    <div>
      {/* ═══ NAV TABS ═══ */}
      <div style={{display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap"}}>
        {[
          {key: "import", icon: "📥", label: fr ? "Import Telegram" : "Import Telegram"},
          {key: "metrics", icon: "📊", label: fr ? "Metriques" : "Metrics"},
          {key: "by_model", icon: "👩", label: fr ? "Par Modele" : "By Model"},
          {key: "fiches", icon: "📇", label: fr ? "Fiches Spenders" : "Spender Files"},
        ].map(tab => (
          <button key={tab.key}
            className={`filter-chip ${activeView === tab.key ? "active" : ""}`}
            onClick={() => { setActiveView(tab.key); setSelectedSpenderKey(null); }}
            style={{fontSize: 13, padding: "8px 16px"}}>
            {tab.icon} {tab.label}
            {tab.key === "fiches" && ` (${filteredSpenders.length})`}
          </button>
        ))}
        {selectedSpender && (
          <button className={`filter-chip ${activeView === "detail" ? "active" : ""}`}
            onClick={() => setActiveView("detail")} style={{fontSize: 13, padding: "8px 16px"}}>
            👤 {selectedSpender.handle}
          </button>
        )}
      </div>

      {/* ═══ 1) IMPORT TAB ═══ */}
      {activeView === "import" && (
        <div>
          <div className="card" style={{marginBottom: 16}}>
            <div className="section-title"><div className="section-bar"></div>📥 Import JSON (Scan OFM)</div>
            <p style={{color: "var(--text2)", fontSize: 13, marginBottom: 12}}>
              {fr ? "Importe tes fichiers JSON de scan OFM. 1 fichier = 1 modele." : "Import OFM scan JSON files. 1 file = 1 model."}
            </p>
            <div style={{background: "var(--accent-subtle)", borderRadius: 8, padding: "8px 12px", marginBottom: 12, fontSize: 11, color: "var(--text2)"}}>
              <strong style={{color: "var(--accent)"}}>Format:</strong> {`{telegramId: {depense, spender, tw, contenu, transactions, resume, info}}`}
            </div>
            <div style={{display: "flex", gap: 12, alignItems: "center", marginBottom: 16}}>
              <label style={{background: "var(--grad)", color: "var(--text-primary)", padding: "10px 24px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600}}>
                📂 {fr ? "Choisir fichier(s)" : "Choose file(s)"}
                <input type="file" accept=".json" multiple onChange={handleImportJSON} style={{display: "none"}} />
              </label>
              {importing && <span className="ai-loading"></span>}
            </div>
            {importLog.length > 0 && (
              <div style={{background: "rgba(0,0,0,0.2)", borderRadius: 8, padding: 12, maxHeight: 300, overflow: "auto"}}>
                {importLog.map((log, i) => (
                  <div key={`${log.type}-${i}`} style={{fontSize: 12, padding: "3px 0", color: log.type === "error" ? "var(--danger)" : log.type === "success" ? "var(--success)" : "var(--text2)"}}>
                    {log.type === "error" ? "❌" : log.type === "success" ? "✅" : "ℹ️"} {log.msg}
                  </div>
                ))}
              </div>
            )}
          </div>
          {/* Quick Add */}
          <div className="card">
            <div className="section-title"><div className="section-bar"></div>⚡ {fr ? "Ajout Rapide" : "Quick Add"}</div>
            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12}}>
              <input list="qa-spender-list" placeholder={fr ? "Pseudo spender" : "Handle"} value={quickForm.spender} onChange={e => setQuickForm({...quickForm, spender: e.target.value})} className="filter-select" autoComplete="off" />
              <datalist id="qa-spender-list">{(spenders||[]).map(s=><option key={s.handle||s.name} value={s.handle||s.name}/>)}</datalist>
              <input type="number" placeholder={fr ? "Montant" : "Amount"} value={quickForm.amount} onChange={e => setQuickForm({...quickForm, amount: e.target.value})} className="filter-select" />
            </div>
            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12}}>
              <select className="filter-select" value={quickForm.model_id} onChange={e => setQuickForm({...quickForm, model_id: e.target.value})}>
                <option value="">{fr ? "Modele" : "Model"}</option>
                {models.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
              <select className="filter-select" value={quickForm.type} onChange={e => setQuickForm({...quickForm, type: e.target.value})}>
                <option value="">{fr ? "Type" : "Type"}</option>
                {PRODUCTS.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <button onClick={handleQuickAdd} disabled={saving || !quickForm.spender || !quickForm.amount}
              style={{background: (!quickForm.spender || !quickForm.amount) ? "var(--border-accent)" : "var(--grad)", color: "var(--text-primary)", border: "none", borderRadius: 8, padding: "12px 32px", cursor: saving ? "wait" : "pointer", fontWeight: 700, width: "100%"}}>
              {saving ? "⏳ ..." : "✅ " + (fr ? "AJOUTER" : "ADD")}
            </button>
          </div>
        </div>
      )}

      {/* ═══ 2) METRIQUES ═══ */}
      {activeView === "metrics" && (
        <div>

// PROVIDER COMPTA TAB — Full Provider Dashboard
// =============================================
const ProviderComptaTab = ({user, lang, txs, providerPayouts: ppData, profiles, models, onRefresh, onNotify, invoices, providerPaymentMethods}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [provSubTab, setProvSubTab] = useState("paiements");
  const [form, setForm] = useState({amount:"",currency:"EUR",period_from:"",period_to:"",payment_method:"virement",reference:"",notes:""});

  // TX stats
  const providerTxs = txs.filter(tx=>tx.provider_id===user.id);
  const validTxs = providerTxs.filter(tx=>tx.status==="validated"||tx.status==="confirmee");
  const pendingTxs = providerTxs.filter(tx=>tx.status==="pending");
  const totalCA = validTxs.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
  const totalPending = pendingTxs.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
  const now = new Date();
  const monthStart = new Date(now.getFullYear(),now.getMonth(),1);
  const thisMonthTxs = validTxs.filter(tx=>new Date(tx.date)>=monthStart);
  const thisMonthCA = thisMonthTxs.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);

  // Provider payouts from provider_payouts table
  const myPayouts = (ppData||[]).filter(p=>p.provider_id===user.id||p.declared_by===user.id);
  const validatedPayouts = myPayouts.filter(p=>p.status==="validated");
  const pendingPayouts = myPayouts.filter(p=>p.status==="pending");
  const totalPaid = validatedPayouts.reduce((s,p)=>s+Number(p.amount),0);
  const totalPendingPayout = pendingPayouts.reduce((s,p)=>s+Number(p.amount),0);
  const balance = totalCA - totalPaid - totalPendingPayout;

  const handleDeclare = async () => {
    if(!form.amount||isNaN(parseFloat(form.amount))||parseFloat(form.amount)<=0){addToast(fr?"Montant invalide (> 0)":"Invalid amount (> 0)","error");return;}
    if(!form.period_from||!form.period_to){addToast(fr?"Période requise":"Period required","error");return;}
    setSaving(true);
    try {
      const {error} = await sb.from("provider_payouts").insert({
        provider_id:user.id, declared_by:user.id,
        amount:parseFloat(form.amount), currency:form.currency,
        period_from:form.period_from, period_to:form.period_to,
        payment_method:form.payment_method, reference:form.reference,
        notes:form.notes, status:"pending"
      });
      if(error){addToast("Erreur: "+error.message,"error");setSaving(false);return;}
      // Notify gérant
      const gerants = profiles.filter(p=>p.role==="gerant");
      for(const g of gerants){
        if(onNotify) await onNotify(g.id,"payment","\u{1F4B3} Paiement déclaré",`${user.name} a déclaré un paiement de ${form.amount}${form.currency==="EUR"?"€":"CHF"}`);
      }
      setForm({amount:"",currency:"EUR",period_from:"",period_to:"",payment_method:"virement",reference:"",notes:""});
      setShowForm(false);
      if(onRefresh) await onRefresh();
      addToast(fr?"Paiement déclaré ✓":"Payment declared ✓","success");
    } catch(e){ /* Provider payment declaration failed */ addToast("Erreur: "+e.message,"error");}
    setSaving(false);
  };

  const statusBadge = (s) => {
    const map = {pending:{bg:"var(--warning-muted)",color:"var(--warning)",icon:"⏳"},validated:{bg:"var(--success-muted)",color:"var(--success)",icon:"✅"},rejected:{bg:"var(--danger-muted)",color:"var(--danger)",icon:"❌"}};
    const st = map[s]||map.pending;
    return React.createElement("span",{style:{padding:"3px 10px",borderRadius:12,background:st.bg,color:st.color,fontSize:11,fontWeight:700}},st.icon+" "+s);
  };

  const myProviderInvoices = (invoices||[]).filter(inv => inv.type === "incoming_provider" && inv.provider_id === user.id);

  return (
    <div>
      {/* Header */}
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:800,margin:0}}>{fr?"Bonjour":"Hello"} {user.name} {"\u{1F44B}"}</h2>
        <p style={{fontSize:11,color:"var(--text-tertiary)",margin:"3px 0 0",fontStyle:"italic"}}>{fr?"Votre espace prestataire":"Your provider space"}</p>
      </div>

      {/* Sub-tabs: Paiements / Factures */}
      <div style={{display:"flex",gap:4,marginBottom:20}}>
        {[{id:"paiements",label:fr?"Mes Paiements":"My Payments"},{id:"factures",label:fr?"Mes Factures":"My Invoices"},{id:"comptes",label:fr?"Mes Comptes":"My Accounts"}].map(tb=>(
          <button key={tb.id} className="btn" style={{padding:"6px 16px",fontSize:12,fontWeight:provSubTab===tb.id?800:600,background:provSubTab===tb.id?"var(--accent)":"var(--card-bg)",color:provSubTab===tb.id?"#fff":"var(--text-secondary)",border:"1px solid "+(provSubTab===tb.id?"var(--accent)":"var(--border-subtle)"),borderRadius:20}} onClick={()=>setProvSubTab(tb.id)}>{tb.label}</button>
        ))}
      </div>

      {provSubTab === "comptes" ? (()=>{
        const myMethods = (providerPaymentMethods || []).filter(pm => pm.provider_id === user.id && pm.active !== false).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
        return (
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 16 }}>{fr ? "Mes moyens de paiement" : "My payment methods"} ({myMethods.length})</div>
            {myMethods.length === 0 ? (
              <div style={{ textAlign: "center", color: "var(--text-quaternary)", padding: 40, fontSize: 12 }}>
                {fr ? "Aucun moyen de paiement configur\u00E9. Contactez le g\u00E9rant." : "No payment methods configured. Contact the manager."}
              </div>
            ) : myMethods.map(pm => {
              const ptc = PAYMENT_TYPE_COLORS[pm.type] || PAYMENT_TYPE_COLORS["Autre"];
              return (
                <div key={pm.id} style={{ padding: "14px 16px", marginBottom: 10, borderRadius: 14, background: "var(--card-bg)", border: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 12, background: ptc.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>{ptc.icon}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontWeight: 700, fontSize: 14 }}>{pm.label || pm.type}</span>
                      {pm.is_primary && <span style={{ padding: "2px 10px", borderRadius: 10, background: "var(--warning-muted)", color: "var(--warning)", fontSize: 10, fontWeight: 700 }}>{"\u2B50"} PRINCIPAL</span>}
                    </div>
                    <div style={{ fontSize: 13, color: "var(--text-secondary)", marginTop: 3 }}>{pm.detail}</div>
                    <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }}>{fr ? "Devise" : "Currency"}: {pm.currency || "CHF"}</div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })() : provSubTab === "factures" ? (
        <MyInvoicesPanel invoices={myProviderInvoices} lang={lang} />
      ) : (
      <>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:24}}>
        {[
          {label:fr?"CA Total Traité":"Total Revenue",value:totalCA.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:"\u{1F4B0}",color:"var(--success)"},
          {label:"TX Total",value:providerTxs.length,icon:"\u{1F4CB}"},
          {label:fr?"Ce mois":"This month",value:thisMonthCA.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:"\u{1F4C5}",color:"var(--accent)"},
          {label:fr?"Paiements validés":"Validated payments",value:totalPaid.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:"\u2705",color:"var(--success)"},
          {label:fr?"Solde en attente":"Pending balance",value:balance.toLocaleString("fr-FR",{maximumFractionDigits:0})+currencySymbol,icon:balance>0?"\u26A0\uFE0F":"\u2705",color:balance>0?"var(--warning)":"var(--success)"},
        ].map((k,i)=>(
          <div key={k.label} style={{background:"var(--card-bg)",border:"1px solid var(--border-subtle)",borderRadius:16,padding:"14px 16px"}}>
            <div style={{fontSize:10,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>{k.icon} {k.label}</div>
            <div style={{fontSize:22,fontWeight:800,color:k.color||"var(--text-primary)"}}>{k.value}</div>
          </div>
        ))}
      </div>

      {/* Declare payment button */}
      <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>
        + {fr?"Déclarer un paiement":"Declare a payment"}
      </button>

      {/* Declare form */}
      {showForm&&(
        <div className="card" style={{marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:16}}>{fr?"Nouveau paiement":"New payment"}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Montant versé *":"Amount paid *"}</label>
              <input className="form-input" type="number" step="0.01" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} placeholder="0.00"/>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Devise":"Currency"}</label>
              <select className="filter-select" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>
                <option value="EUR">EUR</option><option value="CHF">CHF</option><option value="USD">USD</option>
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Période du *":"Period from *"}</label>
              <input className="filter-date" type="date" value={form.period_from} onChange={e=>setForm({...form,period_from:e.target.value})}/>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Période au *":"Period to *"}</label>
              <input className="filter-date" type="date" value={form.period_to} onChange={e=>setForm({...form,period_to:e.target.value})}/>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Méthode de paiement":"Payment method"}</label>
              <select className="filter-select" value={form.payment_method} onChange={e=>setForm({...form,payment_method:e.target.value})}>
                <option value="virement">Virement</option><option value="crypto">Crypto</option><option value="paypal">PayPal</option><option value="revolut">Revolut</option><option value="wise">Wise</option>
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Référence / IBAN ref":"Reference / IBAN ref"}</label>
              <input className="form-input" value={form.reference} onChange={e=>setForm({...form,reference:e.target.value})} placeholder={fr?"Numéro de virement...":"Transfer number..."}/>
            </div>
            <div className="form-group-modal" style={{gridColumn:"1/-1"}}>
              <label className="form-label">Notes</label>
              <input className="form-input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder={fr?"Notes optionnelles...":"Optional notes..."}/>
            </div>
          </div>
          <div style={{display:"flex",gap:12,marginTop:16}}>
            <button className="btn btn-success" onClick={handleDeclare} disabled={saving}>{saving?"...":(fr?"Déclarer":"Declare")}</button>
            <button className="btn btn-danger" onClick={()=>setShowForm(false)}>{fr?"Annuler":"Cancel"}</button>
          </div>
        </div>
      )}

      {/* Payment history */}
      <div className="card" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>{fr?"Historique de mes paiements":"My payment history"}</div>
        {myPayouts.length===0?(
          <div style={{textAlign:"center",color:"var(--text-quaternary)",padding:30,fontSize:13}}>{fr?"Aucun paiement déclaré":"No payments declared"}</div>
        ):(
          <div className="table-wrap">
            <table className="table" style={{fontSize:12}}>
              <thead><tr>
                <th>{t(lang,"date")}</th><th>{t(lang,"amount")}</th><th>{fr?"Période":"Period"}</th>
                <th>{fr?"Méthode":"Method"}</th><th>{fr?"Référence":"Reference"}</th><th>{t(lang,"status")}</th><th>Notes</th>
              </tr></thead>
              <tbody>
                {myPayouts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(p=>(
                  <tr key={p.id}>
                    <td>{fmtDate(p.created_at)}</td>
                    <td style={{fontWeight:700}}>{Number(p.amount).toLocaleString("fr-FR",{maximumFractionDigits:0})}{p.currency==="EUR"?"€":"CHF"}</td>
                    <td style={{fontSize:10}}>{fmtDate(p.period_from)} → {fmtDate(p.period_to)}</td>
                    <td>{p.payment_method||"—"}</td>
                    <td style={{fontSize:10,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis"}}>{p.reference||"—"}</td>
                    <td>{statusBadge(p.status)}</td>
                    <td style={{fontSize:10,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis"}}>{p.notes||"—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* TX list */}
      <div className="card">
        <div className="section-title"><div className="section-bar"></div>{fr?"Mes transactions":"My transactions"}</div>
        <div className="table-wrap">
          <table className="table" style={{fontSize:12}}>
            <thead><tr><th>{t(lang,"date")}</th><th>Spender</th><th>Model</th><th>{t(lang,"amount")}</th><th>{t(lang,"status")}</th></tr></thead>
            <tbody>
              {providerTxs.slice(0,30).map(tx=>(
                <tr key={tx.id}>
                  <td>{fmtDate(tx.date)}</td>
                  <td><Tag type="spender" label={tx.spender_handle} id={tx.spender_handle}/></td>
                  <td><Tag type="model" label={models.find(m=>m.id===tx.model_id)?.name||"?"} id={tx.model_id}/></td>
                  <td style={{fontWeight:700}}>{fmtAmount(tx.amount,tx.currency)}</td>
                  <td><StatusPill status={tx.status} lang={lang}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      </>
      )}
    </div>
  );
};

// =============================================
// PRESTATAIRES TAB — Gérant only
// =============================================
const PrestatairesTab = React.memo(({user, lang, txs, models, profiles, onRefresh, providerPayouts: ppData, onNotify, providerPaymentMethods: ppmData, setProviderPaymentMethods: setPpmData}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const dr = useDateRange("all");
  const [pfModel, setPfModel] = useState("");
  const [selectedProv, setSelectedProv] = useState(null);
  const [subTab, setSubTab] = useState("stats");
  const [modalTab, setModalTab] = useState("transactions");
  const [modalModelFilter, setModalModelFilter] = useState("");
  const [modalStatusFilter, setModalStatusFilter] = useState("");
  const [rejectId, setRejectId] = useState(null);
  const [rejectNotes, setRejectNotes] = useState("");
  const [actionLoading, setActionLoading] = useState(null);
  const [hoveredCard, setHoveredCard] = useState(null);
  const [ppmEditModal, setPpmEditModal] = useState(null); // null | {mode:"add"|"edit", data:{...}, providerId:...}
  const [ppmSaving, setPpmSaving] = useState(false);
  const [ppmDeleteConfirm, setPpmDeleteConfirm] = useState(null);
  const {sort:pSort, onSort:pOnSort, doSort:pDoSort} = useSortable();
  const cardRefs = useRef({});

  // Constants
  const ALERT_REVERSE_DAYS = 3;
  const ALERT_PENDING_COUNT = 5;

  // Local avatar helpers
  const _getInitials = (name) => (name || "?").split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
  const _avatarColor = (id) => { let h = 0; for (let i = 0; i < (id || "").length; i++) h = (id || "").charCodeAt(i) + ((h << 5) - h); return `hsl(${Math.abs(h) % 360}, 60%, 50%)`; };

  const providers = profiles.filter(p => p.role === "provider");
  const allPP = ppData || [];
  const allValidatedPP = allPP.filter(p => p.status === "validated");

  const filteredTxs = useMemo(() => {
    return filterByModel(dr.filterByDate(txs, "date"), pfModel);
  }, [txs, dr.startDate, dr.endDate, dr.activePreset, pfModel]);

  const providerStats = useMemo(() => {
    return providers.map(prov => {
      const pTxs = filteredTxs.filter(tx => tx.provider_id === prov.id);
      const validatedTxs = pTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
      const pendingTxs = pTxs.filter(tx => tx.status === "pending");
      const refusedTxs = pTxs.filter(tx => tx.status === "refused" || tx.status === "refusee");
      const totalCA = validatedTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const pendingAmount = pendingTxs.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0);
      const avgTicket = validatedTxs.length > 0 ? Math.round(totalCA / validatedTxs.length) : 0;
      const validationRate = pTxs.length > 0 ? Math.round((validatedTxs.length / pTxs.length) * 100) : 0;
      const modelIds = [...new Set(pTxs.map(tx => tx.model_id).filter(Boolean))];
      const modelNames = modelIds.map(mid => models.find(m => m.id === mid)?.name || "?");
      const modelBreakdown = modelIds.map(mid => {
        const mTxs = pTxs.filter(tx => tx.model_id === mid);
        const mValid = mTxs.filter(tx => tx.status === "validated" || tx.status === "confirmee");
        return { modelId: mid, modelName: models.find(m => m.id === mid)?.name || "?", ca: mValid.reduce((s, tx) => s + convertAmount(Number(tx.amount), tx.currency), 0), txCount: mTxs.length };
      }).sort((a, b) => b.ca - a.ca);

      // Reversement data
      const provPP = allValidatedPP.filter(p => p.provider_id === prov.id);
      const provAllPP = allPP.filter(p => p.provider_id === prov.id);
      const totalReversed = provPP.reduce((s, p) => s + Number(p.amount), 0);
      const soldeDu = Math.max(0, totalCA - totalReversed);
      const sortedPP = [...provPP].sort((a, b) => new Date(b.validated_at || b.created_at) - new Date(a.validated_at || a.created_at));
      const lastReversementDate = sortedPP.length > 0 ? new Date(sortedPP[0].validated_at || sortedPP[0].created_at) : null;
      const daysSinceReverse = lastReversementDate ? Math.floor((Date.now() - lastReversementDate.getTime()) / 86400000) : null;

      // Average delay
      let avgDelay = 0;
      if (provPP.length > 0) {
        const delays = provPP.map(pp => {
          const ppDate = new Date(pp.validated_at || pp.created_at);
          const relevantTxs = validatedTxs.filter(tx => new Date(tx.date) <= ppDate);
          if (relevantTxs.length === 0) return 0;
          const lastTx = relevantTxs.sort((a, b) => new Date(b.date) - new Date(a.date))[0];
          return Math.max(0, (ppDate - new Date(lastTx.date)) / 86400000);
        });
        avgDelay = delays.length > 0 ? Math.round(delays.reduce((s, d) => s + d, 0) / delays.length * 10) / 10 : 0;
      }

      const reversePct = totalCA > 0 ? Math.round((totalReversed / totalCA) * 100) : 0;

      return {
        provider: prov, pTxs, totalCA, pendingAmount, avgTicket, validationRate,
        validatedCount: validatedTxs.length, pendingCount: pendingTxs.length, refusedCount: refusedTxs.length,
        txCount: pTxs.length, modelIds, modelNames, modelBreakdown,
        totalReversed, soldeDu, daysSinceReverse, avgDelay, reversePct, lastReversementDate,
        provAllPP,
      };
    }).sort((a, b) => b.totalCA - a.totalCA);
  }, [filteredTxs, providers, models, convertAmount, allPP, allValidatedPP]);

  // Alerts
  const alerts = useMemo(() => {
    const result = [];
    providerStats.forEach(ps => {
      if (ps.soldeDu > 0 && (ps.daysSinceReverse === null || ps.daysSinceReverse > ALERT_REVERSE_DAYS)) {
        result.push({
          type: "red", providerId: ps.provider.id,
          message: `${ps.provider.name} : ${ps.soldeDu.toLocaleString("fr-FR", {maximumFractionDigits: 0})}${currencySymbol} ${fr ? "non revers\u00E9s" : "not reversed"}${ps.daysSinceReverse !== null ? ` ${fr ? "depuis" : "since"} ${ps.daysSinceReverse}${fr ? "j" : "d"}` : ` (${fr ? "jamais revers\u00E9" : "never reversed"})`}`,
        });
      }
      if (ps.pendingCount > ALERT_PENDING_COUNT) {
        result.push({
          type: "orange", providerId: ps.provider.id,
          message: `${ps.provider.name} : ${ps.pendingCount} TX ${fr ? "en attente de confirmation" : "pending confirmation"}`,
        });
      }
    });
    return result;
  }, [providerStats, currencySymbol, fr]);

  // Modal filtered TXs
  const modalFilteredTxs = useMemo(() => {
    if (!selectedProv) return [];
    let txList = [...selectedProv.pTxs];
    if (modalModelFilter) txList = txList.filter(tx => tx.model_id === modalModelFilter);
    if (modalStatusFilter) txList = txList.filter(tx => tx.status === modalStatusFilter);
    return txList.sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [selectedProv, modalModelFilter, modalStatusFilter]);

  const modalTxPag = usePagination(modalFilteredTxs, 15);

  const sortedProvStats = pDoSort(providerStats, {
    name: x=>(x.provider.name||"").toLowerCase(), totalCA: x=>x.totalCA, txCount: x=>x.txCount,
    validatedCount: x=>x.validatedCount, pendingCount: x=>x.pendingCount, refusedCount: x=>x.refusedCount,
    validationRate: x=>x.validationRate, avgTicket: x=>x.avgTicket, pendingAmount: x=>x.pendingAmount,
    totalReversed: x=>x.totalReversed, soldeDu: x=>x.soldeDu, avgDelay: x=>x.avgDelay,
  });
  const pPag = usePagination(sortedProvStats);

  // Global KPIs
  const totalProviders = providers.length;
  const globalCA = providerStats.reduce((s, ps) => s + ps.totalCA, 0);
  const globalTxCount = providerStats.reduce((s, ps) => s + ps.txCount, 0);
  const globalPendingCount = providerStats.reduce((s, ps) => s + ps.pendingCount, 0);
  const globalValidationRate = globalTxCount > 0 ? Math.round(providerStats.reduce((s, ps) => s + ps.validatedCount, 0) / globalTxCount * 100) : 0;
  const globalPendingAmount = providerStats.reduce((s, ps) => s + ps.pendingAmount, 0);
  const globalReversed = providerStats.reduce((s, ps) => s + ps.totalReversed, 0);
  const globalSoldeDu = providerStats.reduce((s, ps) => s + ps.soldeDu, 0);

  // Handlers for validate/reject (used in modal + paiements tab)
  const handleValidate = async (ppId) => {
    setActionLoading(ppId);
    try {
      const {error} = await sb.from("provider_payouts").update({status:"validated",validated_by:user.id,validated_at:new Date().toISOString()}).eq("id",ppId);
      if (error) { addToast("Erreur: "+error.message,"error"); } else {
        const pp = allPP.find(p=>p.id===ppId);
        if (onNotify&&pp) await onNotify(pp.declared_by,"payment","\u2705 Paiement valid\u00E9",`Votre paiement de ${pp.amount}${pp.currency==="EUR"?"\u20AC":"CHF"} a \u00E9t\u00E9 valid\u00E9`);
        if (pp) { try { await generateProviderInvoice(pp, profiles, user.id); } catch(e) { addToast(fr?"Erreur g\u00E9n\u00E9ration facture provider":"Provider invoice generation error","error"); } }
        addToast(fr?"Paiement valid\u00E9 \u2713":"Payment validated \u2713","success");
        if (onRefresh) await onRefresh();
      }
    } catch(e) { addToast("Erreur: "+e.message,"error"); }
    setActionLoading(null);
  };

  const handleReject = async (ppId) => {
    if (!rejectNotes.trim()) { addToast(fr?"Raison obligatoire":"Reason required","error"); return; }
    setActionLoading(ppId);
    try {
      const {error} = await sb.from("provider_payouts").update({status:"rejected",validated_by:user.id,validated_at:new Date().toISOString(),notes:rejectNotes}).eq("id",ppId);
      if (error) { addToast("Erreur: "+error.message,"error"); } else {
        const pp = allPP.find(p=>p.id===ppId);
        if (onNotify&&pp) await onNotify(pp.declared_by,"payment","\u274C Paiement refus\u00E9",`Votre paiement de ${pp.amount}${pp.currency==="EUR"?"\u20AC":"CHF"} a \u00E9t\u00E9 refus\u00E9: ${rejectNotes}`);
        setRejectId(null); setRejectNotes("");
        addToast(fr?"Paiement refus\u00E9":"Payment rejected","error");
        if (onRefresh) await onRefresh();
      }
    } catch(e) { addToast("Erreur: "+e.message,"error"); }
    setActionLoading(null);
  };

  const scrollToProvider = (providerId) => {
    const el = cardRefs.current[providerId];
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  // PPM CRUD handlers
  const handlePpmSave = async (formData) => {
    setPpmSaving(true);
    try {
      const isEdit = ppmEditModal?.mode === "edit";
      // If setting as primary, unset others first
      if (formData.is_primary) {
        const others = (ppmData || []).filter(pm => pm.provider_id === formData.provider_id && pm.is_primary && pm.id !== formData.id);
        for (const o of others) {
          await sb.from("provider_payment_methods").update({ is_primary: false }).eq("id", o.id);
        }
      }
      if (isEdit) {
        const { error } = await sb.from("provider_payment_methods").update({
          type: formData.type, label: formData.label || null, detail: formData.detail,
          currency: formData.currency, is_primary: formData.is_primary, active: formData.active,
        }).eq("id", formData.id);
        if (error) { addToast("Erreur: " + error.message, "error"); } else {
          addToast(fr ? "Compte modifi\u00E9 \u2713" : "Account updated \u2713", "success");
        }
      } else {
        const maxSort = (ppmData || []).filter(pm => pm.provider_id === formData.provider_id).length;
        const { error } = await sb.from("provider_payment_methods").insert({
          provider_id: formData.provider_id, type: formData.type, label: formData.label || null,
          detail: formData.detail, currency: formData.currency, is_primary: formData.is_primary,
          active: formData.active !== false, sort_order: maxSort,
        });
        if (error) { addToast("Erreur: " + error.message, "error"); } else {
          addToast(fr ? "Compte ajout\u00E9 \u2713" : "Account added \u2713", "success");
        }
      }
      setPpmEditModal(null);
      if (onRefresh) await onRefresh();
    } catch (e) { addToast("Erreur: " + e.message, "error"); }
    setPpmSaving(false);
  };

  const handlePpmDelete = async (pmId) => {
    setPpmSaving(true);
    try {
      // Check if linked to TXs
      const linkedTxs = txs.filter(tx => tx.provider_payment_method_id === pmId);
      if (linkedTxs.length > 0) {
        // Deactivate instead of delete
        const { error } = await sb.from("provider_payment_methods").update({ active: false }).eq("id", pmId);
        if (error) { addToast("Erreur: " + error.message, "error"); } else {
          addToast(fr ? "Compte d\u00E9sactiv\u00E9 (li\u00E9 \u00E0 des TX)" : "Account deactivated (linked to TXs)", "success");
        }
      } else {
        const { error } = await sb.from("provider_payment_methods").delete().eq("id", pmId);
        if (error) { addToast("Erreur: " + error.message, "error"); } else {
          addToast(fr ? "Compte supprim\u00E9 \u2713" : "Account deleted \u2713", "success");
        }
      }
      setPpmDeleteConfirm(null);
      if (onRefresh) await onRefresh();
    } catch (e) { addToast("Erreur: " + e.message, "error"); }
    setPpmSaving(false);

    if (!date) return fr ? "jamais" : "never";

    if (days === 0) return fr ? "aujourd'hui" : "today";
    if (days === 1) return fr ? "hier" : "yesterday";
    return `${fr ? "il y a" : ""} ${days}${fr ? "j" : "d ago"}`;

                            <td>{mName}</td>
