  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    /* Safe area support for notched iPhones */
    @supports (padding: env(safe-area-inset-bottom)) {

    /* ══════════════════════════════════════════════════════
       DESIGN SYSTEM V2 — CSS Custom Properties
       Ultra Dark Premium (Notion Dark × Linear × Vercel)
       ══════════════════════════════════════════════════════ */
    :root {
      /* — Backgrounds (6 levels, darkest → lightest) — */
      --bg-base: #09090b;
      --bg-raised: #0f0f12;
      --bg-overlay: #18181b;
      --bg-surface: #1e1e22;
      --bg-hover: #27272a;
      --bg-active: #303034;
      /* — Borders (4 levels) — */
      --border-subtle: rgba(255,255,255,0.06);
      --border-default: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.14);
      --border-accent: rgba(99,102,241,0.4);
      /* — Text (4 levels) — */
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --text-quaternary: #52525b;
      /* — Accent (Indigo) — */
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-muted: rgba(99,102,241,0.15);
      --accent-subtle: rgba(99,102,241,0.08);
      /* — Status colors — */
      --success: #34d399;
      --success-muted: rgba(52,211,153,0.15);
      --warning: #fbbf24;
      --warning-muted: rgba(251,191,36,0.15);
      --danger: #f87171;
      --danger-muted: rgba(248,113,113,0.15);
      --pink: #f472b6;
      --pink-muted: rgba(244,114,182,0.15);
      /* — Brand colors — */
      --brand-whatsapp: #25D366;
      --brand-whatsapp-muted: rgba(37,211,102,0.15);
      --brand-telegram: #0088cc;
      --brand-telegram-muted: rgba(0,136,204,0.15);
      --blue-accent: #60a5fa;
      --blue-accent-muted: rgba(96,165,250,0.15);
      --medal-silver: #c0c0c0;
      --medal-bronze: #cd7f32;
      /* — Semantic aliases — */
      --bg: var(--bg-base);
      --bg2: var(--bg-raised);
      --card: var(--bg-raised);
      --primary: #6366f1;
      --text: var(--text-primary);
      --text2: var(--text-secondary);
      --grad: linear-gradient(135deg, #818cf8, #6366f1);
      /* — Shadows — */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      /* — Radius — */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      /* — Sidebar — */
      --sidebar-bg: var(--bg-base);
      --sidebar-border: var(--border-subtle);
      --sidebar-btn-color: var(--text-tertiary);
      --sidebar-btn-hover-bg: var(--bg-hover);
      --sidebar-btn-hover-color: var(--text-primary);
      --sidebar-btn-active-bg: var(--accent-muted);
      --sidebar-btn-active-color: var(--accent);
      /* — Topbar — */
      --topbar-bg: var(--bg-base);
      --topbar-border: var(--border-subtle);
      /* — Card — */
      --card-bg: var(--bg-raised);
      --card-border: var(--border-default);
      --card-hover-border: var(--border-strong);
      /* — Table — */
      --table-header-bg: var(--bg-overlay);
      --table-header-color: var(--text-tertiary);
      --table-row-hover: var(--bg-overlay);
      --table-border: var(--border-subtle);
      /* — Modal — */
      --modal-backdrop: rgba(0,0,0,0.6);
      --modal-bg: var(--bg-raised);
      /* — Input — */
      --input-bg: var(--bg-overlay);
      --input-border: var(--border-default);
      --input-focus-border: var(--accent);
      --input-focus-ring: rgba(99,102,241,0.15);
      --input-color: var(--text-primary);
      /* — Filter Chip — */
      --chip-bg: transparent;
      --chip-border: var(--border-default);
      --chip-color: var(--text-secondary);
      --chip-active-bg: var(--accent-muted);
      --chip-active-border: var(--border-accent);
      --chip-active-color: var(--accent);
    }
    /* ====== LIGHT THEME ====== */
    [data-theme="light"] {
      --bg-base: #f8f9fa;
      --bg-raised: #ffffff;
      --bg-overlay: #f1f3f5;
      --bg-surface: #e9ecef;
      --bg-hover: #f1f3f5;
      --bg-active: #e9ecef;
      --border-subtle: rgba(0,0,0,0.06);
      --border-default: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.16);
      --border-accent: rgba(99,102,241,0.5);
      --text-primary: #111113;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --text-quaternary: #d1d5db;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-muted: rgba(99,102,241,0.1);
      --accent-subtle: rgba(99,102,241,0.05);
      --success: #059669;
      --success-muted: rgba(5,150,105,0.1);
      --warning: #d97706;
      --warning-muted: rgba(217,119,6,0.1);
      --danger: #dc2626;
      --danger-muted: rgba(220,38,38,0.1);
      --pink: #db2777;
      --pink-muted: rgba(219,39,119,0.1);
      --brand-whatsapp: #25D366;
      --brand-whatsapp-muted: rgba(37,211,102,0.15);
      --brand-telegram: #0088cc;
      --brand-telegram-muted: rgba(0,136,204,0.15);
      --blue-accent: #3b82f6;
      --blue-accent-muted: rgba(59,130,246,0.1);
      --medal-silver: #9ca3af;
      --medal-bronze: #b45309;
      --bg: var(--bg-base);
      --bg2: var(--bg-raised);
      --card: var(--bg-raised);
      --text: var(--text-primary);
      --text2: var(--text-secondary);
      --grad: linear-gradient(135deg, #6366f1, #4f46e5);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --sidebar-bg: var(--bg-raised);
      --sidebar-border: var(--border-subtle);
      --sidebar-btn-color: var(--text-secondary);
      --sidebar-btn-hover-bg: var(--bg-hover);
      --sidebar-btn-hover-color: var(--text-primary);
      --sidebar-btn-active-bg: var(--accent-muted);
      --sidebar-btn-active-color: var(--accent);
      --topbar-bg: rgba(255,255,255,0.95);
      --topbar-border: var(--border-subtle);
      --card-bg: var(--bg-raised);
      --card-border: var(--border-default);
      --card-hover-border: var(--border-strong);
      --table-header-bg: var(--bg-overlay);
      --table-header-color: var(--text-secondary);
      --table-row-hover: var(--bg-hover);
      --table-border: var(--border-subtle);
      --modal-backdrop: rgba(0,0,0,0.4);
      --modal-bg: var(--bg-raised);
      --input-bg: var(--bg-base);
      --input-border: var(--border-default);
      --input-focus-border: var(--accent);
      --input-focus-ring: rgba(99,102,241,0.12);
      --input-color: var(--text-primary);
      --chip-bg: var(--bg-overlay);
      --chip-border: var(--border-default);
      --chip-color: var(--text-secondary);
      --chip-active-bg: var(--accent-muted);
      --chip-active-border: var(--border-accent);
      --chip-active-color: var(--accent);
    }
    /* ====== TRANSITIONS (smooth theme switch) ====== */
    body, .sidebar, .topbar, .card, .kpi, .spender-card, .profile-panel, .ai-card, .form-input, .table th, .table td, .filter-chip, .filter-select, .filter-date, .info-box, .login-wrap, .login-card {
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }
    /* ====== TOAST NOTIFICATIONS ====== */
    .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { padding:12px 20px; border-radius:10px; color:white; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.3); animation:slideInToast 0.3s ease-out; pointer-events:auto; }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--accent); }
    @keyframes slideInToast { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    /* ====== CLICKABLE TAGS ====== */
    .tag-click { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); cursor:pointer; transition:all 0.15s; font-size:12px; font-weight:500; text-transform:uppercase; }
    .tag-click:hover { opacity:0.8; }
    .tag-spender { background:var(--pink-muted); color:var(--pink); }
    .tag-model { background:var(--accent-muted); color:var(--accent); }
    .tag-chatter { background:var(--success-muted); color:var(--success); }
    .tag-provider { background:var(--warning-muted); color:var(--warning); }
    /* ====== FADE-IN ANIMATION ====== */
    .fade-in { animation: fadeInTab 0.25s ease-out; }
    @keyframes fadeInTab { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    /* ====== SORTABLE TABLE HEADERS ====== */
    .sort-th { cursor:pointer; user-select:none; }
    .sort-th:hover { background:var(--accent-subtle); }
    .sort-arrow { font-size:10px; margin-left:3px; opacity:0.4; }
    .sort-arrow.active { opacity:1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-overlay); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      overflow: hidden;
    }
    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg-base);
      position: relative; overflow: hidden;
    }
    .login-orb {
      position: absolute; border-radius: 50%;
      filter: blur(40px); opacity: 0.1;
    }
    .login-orb-1 { width: 300px; height: 300px; background: var(--accent); top: -100px; left: -100px; }
    .login-orb-2 { width: 300px; height: 300px; background: var(--pink); bottom: -100px; right: -100px; }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg); padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: var(--shadow-lg);
      position: relative; z-index: 1;
    }
    .login-logo {
      width: 60px; height: 60px;
      background: var(--grad);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: bold;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.25);
    }
    .login-title {
      text-align: center; font-size: 24px; font-weight: 700;
      margin-bottom: 10px; color: var(--text-primary);
    }
    .login-subtitle {
      text-align: center; color: var(--text-secondary); font-size: 13px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase;
    }
    .form-input {
      width: 100%; padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--input-color);
      font-size: 13px;
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3px var(--input-focus-ring);
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(99,102,241,0.25);
    }
    .lang-toggle {
      position: absolute; top: 20px; right: 20px;
      background: var(--accent-subtle);
      border: 1px solid var(--border-default);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-toggle:hover { background: var(--accent-muted); }
    .app-wrap { display: flex; height: 100vh; }
    .sidebar {
      width: 72px; background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex; flex-direction: column;
      align-items: center;
      padding: 16px 0;
      transition: width 0.2s ease;
    }
    .sidebar.expanded {
      width: 220px;
      align-items: stretch;
      padding: 16px 12px;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: var(--grad);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      margin-bottom: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sidebar.expanded .sidebar-logo {
      width: auto; height: 40px;
      padding: 0 12px;
      font-size: 16px;
      justify-content: flex-start;
      gap: 10px;
    }
    .sidebar-toggle {
      width: 44px; height: 32px;
      border: none; background: transparent;
      color: var(--sidebar-btn-color); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm); margin-bottom: 16px; flex-shrink: 0;
      transition: all 0.15s;
    }
    .sidebar.expanded .sidebar-toggle {
      width: 100%; justify-content: flex-end; padding-right: 4px;
    }
    .sidebar-toggle:hover { color: var(--sidebar-btn-hover-color); background: var(--sidebar-btn-hover-bg); }
    .sidebar-nav {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sidebar-nav::-webkit-scrollbar { display: none; }
    .sidebar-btn {
      width: 44px; height: 44px;
      border: none;
      background: transparent;
      color: var(--sidebar-btn-color);
      border-left: 3px solid transparent;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      position: relative;
    }
    .sidebar.expanded .sidebar-btn {
      width: 100%; height: 40px;
      justify-content: flex-start;
      padding: 0 12px; gap: 12px;
      font-size: 18px;
      border-radius: 10px;
    }
    .sidebar-btn:hover { color: var(--sidebar-btn-hover-color); background: #1A1A2E; }
    .sidebar-btn.active {
      color: var(--sidebar-btn-active-color);
      border-left-color: #8B5CF6;
      background: rgba(139,92,246,0.2);
    }
    .sidebar-btn-label {
      display: none; font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar.expanded .sidebar-btn-label { display: block; }
    .sidebar-btn-badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; font-size: 9px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .sidebar.expanded .sidebar-btn-badge {
      position: static; margin-left: auto;
    }
    .sidebar-footer {
      display: flex; flex-direction: column;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .sidebar-footer button {
      width: 44px; height: 44px;
      border: none;
      background: transparent;
      color: var(--sidebar-btn-color);
      cursor: pointer;
      font-size: 20px;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
    }
    .sidebar-footer button:hover { color: var(--sidebar-btn-hover-color); background: var(--sidebar-btn-hover-bg); }
    /* FAB */
    .fab-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .fab-btn { width: 56px; height: 56px; border-radius: 50%; background: #8B5CF6; border: none; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(139,92,246,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .fab-btn:hover { transform: scale(1.08); }
    .fab-menu { display: flex; flex-direction: column; gap: 6px; animation: fabSlideUp 0.2s ease-out; }
    .fab-action { width: 200px; padding: 10px 14px; background: #1A1A2E; border: 1px solid #2A2A3E; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .fab-action:hover { border-color: #8B5CF6; background: rgba(139,92,246,0.1); }
    @keyframes fabSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .main-area {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-primary); }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .user-name { color: var(--accent); font-weight: 600; font-size: 14px; text-transform:uppercase; }
    .role-badge {
      background: var(--accent-muted);
      border: 1px solid var(--border-accent);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .section-title {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
      color: var(--text-primary);
    }
    .section-bar {
      width: 3px; height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }
    .filter-bar {
      display: flex; gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-chip {
      padding: 7px 14px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: var(--radius-sm);
      color: var(--chip-color);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-chip.active {

    .kpi-grid {

    .avatar {

    .badge-refused { background: var(--danger-muted); color: var(--danger); border: 1px solid transparent; }
    .badge-whale { background: var(--pink-muted); color: var(--pink); border: 1px solid transparent; }
    .badge-vip { background: var(--accent-muted); color: var(--accent); border: 1px solid transparent; }
    .badge-regular { background: var(--accent-muted); color: var(--accent); border: 1px solid transparent; }
    .badge-dormant { background: var(--bg-overlay); color: var(--text-tertiary); border: 1px solid transparent; }
    .badge-nouveau { background: var(--success-muted); color: var(--success); border: 1px solid transparent; }
    .badge-done { background: var(--success-muted); color: var(--success); border: 1px solid transparent; }
    .table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 13px; }

    .heatmap-grid {

    .ai-card {

    .btn-small { padding: 6px 12px; font-size: 11px; border-radius: var(--radius-sm); }
    .btn-edit {

    .podium {

    .podium-bar:hover { box-shadow: 0 0 16px rgba(99,102,241,0.3); }
    .podium-name { margin-top: 8px; font-weight: 600; font-size: 13px; text-transform:uppercase; color: var(--text-primary); }
    .podium-ca { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .trophy { font-size: 40px; text-align: center; margin-bottom: 24px; }
    .profile-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);

    }

    }

    .profile-close { background: none; border: none; color: var(--text-tertiary); font-size: 20px; cursor: pointer; }

    .profile-section-title {

    }
    .profile-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: var(--text-secondary); }
    .form-group-modal { margin-bottom: 16px; }
    .error-msg { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; }
    .loading-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-base); }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--accent-muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); } 50% { opacity: 0.6; transform: translateX(-50%) scale(1.1); } }
    @keyframes wave { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 8px rgba(251,191,36,0.3); } 50% { box-shadow: 0 0 20px rgba(251,191,36,0.6); } }
    .info-box { background: var(--accent-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
    /* ============================================= */
    /* TABLET (max 1200px)                           */
    /* ============================================= */
    @media (max-width: 1200px) {
      .grid-55-45 { grid-template-columns: 1fr; }

    }

    /* ============================================= */
    /* MOBILE — LARGE PHONES + SMALL TABLETS         */
    /* iPhone 16 Pro Max (430px), Galaxy S24 (412px) */
    /* ============================================= */
    @media (max-width: 768px) {
      /* --- GLOBAL RESET --- */
      html { font-size: 14px; }
      body { overflow: auto; -webkit-text-size-adjust: 100%; }
      * { -webkit-tap-highlight-color: transparent; }

      /* --- APP LAYOUT --- */
      .app-wrap { flex-direction: column; height: 100vh; height: 100dvh; }

      /* --- BOTTOM NAV BAR --- */
      .sidebar {
        position: fixed; bottom: 0; left: 0; right: 0;
        width: 100%; height: 60px;
        flex-direction: row; padding: 0; z-index: 100;
        border-right: none;
        border-top: 1px solid var(--border-default);
        background: var(--sidebar-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        justify-content: space-between;
        align-items: stretch;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar-logo { display: none; }
      .sidebar-toggle { display: none; }
      .sidebar.expanded { width: 100%; align-items: stretch; padding: 0; }
      .sidebar.expanded .sidebar-btn { width: 48px; height: 48px; padding: 0; gap: 0; justify-content: center; border-radius: 10px; }
      .sidebar-btn-label { display: none !important; }
      .sidebar-btn-badge { position: absolute !important; top: 2px; right: 2px; }
      .sidebar-nav {
        flex-direction: row;
        gap: 0;
        flex: 1;
        justify-content: space-evenly;
        align-items: center;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .sidebar-nav::-webkit-scrollbar { display: none; }
      .sidebar-btn {
        width: 48px; height: 48px;
        min-width: 48px;
        font-size: 20px;
        border-left: none;
        border-radius: 10px;
        border-bottom: 2px solid transparent;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.15s ease;
      }
      .sidebar-btn:active { transform: scale(0.92); background: var(--accent-muted); }
      .sidebar-btn.active {
        border-left-color: transparent;
        border-bottom-color: var(--accent);
        background: var(--sidebar-btn-active-bg);
      }
      .sidebar-footer {
        flex-direction: row;
        gap: 0;
        padding: 0 4px;
        align-items: center;
      }
      .sidebar-footer button {
        width: 40px; height: 40px;
        min-width: 40px;
        font-size: 16px;
        border-radius: 8px;
      }
      .sidebar-footer button:active { transform: scale(0.9); }

      /* --- MAIN AREA --- */
      .main-area {
        padding-bottom: 60px;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
      }

      /* --- TOPBAR (STICKY) --- */
      .topbar {
        height: 48px;
        padding: 0 12px;
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--topbar-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        flex-shrink: 0;
      }
      .topbar-left { font-size: 13px; gap: 6px; }
      .topbar-left span:first-child { font-size: 16px; }
      .topbar-right { gap: 6px; }
      .user-name { font-size: 11px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .role-badge { font-size: 9px; padding: 2px 6px; }

      /* --- CONTENT AREA --- */
      .content {
        padding: 12px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* --- KPI CARDS (2x2 grid) --- */
      .kpi-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .kpi {
        padding: 10px;
        border-radius: 10px;
      }
      .kpi-label { font-size: 9px; margin-bottom: 3px; letter-spacing: 0.3px; }
      .kpi-value { font-size: 18px; line-height: 1.2; }
      .kpi-sublabel { font-size: 9px; margin-top: 3px; }

      /* --- GRIDS → SINGLE COLUMN --- */
      .grid-2 { grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
      .grid-55-45 { grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }

      /* --- FILTER BAR (horizontal scroll) --- */
      .filter-bar {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 6px;
        scrollbar-width: none;
        flex-wrap: nowrap;
      }
      .filter-bar::-webkit-scrollbar { display: none; }
      .filter-chip {
        padding: 8px 12px;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
        min-height: 36px;
        display: flex; align-items: center;
      }
      .filter-chip:active { transform: scale(0.95); }
      .filter-date {
        padding: 8px 10px;
        font-size: 12px;
        min-width: 130px;
        flex-shrink: 0;
        min-height: 36px;
      }
      .filter-select {
        padding: 8px 10px;
        font-size: 12px;
        flex-shrink: 0;
        min-height: 36px;
        max-width: 160px;
      }

      /* --- TABLES (horizontal scroll wrapper) --- */
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin: 0 -12px;
        padding: 0 12px 8px;
        scrollbar-width: none;
      }
      .table-wrap::-webkit-scrollbar { display: none; }
      .table { font-size: 11px; min-width: 520px; }
      .table th {
        padding: 10px 8px;
        font-size: 9px;
        letter-spacing: 0.3px;

        position: sticky;
        top: 0;
        background: var(--table-header-bg);
        z-index: 2;

      .table td {
        padding: 10px 8px;
        white-space: nowrap;

      /* --- CARDS --- */
      .card {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .section-title { font-size: 13px; margin-bottom: 10px; }
      .section-bar { width: 3px; height: 16px; }

      /* --- SPENDER CARDS (touch-friendly) --- */
      .spender-card {
        padding: 12px;
        margin-bottom: 8px;
        min-height: 60px;
      }
      .spender-card:active { transform: scale(0.98); background: var(--bg-hover); }

      .spender-ltv { font-size: 15px; }
      .spender-meta { font-size: 11px; gap: 8px; }

      /* --- PROFILE PANEL (full width on mobile) --- */
      .profile-panel {
        max-height: none;
        border-radius: 10px;
        margin-top: 10px;
      }
      .profile-header { margin-bottom: 12px; padding-bottom: 10px; }
      .profile-name { font-size: 16px; }
      .profile-close {
        font-size: 24px;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
      }
      .profile-section { margin-bottom: 14px; }
      .profile-section-title { font-size: 10px; margin-bottom: 6px; }
      .profile-row { padding: 6px 0; font-size: 12px; }

      /* --- PODIUM --- */
      .podium { height: 130px; gap: 10px; margin-bottom: 20px; }
      .podium-step { min-width: 70px; }
      .podium-bar { width: 56px; border-radius: 6px 6px 0 0; }
      .podium-rank { font-size: 22px; margin-bottom: 4px; }
      .podium-name { font-size: 11px; margin-top: 6px; }
      .podium-ca { font-size: 10px; }
      .trophy { font-size: 32px; margin-bottom: 16px; }

      /* --- LOGIN (full mobile) --- */
      .login-wrap { padding: 16px; }
      .login-card {
        padding: 24px 20px;
        margin: 0;
        max-width: 100%;
        border-radius: 12px;
      }
      .login-logo { width: 50px; height: 50px; font-size: 22px; margin-bottom: 16px; }
      .login-title { font-size: 20px; margin-bottom: 6px; }
      .login-subtitle { font-size: 12px; margin-bottom: 20px; }
      .lang-toggle { top: 12px; right: 12px; padding: 5px 10px; font-size: 11px; }

      /* --- FORMS (touch inputs) --- */
      .form-group { margin-bottom: 12px; }
      .form-label { font-size: 11px; margin-bottom: 5px; }
      .form-input {
        padding: 12px;
        font-size: 16px; /* prevents iOS zoom on focus */
        border-radius: 10px;
        min-height: 44px;
      }
      .form-group-modal { margin-bottom: 12px; }

      /* --- BUTTONS (thumb-friendly 48px touch targets) --- */
      .btn {
        padding: 12px 16px;
        font-size: 14px;
        min-height: 48px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary { border-radius: 10px; }
      .btn-small {
        padding: 10px 14px;
        font-size: 12px;
        min-height: 40px;
        border-radius: 8px;
      }
      .btn-success, .btn-danger { min-height: 44px; }

      /* --- FORM CREATE GRID → 1 column on mobile --- */
      .form-grid-mobile {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }

      /* --- AI CARDS --- */
      .ai-card {
        padding: 14px;
        min-height: 80px;
      }
      .ai-card:active { transform: scale(0.97); }
      .ai-card-icon { font-size: 26px; margin-bottom: 6px; }
      .ai-card-title { font-size: 13px; }
      .ai-card-desc { font-size: 11px; }
      .ai-result { padding: 10px; font-size: 11px; }

      /* --- HEATMAP --- */
      .heatmap-grid { gap: 3px; margin: 8px 0; }
      .heatmap-cell { font-size: 9px; border-radius: 3px; }

      /* --- PROGRESS BARS --- */
      .progress { height: 8px; border-radius: 4px; margin-top: 6px; }

      /* --- INFO BOX --- */
      .info-box { font-size: 11px; padding: 10px; border-radius: 8px; line-height: 1.5; }

      /* --- BADGES --- */
      .badge { font-size: 10px; padding: 3px 6px; }

      /* --- MODAL (slide-up on mobile) --- */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      /* --- FAB BUTTON (floating action) --- */
      .fab-btn {
        position: fixed;
        bottom: 76px;
        right: 16px;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--grad);

const computeVIPScore = (sp) => {
  const ltv = sp.ltv || sp.total_spent || 0;
  const cnt = sp.cnt || sp.tx_count || 0;
  const aov = cnt > 0 ? ltv / cnt : 0;
  const txArr = sp.txs || [];
  const sortedTx = [...txArr].sort((a, b) => new Date(b.date) - new Date(a.date));
  const lastTxDate = sortedTx.length > 0 ? new Date(sortedTx[0].date) : (sp.last_purchase_date ? new Date(sp.last_purchase_date) : null);
  const daysSinceLast = lastTxDate ? Math.floor((Date.now() - lastTxDate.getTime()) / 86400000) : 365;
  const now30 = Date.now() - 30 * 86400000;
  const txLast30 = txArr.filter(tx => new Date(tx.date).getTime() > now30).length;
  const ltvScore = Math.min(ltv / 1000, 1) * 40;
  const freqScore = Math.min(txLast30 / 5, 1) * 25;
  const recencyScore = Math.max(1 - daysSinceLast / 90, 0) * 20;
  const aovScore = Math.min(aov / 200, 1) * 15;
  return Math.round(ltvScore + freqScore + recencyScore + aovScore);
};

// safeInsertTx: ULTRA-BULLETPROOF transaction insert with try-catch at EVERY level
const safeInsertTx = async (txData) => {
  // Level 1: try full insert
  try {
    const res = await sb.from("transactions").insert(txData).select();
    if (!res.error) { return res; }
  } catch(e) { /* L1 fallback */ }

  // Level 2: strip optional columns (currency, product, tag)
  try {
    const l2 = {...txData};
    delete l2.currency; delete l2.product; delete l2.tag;
    const res = await sb.from("transactions").insert(l2).select();
    if (!res.error) { return res; }
  } catch(e) { /* L2 fallback */ }

  // Level 3: strip ALL FK columns
  try {
    const l3 = {
      date: txData.date,
      spender_handle: txData.spender_handle,
      amount: txData.amount,
      status: txData.status || "pending",
      notes: txData.notes || null,
    };
    const res = await sb.from("transactions").insert(l3).select();
    if (!res.error) { return res; }
  } catch(e) { /* L3 fallback */ }

  // Level 4: absolute minimum — only required columns
  try {
    const res = await sb.from("transactions").insert({
      date: txData.date || new Date().toISOString(),
      spender_handle: txData.spender_handle || "unknown",
      amount: parseFloat(txData.amount) || 0,
      status: "pending",
    }).select();
    if (!res.error) { return res; }
    return res;
  } catch(e) { // All insert attempts failed
    return { data: null, error: { message: "All 4 insert levels failed: " + e.message } };
  }
};

  let res = await sb.from("spenders").upsert(spenderData, {onConflict: "handle"});
  if (!res.error) return res;
  // Full upsert failed, try minimal fallback
  // Fallback: minimal
  return await sb.from("spenders").upsert(
    {handle: spenderData.handle, name: spenderData.name || spenderData.handle},
    {onConflict: "handle"}
  );
};

const displayFees = (tx, role) => {
  if(role==="gerant") return `${(tx.provider_fee||0).toFixed(0)}/${(tx.dada_fee||0).toFixed(0)}`;
  if(role==="chatter") return `${((tx.provider_fee||0)+(tx.dada_fee||0)).toFixed(0)}`;
  if(role==="provider") return `${(tx.provider_fee||0).toFixed(0)}`;
  return "0";
};

const getSpenderSegment = (ltv) => {
  if(ltv>2000) return "whale";
  if(ltv>1000) return "vip";
  if(ltv>200) return "regular";
  if(ltv>0) return "dormant";
  return "nouveau";
};

const getDateRange = (period) => {
  const now = new Date();
  if(period==="24h") return new Date(now.getTime()-24*60*60*1000);
  if(period==="7j") return new Date(now.getTime()-7*24*60*60*1000);
  if(period==="30j") return new Date(now.getTime()-30*24*60*60*1000);
  return new Date(0);
};

// Global timezone ref — updated by App component, read by formatting functions
const _tz = { current: "Europe/Paris" };

const fmtDate = (d) => {
  if(!d) return "";
  const dt = new Date(d);
  return dt.toLocaleDateString("fr-CH", { timeZone: _tz.current });
};
const fmtTime = (d) => {
  if(!d) return "";
  const dt = new Date(d);
  return dt.toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit", timeZone: _tz.current});
};
const fmtDayTime = (d) => {
  if(!d) return "";
  const dt = new Date(d);
  const day = dt.toLocaleDateString("fr-FR",{weekday:"short", timeZone: _tz.current});
  return `${day} ${dt.toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit", timeZone: _tz.current})}`;
};

// =============================================
// ERROR BOUNDARY
// =============================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {hasError:false, error:null}; }
  static getDerivedStateFromError(error) { return {hasError:true, error}; }
  render() {
    if(this.state.hasError) {
      return React.createElement("div", {style:{padding:40,textAlign:"center",color:"var(--danger)"}},
        React.createElement("h2", null, "Erreur"),
        React.createElement("p", null, String(this.state.error)),
        React.createElement("button", {onClick:()=>this.setState({hasError:false}),className:"btn btn-primary",style:{marginTop:20,width:"auto"}}, "Recharger")
      );
    }
    return this.props.children;
  }
}

// NAVIGATION CONTEXT (drill-down system)
// =============================================
const NavContext = createContext();
const NavProvider = ({children}) => {
  const [drillDown, setDrillDown] = useState(null);
  const openEntity = (type, id) => {
    setDrillDown({type, id});
    window.history.pushState({drill:type,drillId:id}, "", `#${type}/${id}`);
  };
  const closeDrill = () => {
    setDrillDown(null);
    // Sync URL: remove drill-down hash, keep current tab hash
    const hash = window.location.hash.replace(/^#/, "");
    if (hash.includes("/")) {
      window.history.pushState({tab:"dashboard"}, "", "#dashboard");
    }
  };
  // Expose raw setter for popstate handler
  return (
    <NavContext.Provider value={{drillDown, setDrillDown, openEntity, closeDrill}}>
      {children}
    </NavContext.Provider>
  );
};
const useNav = () => useContext(NavContext);

const Tag = ({type, label, id, onClick}) => {
  const {openEntity} = useNav();
  const prefixes = {spender:"@",model:"#",provider:"@",chatter:"@",product:"#",status:""};
  const handleClick = (e) => {
    e.stopPropagation();
    if(onClick) onClick();
    else if(id) openEntity(type, id);
  };
  return <span className={`tag-click tag-${type}`} onClick={handleClick}>{prefixes[type]||""}{label}</span>;
};

// =============================================
// SORTABLE TABLE HEADER + HOOK (3-state: neutral → ASC → DESC → neutral)
// =============================================
const SortTh = ({label, sortKey, sort, onSort, style}) => {
  const active = sort.key===sortKey;
  const arrow = active?(sort.dir==="asc"?"↑":"↓"):"↕";
  return <th className="sort-th" onClick={()=>onSort(sortKey)} style={{cursor:"pointer",userSelect:"none",...(style||{})}}>{label} <span className={`sort-arrow ${active?"active":""}`}>{arrow}</span></th>;
};
const useSortable = (defaultKey=null, defaultDir="desc") => {
  const [sort, setSort] = useState({key:defaultKey, dir:defaultDir});
  const onSort = (key) => setSort(prev=>{
    if(prev.key!==key) return {key, dir:"asc"};
    if(prev.dir==="asc") return {key, dir:"desc"};
    return {key:null, dir:"desc"};
  });
  const doSort = (data, getters={}) => {
    if(!sort.key) return data;
    return [...data].sort((a,b)=>{
      const g = getters[sort.key]||(x=>x[sort.key]);
      const va=g(a), vb=g(b);
      // Date detection
      if(typeof va==="string" && /^\d{4}-\d{2}/.test(va||"")) {
        const da=new Date(va||0), db=new Date(vb||0);
        return sort.dir==="asc"?da-db:db-da;
      }
      const cmp = typeof va==="string"?(va||"").localeCompare(vb||""):(Number(va)||0)-(Number(vb)||0);
      return sort.dir==="asc"?cmp:-cmp;
    });
  };
  return {sort, onSort, doSort};
};

// =============================================
// PAGINATION HOOK + CONTROLS
// =============================================
const usePagination = (data, pageSize=PAGE_SIZE) => {
  const [page, setPage] = useState(0);
  const totalPages = Math.max(1, Math.ceil(data.length / pageSize));
  const safeP = Math.min(page, totalPages - 1);
  useEffect(() => { setPage(0); }, [data.length]);
  const paginatedData = data.slice(safeP * pageSize, (safeP + 1) * pageSize);
  return {
    page: safeP, totalPages, paginatedData,
    goFirst: () => setPage(0),
    goPrev: () => setPage(p => Math.max(0, p - 1)),
    goNext: () => setPage(p => Math.min(totalPages - 1, p + 1)),
    goLast: () => setPage(totalPages - 1),
    setPage,
    total: data.length,
    from: data.length > 0 ? safeP * pageSize + 1 : 0,
    to: Math.min((safeP + 1) * pageSize, data.length),
  };
};

const MiniCalendar = ({lang, selected, onSelect, onClose, refEl}) => {
  const [viewDate, setViewDate] = useState(()=>selected?new Date(selected):new Date());
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const firstDay = new Date(year,month,1).getDay();
  const monthNames = lang==="fr"
    ?["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Aoû","Sep","Oct","Nov","Déc"]
    :["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayNames = lang==="fr"?["Lu","Ma","Me","Je","Ve","Sa","Di"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const prevMonth = () => setViewDate(new Date(year,month-1,1));
  const nextMonth = () => setViewDate(new Date(year,month+1,1));
  const _now = new Date();
  const today = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,"0")}-${String(_now.getDate()).padStart(2,"0")}`;
  // Adjust firstDay for Monday start (0=Mon..6=Sun)
  const startOffset = (firstDay+6)%7;
  const days = [];
  for(let i=0;i<startOffset;i++) days.push(null);
  for(let d=1;d<=daysInMonth;d++) days.push(d);

  return (
    <div style={{position:"absolute",top:"100%",left:0,zIndex:999,background:"var(--bg2)",border:"1px solid var(--border-accent)",borderRadius:12,padding:12,boxShadow:"var(--shadow-lg)",minWidth:260,marginTop:4}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button onClick={prevMonth} style={{background:"none",border:"none",color:"var(--accent)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>‹</button>
        <span style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{monthNames[month]} {year}</span>
        <button onClick={nextMonth} style={{background:"none",border:"none",color:"var(--accent)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,textAlign:"center"}}>
        {dayNames.map(d=><div key={d} style={{fontSize:10,fontWeight:600,color:"var(--text2)",padding:4}}>{d}</div>)}
        {days.map((d,i)=>{
          if(!d) return <div key={`e${i}`}></div>;
          const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const isSelected = dateStr===selected;
          const isToday = dateStr===today;
          return (
            <div key={dateStr} onClick={()=>{onSelect(dateStr);onClose();}}
              style={{padding:"6px 2px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:isSelected||isToday?700:400,
                background:isSelected?"var(--accent)":isToday?"var(--accent-muted)":"transparent",
                color:isSelected?"var(--text-primary)":isToday?"var(--accent)":"var(--text)",
                transition:"all 0.15s"}}>
              {d}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
        <button onClick={()=>{onSelect(today);onClose();}} style={{fontSize:11,color:"var(--accent)",background:"none",border:"none",cursor:"pointer",fontWeight:600}}>
          {lang==="fr"?"Aujourd'hui":"Today"}
        </button>
        <button onClick={()=>{onSelect("");onClose();}} style={{fontSize:11,color:"var(--text2)",background:"none",border:"none",cursor:"pointer"}}>
          {lang==="fr"?"Effacer":"Clear"}
        </button>
      </div>
    </div>
  );
};

const DateRangeFilter = ({lang, startDate, endDate, setStartDate, setEndDate, activePreset, setActivePreset}) => {
  const [showCalStart, setShowCalStart] = useState(false);
  const [showCalEnd, setShowCalEnd] = useState(false);
  const calRef = useRef(null);

  // Close calendars on outside click
  useEffect(()=>{
    const handler = (e) => {
      if(calRef.current && !calRef.current.contains(e.target)) {
        setShowCalStart(false);
        setShowCalEnd(false);
      }
    };
    document.addEventListener("mousedown", handler);
    return ()=>document.removeEventListener("mousedown", handler);
  },[]);

  const presets = [
    {id:"today",label:t(lang,"today")||"Aujourd'hui"},
    {id:"7d",label:"7j"},
    {id:"30d",label:"30j"},
    {id:"this_month",label:t(lang,"this_month")||"Ce mois"},
    {id:"last_month",label:t(lang,"last_month")||"Mois dernier"},
    {id:"all",label:t(lang,"all_time")||"Tout"},
  ];
  const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const applyPreset = (id) => {
    const now = new Date();
    let s, e;
    if(id==="today"){ s=new Date(now.getFullYear(),now.getMonth(),now.getDate()); e=new Date(s); }
    else if(id==="7d"){ s=new Date(now.getTime()-7*24*60*60*1000); e=new Date(now); }
    else if(id==="30d"){ s=new Date(now.getTime()-30*24*60*60*1000); e=new Date(now); }
    else if(id==="this_month"){ s=new Date(now.getFullYear(),now.getMonth(),1); e=new Date(now); }
    else if(id==="last_month"){ s=new Date(now.getFullYear(),now.getMonth()-1,1); e=new Date(now.getFullYear(),now.getMonth(),0); }
    else { s=null; e=null; }
    setStartDate(s?localDateStr(s):"");
    setEndDate(e?localDateStr(e):"");
    setActivePreset(id);
    setShowCalStart(false);
    setShowCalEnd(false);
  };

  const fmtDisplay = (d) => {
    if(!d) return lang==="fr"?"Début":"Start";
    const dt = new Date(d);
    const day = dt.toLocaleDateString(lang==="fr"?"fr-FR":"en-US",{day:"numeric",month:"short", timeZone: _tz.current});
    return day;
  };
  const fmtDisplayEnd = (d) => {
    if(!d) return lang==="fr"?"Fin":"End";
    const dt = new Date(d);
    return dt.toLocaleDateString(lang==="fr"?"fr-FR":"en-US",{day:"numeric",month:"short", timeZone: _tz.current});
  };

  return (
    <div className="filter-bar" style={{marginBottom:16}} ref={calRef}>
      {presets.map(p=>(
        <button key={p.id} className={`filter-chip ${activePreset===p.id?"active":""}`} onClick={()=>applyPreset(p.id)}>{p.label}</button>
      ))}
      <div style={{position:"relative",display:"inline-block"}}>
        <button onClick={()=>{setShowCalStart(!showCalStart);setShowCalEnd(false);}}
          style={{background:"var(--accent-subtle)",border:"1px solid var(--accent-muted)",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:startDate?"var(--text)":"var(--text2)",fontSize:12,fontWeight:startDate?600:400,display:"flex",alignItems:"center",gap:4}}>
          📅 {fmtDisplay(startDate)}
        </button>
        {showCalStart && <MiniCalendar lang={lang} selected={startDate} onSelect={(d)=>{setStartDate(d);setActivePreset("");}} onClose={()=>setShowCalStart(false)} />}
      </div>
      <span style={{color:"var(--text2)",fontSize:14,fontWeight:600}}>→</span>
      <div style={{position:"relative",display:"inline-block"}}>
        <button onClick={()=>{setShowCalEnd(!showCalEnd);setShowCalStart(false);}}
          style={{background:"var(--accent-subtle)",border:"1px solid var(--accent-muted)",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:endDate?"var(--text)":"var(--text2)",fontSize:12,fontWeight:endDate?600:400,display:"flex",alignItems:"center",gap:4}}>
          📅 {fmtDisplayEnd(endDate)}
        </button>
        {showCalEnd && <MiniCalendar lang={lang} selected={endDate} onSelect={(d)=>{setEndDate(d);setActivePreset("");}} onClose={()=>setShowCalEnd(false)} />}
      </div>
    </div>
  );
};
const useDateRange = (defaultPreset="30d") => {
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [activePreset, setActivePreset] = useState(defaultPreset);
  useEffect(()=>{
    const now = new Date();
    let s;
    if(defaultPreset==="7d") s=new Date(now.getTime()-7*24*60*60*1000);
    else if(defaultPreset==="30d") s=new Date(now.getTime()-30*24*60*60*1000);
    else return;
    const ld = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    setStartDate(ld(s));
    setEndDate(ld(now));
  },[]);
  const filterByDate = (data, dateField="date") => {
    if(activePreset==="all"&&!startDate&&!endDate) return data;
    return data.filter(item=>{
      if(!item[dateField]) return false;
      const d = new Date(item[dateField]);
      if(startDate) {
        const [sy,sm,sd] = startDate.split("-").map(Number);
        if(d < new Date(sy, sm-1, sd, 0, 0, 0, 0)) return false;
      }
      if(endDate) {
        const [ey,em,ed] = endDate.split("-").map(Number);
        if(d > new Date(ey, em-1, ed, 23, 59, 59, 999)) return false;
      }
      return true;
    });
  };
  return {startDate, endDate, setStartDate, setEndDate, activePreset, setActivePreset, filterByDate};
};

const useDebounce = (value, delay = DEBOUNCE_DELAY) => {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(timer);
  }, [value, delay]);
  return debounced;
};

const getBadges = (txs, chatterId) => {
  const myTx = txs.filter(tx=>tx.chatter_id===chatterId);
  const validated = myTx.filter(tx=>tx.status==="validated");
  const badges = [];
  if(validated.length>=10) badges.push({icon:"🏅",label:"10 TX"});
  if(validated.length>=50) badges.push({icon:"⭐",label:"50 TX"});
  if(validated.length>=100) badges.push({icon:"💎",label:"100 TX"});
  const totalCA = validated.reduce((s,tx)=>s+Number(tx.amount),0);
  if(totalCA>=1000) badges.push({icon:"🚀",label:"1K€"});
  if(totalCA>=5000) badges.push({icon:"🔥",label:"5K€"});
  if(totalCA>=10000) badges.push({icon:"👑",label:"10K€"});
  const dates = [...new Set(validated.map(tx=>tx.date?.split("T")[0]).filter(Boolean))].sort().reverse();
  let streak = 0;
  const today = new Date();
  for(let i=0;i<dates.length;i++){
    const expected = new Date(today);
    expected.setDate(expected.getDate()-i);
    const expStr = `${expected.getFullYear()}-${String(expected.getMonth()+1).padStart(2,"0")}-${String(expected.getDate()).padStart(2,"0")}`;
    if(dates[i]===expStr) streak++;
    else break;
  }
  if(streak>=3) badges.push({icon:"🔥",label:`${streak}j streak`});
  if(streak>=7) badges.push({icon:"💪",label:"7j streak!"});
  return {badges, streak};
};

  const toggleMetric = (key) => {
    setActiveMetrics(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
  };
  const handleDashStatus = async (txId, newStatus) => {
    if(processingTxId) return;
    setProcessingTxId(txId);
    try {
      const currentTx = txs.find(tx=>tx.id===txId);
      // Immutability guard: only pending transactions can change status
      if (currentTx && currentTx.status !== "pending") {
        addToast(t(lang,"tx_immutable"), "error");
        setProcessingTxId(null);
        return;
      }
      const {error} = await sb.from("transactions").update({status:newStatus}).eq("id",txId);
      if(error) { addToast("Erreur: " + error.message, "error"); setProcessingTxId(null); return; }
      if(onNotify&&currentTx) {
        const cur = currencySymbol;
        const modelName = models.find(m=>m.id===currentTx.model_id)?.name||"";
        if(newStatus==="validated") {
          if(currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_validated","TX validée ✅",`${currentTx.amount}${cur} de @${currentTx.spender_handle}`,txId);
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_validated","TX validée",`${currentTx.amount}${cur} @${currentTx.spender_handle}${modelName?" #"+modelName:""}`,txId));
        } else {
          if(currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_refused","TX refusée ❌",`${currentTx.amount}${cur} de @${currentTx.spender_handle}`,txId);
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_refused","TX refusée",`${currentTx.amount}${cur} @${currentTx.spender_handle}${modelName?" #"+modelName:""}`,txId));
        }
      }
      await onRefresh();
      addToast(newStatus==="validated"?(t(lang,"tx_validated")):(t(lang,"tx_refused")), newStatus==="validated"?"success":"error");
    } catch(e) { /* Dashboard TX status update failed */ addToast("Erreur: " + e.message, "error"); }
    setProcessingTxId(null);
  };
  const handleDashEditSave = async (updates) => {
    if (!editingTx || editingTx.status !== "pending") { setEditingTx(null); return; }
    setSaving(true);
    try {
      const {error} = await sb.from("transactions").update({spender_handle:updates.spender_handle,amount:updates.amount,currency:updates.currency,model_id:updates.model_id,provider_id:updates.provider_id,chatter_id:updates.chatter_id,product:updates.product,tag:updates.tag,product_id:updates.product_id||null,product_tag_id:updates.product_tag_id||null,notes:updates.notes}).eq("id",editingTx.id).eq("status","pending");
      setSaving(false);
      if(error) { addToast("Erreur: " + error.message, "error"); return; }
      setEditingTx(null);
      await onRefresh();
      addToast(t(lang,"tx_updated"), "success");
    } catch(e) { /* Dashboard TX edit failed */ setSaving(false); addToast("Erreur: " + e.message, "error"); }
  };
  const filtered = useMemo(() => filterByStatus(filterByChatter(filterByProvider(filterByModel(dr.filterByDate(txs, "date"), model), provider), chatter), status), [txs, model, provider, chatter, status, dr.startDate, dr.endDate, dr.activePreset]);
  const kpis = useMemo(() => {
    const pending = filtered.filter(tx=>tx.status==="pending");
    const validated = filtered.filter(tx=>tx.status==="validated");
    const caGross = filtered.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
    const commTotal = filtered.reduce((s,tx)=>s+convertAmount(Number(tx.chatter_commission||0),tx.currency),0);
    const caNet = filtered.reduce((s,tx)=>s+convertAmount(Number(tx.net_amount||0),tx.currency),0);
    const caPending = pending.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
    const caValidated = validated.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
    return { pending, validated, caGross, commTotal, caNet, caPending, caValidated };
  }, [filtered, convertAmount]);
  const { pending, validated, caGross, commTotal, caNet, caPending, caValidated } = kpis;
  const chartData = useMemo(() => {
    const byDay = {};
    filtered.forEach(tx => {
      const d = new Date(tx.date);
      const key = d.toLocaleDateString("fr-FR", { timeZone: tz, day: "2-digit", month: "short" });
      const sortKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      if (!byDay[sortKey]) byDay[sortKey] = { name: key, sortKey, brut: 0, valide: 0, pending: 0, refuse: 0 };
      byDay[sortKey].brut += convertAmount(Number(tx.amount), tx.currency);
      if (tx.status === "validated" || tx.status === "confirmee" || tx.status === "payee") {
        byDay[sortKey].valide += convertAmount(Number(tx.amount), tx.currency);
      }
      if (tx.status === "pending" || tx.status === "en_attente") {
        byDay[sortKey].pending += convertAmount(Number(tx.amount), tx.currency);
      }
      if (tx.status === "refused" || tx.status === "refusee" || tx.status === "annulee") {
        byDay[sortKey].refuse += convertAmount(Number(tx.amount), tx.currency);
      }
    });
    return Object.values(byDay).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  }, [filtered, tz, convertAmount]);
  const totalBrut = chartData.reduce((s, d) => s + d.brut, 0);
  const totalValide = chartData.reduce((s, d) => s + d.valide, 0);
  const totalPending = chartData.reduce((s, d) => s + d.pending, 0);
  return (
    <div>
      <GlobalFilterBar lang={lang} dr={dr} models={models} profiles={profiles}
        model={model} setModel={setModel} showModelFilter
        provider={provider} setProvider={setProvider} showProviderFilter={user.role==="gerant"}
        chatter={chatter} setChatter={setChatter} showChatterFilter={user.role==="gerant"}
        status={status} setStatus={setStatus} showStatusFilter />
      {user.role==="gerant" && alerts && <AlertsPanel alerts={alerts} onDismiss={onDismissAlert} onNavigate={onAlertNavigate} lang={lang} />}
      {user.role==="gerant" && botStats && <BotStatsKPIs botStats={botStats} lang={lang} />}
      {txs.length===0 ? (
        <div className="kpi-grid">
          {[1,2,3,4].map(n=><div key={n} className="kpi-card"><Skeleton height={14} width="60%" /><div style={{marginTop:10}}><Skeleton height={28} width="80%" /></div></div>)}
        </div>
      ) : (<>
      <div className="kpi-grid">
        {user.role==="gerant"?
          <><KPICard label={t(lang,"ca_brut")} value={`${caGross.toFixed(0)}${currencySymbol}`} icon="💰"/><KPICard label={t(lang,"net_agence")} value={`${caNet.toFixed(0)}${currencySymbol}`} icon="🏦"/></>
          :<KPICard label={t(lang,"mon_ca")} value={`${caGross.toFixed(0)}${currencySymbol}`} icon="💰"/>
        }
        <KPICard label={t(lang,"nb_txs")} value={`${filtered.length}`} icon="📋"/>
        <KPICard label={t(lang,"marge_comm")} value={`${(caNet-commTotal).toFixed(0)}${currencySymbol}`} sublabel={`Comm: ${commTotal.toFixed(0)}${currencySymbol}`} icon="📊"/>
      </div>
      <div className="kpi-grid">
        <KPICard label={t(lang,"ca_pending")} value={`${caPending.toFixed(0)}${currencySymbol}`} icon="⏳" className="warning" />
        <KPICard label={t(lang,"nb_pending")} value={`${pending.length}`} icon="🔄" className="warning" />
        <KPICard label={t(lang,"ca_validated")} value={`${caValidated.toFixed(0)}${currencySymbol}`} icon="✅" className="warning" />
        <KPICard label={t(lang,"nb_validated")} value={`${validated.length}`} icon="🎯" className="warning" />
      </div>
      </>)}
      {/* ═══════════════════════════════════════════
          GRAPHE CA BRUT DYNAMIQUE
          ═══════════════════════════════════════════ */}

        background: "var(--card-bg)",
        border: "1px solid var(--border-subtle)",
        borderRadius: 12,
        padding: "24px 24px 16px",
        marginBottom: 24,

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>

            <h2 style={{ fontSize: 17, fontWeight: 700, margin: 0, color: "var(--text)" }}>📈 CA Brut Agence</h2>

          </div>
        </div>
        <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
          {[

                labelStyle={{ color: "var(--text-secondary)", marginBottom: 6 }}
              />
              {activeMetrics.includes("brut") && (
                <Area type="monotone" dataKey="brut" stroke="var(--accent)" strokeWidth={3} fill="url(#gradBrut)"
                  dot={{ fill: "var(--accent)", stroke: "var(--bg-raised)", strokeWidth: 3, r: 5 }}
                  activeDot={{ r: 7, stroke: "var(--accent)", strokeWidth: 2, fill: "var(--bg-raised)" }}
                  name="CA Brut" animationDuration={600} />
              )}
              {activeMetrics.includes("valide") && (
                <Area type="monotone" dataKey="valide" stroke="var(--success)" strokeWidth={2} fill="url(#gradValide)"
                  dot={{ fill: "var(--success)", stroke: "var(--bg-raised)", strokeWidth: 2, r: 3 }}
                  activeDot={{ r: 6, stroke: "var(--success)", strokeWidth: 2, fill: "var(--bg-raised)" }}
                  name={lang==="fr"?"Validé":"Validated"} animationDuration={600} />
              )}
              {activeMetrics.includes("pending") && (
                <Area type="monotone" dataKey="pending" stroke="var(--warning)" strokeWidth={2} fill="url(#gradPending)"
                  dot={{ fill: "var(--warning)", stroke: "var(--bg-raised)", strokeWidth: 2, r: 3 }}
                  activeDot={{ r: 6, stroke: "var(--warning)", strokeWidth: 2, fill: "var(--bg-raised)" }}
                  name="Pending" animationDuration={600} />
              )}
              {activeMetrics.includes("refuse") && (

                  dot={{ fill: "var(--danger)", stroke: "var(--bg-raised)", strokeWidth: 2, r: 3 }}
                  activeDot={{ r: 6, stroke: "var(--danger)", strokeWidth: 2, fill: "var(--bg-raised)" }}
                  name={lang==="fr"?"Refusé":"Refused"} animationDuration={600} />

            </AreaChart>

        ) : (

      )}

                return <tr key={m.id}><td><Tag type="model" label={m.name} id={m.id}/></td><td>{ca.toFixed(0)}{currencySymbol}</td></tr>;
              })}

                  return <tr key={u.id}><td><Tag type="chatter" label={u.name} id={u.id}/></td><td>{ca.toFixed(0)}{currencySymbol}</td></tr>;

          :

              <table className="table" style={{fontSize:11}}><thead><tr><th>{t(lang,"date")}</th><th>Spender</th><th>{t(lang,"amount")}</th><th>{lang==="fr"?"Produit":"Product"}</th><th>Tag</th><th>{lang==="fr"?"Modèle":"Model"}</th><th>Chatter</th><th>Provider</th><th>{t(lang,"status")}</th></tr></thead>
              <tbody>

            </thead>

              {filtered.slice(0,10).map(tx=>{

                  return (
                  <tr key={tx.id} className={tx.status==="pending"?"pending-row":""}>
                    <td style={{fontFamily:"monospace",fontSize:12,color:"var(--text-secondary)"}}>{fmtDate(tx.date)}</td>
                    <td><Tag type="spender" label={tx.spender_handle} id={tx.spender_handle}/></td>
                    <td style={{fontSize:14,fontWeight:800,color:"var(--text-primary)"}}>{fmtAmount(tx.amount,tx.currency)}{tx.currency&&tx.currency!=="EUR"&&<span style={{fontSize:9,color:"var(--text-quaternary)",marginLeft:4}}>({tx.amount}{tx.currency==="CHF"?" CHF":"€"})</span>}</td>
                    <td>{tx.product||"—"}</td>
                    <td>{tx.tag||"—"}</td>
                    <td><Tag type="model" label={models.find(m=>m.id===tx.model_id)?.name||"?"} id={tx.model_id}/></td>
                    <td><Tag type="chatter" label={profiles.find(p=>p.id===tx.chatter_id)?.name||"?"} id={tx.chatter_id}/></td>

                    <td><StatusPill status={tx.status} lang={lang}/></td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {canEdit&&<button className="btn-edit" style={{marginRight:4}} onClick={()=>setEditingTx(tx)}>✏️ Modifier</button>}
                      {tx.status==="pending"&&(user.role==="gerant"||(user.role==="provider"&&tx.provider_id===user.id))&&(

                      )}
                    </td>
                  </tr>
                  );
              })}
            </tbody>
          </table>
          {filtered.length===0 && <div style={{padding:60,textAlign:"center",color:"var(--text-tertiary)",fontSize:14}}>📋 {lang==="fr"?"Aucune transaction trouvée":"No transactions found"}</div>}
        </div>
      </div>
      {/* ── GÉRANT GAMIFICATION SECTION ── */}
      {user.role === "gerant" && (

              <AgencyHealthScore txs={txs} profiles={profiles} />

            <div style={{ background: "var(--card-bg)", border: "1px solid var(--border-subtle)", borderRadius: 12, padding: 20 }}>

    </div>
  );
});
