  const [showExpenseForm, setShowExpenseForm] = useState(false);
  const [expForm, setExpForm] = useState({model_id:"",amount:"",currency:"EUR",category:"contenu",description:"",date:new Date().toISOString().slice(0,10)});
  const [editingTx, setEditingTx] = useState(null);
  const [saving, setSaving] = useState(false);
  const [processingTxId, setProcessingTxId] = useState(null);
  const [confirmRefuse, setConfirmRefuse] = useState(null);
  const {sort:mSort, onSort:mOnSort, doSort:mDoSort} = useSortable();
  const filteredTxs = useMemo(() => {
    return filterByProvider(dr.filterByDate(txs, "date"), mfProvider);
  }, [txs, dr.startDate, dr.endDate, dr.activePreset, mfProvider]);

  const modelStats = useMemo(() => {
    return models.map(m => {
      const mTxs = filteredTxs.filter(tx => tx.model_id === m.id);
      const validated = mTxs.filter(tx => tx.status==="validated"||tx.status==="confirmee");
      const pending = mTxs.filter(tx => tx.status==="pending"||tx.status==="en_attente");
      const ca = validated.reduce((s,tx) => s+convertAmount(Number(tx.amount),tx.currency), 0);
      const caPending = pending.reduce((s,tx) => s+convertAmount(Number(tx.amount),tx.currency), 0);
      const mExp = (expenses||[]).filter(e => e.model_id===m.id);
      const totalExp = mExp.reduce((s,e) => s+convertAmount(Number(e.amount),e.currency), 0);
      const benefice = ca - totalExp;
      const margin = ca > 0 ? Math.round((benefice/ca)*100) : 0;
      const convRate = mTxs.length > 0 ? Math.round((validated.length/mTxs.length)*100) : 0;
      const avgTicket = validated.length > 0 ? Math.round(ca/validated.length) : 0;
      const chatters = [...new Set(mTxs.map(tx=>tx.chatter_id).filter(Boolean))];
      const chatterNames = chatters.map(cid => profiles.find(p=>p.id===cid)?.name||"?");
      const now = Date.now();
      const last7dCA = mTxs.filter(tx=>(now-new Date(tx.date).getTime())<7*86400000&&(tx.status==="validated"||tx.status==="confirmee")).reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
      let streak = 0;
      for(let d=0;d<30;d++){const dk=new Date(now-d*86400000).toISOString().slice(0,10);if(validated.some(tx=>tx.date&&tx.date.slice(0,10)===dk))streak++;else if(d>0)break;}
      return {...m,mTxs,validated,pending,ca,caPending,totalExp,benefice,margin,convRate,avgTicket,chatters,chatterNames,txCount:mTxs.length,validatedCount:validated.length,last7dCA,streak,mExp};
    }).sort((a,b) => b.ca - a.ca);
  }, [filteredTxs, models, profiles, expenses, convertAmount]);

  const sortedModelStats = mDoSort(modelStats, {
    name: x=>(x.name||"").toLowerCase(), ca: x=>x.ca, totalExp: x=>x.totalExp,
    benefice: x=>x.benefice, margin: x=>x.margin, txCount: x=>x.txCount, convRate: x=>x.convRate,
  });
  const mPag = usePagination(sortedModelStats);
  const globalCA = modelStats.reduce((s,m)=>s+m.ca,0);
  const globalExp = modelStats.reduce((s,m)=>s+m.totalExp,0) + (expenses||[]).filter(e=>!e.model_id).reduce((s,e)=>s+convertAmount(Number(e.amount),e.currency),0);
  const globalBenef = globalCA - globalExp;
  const globalMargin = globalCA>0?Math.round((globalBenef/globalCA)*100):0;
  const totalTxCount = modelStats.reduce((s,m)=>s+m.txCount,0);
  const globalAvgTicket = modelStats.reduce((s,m)=>s+m.validatedCount,0)>0?Math.round(globalCA/modelStats.reduce((s,m)=>s+m.validatedCount,0)):0;

  const handleStatus = async (txId, newStatus) => {
    if(processingTxId) return;
    setProcessingTxId(txId);
    const currentTx = txs.find(tx => tx.id === txId);
    if (currentTx && currentTx.status !== "pending") {
      addToast(t(lang, "tx_immutable"), "error");
      setProcessingTxId(null);
      return;
    }
    try {
      const {error} = await sb.from("transactions").update({status: newStatus}).eq("id", txId);
      if (error) { addToast("Erreur: " + error.message, "error"); setProcessingTxId(null); return; }
      if(onNotify&&currentTx) {
        const cur=currencySymbol;
        const mName=models.find(m=>m.id===currentTx.model_id)?.name||"";
        if(newStatus==="validated"){
          if(currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_validated","TX validée ✅",`${currentTx.amount}${cur} de @${currentTx.spender_handle}`,txId);
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_validated","TX validée",`${currentTx.amount}${cur}${mName?" #"+mName:""}`,txId));
        } else {
          if(currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_refused","TX refusée ❌",`${currentTx.amount}${cur} de @${currentTx.spender_handle}`,txId);
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_refused","TX refusée",`${currentTx.amount}${cur}${mName?" #"+mName:""}`,txId));
        }
      }
      await onRefresh();
      addToast(newStatus === "validated" ? (t(lang, "tx_validated")) : (t(lang, "tx_refused")), newStatus === "validated" ? "success" : "error");
    } catch(e) { /* Modeles TX status update failed */ addToast("Erreur: " + e.message, "error"); }
    setProcessingTxId(null);
  };

  const handleEditSave = async (updates) => {
    if (!editingTx || editingTx.status !== "pending") {
      addToast(t(lang, "tx_immutable"), "error");
      setEditingTx(null);
      return;
    }
    setSaving(true);
    try {
      const {error} = await sb.from("transactions").update({
        spender_handle:updates.spender_handle, amount:updates.amount, currency:updates.currency,
        model_id:updates.model_id, provider_id:updates.provider_id, chatter_id:updates.chatter_id,
        product:updates.product, tag:updates.tag, product_id:updates.product_id||null, product_tag_id:updates.product_tag_id||null, notes:updates.notes,
      }).eq("id", editingTx.id).eq("status", "pending");
      setSaving(false);
      if (error) { addToast("Erreur: " + error.message, "error"); return; }
      setEditingTx(null);
      await onRefresh();
      addToast(t(lang, "tx_updated"), "success");
    } catch(e) { /* Modeles TX edit failed */ setSaving(false); addToast("Erreur: " + e.message, "error"); }
  };

  const handleAddExpense = async () => {
    if(!expForm.amount||isNaN(parseFloat(expForm.amount))||parseFloat(expForm.amount)<=0){addToast(fr?"Montant invalide (> 0)":"Invalid amount (> 0)","error");return;}
    setSaving(true);
    try {
      const row = {amount:parseFloat(expForm.amount),currency:expForm.currency,category:expForm.category,name:expForm.description||expForm.category,date:expForm.date||new Date().toISOString().slice(0,10)};
      if(expForm.model_id) row.model_id = expForm.model_id;
      const {error} = await sb.from("expenses").insert(row);
      setSaving(false);
      if(error){addToast("Erreur: "+error.message,"error");return;}
      setShowExpenseForm(false);
      setExpForm({model_id:selectedModel||"",amount:"",currency:"EUR",category:"contenu",description:"",date:new Date().toISOString().slice(0,10)});
      await onRefresh();
      addToast(fr?"Dépense ajoutée ✓":"Expense added ✓","success");
    } catch(e){ /* Expense creation failed */ setSaving(false);addToast("Erreur: "+e.message,"error");}
  };

  const sel = selectedModel ? modelStats.find(m=>m.id===selectedModel) : null;
  const Badge = ({color,text}) => <span style={{fontSize:9,padding:"3px 8px",borderRadius:12,background:`${color}22`,color,fontWeight:700,whiteSpace:"nowrap"}}>{text}</span>;

  return (
    <div>
      <GlobalFilterBar lang={lang} dr={dr} models={null} profiles={profiles}
        provider={mfProvider} setProvider={setMfProvider} showProviderFilter />
      {/* Header + Toggle */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:17,fontWeight:800,margin:0}}>{fr?"Modèles · Performance & Management":"Models · Performance & Management"}</h2>
          <p style={{fontSize:11,color:"var(--text-tertiary)",margin:"3px 0 0"}}>{fr?"Rentabilité, dépenses et classement":"Profitability, expenses and ranking"}</p>
        </div>
        <div style={{display:"flex",gap:0,borderRadius:14,border:"1px solid var(--border-default)",overflow:"hidden"}}>
          <button onClick={()=>{setView("global");setSelectedModel(null);}} style={{padding:"7px 16px",border:"none",background:view==="global"?"var(--accent-muted)":"transparent",color:view==="global"?"var(--accent)":"var(--text-tertiary)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{fr?"Vue Globale":"Global View"}</button>
          <button onClick={()=>setView("model")} style={{padding:"7px 16px",border:"none",background:view==="model"?"var(--accent-muted)":"transparent",color:view==="model"?"var(--accent)":"var(--text-tertiary)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{fr?"Par Modèle":"Per Model"}</button>
        </div>
      </div>

      {/* ── GLOBAL VIEW ── */}
      {view==="global"&&<>
        <div className="kpi-grid" style={{marginBottom:20}}>
          <KPICard label={fr?"CA Total":"Total Revenue"} value={`${Math.round(globalCA)}${currencySymbol}`} icon="💰"/>
          <KPICard label={fr?"Dépenses":"Expenses"} value={`${Math.round(globalExp)}${currencySymbol}`} icon="💸"/>
          <KPICard label={fr?"Bénéfice Net":"Net Profit"} value={`${Math.round(globalBenef)}${currencySymbol}`} icon="📈"/>
          <KPICard label={fr?"Rentabilité":"Profitability"} value={`${globalMargin}%`} icon="🎯"/>
          <KPICard label="TX Total" value={`${totalTxCount}`} icon="📋"/>
          <KPICard label={fr?"Panier Moyen":"Avg Ticket"} value={`${globalAvgTicket||0}${currencySymbol}`} icon="🛒"/>
        </div>

        {/* Podium top 3 */}
        {modelStats.length>=3&&<div className="card" style={{marginBottom:20,textAlign:"center",padding:"24px 20px"}}>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:20}}>{fr?"🏆 Classement Modèles":"🏆 Models Ranking"}</h3>
          <div style={{display:"flex",justifyContent:"center",alignItems:"flex-end",gap:16,height:220}}>
            {/* 2nd */}
            <div style={{textAlign:"center",cursor:"pointer"}} onClick={()=>{setSelectedModel(modelStats[1].id);setView("model");}}>
              <div style={{width:56,height:56,borderRadius:16,background:"var(--accent-muted)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:20,color:"var(--accent)",margin:"0 auto"}}>{modelStats[1].name[0]}</div>
              <div style={{fontSize:13,fontWeight:700,marginTop:8}}>{modelStats[1].name}</div>
              <div style={{fontSize:20,fontWeight:800,color:"var(--medal-silver)"}}>🥈</div>
              <div style={{width:100,height:100,background:"var(--bg-overlay)",borderRadius:"12px 12px 0 0",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",margin:"0 auto"}}>
                <div style={{fontSize:15,fontWeight:800}}>{Math.round(modelStats[1].ca).toLocaleString()}{currencySymbol}</div>
                <div style={{fontSize:10,color:"var(--text-tertiary)"}}>{modelStats[1].margin}% marge</div>
              </div>
            </div>
            {/* 1st */}
            <div style={{textAlign:"center",cursor:"pointer"}} onClick={()=>{setSelectedModel(modelStats[0].id);setView("model");}}>
              <div style={{width:64,height:64,borderRadius:12,background:"var(--warning-muted)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:24,color:"var(--warning)",margin:"0 auto"}}>{modelStats[0].name[0]}</div>
              <div style={{fontSize:16,fontWeight:800,marginTop:8}}>{modelStats[0].name}</div>
              <div style={{fontSize:24,fontWeight:800,color:"var(--warning)"}}>🥇</div>
              <div style={{width:110,height:140,background:"var(--warning-muted)",borderRadius:"12px 12px 0 0",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",margin:"0 auto"}}>
                <div style={{fontSize:17,fontWeight:800}}>{Math.round(modelStats[0].ca).toLocaleString()}{currencySymbol}</div>
                <div style={{fontSize:10,color:"var(--text-tertiary)"}}>{modelStats[0].margin}% marge</div>
              </div>
            </div>
            {/* 3rd */}
            <div style={{textAlign:"center",cursor:"pointer"}} onClick={()=>{setSelectedModel(modelStats[2].id);setView("model");}}>
              <div style={{width:48,height:48,borderRadius:14,background:"var(--bg-hover)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:18,color:"var(--medal-bronze)",margin:"0 auto"}}>{modelStats[2].name[0]}</div>
              <div style={{fontSize:12,fontWeight:700,marginTop:8}}>{modelStats[2].name}</div>
              <div style={{fontSize:18,fontWeight:800,color:"var(--medal-bronze)"}}>🥉</div>
              <div style={{width:90,height:70,background:"var(--bg-overlay)",borderRadius:"12px 12px 0 0",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",margin:"0 auto"}}>
                <div style={{fontSize:14,fontWeight:800}}>{Math.round(modelStats[2].ca).toLocaleString()}{currencySymbol}</div>
                <div style={{fontSize:10,color:"var(--text-tertiary)"}}>{modelStats[2].margin}% marge</div>
              </div>
            </div>
          </div>
        </div>}

        {/* Model Cards Grid */}
        <div>
          <div className="section-title" style={{marginBottom:16}}><div className="section-bar"></div>{fr?"Tous les mod\u00E8les":"All models"}</div>
          <div className="cards-grid">
            {mPag.paginatedData.map(m => {
              const avatarColors = ["#8B5CF6","#EC4899","#F59E0B","#10B981","#3B82F6","#EF4444","#6366F1","#14B8A6"];
              const avatarBg = avatarColors[(m.name||"").charCodeAt(0) % avatarColors.length];
              const totalForBar = m.validatedCount + (m.pending?.length||0) + (m.mTxs.length - m.validatedCount - (m.pending?.length||0));
              const pctValidated = totalForBar > 0 ? Math.round((m.validatedCount / totalForBar) * 100) : 0;
              const refusedCount = m.mTxs.length - m.validatedCount - (m.pending?.length||0);
              return (
                <div key={m.id} className="card card-hover" onClick={()=>{setSelectedModel(m.id);setView("model");}} style={{cursor:"pointer",padding:20}}>
                  <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                    <div className="avatar" style={{background:avatarBg,color:"#fff"}}>{(m.name||"?")[0]}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14}}>{m.name}</div>
                      <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{m.txCount} TX {"\u00B7"} {m.chatters.length} chatters</div>
                    </div>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                      {m.margin>80&&<Badge color="var(--success)" text="\u{1F525}"/>}
                      {m.streak>2&&<Badge color="var(--warning)" text={`${m.streak}j`}/>}
                      {m.convRate>85&&<Badge color="var(--pink)" text="\u{1F48E}"/>}
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                    <div>
                      <div style={{fontSize:10,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.5}}>CA</div>
                      <div style={{fontSize:20,fontWeight:700,color:"var(--success)"}}>{Math.round(m.ca).toLocaleString()}{currencySymbol}</div>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:"var(--text-tertiary)",textTransform:"uppercase",letterSpacing:0.5}}>TX</div>
                      <div style={{fontSize:20,fontWeight:700}}>{m.txCount}</div>
                    </div>
                  </div>
                  <div style={{height:4,borderRadius:2,background:"#2A2A3E",marginBottom:8}}>
                    <div style={{height:"100%",borderRadius:2,background:"var(--success)",width:pctValidated+"%",transition:"width 0.3s"}}/>
                  </div>
                  <div style={{display:"flex",gap:12,fontSize:11,color:"var(--text-tertiary)"}}>
                    <span>{"\u2705"} {m.validatedCount}</span>
                    <span>{"\u23F3"} {m.pending?.length||0}</span>
                    <span>{"\u274C"} {refusedCount>0?refusedCount:0}</span>
                    <span style={{marginLeft:"auto",fontWeight:600}}><span style={{padding:"2px 8px",borderRadius:12,fontSize:10,fontWeight:700,background:m.margin>=70?"var(--success-muted)":m.margin>=40?"var(--warning-muted)":"var(--danger-muted)",color:m.margin>=70?"var(--success)":m.margin>=40?"var(--warning)":"var(--danger)"}}>{m.margin}%</span></span>
                  </div>
                </div>
              );
            })}
          </div>
          {mPag.paginatedData.length===0&&<div style={{padding:60,textAlign:"center",color:"var(--text-tertiary)"}}><div style={{fontSize:32,marginBottom:8}}>{"\u{1F4CA}"}</div><div style={{fontSize:14}}>{lang==="fr"?"Aucun mod\u00E8le trouv\u00E9":"No models found"}</div></div>}
          <PaginationControls pag={mPag} lang={lang}/>
        </div>
      </>}

      {/* ── PER MODEL VIEW ── */}
      {view==="model"&&<>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12,marginBottom:20}}>
          {modelStats.map(m => (
            <div key={m.id} className="card" onClick={()=>setSelectedModel(m.id)}
              style={{cursor:"pointer",padding:"14px 16px",transition:"all 0.3s",border:selectedModel===m.id?"1px solid var(--border-accent)":"1px solid var(--border-subtle)",background:selectedModel===m.id?"var(--accent-subtle)":"var(--card-bg)"}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{m.name}</div>
              <div style={{fontSize:12,color:"var(--success)",fontWeight:700}}>{Math.round(m.ca)}{currencySymbol}</div>
              <div style={{display:"flex",gap:4,marginTop:6,flexWrap:"wrap"}}>
                {m.margin>80&&<Badge color="var(--success)" text="🔥"/>}
                {m.streak>2&&<Badge color="var(--warning)" text={`${m.streak}j`}/>}
                {m.convRate>85&&<Badge color="var(--pink)" text="💎"/>}
              </div>
            </div>
          ))}
        </div>
        {sel&&<>
          <div className="kpi-grid" style={{marginBottom:20}}>
            <KPICard label="CA" value={`${Math.round(sel.ca)}${currencySymbol}`} icon="💰"/>
            <KPICard label={fr?"Dépenses":"Expenses"} value={`${Math.round(sel.totalExp)}${currencySymbol}`} icon="💸"/>
            <KPICard label={fr?"Bénéfice":"Profit"} value={`${Math.round(sel.benefice)}${currencySymbol}`} icon="📈"/>
            <KPICard label="Marge" value={`${sel.margin}%`} icon="🎯"/>
            <KPICard label="TX" value={`${sel.txCount}`} icon="📋"/>
            <KPICard label={fr?"Panier Moyen":"Avg Ticket"} value={`${sel.avgTicket}${currencySymbol}`} icon="🛒"/>
          </div>
          <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
            {sel.margin>80&&<Badge color="var(--success)" text="🔥 High Margin"/>}
            {sel.txCount>50&&<Badge color="var(--accent)" text="⚡ Volume King"/>}
            {sel.convRate>85&&<Badge color="var(--pink)" text="💎 Top Converter"/>}
            {sel.streak>0&&<Badge color="var(--warning)" text={`🔥 ${sel.streak}j streak`}/>}
            {sel.last7dCA>0&&<Badge color="var(--accent)" text={`📈 ${Math.round(sel.last7dCA)}${currencySymbol} 7j`}/>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
            <div className="card" style={{overflow:"hidden"}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>📋 {sel.name} — TX ({sel.txCount})</div>
              <div className="table-wrap" style={{maxHeight:400,overflowY:"auto"}}>
                <table className="table">
                  <thead><tr><th>{t(lang,"date")}</th><th>Spender</th><th>{t(lang,"amount")}</th><th>{lang==="fr"?"Produit":"Product"}</th><th>Tag</th><th>Chatter</th><th>Provider</th><th>{t(lang,"status")}</th><th>{t(lang,"actions")}</th></tr></thead>
                  <tbody>
                    {sel.mTxs.slice(0,30).map(tx => (
                      <tr key={tx.id} className={tx.status==="pending"?"pending-row":""}>
                        <td style={{fontFamily:"monospace",fontSize:11,color:"var(--text-secondary)"}}>{fmtDate(tx.date)}</td>
                        <td><Tag type="spender" label={tx.spender_handle} id={tx.spender_handle}/></td>
                        <td style={{fontWeight:700}}>{fmtAmount(tx.amount,tx.currency)}</td>
                        <td>{tx.product||"—"}</td>
                        <td>{tx.tag||"—"}</td>
                        <td><Tag type="chatter" label={profiles.find(p=>p.id===tx.chatter_id)?.name||"?"} id={tx.chatter_id}/></td>
                        <td><Tag type="provider" label={profiles.find(p=>p.id===tx.provider_id)?.name||"?"} id={tx.provider_id}/></td>
                        <td><StatusPill status={tx.status} lang={lang}/></td>
                        <td style={{whiteSpace:"nowrap"}}>{tx.status==="pending"&&<>
                          <button className="btn-edit" style={{marginRight:4}} onClick={()=>setEditingTx(tx)}>✏️</button>
                          <button className="btn btn-success btn-small" disabled={!!processingTxId} onClick={()=>handleStatus(tx.id,"validated")}>{processingTxId===tx.id?<Spinner/>:"✓"}</button>{" "}
                          <button className="btn btn-danger btn-small" disabled={!!processingTxId} onClick={()=>setConfirmRefuse(tx)}>✗</button>
                        </>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:14}}>💸 {fr?"Dépenses":"Expenses"} — {sel.name}</div>
                <button onClick={()=>{setExpForm({...expForm,model_id:sel.id});setShowExpenseForm(true);}} style={{padding:"6px 16px",borderRadius:14,border:"none",background:"var(--danger)",color:"var(--text-primary)",fontSize:11,fontWeight:700,cursor:"pointer",boxShadow:"var(--shadow-md)",fontFamily:"'DM Sans',sans-serif"}}>+ {fr?"Ajouter":"Add"}</button>
              </div>
              <div style={{fontSize:22,fontWeight:800,color:"var(--danger)",marginBottom:14}}>-{Math.round(sel.totalExp).toLocaleString()}{currencySymbol}</div>
              {EXPENSE_CATS.map(cat => {
                const catTotal = sel.mExp.filter(e=>e.category===cat.id).reduce((s,e)=>s+convertAmount(Number(e.amount),e.currency),0);
                if(catTotal===0) return null;
                return <div key={cat.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border-subtle)"}}>
                  <span style={{fontSize:12,color:"var(--text-secondary)"}}>{cat.icon} {cat.label}</span>
                  <span style={{fontSize:13,fontWeight:700,color:"var(--danger)"}}>-{Math.round(catTotal).toLocaleString()}{currencySymbol}</span>
                </div>;
              })}
              {sel.totalExp===0&&<div style={{textAlign:"center",padding:20,color:"var(--text-quaternary)",fontSize:12}}>{fr?"Aucune dépense":"No expenses"}</div>}
              {sel.mExp.length>0&&<div style={{marginTop:12,maxHeight:200,overflowY:"auto"}}>
                {sel.mExp.map((e,i) => (
                  <div key={e.id||i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",fontSize:11,borderBottom:"1px solid var(--border-subtle)"}}>
                    <span style={{color:"var(--text-secondary)"}}>{e.date?.slice(0,10)||"-"} · {e.name||e.category}</span>
                    <span style={{fontWeight:700,color:"var(--danger)"}}>-{Number(e.amount).toFixed(0)}{currencySymbol}</span>
                  </div>
                ))}
              </div>}
            </div>
          </div>
          {/* Content Task Manager — gérant assigns tasks to model */}
          <div className="card" style={{ marginTop: 16 }}>
            <ContentTaskManager modelId={selectedModel} lang={lang} onRefresh={onRefresh} />
          </div>
        </>}
        {!sel&&<div className="card" style={{textAlign:"center",padding:40,color:"var(--text-quaternary)"}}>{fr?"Sélectionnez un modèle ci-dessus":"Select a model above"}</div>}
      </>}

      {/* ── EXPENSE FORM MODAL ── */}
      {showExpenseForm&&<div className="modal-overlay" onClick={()=>setShowExpenseForm(false)}>
        <div className="card" style={{maxWidth:440,width:"100%",margin:16}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>💸 {fr?"Ajouter une dépense":"Add an expense"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div className="form-group-modal" style={{gridColumn:"1/-1"}}>
              <label className="form-label">{t(lang,"model")}</label>
              <select className="filter-select" style={{width:"100%"}} value={expForm.model_id} onChange={e=>setExpForm({...expForm,model_id:e.target.value})}>
                <option value="">{fr?"Agence (général)":"Agency (general)"}</option>
                {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"amount")}</label>
              <input className="form-input" type="number" value={expForm.amount} onChange={e=>setExpForm({...expForm,amount:e.target.value})}/>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Devise":"Currency"}</label>
              <select className="filter-select" style={{width:"100%"}} value={expForm.currency} onChange={e=>setExpForm({...expForm,currency:e.target.value})}><option>EUR</option><option>CHF</option></select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{fr?"Catégorie":"Category"}</label>
              <select className="filter-select" style={{width:"100%"}} value={expForm.category} onChange={e=>setExpForm({...expForm,category:e.target.value})}>
                {EXPENSE_CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">Date</label>
              <input className="form-input" type="date" value={expForm.date} onChange={e=>setExpForm({...expForm,date:e.target.value})}/>
            </div>
            <div className="form-group-modal" style={{gridColumn:"1/-1"}}>
              <label className="form-label">Description</label>
              <input className="form-input" value={expForm.description} onChange={e=>setExpForm({...expForm,description:e.target.value})} placeholder={fr?"Ex: Shooting photo":"Ex: Photo shoot"}/>
            </div>
          </div>
          <div style={{display:"flex",gap:12,marginTop:20}}>
            <button className="btn btn-danger" onClick={()=>setShowExpenseForm(false)} style={{flex:1}}>{t(lang,"cancel")}</button>
            <button className="btn btn-success" onClick={handleAddExpense} disabled={saving} style={{flex:1}}>{saving?"...":fr?"Ajouter":"Add"}</button>
          </div>
        </div>
      </div>}

      {/* ── GLOBAL EXPENSE SECTION ── */}
      <div className="card" style={{marginTop:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
          <div className="section-title" style={{marginBottom:0}}><div className="section-bar"></div>💸 {fr?"Espace Dépenses":"Expenses Space"}</div>
          <button onClick={()=>{setExpForm({model_id:"",amount:"",currency:"EUR",category:"contenu",description:"",date:new Date().toISOString().slice(0,10)});setShowExpenseForm(true);}} style={{padding:"7px 20px",borderRadius:14,border:"none",background:"var(--danger)",color:"var(--text-primary)",fontSize:12,fontWeight:700,cursor:"pointer",boxShadow:"var(--shadow-md)",fontFamily:"'DM Sans',sans-serif"}}>+ {fr?"Ajouter une dépense":"Add an expense"}</button>
        </div>
        <div className="table-wrap">
          <table className="table">
            <thead><tr><th>Date</th><th>{t(lang,"model")}</th><th>{fr?"Catégorie":"Category"}</th><th>Description</th><th>{t(lang,"amount")}</th></tr></thead>
            <tbody>
              {(expenses||[]).slice(0,20).map((e,i) => {
                const mName = models.find(m=>m.id===e.model_id)?.name||(fr?"Agence":"Agency");
                const cat = EXPENSE_CATS.find(c=>c.id===e.category);
                return <tr key={e.id||i}>
                  <td style={{fontFamily:"monospace",fontSize:11,color:"var(--text-secondary)"}}>{e.date?.slice(0,10)||e.created_at?.slice(0,10)||"-"}</td>
                  <td style={{fontWeight:600}}>{mName}</td>
                  <td>{cat?`${cat.icon} ${cat.label}`:e.category||"-"}</td>
                  <td style={{fontSize:11,color:"var(--text-secondary)"}}>{e.name||e.description||"-"}</td>
                  <td style={{fontWeight:700,color:"var(--danger)"}}>-{Number(e.amount).toFixed(0)}{currencySymbol}</td>
                </tr>;
              })}
              {(!expenses||expenses.length===0)&&<tr><td colSpan={5} style={{textAlign:"center",color:"var(--text-quaternary)",padding:20}}>{fr?"Aucune dépense":"No expenses"}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {editingTx && <EditTxModal tx={editingTx} lang={lang} onSave={handleEditSave} onCancel={()=>setEditingTx(null)} saving={saving} models={models} profiles={profiles} products={products} productTags={productTags} modelPrices={modelPrices} providerPaymentMethods={providerPaymentMethods} />}
      <ConfirmModal open={!!confirmRefuse} lang={lang} title={fr?"Refuser cette transaction ?":"Refuse this transaction?"} message={confirmRefuse?`${fr?"Voulez-vous vraiment refuser la transaction de":"Do you really want to refuse the transaction from"} @${confirmRefuse.spender_handle} (${fmtAmount(confirmRefuse.amount,confirmRefuse.currency)}) ?`:""} onConfirm={()=>{const tx=confirmRefuse;setConfirmRefuse(null);handleStatus(tx.id,"refused");}} onCancel={()=>setConfirmRefuse(null)} />
    </div>
  );
});

// =============================================
// TRANSACTIONS TAB
// =============================================
const TransactionsTab = React.memo(({user, lang, txs, models, profiles, dbSpenders, onRefresh, onNotify, products, productTags, modelPrices, providerPaymentMethods}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const dr = useDateRange("7d");
  const [model, setModel] = useState("");
  const [status, setStatus] = useState("");
  const [chatter, setChatter] = useState("");
  const [txProvider, setTxProvider] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({spender_handle:"",amount:"",currency:"EUR",model_id:"",chatter_id:user.id,provider_id:"",product:"",tag:"",product_id:"",product_tag_id:"",notes:"",payment_method:"",product_contents:[]});
  const [editingTx, setEditingTx] = useState(null);
  const [processingTxId, setProcessingTxId] = useState(null);
  const [confirmRefuse, setConfirmRefuse] = useState(null);
  const activeProducts = (products||[]).filter(p => p.active !== false);
  const activeTags = (productTags||[]).filter(t => t.active !== false);
  const {sort, onSort, doSort} = useSortable();
  let filtered = filterByStatus(filterByChatter(filterByProvider(filterByModel(dr.filterByDate(txs, "date"), model), txProvider), chatter), status);
  const sortedFiltered = doSort(filtered, {
    date: x=>x.date, amount: x=>Number(x.amount)||0, spender_handle: x=>(x.spender_handle||"").toLowerCase(),
    model_id: x=>(models.find(m=>m.id===x.model_id)?.name||"").toLowerCase(),
    provider_id: x=>(profiles.find(p=>p.id===x.provider_id)?.name||"").toLowerCase(),
    chatter_id: x=>(profiles.find(p=>p.id===x.chatter_id)?.name||"").toLowerCase(),
    product: x=>(x.product||"").toLowerCase(), status: x=>(x.status||"").toLowerCase(),
  });
  const pag = usePagination(sortedFiltered);

  // Build spender list for autocomplete
  const spenderOptions = React.useMemo(() => {
    const set = new Set();
    (dbSpenders || []).forEach(s => set.add(s.handle || s.name));
    txs.forEach(tx => { if(tx.spender_handle) set.add(tx.spender_handle); });
    return [...set].sort();
  }, [dbSpenders, txs]);

  const handleCreate = async () => {
    const trimmedHandle = (form.spender_handle||"").replace(/^@/, "").trim();
    if(!trimmedHandle) { addToast(lang==="fr"?"Spender requis":"Spender required","error"); return; }
    if(!form.amount||isNaN(parseFloat(form.amount))||parseFloat(form.amount)<=0) { addToast(lang==="fr"?"Montant invalide (> 0)":"Invalid amount (> 0)","error"); return; }
    setSaving(true);
    try {
      // Step 1: UPSERT le Spender en DB
      const handle = trimmedHandle;
      try {
        await safeUpsertSpender({handle, name: handle, status: "active", last_seen: new Date().toISOString()});
      } catch(e) { /* Spender upsert best-effort */ }

      // Step 2: INSERT transaction — only include FK fields if they look like valid UUIDs
      // Store date in UTC+1 (Europe/Paris) reference timezone
      const now = new Date();
      const dateUTC1 = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Paris" }));
      const isUUID = (v) => typeof v === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
      const txRow = {
        date: dateUTC1.toISOString(),
        spender_handle: handle,
        amount: parseFloat(form.amount),
        status: "pending",
        notes: form.notes || null,
      };
      if(isUUID(form.model_id)) txRow.model_id = form.model_id;
      if(isUUID(form.provider_id)) txRow.provider_id = form.provider_id;
      if(isUUID(form.chatter_id)) txRow.chatter_id = form.chatter_id;
      if(form.currency && form.currency !== "EUR") txRow.currency = form.currency;
      if(form.product) txRow.product = form.product;
      if(form.tag) txRow.tag = form.tag;
      if(isUUID(form.product_id)) txRow.product_id = form.product_id;
      if(isUUID(form.product_tag_id)) txRow.product_tag_id = form.product_tag_id;
      if(form.payment_method) txRow.payment_method = form.payment_method;
      if(form.product_contents&&form.product_contents.length>0) txRow.product_contents = form.product_contents;
      const res = await safeInsertTx(txRow);

      if(!res.error) {
        setForm({spender_handle:"",amount:"",currency:"EUR",model_id:"",chatter_id:user.id,provider_id:"",product:"",tag:"",product_id:"",product_tag_id:"",notes:"",payment_method:"",product_contents:[]});
        setShowForm(false);
        setSaving(false);
        await onRefresh();
        addToast(t(lang,"tx_created")||"Transaction créée ✓","success");
        // ── Send notifications ──
        if(onNotify&&res.data&&res.data[0]) {
          const tx = res.data[0];
          const cur = currencySymbol;
          const modelName = models.find(m=>m.id===tx.model_id)?.name||"";
          const providerName = profiles.find(p=>p.id===tx.provider_id)?.name||"";
          // Notify gerants
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_created","Nouvelle transaction",`${tx.amount}${cur} de @${tx.spender_handle}${modelName?" sur #"+modelName:""}${providerName?" par @"+providerName:""}`,tx.id));
          // Notify provider
          if(tx.provider_id){const prov=profiles.find(p=>p.id===tx.provider_id);if(prov)onNotify(prov.id,"tx_created","Nouvelle vente",`${tx.amount}${cur} de @${tx.spender_handle}`,tx.id);}
        }
      } else {
        setSaving(false);
        // TX insert failed
        addToast("Erreur: " + (res.error.message || "insert failed"),"error");
      }
    } catch(e) {
      setSaving(false);
      // handleCreate error
      addToast("Erreur: " + e.message, "error");
    }
  };
  const handleStatus = async (txId, newStatus) => {
    if (processingTxId) return; // double-click guard
    setProcessingTxId(txId);
    try {
      // Immutability guard: only pending transactions can change status
      const currentTx = txs.find(tx => tx.id === txId);
      if (currentTx && currentTx.status !== "pending") {
        addToast(t(lang,"tx_immutable"), "error");
        setProcessingTxId(null);
        return;
      }
      const {error} = await sb.from("transactions").update({status:newStatus}).eq("id",txId);
      if(error) { addToast("Erreur: " + error.message, "error"); setProcessingTxId(null); return; }
      // ── Notify on validate/refuse ──
      if(onNotify&&currentTx) {
        const cur = currencySymbol;
        const modelName = models.find(m=>m.id===currentTx.model_id)?.name||"";
        if(newStatus==="validated") {
          if(currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_validated","TX validée ✅",`${currentTx.amount}${cur} de @${currentTx.spender_handle} — commission ${(currentTx.chatter_commission||0).toFixed(0)}${cur}`,txId);
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_validated","TX validée",`${currentTx.amount}${cur} @${currentTx.spender_handle}${modelName?" #"+modelName:""}`,txId));
        } else {
          if(currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_refused","TX refusée ❌",`${currentTx.amount}${cur} de @${currentTx.spender_handle} — motif à vérifier`,txId);
          profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_refused","TX refusée",`${currentTx.amount}${cur} @${currentTx.spender_handle}${modelName?" #"+modelName:""}`,txId));
        }
      }
      await onRefresh();
      addToast(newStatus==="validated"?(t(lang,"tx_validated")||"Validée ✓"):(t(lang,"tx_refused")||"Refusée"), newStatus==="validated"?"success":"error");
    } catch(e) { /* TX status update failed */ addToast("Erreur: " + e.message, "error"); }
    setProcessingTxId(null);
  };
  const handleEditSave = async (updates) => {
    if (!editingTx || editingTx.status !== "pending") {
      addToast(t(lang,"tx_immutable"), "error");
      setEditingTx(null);
      return;
    }
    if(!updates.amount||isNaN(Number(updates.amount))||Number(updates.amount)<=0) { addToast(lang==="fr"?"Montant invalide (> 0)":"Invalid amount (> 0)","error"); return; }
    if(!(updates.spender_handle||"").trim()) { addToast(lang==="fr"?"Spender requis":"Spender required","error"); return; }
    setSaving(true);
    try {
      const {error} = await sb.from("transactions").update({
        spender_handle:updates.spender_handle, amount:updates.amount, currency:updates.currency,
        model_id:updates.model_id, provider_id:updates.provider_id, chatter_id:updates.chatter_id,
        product:updates.product, tag:updates.tag, product_id:updates.product_id||null, product_tag_id:updates.product_tag_id||null, notes:updates.notes,
      }).eq("id", editingTx.id).eq("status","pending");
      setSaving(false);
      if (error) { addToast("Erreur: " + error.message, "error"); return; }
      // ── Notify on edit ──
      if(onNotify&&editingTx) {
        const cur = (updates.currency||editingTx.currency)==="EUR"?"€":" CHF";
        const msg = editingTx.amount!==updates.amount?`montant ${editingTx.amount}→${updates.amount}${cur}`:"TX modifiée";
        if(editingTx.provider_id) onNotify(editingTx.provider_id,"tx_modified","TX modifiée",msg,editingTx.id);
        if(editingTx.chatter_id) onNotify(editingTx.chatter_id,"tx_modified","TX modifiée",msg,editingTx.id);
        profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,"tx_modified","TX modifiée",`par @${user.name}: ${msg}`,editingTx.id));
      }
      setEditingTx(null);
      await onRefresh();
      addToast(t(lang,"tx_updated")||"Transaction modifiée ✓","success");
    } catch(e) { /* TX edit save failed */
      setSaving(false);
      addToast("Erreur: " + e.message, "error");
    }
  };
  return (
    <div>
      <GlobalFilterBar lang={lang} dr={dr} models={models} profiles={profiles}
        model={model} setModel={setModel} showModelFilter
        provider={txProvider} setProvider={setTxProvider} showProviderFilter={user.role==="gerant"}
        chatter={chatter} setChatter={setChatter} showChatterFilter={user.role==="gerant"}
        status={status} setStatus={setStatus} showStatusFilter />
      {(()=>{
        const vTx = filtered.filter(tx=>tx.status==="validated"||tx.status==="confirmee");
        const pTx = filtered.filter(tx=>tx.status==="pending");
        const caGross = vTx.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
        const caPend = pTx.reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
        const now = new Date(); const ms = new Date(now.getFullYear(),now.getMonth(),1);
        const caMonth = vTx.filter(tx=>new Date(tx.date)>=ms).reduce((s,tx)=>s+convertAmount(Number(tx.amount),tx.currency),0);
        return (
          <div className="kpi-grid" style={{marginBottom:20}}>
            <KPICard label={lang==="fr"?"CA Brut":"Gross Revenue"} value={`${Math.round(caGross).toLocaleString()}${currencySymbol}`} icon={"\u{1F4B0}"}/>
            <KPICard label={lang==="fr"?"Nb TX":"TX Count"} value={`${filtered.length}`} icon={"\u{1F4CB}"}/>
            <KPICard label={lang==="fr"?"Ce mois":"This month"} value={`${Math.round(caMonth).toLocaleString()}${currencySymbol}`} icon={"\u{1F4C5}"}/>
            <KPICard label={lang==="fr"?"En attente":"Pending"} value={`${Math.round(caPend).toLocaleString()}${currencySymbol}`} icon={"\u23F3"} className="warning"/>
          </div>
        );
      })()}
      {(user.role==="gerant"||user.role==="chatter")&&(
        <button className="btn btn-primary" style={{marginBottom:20,width:"auto"}} onClick={()=>setShowForm(!showForm)}>+ {t(lang,"new_tx")}</button>
      )}
      {showForm&&(
        <div className="card" style={{marginBottom:20}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"spender")}</label>
              <input className="form-input" list="spender-list" value={form.spender_handle} onChange={e=>setForm({...form,spender_handle:e.target.value})} placeholder="@handle ou choisir existant" autoComplete="off" />
              <datalist id="spender-list">{spenderOptions.map(s=><option key={s} value={s}/>)}</datalist>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"amount")}</label>
              <input className="form-input" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} />
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"currency")}</label>
              <select className="filter-select" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>
                <option>EUR</option><option>CHF</option><option>USD</option>
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"model")}</label>
              <select className="filter-select" value={form.model_id} onChange={e=>setForm({...form,model_id:e.target.value})}>
                <option value="">Select</option>
                {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"provider")}</label>
              <select className="filter-select" value={form.provider_id} onChange={e=>setForm({...form,provider_id:e.target.value})}>
                <option value="">Select</option>
                {profiles.filter(u=>u.role==="provider").map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            {user.role==="gerant"&&(
              <div className="form-group-modal">
                <label className="form-label">Chatter</label>
                <select className="filter-select" value={form.chatter_id} onChange={e=>setForm({...form,chatter_id:e.target.value})}>
                  {profiles.filter(u=>u.role==="chatter").map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                </select>
              </div>
            )}
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"product")}</label>
              <select className="filter-select" value={form.product_id} onChange={e=>{
                const pid = e.target.value;
                const prod = activeProducts.find(p=>p.id===pid);
                const newAmount = prod&&prod.price_chf ? String(prod.price_chf) : form.amount;
                const newCurrency = prod&&prod.price_chf ? "CHF" : form.currency;
                setForm({...form, product_id:pid, product:prod?.name||"", product_tag_id:"", tag:"", amount:newAmount, currency:newCurrency});
              }}>
                <option value="">Select</option>
                {PRODUCT_CATEGORIES.map(cat=>{
                  const catProds = activeProducts.filter(p=>(p.category||"Autre")===cat);
                  if(catProds.length===0) return null;
                  return <optgroup key={cat} label={`\u2014 ${cat} \u2014`}>{catProds.map(p=>{
                    const priceStr = p.price_chf ? ` (${p.price_chf} CHF)` : "";
                    const durStr = p.duration_minutes ? ` ${p.duration_minutes}min` : "";
                    return <option key={p.id} value={p.id}>{p.icon} {p.name}{durStr}{priceStr}</option>;
                  })}</optgroup>;
                })}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{t(lang,"tag")}</label>
              <select className="filter-select" value={form.product_tag_id} onChange={e=>{
                const tid = e.target.value;
                const tag = activeTags.find(t=>t.id===tid);
                if(tag) {
                  const mp = (modelPrices||[]).find(p=>p.model_id===form.model_id&&p.product_tag_id===tid);
                  const price = mp ? Number(mp.price) : Number(tag.default_price);
                  setForm({...form, product_tag_id:tid, tag:tag.name, amount: price > 0 ? String(price) : form.amount});
                } else {
                  setForm({...form, product_tag_id:tid, tag:""});
                }
              }}>
                <option value="">Select</option>
                {activeTags.filter(t=>!form.product_id||t.product_id===form.product_id).map(t=>{
                  const dur = t.duration_minutes ? ` (${t.duration_minutes}min)` : "";
                  const price = Number(t.default_price);
                  return <option key={t.id} value={t.id}>{t.name}{dur}{price>0?` \u2014 ${price} CHF`:""}</option>;
                })}
              </select>
            </div>
            <div className="form-group-modal">
              <label className="form-label">{lang==="fr"?"M\u00E9thode paiement":"Payment method"}</label>
              <select className="filter-select" value={form.payment_method} onChange={e=>setForm({...form,payment_method:e.target.value})}>
                <option value="">Select</option>
                {PAYMENT_METHODS.map(pm=>{const ptc=PAYMENT_TYPE_COLORS[pm]||PAYMENT_TYPE_COLORS["Autre"];return <option key={pm} value={pm}>{ptc.icon} {pm}</option>;})}
              </select>
            </div>
          </div>
          {/* Contenu associé — toggle badges */}
          {form.product_id&&(
            <div style={{marginTop:12}}>
              <label className="form-label" style={{marginBottom:6,display:"block"}}>{lang==="fr"?"Contenu associ\u00E9":"Associated content"}</label>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {activeTags.filter(t=>t.product_id===form.product_id).map((t,i)=>{
                  const sel = (form.product_contents||[]).includes(t.name);
                  const tc = TAG_COLORS[i%TAG_COLORS.length];
                  return <button key={t.id} type="button" onClick={()=>{
                    const cur = form.product_contents||[];
                    setForm({...form, product_contents: sel ? cur.filter(n=>n!==t.name) : [...cur, t.name]});
                  }} style={{padding:"4px 12px",borderRadius:10,border:sel?`2px solid ${tc.bg}`:"2px solid transparent",background:sel?tc.bg+"33":"rgba(255,255,255,0.04)",color:sel?tc.bg:"var(--text-tertiary)",fontSize:12,fontWeight:600,cursor:"pointer",transition:"all 0.15s",fontFamily:"'DM Sans',sans-serif"}}>{t.name}</button>;
                })}
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:12,marginTop:16}}>
            <button className="btn btn-success" onClick={handleCreate} disabled={saving}>{saving?"...":t(lang,"create")}</button>
            <button className="btn btn-danger" onClick={()=>setShowForm(false)}>{t(lang,"cancel")}</button>
          </div>
        </div>
      )}
      <div className="card">
        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr><SortTh label={t(lang,"date")} sortKey="date" sort={sort} onSort={onSort}/><th>{lang==="fr"?"Heure":"Time"}</th><SortTh label="Spender" sortKey="spender_handle" sort={sort} onSort={onSort}/><SortTh label={t(lang,"amount")} sortKey="amount" sort={sort} onSort={onSort}/><th>{lang==="fr"?"Devise":"Cur."}</th><SortTh label="Model" sortKey="model_id" sort={sort} onSort={onSort}/><SortTh label="Provider" sortKey="provider_id" sort={sort} onSort={onSort}/><th>{lang==="fr"?"Compte":"Account"}</th><SortTh label="Chatter" sortKey="chatter_id" sort={sort} onSort={onSort}/><SortTh label={lang==="fr"?"Produit":"Product"} sortKey="product" sort={sort} onSort={onSort}/><th>{lang==="fr"?"Contenu":"Content"}</th><th>{lang==="fr"?"Paiement":"Payment"}</th><th>{t(lang,"notes")}</th><SortTh label={t(lang,"status")} sortKey="status" sort={sort} onSort={onSort}/>{(user.role==="gerant"||user.role==="chatter"||user.role==="provider")&&<th>{t(lang,"actions")}</th>}</tr>
            </thead>
            <tbody>
              {pag.paginatedData.map(tx=>{
                const chName = profiles.find(u=>u.id===tx.chatter_id)?.name||"?";
                const provName = profiles.find(u=>u.id===tx.provider_id)?.name||"?";
                const canEdit = tx.status === "pending" && (user.role === "gerant" || user.role === "chatter" || (user.role === "provider" && tx.provider_id === user.id));
                return (
                  <tr key={tx.id} className={tx.status==="pending"?"pending-row":""}>
                    <td style={{fontFamily:"monospace",fontSize:12,color:"var(--text-secondary)"}}>{fmtDate(tx.date)}</td>
                    <td style={{fontSize:11,whiteSpace:"nowrap",color:"var(--text-secondary)"}}>{fmtDayTime(tx.date)}</td>
                    <td><Tag type="spender" label={tx.spender_handle} id={tx.spender_handle}/></td>
                    <td style={{fontSize:14,fontWeight:800,color:"var(--text-primary)"}}>{fmtAmount(tx.amount,tx.currency)}{(tx.currency||"EUR")!==currencySymbol.replace("€","EUR").replace(" CHF","CHF")&&<span style={{fontSize:9,color:"var(--text-quaternary)",marginLeft:4}}>({tx.amount}{(tx.currency||"EUR")==="CHF"?" CHF":"€"})</span>}</td>
                    <td style={{fontSize:11}}>{tx.currency||"EUR"}</td>
                    <td><Tag type="model" label={models.find(m=>m.id===tx.model_id)?.name||"?"} id={tx.model_id}/></td>
                    <td><Tag type="provider" label={provName} id={tx.provider_id}/></td>
                    <td style={{fontSize:11,whiteSpace:"nowrap"}}>{(()=>{const pm=(providerPaymentMethods||[]).find(p=>p.id===tx.provider_payment_method_id);return pm?fmtPaymentMethod(pm):"\u2014";})()}</td>
                    <td><Tag type="chatter" label={chName} id={tx.chatter_id}/></td>
                    <td style={{fontSize:11}}>{tx.product||"-"}</td>
                    <td style={{fontSize:11}}>{(tx.product_contents&&tx.product_contents.length>0)?tx.product_contents.map((c,i)=>{const tc=TAG_COLORS[i%TAG_COLORS.length];return <span key={i} style={{display:"inline-block",padding:"2px 7px",borderRadius:9,fontSize:10,fontWeight:600,background:tc.bg,color:tc.text,marginRight:3,marginBottom:2}}>{c}</span>;}):"—"}</td>
                    <td style={{fontSize:11}}>{tx.payment_method?(()=>{const ptc=PAYMENT_TYPE_COLORS[tx.payment_method]||PAYMENT_TYPE_COLORS["Autre"];return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:9,fontSize:10,fontWeight:600,background:ptc.bg,color:ptc.text}}>{ptc.icon} {tx.payment_method}</span>;})():"—"}</td>
                    <td style={{fontSize:11}}>{tx.notes||"-"}</td>
                    <td><StatusPill status={tx.status} lang={lang}/></td>
                    {(user.role==="gerant"||user.role==="chatter"||user.role==="provider")&&(
                      <td style={{whiteSpace:"nowrap"}}>
                        {canEdit && (
                          <button className="btn-edit" style={{marginRight:4}} onClick={()=>setEditingTx(tx)}>✏️ Modifier</button>
                        )}
                        {tx.status==="pending"&&(user.role==="gerant"||(user.role==="provider"&&tx.provider_id===user.id))&&(
                          <>
                            <button className="btn btn-success btn-small" onClick={()=>handleStatus(tx.id,"validated")} disabled={!!processingTxId}>{processingTxId===tx.id?<Spinner/>:t(lang,"validate")}</button>{" "}
                            <button className="btn btn-danger btn-small" onClick={()=>setConfirmRefuse(tx)} disabled={!!processingTxId}>{processingTxId===tx.id?<Spinner/>:t(lang,"refuse")}</button>
                          </>
                        )}
                      </td>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {pag.paginatedData.length===0&&<div style={{padding:60,textAlign:"center",color:"var(--text-tertiary)"}}><div style={{fontSize:32,marginBottom:8}}>📋</div><div style={{fontSize:14}}>{lang==="fr"?"Aucune transaction trouvée":"No transactions found"}</div></div>}
        <PaginationControls pag={pag} lang={lang}/>
      </div>
      {editingTx && <EditTxModal tx={editingTx} lang={lang} onSave={handleEditSave} onCancel={() => setEditingTx(null)} saving={saving} models={models} profiles={profiles} providerPaymentMethods={providerPaymentMethods} />}
      <ConfirmModal open={!!confirmRefuse} title={lang==="fr"?"Refuser cette transaction ?":"Refuse this transaction?"} message={confirmRefuse?`${confirmRefuse.spender_handle} — ${confirmRefuse.amount} ${confirmRefuse.currency||"EUR"}`:""} lang={lang} onConfirm={()=>{const tx=confirmRefuse;setConfirmRefuse(null);handleStatus(tx.id,"refused");}} onCancel={()=>setConfirmRefuse(null)}/>
    </div>
  );
});

// =============================================
// SPENDERS TAB (v2 — with chatter/provider breakdowns + cross-page nav)
// =============================================
const SpendersTab = React.memo(({user, lang, txs, models, profiles, dbSpenders, selectedSpenderKey, setSelectedSpenderKey, onRefresh, onNotify, providerPaymentMethods}) => {
  const addToast = useToast();
  const { convertAmount, fmtAmount, currencySymbol } = useCurrency();
  const fr = lang === "fr";
  const dr = useDateRange("all");
  const [sortBy, setSortBy] = useState("ltv");
  const [filterModel, setFilterModel] = useState("");
  const [selected, setSelected] = useState(null);
  const [detailModel, setDetailModel] = useState("");
  const [detailTab, setDetailTab] = useState("models");
  const [editingTx, setEditingTx] = useState(null);
  const [spSaving, setSpSaving] = useState(false);
  const [processingTxId, setProcessingTxId] = useState(null);
  const [confirmRefuse, setConfirmRefuse] = useState(null);
  const [spModalTab, setSpModalTab] = useState("profil");
  const [spEditMode, setSpEditMode] = useState(false);
  const [spForm, setSpForm] = useState({});
  const [spSavingProfile, setSpSavingProfile] = useState(false);
  const [showNewSpender, setShowNewSpender] = useState(false);
  const [newSpForm, setNewSpForm] = useState({handle:"",first_name:"",langue:"FR",timezone:"Europe/Zurich"});
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const handleSpStatus = async (txId, newStatus) => {
    if (processingTxId) return;
    setProcessingTxId(txId);
    try {
      const currentTx = txs.find(tx=>tx.id===txId);
      // Immutability guard: only pending transactions can change status
      if (currentTx && currentTx.status !== "pending") {
        addToast(t(lang,"tx_immutable"), "error");
        setProcessingTxId(null);
        return;
      }
      const {error} = await sb.from("transactions").update({status:newStatus}).eq("id",txId);
      if(error) { addToast("Erreur: " + error.message, "error"); setProcessingTxId(null); return; }
      if(onNotify&&currentTx) {
        const cur=currencySymbol;
        if(newStatus==="validated"&&currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_validated","TX validée ✅",`${currentTx.amount}${cur} de @${currentTx.spender_handle}`,txId);
        if(newStatus==="refused"&&currentTx.chatter_id) onNotify(currentTx.chatter_id,"tx_refused","TX refusée ❌",`${currentTx.amount}${cur} de @${currentTx.spender_handle}`,txId);
        profiles.filter(p=>p.role==="gerant").forEach(g=>onNotify(g.id,newStatus==="validated"?"tx_validated":"tx_refused",newStatus==="validated"?"TX validée":"TX refusée",`${currentTx.amount}${cur} @${currentTx.spender_handle}`,txId));
      }
      await onRefresh();
      addToast(newStatus==="validated"?(t(lang,"tx_validated")):(t(lang,"tx_refused")), newStatus==="validated"?"success":"error");
    } catch(e) { /* Spender TX status update failed */ addToast("Erreur: " + e.message, "error"); }
    setProcessingTxId(null);
  };
  const handleSpEditSave = async (updates) => {
    if (!editingTx || editingTx.status !== "pending") { setEditingTx(null); return; }
    setSpSaving(true);
    try {
      const {error} = await sb.from("transactions").update({spender_handle:updates.spender_handle,amount:updates.amount,currency:updates.currency,model_id:updates.model_id,provider_id:updates.provider_id,chatter_id:updates.chatter_id,product:updates.product,tag:updates.tag,product_id:updates.product_id||null,product_tag_id:updates.product_tag_id||null,notes:updates.notes}).eq("id",editingTx.id).eq("status","pending");
      setSpSaving(false);
      if(error) { addToast("Erreur: " + error.message, "error"); return; }
      setEditingTx(null);
      await onRefresh();
      addToast(t(lang,"tx_updated"), "success");
    } catch(e) { /* Spender TX edit failed */ setSpSaving(false); addToast("Erreur: " + e.message, "error"); }
  };

  const openSpenderModal = (sp) => {
    setSelected(sp); setSpModalTab("profil"); setSpEditMode(false);
    setSpForm({langue: sp.langue || "FR", timezone: sp.timezone || "Europe/Zurich", budget_range: sp.budget_range || "", first_name: sp.contactInfo?.prenom || "", age: sp.age || "", city: sp.city || "", country: sp.country || "", job: sp.job || sp.contactInfo?.metier || "", telegram_username: sp.telegramId || "", whatsapp_phone: sp.whatsapp_phone || "", relationship_status: sp.relationship_status || "", preferences: sp.preferences || "", personality_notes: sp.personality_notes || "", chatter_notes: sp.dbNotes || "", favorite_content: sp.favorite_content || "", best_time: sp.best_time || "", classification: sp.classification || "new", risk_level: sp.risk_level || "safe", source: sp.source || "", tags: sp.dbTags || []});
  };
  const handleSaveProfile = async () => {
    if (!selected?.dbId) { addToast(fr ? "Spender sans ID DB" : "Spender has no DB ID", "error"); return; }
    setSpSavingProfile(true);
    try {
      const updates = {first_name: spForm.first_name || null, age: spForm.age ? parseInt(spForm.age) : null, city: spForm.city || null, country: spForm.country || null, job: spForm.job || null, langue: spForm.langue || "FR", timezone: spForm.timezone || "Europe/Zurich", budget_range: spForm.budget_range || null, telegram_username: spForm.telegram_username || null, whatsapp_phone: spForm.whatsapp_phone || null, relationship_status: spForm.relationship_status || null, preferences: spForm.preferences || null, personality_notes: spForm.personality_notes || null, notes: spForm.chatter_notes || null, favorite_content: spForm.favorite_content || null, best_time: spForm.best_time || null, classification: spForm.classification || "new", risk_level: spForm.risk_level || "safe", source: spForm.source || null, tags: spForm.tags || []};
      const {error} = await sb.from("spenders").update(updates).eq("id", selected.dbId);
      if (error) { addToast("Erreur: " + error.message, "error"); setSpSavingProfile(false); return; }
      setSpSavingProfile(false); setSpEditMode(false);
      addToast(fr ? "Profil sauvegard\u00E9" : "Profile saved", "success");
      await onRefresh(); setSelected(null);
    } catch (e) { setSpSavingProfile(false); addToast("Erreur: " + e.message, "error"); }
  };
  const handleDeleteSpender = async (sp) => {
    try {
      const {error} = await sb.from("spenders").delete().eq("id", sp.dbId);
      if (error) { addToast("Erreur: " + error.message, "error"); return; }
      addToast(fr ? "Spender supprim\u00E9" : "Spender deleted", "success");
      setSelected(null); setDeleteConfirm(null); await onRefresh();
    } catch (e) { addToast("Erreur: " + e.message, "error"); }
  };
  const handleCreateSpender = async () => {
    if (!newSpForm.handle.trim()) { addToast(fr ? "Handle requis" : "Handle required", "error"); return; }
    setSpSavingProfile(true);
    try {
      const handle = newSpForm.handle.trim().replace(/^@/, "");
      const {error} = await sb.from("spenders").upsert({handle, name: handle, status: "active", first_name: newSpForm.first_name || null, langue: newSpForm.langue || "FR", timezone: newSpForm.timezone || "Europe/Zurich"}, {onConflict: "handle"});
      if (error) { addToast("Erreur: " + error.message, "error"); setSpSavingProfile(false); return; }
      setSpSavingProfile(false); setShowNewSpender(false); setNewSpForm({handle:"",first_name:"",langue:"FR",timezone:"Europe/Zurich"});
      addToast(fr ? "Spender cr\u00E9\u00E9" : "Spender created", "success"); await onRefresh();
    } catch (e) { setSpSavingProfile(false); addToast("Erreur: " + e.message, "error"); }
  };

  // Build spender data: merge DB spenders + transactions + breakdowns
  const spFilteredTxs = useMemo(() => dr.filterByDate(txs, "date"), [txs, dr.startDate, dr.endDate, dr.activePreset]);
  const spenders = useMemo(()=>{
    const map = {};

    // 1) Seed from DB spenders table (source of truth for metadata)
    (dbSpenders || []).forEach(dbSp => {
      const h = dbSp.handle || dbSp.name;
      if (!h) return;
      let contactInfo = {};
      try { contactInfo = typeof dbSp.contact_info === "string" ? JSON.parse(dbSp.contact_info) : (dbSp.contact_info || {}); } catch(e) {/* Contact info JSON parse fallback */}
      map[h] = {
        name: h,
        dbId: dbSp.id,
        telegramId: dbSp.telegram_id || null,
        whatsapp_phone: dbSp.whatsapp_phone || null,
        age: dbSp.age || null,
        city: dbSp.city || null,
        country: dbSp.country || null,
        job: dbSp.job || null,
        first_name: dbSp.first_name || null,
        langue: dbSp.langue || null,
        timezone: dbSp.timezone || "Europe/Zurich",
        budget_range: dbSp.budget_range || null,
        classification: dbSp.classification || "new",
        last_contact_date: dbSp.last_contact_date || null,
        last_purchase_date: dbSp.last_purchase_date || null,
        source: dbSp.source || null,
        dbTags: Array.isArray(dbSp.tags) ? dbSp.tags : [],
        dbStatus: dbSp.status || "active",
        contactInfo,
        dbNotes: dbSp.notes || "",
        totalSpentDb: Number(dbSp.total_spent) || 0,
        preferences: dbSp.preferences || null,
        personality_notes: dbSp.personality_notes || null,
        favorite_content: dbSp.favorite_content || null,
        best_time: dbSp.best_time || null,
        relationship_status: dbSp.relationship_status || null,
        risk_level: dbSp.risk_level || "safe",
        telegram_username: dbSp.telegram_username || null,
        txs: [], byModel: {}, byChatter: {}, byProvider: {},
      };
    });

    // 2) Enrich with transactions
    spFilteredTxs.forEach(tx => {
      const h = tx.spender_handle;
      if (!h) return;
      if (!map[h]) map[h] = {name: h, dbId: null, telegramId: null, dbTags: [], dbStatus: "active", contactInfo: {}, dbNotes: "", totalSpentDb: 0, txs: [], byModel: {}, byChatter: {}, byProvider: {}};
      map[h].txs.push(tx);
      // Model breakdown
      const mid = tx.model_id;
      if (!map[h].byModel[mid]) map[h].byModel[mid] = {txs: [], ca: 0, validated: 0, pending: 0};
      map[h].byModel[mid].txs.push(tx);
      map[h].byModel[mid].ca += Number(tx.amount);
      if (tx.status === "validated") map[h].byModel[mid].validated += Number(tx.amount);
      if (tx.status === "pending") map[h].byModel[mid].pending += Number(tx.amount);
      // Chatter breakdown
      const cid = tx.chatter_id || "unknown";
      const cName = profiles.find(p => p.id === cid)?.name || "?";
      if (!map[h].byChatter[cid]) map[h].byChatter[cid] = {id: cid, name: cName, ca: 0, count: 0, validated: 0, pending: 0};
      map[h].byChatter[cid].ca += Number(tx.amount);
      map[h].byChatter[cid].count++;
      if (tx.status === "validated") map[h].byChatter[cid].validated += Number(tx.amount);
      if (tx.status === "pending") map[h].byChatter[cid].pending += Number(tx.amount);
      // Provider breakdown
      const pid = tx.provider_id || "unknown";
      const pName = profiles.find(p => p.id === pid)?.name || "?";
      if (!map[h].byProvider[pid]) map[h].byProvider[pid] = {id: pid, name: pName, ca: 0, count: 0, validated: 0, pending: 0};
      map[h].byProvider[pid].ca += Number(tx.amount);
      map[h].byProvider[pid].count++;
      if (tx.status === "validated") map[h].byProvider[pid].validated += Number(tx.amount);
      if (tx.status === "pending") map[h].byProvider[pid].pending += Number(tx.amount);
    });

    return Object.values(map).map(s => {
      const ltv = s.txs.reduce((sum, tx) => sum + Number(tx.amount), 0);
      const cnt = s.txs.length;
      const aov = cnt > 0 ? ltv / cnt : 0;
      const validCA = s.txs.filter(tx => tx.status === "validated").reduce((sum, tx) => sum + Number(tx.amount), 0);
      const pendingCA = s.txs.filter(tx => tx.status === "pending").reduce((sum, tx) => sum + Number(tx.amount), 0);
      const validCount = s.txs.filter(tx => tx.status === "validated").length;
      const pendingCount = s.txs.filter(tx => tx.status === "pending").length;
      const lastTxDate = s.txs.length > 0 ? [...s.txs].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date : (s.last_purchase_date || null);
      const modelCount = Object.keys(s.byModel).length;
      const modelBreakdown = Object.entries(s.byModel).map(([mid, data]) => {
        const mName = models.find(m => m.id === mid)?.name || "?";
        return {id: mid, name: mName, ca: data.ca, validated: data.validated, pending: data.pending, txCount: data.txs.length, txs: data.txs, pct: ltv > 0 ? ((data.ca / ltv) * 100) : 0};
      }).sort((a, b) => b.ca - a.ca);
      const chatterBreakdown = Object.values(s.byChatter).sort((a, b) => b.ca - a.ca);
      const providerBreakdown = Object.values(s.byProvider).sort((a, b) => b.ca - a.ca);
      return {...s, ltv, cnt, aov, validCA, pendingCA, validCount, pendingCount, lastTxDate, segment: getSpenderSegment(ltv), modelCount, modelBreakdown, chatterBreakdown, providerBreakdown};
    });
  }, [spFilteredTxs, models, profiles, dbSpenders]);

  // Auto-select from cross-page navigation
  useEffect(()=>{
    if(selectedSpenderKey && spenders.length > 0) {
      const found = spenders.find(s => s.name.toLowerCase() === selectedSpenderKey.toLowerCase());
      if(found) { setSelected(found); setDetailModel(""); setDetailTab("models"); }
      if(setSelectedSpenderKey) setSelectedSpenderKey(null);
    }
  },[selectedSpenderKey, spenders]);

  let filtered = filterModel ? spenders.filter(s=>s.byModel[filterModel]) : spenders;
  let sorted = [...filtered];
  if(sortBy==="frequency") sorted.sort((a,b)=>b.cnt-a.cnt);
  else if(sortBy==="recency") sorted.sort((a,b)=>new Date(b.txs[b.txs.length-1]?.date||0)-new Date(a.txs[a.txs.length-1]?.date||0));
  else if(sortBy==="model_ca" && filterModel) sorted.sort((a,b)=>(b.byModel[filterModel]?.ca||0)-(a.byModel[filterModel]?.ca||0));
  else sorted.sort((a,b)=>b.ltv-a.ltv);

  const spPag = usePagination(sorted);
  const avgLtv = sorted.length>0 ? sorted.reduce((s,x)=>s+x.ltv,0)/sorted.length : 0;
  const multiModelCount = sorted.filter(s=>s.modelCount>1).length;
  const totalValidated = sorted.reduce((s,x)=>s+x.validCA,0);
  const totalPending = sorted.reduce((s,x)=>s+x.pendingCA,0);

  return (
    <div>
      <GlobalFilterBar lang={lang} dr={dr} models={models} profiles={null}
        model={filterModel} setModel={(v)=>{setFilterModel(v);setSelected(null);}} showModelFilter />
      <div className="kpi-grid">
        <KPICard label={t(lang,"spenders")} value={`${sorted.length}`} icon="👥"/>
        <KPICard label={t(lang,"avg_ltv")} value={`${avgLtv.toFixed(0)}${currencySymbol}`} icon="💎"/>
        <KPICard label={fr?"Valide":"Validated"} value={`${totalValidated.toFixed(0)}${currencySymbol}`} icon="✅"/>
        <KPICard label="Pending" value={`${totalPending.toFixed(0)}${currencySymbol}`} icon="⏳"/>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12,alignItems:"center"}}>
        <button className="btn btn-primary" onClick={()=>setShowNewSpender(true)} style={{fontSize:12,padding:"6px 14px",borderRadius:12}}>{"\u2795"} {fr?"Nouveau Spender":"New Spender"}</button>
        <select className="filter-select" value={filterModel} onChange={e=>{setFilterModel(e.target.value);setSelected(null);}}>
          <option value="">{fr?"Tous les modeles":"All models"}</option>
          {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
        <button className={`filter-chip ${sortBy==="ltv"?"active":""}`} onClick={()=>setSortBy("ltv")}>LTV</button>
        <button className={`filter-chip ${sortBy==="frequency"?"active":""}`} onClick={()=>setSortBy("frequency")}>{t(lang,"frequency")}</button>
