<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <rect x="64" y="64" width="384" height="384" rx="72" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.12"/>
  <text x="256" y="300" font-size="220" font-weight="800" text-anchor="middle" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-6" filter="url(#glow)">D</text>
  <rect x="80" y="400" width="352" height="4" rx="2" fill="url(#accent)" opacity="0.25"/>
</svg>
